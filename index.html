        if ((s.opp.finishes || []).length || (s.opp.rides || []).length) {

    /**
     * Parse stored event modifiers for display / edit.
     * Supports: new struct, new plain "Opp: … Our: …", legacy "Opp: X + Y".
     */
    function parseEventModifiers(e) {
      if (e && e.modifiers && (e.modifiers.opp || e.modifiers.our)) {
        return {
          opp: {
            ties: (e.modifiers.opp && e.modifiers.opp.ties) || [],
            finishes: (e.modifiers.opp && e.modifiers.opp.finishes) || [],
            rides: (e.modifiers.opp && e.modifiers.opp.rides) || []
          },
          our: {
            ties: (e.modifiers.our && e.modifiers.our.ties) || [],
            finishes: (e.modifiers.our && e.modifiers.our.finishes) || [],
            rides: (e.modifiers.our && e.modifiers.our.rides) || []
          }
        };
      }
      const raw = (e && (e.tie || e.modifiersText)) || "";
      return parseModifiersPlain(raw);
    }

    function parseModifiersPlain(raw) {
      const s = emptyModifiersStruct();
      if (!raw || !String(raw).trim()) return s;
      let str = String(raw).trim();
      // Strip outer brackets
      if (str.startsWith("[") && str.endsWith("]")) str = str.slice(1, -1).trim();

      // New format: "Opp: ... Our: ..."
      const hasOpp = /\bOpp:\s*/i.test(str);
      const hasOur = /\bOur:\s*/i.test(str);
      if (hasOpp || hasOur) {
        let oppSeg = "", ourSeg = "";
        if (hasOpp && hasOur) {
          const ourIdx = str.search(/\bOur:\s*/i);
          const oppIdx = str.search(/\bOpp:\s*/i);
          if (oppIdx < ourIdx) {
            oppSeg = str.slice(oppIdx, ourIdx).replace(/^\s*Opp:\s*/i, "").trim();
            ourSeg = str.slice(ourIdx).replace(/^\s*Our:\s*/i, "").trim();
          } else {
            ourSeg = str.slice(ourIdx, oppIdx).replace(/^\s*Our:\s*/i, "").trim();
            oppSeg = str.slice(oppIdx).replace(/^\s*Opp:\s*/i, "").trim();
          }
        } else if (hasOpp) {
          oppSeg = str.replace(/^\s*Opp:\s*/i, "").trim();
        } else {
          ourSeg = str.replace(/^\s*Our:\s*/i, "").trim();
        }
        // Drop trailing kind notes like "(ties, finishes)"
        oppSeg = oppSeg.replace(/\s*\([^)]*\)\s*$/, "").trim();
        ourSeg = ourSeg.replace(/\s*\([^)]*\)\s*$/, "").trim();
        const splitNames = seg => seg.split(/\s*\+\s*|\s*·\s*|\s*\|\s*/).map(x => x.trim()).filter(Boolean);
        // Without kind in legacy parse, put all under ties for editability
        splitNames(oppSeg).forEach(n => { if (!s.opp.ties.includes(n)) s.opp.ties.push(n.replace(/^Opp:\s*/i, "")); });
        splitNames(ourSeg).forEach(n => { if (!s.our.ties.includes(n)) s.our.ties.push(n.replace(/^Our:\s*/i, "")); });
        return s;
      }

      // Legacy: "Opp: X + Y + Z" with some unprefixed = our
      str.split(/\s*\+\s*/).forEach(part => {
        const p = part.trim();
        if (!p) return;
        if (/^Opp:\s*/i.test(p)) {
          const n = p.replace(/^Opp:\s*/i, "").trim();
          if (n && !s.opp.ties.includes(n)) s.opp.ties.push(n);
        } else {
          if (!s.our.ties.includes(p)) s.our.ties.push(p);
        }
      });
      return s;
    }

    function formatModifiersHtmlForEvent(e) {
      return formatModifiersHtmlFromStruct(parseEventModifiers(e));
    }

    function formatModifiersPlainForEvent(e) {
      return formatModifiersPlainFromStruct(parseEventModifiers(e));

      const notes = a.notes ? (" Notes: " + a.notes + ".") : "";
      const name = wrestlerName || "Our wrestler";
      return `${name} — ankle: ${band}; singlet: ${singlet}.${notes}`;
    }

    function renderOurWrestlerIdCard(activeW, opts) {
      opts = opts || {};
      const compact = !!opts.compact;
      const name = activeW ? activeW.name : "our wrestler";
      return `
        <div style="background:var(--mat); border:1px solid var(--panelLine); border-radius:6px; padding:${compact ? "10px" : "12px"}; margin-bottom:10px;">
          <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">
            Identify Your Wrestler
          </div>
          <p style="font-size:11px; color:var(--muted); margin:0 0 8px 0;">
            How to recognize <strong style="color:var(--chalk);">${name}</strong> on film (ankle band and/or singlet). Used for AI analysis and saved with training-library examples.
          </p>
          <div class="grid-2">
            <div>
              <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Ankle Band</label>
              <select class="select" onchange="ourWrestlerAppearance.ankleBand = this.value;">
                <option value="none" ${ourWrestlerAppearance.ankleBand === "none" ? "selected" : ""}>None / not visible</option>
                <option value="red" ${ourWrestlerAppearance.ankleBand === "red" ? "selected" : ""}>Red</option>
                <option value="green" ${ourWrestlerAppearance.ankleBand === "green" ? "selected" : ""}>Green</option>
                <option value="blue" ${ourWrestlerAppearance.ankleBand === "blue" ? "selected" : ""}>Blue</option>
              </select>
            </div>
            <div>
              <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Singlet Primary Color</label>
              <input class="input" placeholder="e.g. navy, black" value="${(ourWrestlerAppearance.singletColor || "").replace(/"/g, "&quot;")}"
                oninput="ourWrestlerAppearance.singletColor = this.value" />
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Singlet Secondary / Trim</label>
              <input class="input" placeholder="e.g. gold trim" value="${(ourWrestlerAppearance.singletSecondary || "").replace(/"/g, "&quot;")}"
                oninput="ourWrestlerAppearance.singletSecondary = this.value" />
            </div>
            <div>
              <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Extra Notes</label>
              <input class="input" style="margin-bottom:0;" placeholder="e.g. left ankle" value="${(ourWrestlerAppearance.notes || "").replace(/"/g, "&quot;")}"
                oninput="ourWrestlerAppearance.notes = this.value" />
            </div>
          </div>
        </div>
      `;
    }

    function renderManualScoutContent(activeW, boutOpponents, autoOpponent) {
      if (!activeMatch) {
        const activeBout = getActiveBout();
        const boutSelected = store.activeBoutId && store.activeBoutId !== "all" && activeBout;
        const boutFinalized = !!(activeBout && activeBout.finalized);
        const boutReady = boutSelected && !boutFinalized && !isSeasonLocked();
        let blockMsg = "";
        if (!boutSelected) {
          blockMsg = `<div style="background:var(--redDim); border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
                <strong style="color:var(--red);">Event required.</strong>
                <span style="color:var(--chalk);"> Choose a dual or tournament from the <strong>Event</strong> dropdown at the top before scoring a match. Scoring under “All Events / Season Total” is not allowed.</span>
              </div>`;
        } else if (boutFinalized) {
          blockMsg = `<div style="background:var(--redDim); border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
                <strong style="color:var(--red);">Event finalized.</strong>
                <span style="color:var(--chalk);"> This dual/event is finalized. Reopen it from the Bout Sheet before scoring additional matches.</span>
              </div>`;
        } else if (isSeasonLocked()) {
          blockMsg = `<div style="background:var(--redDim); border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
                <strong style="color:var(--red);">Season locked.</strong>
                <span style="color:var(--chalk);"> This season is finalized. Reopen it from Admin before scoring.</span>
              </div>`;
        }
        return `
          <div class="card">
            ${renderScoutTitleRow("Score Match:", activeW, helpIcon('scout_manual'))}
            ${blockMsg}
            
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="log-match-level" class="select" onchange="selectedMatchLevel = this.value" ${!boutReady ? 'disabled' : ''}>
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  ${appConfig.includeMiddleSchool ? `<option value="Junior High" ${selectedMatchLevel === 'Junior High' ? 'selected' : ''}>Junior High</option>` : ''}
                  ${appConfig.includeCollege ? `<option value="College" ${selectedMatchLevel === 'College' ? 'selected' : ''}>College</option>` : ''}
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Opponent Roster</label>
                <select id="log-opp-select" class="select" onchange="document.getElementById('log-opponent').value = this.value" ${!boutReady ? 'disabled' : ''}>
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>

            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="log-opponent" class="input" value="${autoOpponent}" placeholder="Enter opponent name" ${!boutReady ? 'disabled' : ''} />
            ${renderOurWrestlerIdCard(activeW)}
            <button class="btn btn-gold" style="width:100%; margin-top:4px; ${!boutReady ? 'opacity:0.45; cursor:not-allowed;' : ''}" onclick="startMatch()" ${!boutReady ? 'disabled' : ''}>
              ${!boutSelected ? 'Select an Event to Start Scoring' : (boutFinalized ? 'Event Finalized — Scoring Locked' : (isSeasonLocked() ? 'Season Locked' : 'Start Scoring Match'))}
            </button>
          </div>
        `;
      }

      // Point Calculation (includes Riding Time point when advantage ≥ 1:00)
      applyRidingTimePointIfNeeded();
      const _acc = accumulateMatchPoints(activeMatch.events);
      let ourPts = _acc.ourP;
      let oppPts = _acc.oppP;

      const choiceEvents = activeMatch.events.filter(e => e.category === "Choice");
      const p2ChoiceEvs = choiceEvents.filter(e => e.period === "P2");
      const p3ChoiceEv = choiceEvents.find(e => e.period === "P3");

      const hasEventsInP1 = activeMatch.events.some(e => e.period === "P1");
      const hasEventsInP2 = activeMatch.events.some(e => e.period === "P2");

      let p2Allowed = hasEventsInP1;
      let p3Allowed = hasEventsInP2;

      let decisionButtonsDisabled = true;
      let currentChooserText = "Neutral Start";

      if (currentPeriod === "P2") {
        const deferEv = p2ChoiceEvs.find(e => e.detail === "Defer");
        const finalP2Pos = p2ChoiceEvs.find(e => e.detail !== "Defer");

        if (!deferEv && !finalP2Pos) {
          decisionButtonsDisabled = false;
          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P2` : `Opponent's Choice for P2`;
        } else if (deferEv && !finalP2Pos) {
          decisionButtonsDisabled = false;
          const deferredToWhom = deferEv.move.includes("Home") ? `${activeMatch.opponent || 'Opponent'}` : activeW.name;
          currentChooserText = `${deferredToWhom}'s Choice (Deferred)`;
        } else {
          decisionButtonsDisabled = true;
          currentChooserText = `P2 Set: ${finalP2Pos.move}`;
        }
      } else if (currentPeriod === "P3") {
        if (!p3ChoiceEv) {
          decisionButtonsDisabled = false;
          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P3` : `Opponent's Choice for P3`;
        } else {
          decisionButtonsDisabled = true;
          currentChooserText = `P3 Set: ${p3ChoiceEv.move}`;
        }
      }

      const activeList = modifierSubView === "ties"
        ? taxonomy.TIE_MODIFIERS
        : modifierSubView === "finishes"
          ? (taxonomy.FINISH_MODIFIERS || DEFAULT_TAXONOMY.FINISH_MODIFIERS)
          : (taxonomy.RIDE_MODIFIERS || DEFAULT_TAXONOMY.RIDE_MODIFIERS);

      return `
        <div class="card" style="padding:8px 12px;">
          ${renderScoutTitleRow("Score Match:", activeW, helpIcon('scout_manual'))}
        </div>
        <!--VIDEO_SLOT-->
        <!-- Score Card -->
        <div class="card" style="padding:12px;">
          <div class="grid-2">
            <div style="background-color:var(--greenDim); border:1px solid var(--green); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--green); text-transform:uppercase;">${activeW.name} (${activeMatch.level})</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${ourPts}</div>
            </div>
            <div style="background-color:var(--redDim); border:1px solid var(--red); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--red); text-transform:uppercase;">${activeMatch.opponent}</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${oppPts}</div>
            </div>
          </div>
        </div>

        <!-- Direction Switcher Card -->
        <div class="card" style="padding:8px 12px;">
          <div class="grid-2">
            <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'offense' ? 'var(--green)' : 'var(--mat)'}; border:1px solid var(--panelLine); color:var(--chalk);" onclick="setDir('offense')">
              Offense (By ${activeW.name})
            </button>
            <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'defense' ? 'var(--red)' : 'var(--mat)'}; border:1px solid var(--panelLine); color:var(--chalk);" onclick="setDir('defense')">
              Faced (vs. ${activeW.name})
            </button>
          </div>
        </div>

        <!-- Period Bar Card -->
        <div class="card" style="padding:8px 12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase;">Period: ${currentPeriod}</div>
            <div style="font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;">${currentChooserText}</div>
          </div>
          
          <div style="display:flex; justify-content:space-between; align-items:center; gap:4px; flex-wrap:wrap;">
            <div style="display:flex; gap:4px;">
              <button class="chip ${currentPeriod === 'P1' ? 'selected' : ''}" onclick="advancePeriod('P1')">P1</button>
              <button class="chip ${currentPeriod === 'P2' ? 'selected' : ''}" ${!p2Allowed && currentPeriod !== 'P2' && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P2')">P2</button>
              <button class="chip ${currentPeriod === 'P3' ? 'selected' : ''}" ${!p3Allowed && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P3')">P3</button>
              <button class="chip ${currentPeriod === 'OT' ? 'selected' : ''}" onclick="advancePeriod('OT')">OT</button>
            </div>

            ${getSeasonStyle() === "Folkstyle" ? `
            <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
              <span style="font-size:9px; font-weight:800; color:var(--muted); text-transform:uppercase;">Riding Time</span>
              <button class="btn" style="padding:4px 8px; font-size:10px; font-weight:800; background:${ridingTimeActive && ridingTimeController==='our' ? 'var(--green)' : 'var(--mat)'}; border:1px solid var(--green); color:var(--chalk);"
                onclick="startRidingTime('our')" title="Start our riding time">${ridingTimeActive && ridingTimeController==='our' ? '● Our RT' : 'Start Our RT'}</button>
              <button class="btn" style="padding:4px 8px; font-size:10px; font-weight:800; background:${ridingTimeActive && ridingTimeController==='opp' ? 'var(--red)' : 'var(--mat)'}; border:1px solid var(--red); color:var(--chalk);"
                onclick="startRidingTime('opp')" title="Start opponent riding time">${ridingTimeActive && ridingTimeController==='opp' ? '● Opp RT' : 'Start Opp RT'}</button>
              <button class="btn btn-gold" style="padding:4px 8px; font-size:10px; font-weight:800;" onclick="stopRidingTime()" ${!ridingTimeActive ? 'disabled' : ''}>Stop RT</button>
              ${(() => {
                const tot = getRidingTimeTotalsFromEvents(activeMatch.events);
                return `<span style="font-size:10px; font-family:monospace;"><span style="color:var(--green);">${formatRtClock(tot.our)}</span> / <span style="color:var(--red);">${formatRtClock(tot.opp)}</span></span>`;
              })()}
            </div>
            ` : `
            <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
              <span style="font-size:9px; font-weight:800; color:var(--muted); text-transform:uppercase;">Passivity</span>
              <button class="btn" style="padding:4px 8px; font-size:10px; font-weight:800; background:${passivityController==='our' ? 'var(--green)' : 'var(--mat)'}; border:1px solid var(--green); color:var(--chalk);"
                onclick="setPassivitySide('our')" title="Mark our wrestler passive">${passivityController==='our' ? '● Our passive' : 'Our passive'}</button>
              <button class="btn" style="padding:4px 8px; font-size:10px; font-weight:800; background:${passivityController==='opp' ? 'var(--red)' : 'var(--mat)'}; border:1px solid var(--red); color:var(--chalk);"
                onclick="setPassivitySide('opp')" title="Mark opponent passive">${passivityController==='opp' ? '● Opp passive' : 'Opp passive'}</button>
              <button class="btn" style="padding:4px 8px; font-size:10px; font-weight:800; background:${passivityController==='our' ? 'var(--red)' : (passivityController==='opp' ? 'var(--green)' : 'var(--mat)')}; border:1px solid ${passivityController==='our' ? 'var(--red)' : (passivityController==='opp' ? 'var(--green)' : 'var(--panelLine)')}; color:var(--chalk);"
                onclick="awardPassivityPoint()" title="${passivityController==='our' ? 'Our passivity → opponent scores (+1 red)' : (passivityController==='opp' ? 'Opp passivity → we score (+1 green)' : 'Select Our or Opp passive first')}"
                ${!passivityController ? 'disabled' : ''}>+1 Passivity</button>
            </div>
            `}
            <div style="display:flex; gap:4px;">
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Top')">Top</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Bottom')">Bottom</button>
              <button class="chip" ${decisionButtonsDisabled || currentPeriod !== 'P2' || (p2ChoiceEvs.some(e => e.detail === 'Defer')) ? 'disabled' : ''} onclick="recordPositionChoice('Defer')">Defer</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Neutral')">Neutral</button>
            </div>
          </div>
        </div>

        <!-- Modifiers Window: Ties & Setups vs Finishes -->
        <div class="card" style="padding:10px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'ties' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'ties' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'ties'; render();">
                Ties & Setups
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'finishes' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'finishes' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'finishes'; render();">
                Finishes
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'rides' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'rides' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'rides'; render();">
                Rides
              </button>
              <span style="font-size:10px; font-weight:700; color:var(--muted);">${formatActiveModifiersSummary()}</span>
              ${helpIcon('scout_modifiers')}
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <span style="font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase;">Apply To:</span>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierAssignTarget === 'wrestler' ? 'var(--green)' : 'var(--mat)'}; border:1px solid ${modifierAssignTarget === 'wrestler' ? 'var(--green)' : 'var(--panelLine)'}; color:var(--chalk);" onclick="modifierAssignTarget = 'wrestler'; render();">
                ${activeW.name} (Wrestler)
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierAssignTarget === 'opponent' ? 'var(--red)' : 'var(--mat)'}; border:1px solid ${modifierAssignTarget === 'opponent' ? 'var(--red)' : 'var(--panelLine)'}; color:var(--chalk);" onclick="modifierAssignTarget = 'opponent'; render();">
                ${activeMatch.opponent || 'Opponent'}
              </button>
            </div>
          </div>
          <div class="grid-4">
            ${activeList.map(mod => {
              const kind = modifierSubView === "finishes" ? "finish" : (modifierSubView === "rides" ? "ride" : "tie");
              const matchedMod = activeTieModifiers.find(m => modName(m) === mod && modKind(m) === kind);
              let chipClass = "chip";
              if (matchedMod) {
                const owner = modOwner(matchedMod);
                chipClass += owner === 'opponent' ? " selected-opponent" : " selected-wrestler";
              }
              return `
                <div class="${chipClass}" onclick="toggleTieModifierMulti('${escAttr(mod)}')">
                  ${mod} ${matchedMod ? `<span style="font-size:9px;">[${modOwner(matchedMod) === 'opponent' ? 'OPP' : 'OUR'}]</span>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Move Selection Card -->
        <div class="card">
          <div class="card-title">
            <span>${renderMoveSelectorTitle()}</span>
            ${renderMoveBackButton()}
          </div>
          ${renderMoveSelectorGrid()}
        </div>

        <!-- Scoring Log Card -->
        <div class="card">
          <div class="card-title">
            <span>Scoring Log (${activeMatch.events.length} events)</span>
            <span style="font-size:10px; color:var(--muted); font-weight:400; text-transform:none;">Click any action to edit</span>
          </div>
          <div style="max-height:180px; overflow-y:auto; margin-bottom:12px;">
            ${activeMatch.events.length === 0 ? '<p style="font-size:11px; color:var(--muted);">No actions tagged yet.</p>' : ''}
            ${activeMatch.events.slice().reverse().map((e) => `
              <div class="item-row" style="cursor:pointer;" onclick="openEditEventModal('${e.id}')">
                <span>
                  <span style="font-family:monospace; color:var(--gold); margin-right:6px; text-decoration:underline;" onclick="event.stopPropagation(); seekVideo('${e.timestamp}');">${e.timestamp || '--:--'}</span>
                  <span style="color:var(--muted); font-size:10px; margin-right:4px;">[${e.period || 'P1'}]</span>
                  <strong style="color:${e.direction === 'offense' ? 'var(--green)' : 'var(--red)'}">${e.direction === 'offense' ? 'OFF' : 'DEF'}</strong> 
                  ${e.move} ${formatModifiersHtmlForEvent(e) ? `<span style="font-size:10px; margin-left:4px;">${formatModifiersHtmlForEvent(e)}</span>` : ''}
                  ${e.detail ? `<span style="color:var(--muted); font-size:10px;">(${e.detail})</span>` : ''}
                </span>
                ${(() => { const od = formatOutcomeDisplay(e); return `
                <span style="color:${od.color}; font-weight:700; display:flex; align-items:center; gap:4px;">
                  ${od.label}${od.pointsHtml ? ' ' + od.pointsHtml : ''}
                  <span style="color:var(--gold); font-size:13px;">✎</span>
                </span>`; })()}
              </div>
            `).join('')}
          </div>

          <label style="display:flex; align-items:flex-start; gap:8px; margin:10px 0 12px 0; font-size:12px; color:var(--chalk); cursor:pointer;">
            <input type="checkbox" style="margin-top:3px;" ${appConfig.aiTrainOnCommit ? 'checked' : ''}
              onchange="appConfig.aiTrainOnCommit = this.checked; persist();" />
            <span>
              <strong style="color:var(--gold);">Add to AI training library</strong>
              <span style="color:var(--muted); display:block; font-size:11px; margin-top:2px;">
                When checked, this match’s scoring log (and video reference — YouTube link or local file copy) is saved for future AI scoring examples.
                Library size: ${aiTrainingLibrary.length} example(s).
              </span>
            </span>
          </label>

          <div class="grid-2">
            <button id="commit-match-btn" class="btn btn-green" onclick="commitManualMatch()">Save & Commit Match to Stats</button>
            <button class="btn" style="background:var(--panelLine); color:var(--chalk);" onclick="discardMatch()">Discard Match</button>
          </div>
        </div>
      `;
    }

    function advancePeriod(p) {
      currentPeriod = p;
      logEvent('Flow', `Period Change: ${p}`, 'success', 0, p);

      if (p === 'P3' && activeMatch) {
        const choiceEvents = activeMatch.events.filter(e => e.category === "Choice");
        const p2ChoiceEvs = choiceEvents.filter(e => e.period === "P2");
        const deferEv = p2ChoiceEvs.find(e => e.detail === "Defer");
        const finalP2Pos = p2ChoiceEvs.find(e => e.detail !== "Defer");

        if (deferEv) {
          manualDirection = deferEv.move.includes("Home") ? 'offense' : 'defense';
        } else if (finalP2Pos) {
          manualDirection = finalP2Pos.move.includes("Home") ? 'defense' : 'offense';
        }
      }
      render();
    }

    function recordPositionChoice(choice) {
      const chooser = manualDirection === 'offense' ? 'Home' : 'Opponent';
      logEvent('Choice', `${chooser} Choice: ${choice}`, 'success', 0, choice);

      if (choice === 'Defer') {
        manualDirection = (manualDirection === 'offense') ? 'defense' : 'offense';
      }
      render();
    }

    function renderAIScoutContent(activeW, boutOpponents, autoOpponent) {
      const withVid = (aiTrainingLibrary || []).filter(e => e && e.video && e.video.type === "file" && e.video.hasLocalBlob).length;
      const totalTrain = (aiTrainingLibrary || []).length;
      const activeBout = getActiveBout();
      const boutSelected = store.activeBoutId && store.activeBoutId !== "all" && activeBout;
      const boutFinalized = !!(activeBout && activeBout.finalized);
      const boutReady = boutSelected && !boutFinalized && !isSeasonLocked();
      let blockMsg = "";
      if (!boutSelected) {
        blockMsg = `<div style="background:var(--redDim); border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
                <strong style="color:var(--red);">Event required.</strong>
                <span style="color:var(--chalk);"> Choose a dual or tournament from the <strong>Event</strong> dropdown at the top before analyzing a match. Analysis under “All Events / Season Total” is not allowed.</span>
              </div>`;
      } else if (boutFinalized) {
        blockMsg = `<div style="background:var(--redDim); border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
                <strong style="color:var(--red);">Event finalized.</strong>
                <span style="color:var(--chalk);"> This dual/event is finalized. Reopen it from the Bout Sheet before analyzing additional matches.</span>
              </div>`;
      } else if (isSeasonLocked()) {
        blockMsg = `<div style="background:var(--redDim); border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
                <strong style="color:var(--red);">Season locked.</strong>
                <span style="color:var(--chalk);"> This season is finalized. Reopen it from Admin before analyzing.</span>
              </div>`;
      }

      if (!parsedEvents) {
        return `
          <div class="card">
            ${renderScoutTitleRow("AI Video Scout:", activeW, "")}
            ${blockMsg}
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="ai-match-level" class="select" onchange="selectedMatchLevel = this.value" ${!boutReady ? 'disabled' : ''}>
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  ${appConfig.includeMiddleSchool ? `<option value="Junior High" ${selectedMatchLevel === 'Junior High' ? 'selected' : ''}>Junior High</option>` : ''}
                  ${appConfig.includeCollege ? `<option value="College" ${selectedMatchLevel === 'College' ? 'selected' : ''}>College</option>` : ''}
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Roster</label>
                <select class="select" onchange="document.getElementById('imp-opp').value = this.value" ${!boutReady ? 'disabled' : ''}>
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>
            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="imp-opp" class="input" value="${autoOpponent}" placeholder="Opponent name" ${!boutReady ? 'disabled' : ''} />
            ${renderOurWrestlerIdCard(activeW)}
            <div style="background:var(--mat); border:1px solid var(--panelLine); border-radius:4px; padding:10px; margin-bottom:10px; font-size:11px;">
              <div style="font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:4px;">AI Training Library</div>
              ${totalTrain === 0
                ? `<p style="margin:0; color:var(--muted);">No examples yet. Score in Manual with video + training checkbox for better visual recognition.</p>`
                : `<p style="margin:0; color:var(--chalk);"><strong>${totalTrain}</strong> example(s) · <strong style="color:${withVid ? 'var(--green)' : 'var(--muted)'};">${withVid}</strong> with local video</p>`}
            </div>
            <div class="grid-2" style="margin-bottom:8px;">
              <div>
                <label style="font-size:11px; color:var(--muted);">Analysis Backend</label>
                <select id="ai-backend" class="select" onchange="aiAnalysisBackend = this.value; localStorage.setItem(AI_BACKEND_STORAGE, this.value); render();" ${!boutReady ? 'disabled' : ''}>
                  <option value="gemini" ${aiAnalysisBackend === 'gemini' ? 'selected' : ''}>Google Gemini</option>
                  <option value="local_lora" ${aiAnalysisBackend === 'local_lora' ? 'selected' : ''}>Local Fine-Tuned (Qwen-VL LoRA)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">${aiAnalysisBackend === 'local_lora' ? 'Local server' : 'Gemini models'}</label>
                ${aiAnalysisBackend === 'local_lora'
                  ? `<div class="muted-note" style="padding:6px 0;">POST frames → ${(appConfig.autoClipServerUrl || 'http://localhost:5057').replace(/\/$/, '')}/predict</div>`
                  : `<div class="muted-note" style="padding:6px 0;">Auto-fallback: 3.7 → 3.6 → 3.5 → 2.5 Flash</div>`}
              </div>
            </div>
            ${aiAnalysisBackend === 'gemini' ? `
            <label style="font-size:11px; color:var(--muted);">Gemini API Key</label>
            <input type="password" id="imp-key" class="input"
              placeholder="AIzaSy…"
              value="${localStorage.getItem(API_KEY_STORAGE) || ''}"
              ${!boutReady ? 'disabled' : ''} />
            ` : `
            <div class="surface surface-pad muted-note" style="margin-bottom:8px;">
              Uses the same local bridge as Auto-Clip (<strong>${(appConfig.autoClipServerUrl || 'http://localhost:5057')}</strong>).
              Start <code>app.py</code> / the clip server with LoRA weights loaded so <code>/predict</code> is available.
              No cloud API key required.
            </div>
            `}
            <div id="ai-status" style="display:none; padding:10px; margin-bottom:8px; border-radius:4px; font-size:12px; font-weight:700; text-align:center; background:var(--goldDim); color:var(--gold);"></div>
            <button id="ai-btn" class="btn btn-gold" style="width:100%; ${!boutReady ? 'opacity:0.45; cursor:not-allowed;' : ''}" onclick="runDirectBrowserAnalysis()" ${!boutReady ? 'disabled' : ''}>
              ${!boutSelected ? 'Select an Event to Analyze' : (boutFinalized ? 'Event Finalized — Analysis Locked' : (isSeasonLocked() ? 'Season Locked' : (aiAnalysisBackend === 'local_lora' ? 'Analyze with Local LoRA' : 'Analyze Match with AI')))}
            </button>
            <div style="font-size:10px; color:var(--muted); margin-top:6px;">
              <strong style="color:var(--gold);">AI analysis requires a local video file</strong> (Option 1 — .mp4 recommended).
              YouTube works for playback and manual scoring, but browsers cannot extract frames from YouTube for AI.
              Uses taxonomy, modifiers, visual ID, and training library.
              ${aiAnalysisBackend === 'local_lora' ? ' Local LoRA sends a compact frame sample to your fine-tuned model.' : ' Gemini runs in-browser with model fallback.'}
            </div>
            ${videoSourceType === 'youtube' && youtubeVideoId ? `
              <div style="margin-top:8px; padding:8px 10px; border-radius:4px; background:var(--redDim); border:1px solid var(--red); font-size:11px; color:var(--chalk);">
                <strong style="color:var(--red);">YouTube is loaded for viewing only.</strong>
                To run AI Video Scout, download this match and upload it under <strong>Option 1: Local Match Video</strong>.
              </div>
            ` : ''}
          </div>
        `;
      }

      const oppName = aiImportOpponent || "Opponent";
      const scoringEvs = parsedEvents.filter(e => selectedEvents[e.id]);
      let ourPts = 0, oppPts = 0;
      scoringEvs.forEach(e => {
        const pts = e.points || 0;
        if (isPenaltyCategory(e.category)) {
          if (e.direction === "offense") oppPts += pts; else ourPts += pts;
        } else {
          if (e.direction === "offense") ourPts += pts;
          else if (e.outcome === "fail") oppPts += pts;
        }
      });
      const selectedCount = scoringEvs.length;
      const lowCount = parsedEvents.filter(e => (e.confidence || "").toLowerCase() === "low").length;
      const confBadge = (c) => {
        const conf = (c || "medium").toLowerCase();
        if (conf === "low") return `<span style="font-size:9px; font-weight:800; padding:2px 6px; border-radius:3px; background:var(--goldDim); color:var(--gold); border:1px solid var(--gold);">LOW</span>`;
        if (conf === "high") return `<span style="font-size:9px; font-weight:800; padding:2px 6px; border-radius:3px; background:var(--greenDim); color:var(--green); border:1px solid var(--green);">HIGH</span>`;
        return `<span style="font-size:9px; font-weight:800; padding:2px 6px; border-radius:3px; background:var(--panelLine); color:var(--muted);">MED</span>`;
      };
      const filtered = parsedEvents.filter(ev => {
        const conf = (ev.confidence || "medium").toLowerCase();
        if (aiVerifyFilter === "low") return conf === "low";
        if (aiVerifyFilter === "medium") return conf === "medium";
        if (aiVerifyFilter === "choices") return ev.category === "Choice";
        if (aiVerifyFilter === "moves") return ev.category !== "Choice" && ev.category !== "Flow";
        return true;
      });

      return `
        <div class="card" style="padding:12px;">
          <div class="grid-2">
            <div style="background-color:var(--greenDim); border:1px solid var(--green); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--green); text-transform:uppercase;">${activeW.name} (${selectedMatchLevel})</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${ourPts}</div>
            </div>
            <div style="background-color:var(--redDim); border:1px solid var(--red); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--red); text-transform:uppercase;">${oppName}</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${oppPts}</div>
            </div>
          </div>
          <div style="font-size:10px; color:var(--muted); text-align:center; margin-top:6px;">Live score from <strong style="color:var(--chalk);">${selectedCount}</strong> selected · Manual scoring rules</div>
        </div>
        <div class="card">
          ${renderScoutTitleRow("AI Video Scout:", activeW, `<span style="font-size:11px; color:var(--muted); font-weight:700; margin-left:4px;">Review (${selectedCount}/${parsedEvents.length})${lowCount ? ` · ${lowCount} low` : ""}</span><button class="btn-back" onclick="cancelImport()">Cancel</button>`)}
          <p style="font-size:11px; color:var(--muted); margin-bottom:8px;">Manual-format events. <strong style="color:var(--gold);">LOW</strong> unchecked by default. ✎ edits any field.</p>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
            ${[["all","All"],["low","Low"],["medium","Med"],["choices","Choices"],["moves","Moves"]].map(([k,lab]) =>
              `<button class="chip ${aiVerifyFilter===k?'selected':''}" style="min-width:auto;" onclick="aiVerifyFilter='${k}'; render();">${lab}</button>`
            ).join("")}
            <button class="btn btn-gold" style="font-size:10px; padding:4px 10px;" onclick="swapAllDir()">Swap All OFF/DEF</button>
            <button class="btn" style="background:var(--panelLine); color:var(--chalk); font-size:10px; padding:4px 10px;" onclick="selectAllAiEvents(true)">Select Visible</button>
            <button class="btn" style="background:var(--panelLine); color:var(--chalk); font-size:10px; padding:4px 10px;" onclick="selectAllAiEvents(false)">Deselect Visible</button>
          </div>
          <div style="max-height:440px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
            ${filtered.length === 0 ? `<p style="color:var(--muted); font-size:12px;">No events match filter.</p>` : ""}
            ${filtered.map(ev => {
              const idx = parsedEvents.findIndex(e => e.id === ev.id);
              const isLow = (ev.confidence || "").toLowerCase() === "low";
              const isChoice = ev.category === "Choice";
              const editing = editingAiEventId === ev.id;
              const od = formatOutcomeDisplay(ev);
              const ptsLabel = isChoice ? "" : (od.pointsHtml ? od.pointsHtml.replace(/[()]/g, "") : (od.label === "defended" ? "" : (ev.points ? `+${ev.points}` : "")));
              return `
                <div style="background:var(--mat); border:1px solid ${isLow ? 'var(--gold)' : 'var(--panelLine)'}; border-radius:6px; padding:8px 10px;">
                  <div style="display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;">
                    <input type="checkbox" style="margin-top:4px;" ${selectedEvents[ev.id] ? 'checked' : ''} onchange="toggleSelect('${ev.id}')" />
                    <div style="flex:1; min-width:200px;">
                      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:4px;">
                        <span style="font-family:monospace; color:var(--gold); cursor:pointer; text-decoration:underline; font-weight:700;" onclick="seekVideo('${escAttr(ev.timestamp || '')}')">${ev.timestamp || '--:--'}</span>
                        <span style="font-size:10px; color:var(--muted); font-weight:700;">[${ev.period || 'P1'}]</span>
                        ${confBadge(ev.confidence)}
                        ${isChoice ? `<span style="font-size:9px; font-weight:800; color:var(--gold);">CHOICE</span>` : ""}
                        <span style="font-weight:700; color:${ev.direction === 'offense' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvDir(${idx})">${ev.direction === 'offense' ? 'OFF' : 'DEF'}</span>
                        ${!isChoice ? `<span style="color:${od.color}; cursor:pointer; font-weight:700;" onclick="toggleEvOutcome(${idx})">${od.label}</span>` : ""}
                        ${ptsLabel ? `<span style="color:var(--gold); font-family:monospace; font-weight:700;">${ptsLabel}</span>` : ""}
                      </div>
                      <div style="font-size:12px;"><strong>${ev.category || ""}</strong>${ev.subCategory ? ` · ${ev.subCategory}` : ""} — <strong>${ev.move || ""}</strong></div>
                      ${formatModifiersHtmlForEvent(ev) ? `<div style="font-size:10px; margin-top:2px;">${formatModifiersHtmlForEvent(ev)}</div>` : ""}
                    </div>
                    <button class="btn" style="background:var(--panelLine); color:var(--chalk); font-size:10px; padding:4px 8px;" onclick="toggleAiEventEditor('${ev.id}')">${editing ? 'Close' : '✎ Edit'}</button>
                    <button class="btn btn-red" style="font-size:10px; padding:4px 8px;" onclick="deleteAiParsedEvent('${ev.id}')">✕</button>
                  </div>
                  ${editing ? renderAiEventEditor(ev, idx) : ""}
                </div>`;
            }).join("")}
          </div>
          <button id="ai-commit-btn" class="btn btn-green" style="width:100%;" onclick="commitImport()" ${selectedCount ? "" : "disabled"}>
            Commit ${selectedCount} Selected Event${selectedCount === 1 ? "" : "s"} to ${activeW.name}'s Stats
          </button>
        </div>
      `;
    }

    function renderAiEventEditor(ev, idx) {
      const isChoice = ev.category === "Choice";
      const cats = Object.keys(taxonomy.MOVE_GROUPS || {});
      const ties = taxonomy.TIE_MODIFIERS || [];
      const finishes = taxonomy.FINISH_MODIFIERS || DEFAULT_TAXONOMY.FINISH_MODIFIERS || [];
      const rides = taxonomy.RIDE_MODIFIERS || DEFAULT_TAXONOMY.RIDE_MODIFIERS || [];
      let moveOptions = [];
      if (!isChoice) {
        const group = taxonomy.MOVE_GROUPS[ev.category];
        if (Array.isArray(group)) moveOptions = group.slice();
        else if (group && typeof group === "object") {
          Object.keys(group).forEach(sub => (group[sub] || []).forEach(m => moveOptions.push(m)));
        }
        if (ev.move && !moveOptions.includes(ev.move)) moveOptions.unshift(ev.move);
      }
      return `
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--panelLine); display:flex; flex-direction:column; gap:8px;">
          <div class="grid-3">
            <div>
              <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Timestamp</label>
              <input class="input" style="margin-bottom:0;" value="${escAttr(ev.timestamp || '')}" onchange="updateAiParsedField(${idx}, 'timestamp', this.value)" />
            </div>
            <div>
              <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Period</label>
              <select class="select" style="margin-bottom:0;" onchange="updateAiParsedField(${idx}, 'period', this.value)">
                ${["P1","P2","P3","OT"].map(p => `<option value="${p}" ${ev.period===p?'selected':''}>${p}</option>`).join("")}
              </select>
            </div>
            <div>
              <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Confidence</label>
              <select class="select" style="margin-bottom:0;" onchange="updateAiParsedField(${idx}, 'confidence', this.value)">
                <option value="high" ${(ev.confidence||'').toLowerCase()==='high'?'selected':''}>high</option>
                <option value="medium" ${(ev.confidence||'medium').toLowerCase()==='medium'?'selected':''}>medium</option>
                <option value="low" ${(ev.confidence||'').toLowerCase()==='low'?'selected':''}>low</option>
              </select>
            </div>
          </div>
          <div class="grid-3">
            <div>
              <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Direction</label>
              <select class="select" style="margin-bottom:0;" onchange="updateAiParsedField(${idx}, 'direction', this.value); recalcAiEventPoints(${idx});">
                <option value="offense" ${ev.direction==='offense'?'selected':''}>Offense (us)</option>
                <option value="defense" ${ev.direction==='defense'?'selected':''}>Defense (faced)</option>
              </select>
            </div>
            ${isChoice ? `
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Chooser</label>
                <select class="select" style="margin-bottom:0;" onchange="updateAiChoiceChooser(${idx}, this.value)">
                  <option value="Home" ${(ev.move||'').includes('Home')?'selected':''}>Home</option>
                  <option value="Opponent" ${(ev.move||'').includes('Opponent')?'selected':''}>Opponent</option>
                </select>
              </div>
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Position</label>
                <select class="select" style="margin-bottom:0;" onchange="updateAiChoicePosition(${idx}, this.value)">
                  ${["Top","Bottom","Neutral","Defer"].map(p => `<option value="${p}" ${(ev.detail||ev.move||'').includes(p)?'selected':''}>${p}</option>`).join("")}
                </select>
              </div>
            ` : `
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Outcome</label>
                <select class="select" style="margin-bottom:0;" onchange="updateAiParsedField(${idx}, 'outcome', this.value); recalcAiEventPoints(${idx});">
                  <option value="success" ${ev.outcome==='success'?'selected':''}>success</option>
                  <option value="fail" ${ev.outcome==='fail'?'selected':''}>fail</option>
                </select>
              </div>
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Points</label>
                <input type="number" class="input" style="margin-bottom:0;" value="${ev.points || 0}" onchange="updateAiParsedField(${idx}, 'points', Number(this.value)||0)" />
              </div>
            `}
          </div>
          ${!isChoice ? `
            <div class="grid-2">
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Category</label>
                <select class="select" style="margin-bottom:0;" onchange="updateAiParsedCategory(${idx}, this.value)">
                  ${cats.map(c => `<option value="${escAttr(c)}" ${ev.category===c?'selected':''}>${c}</option>`).join("")}
                  <option value="Choice" ${ev.category==='Choice'?'selected':''}>Choice</option>
                </select>
              </div>
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Move</label>
                <select class="select" style="margin-bottom:0;" onchange="updateAiParsedField(${idx}, 'move', this.value); recalcAiEventPoints(${idx});">
                  ${moveOptions.map(m => `<option value="${escAttr(m)}" ${ev.move===m?'selected':''}>${m}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="grid-3">
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Tie / Setup</label>
                <select class="select" style="margin-bottom:0;" onchange="setAiModifier(${idx}, 'tie', this.value)">
                  <option value="">— none —</option>
                  ${ties.map(t => `<option value="${escAttr(t)}" ${(ev.tie||'').split(' + ').includes(t)?'selected':''}>${t}</option>`).join("")}
                </select>
              </div>
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Finish</label>
                <select class="select" style="margin-bottom:0;" onchange="setAiModifier(${idx}, 'finish', this.value)">
                  <option value="">— none —</option>
                  ${finishes.map(t => `<option value="${escAttr(t)}" ${(ev.tie||'').split(' + ').includes(t)?'selected':''}>${t}</option>`).join("")}
                </select>
              </div>
              <div>
                <label style="font-size:9px; color:var(--muted); text-transform:uppercase; font-weight:700;">Ride</label>
                <select class="select" style="margin-bottom:0;" onchange="setAiModifier(${idx}, 'ride', this.value)">
                  <option value="">— none —</option>
                  ${rides.map(t => `<option value="${escAttr(t)}" ${(ev.tie||'').split(' + ').includes(t)?'selected':''}>${t}</option>`).join("")}
                </select>
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function toggleAiEventEditor(id) {
      editingAiEventId = editingAiEventId === id ? null : id;
      render();
    }
    function updateAiParsedField(idx, field, value) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      parsedEvents[idx][field] = value;
      if (field === "confidence" && String(value).toLowerCase() === "low") selectedEvents[parsedEvents[idx].id] = false;
      render();
    }
    function recalcAiEventPoints(idx) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      const e = parsedEvents[idx];
      if (e.category === "Choice" || e.category === "Flow") e.points = 0;
      else if (isPenaltyCategory(e.category)) e.points = e.points || 1;
      else if (e.category === "Near Fall / Pin") {
        const src = (e.move || "") + " " + (e.detail || "");
        if (/pin/i.test(src)) e.points = 0;
        else if (/4/.test(src)) e.points = 4;
        else if (/3/.test(src)) e.points = 3;
        else if (/2/.test(src)) e.points = 2;
        else e.points = 0;
        if (e.outcome === "fail" && e.direction === "offense") e.points = 0;
        // Defended near-fall attempt — no board points
        if (e.direction === "defense" && e.outcome === "success") e.points = 0;
      } else if (e.direction === "defense" && e.outcome === "success") {
        e.points = 0; // defended
      } else if (e.outcome === "success") e.points = getPointValue(e.category, e.move);
      else if (e.outcome === "fail" && e.direction === "defense") e.points = getPointValue(e.category, e.move);
      else e.points = 0;
      render();
    }
    function updateAiParsedCategory(idx, cat) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      parsedEvents[idx].category = cat;
      if (cat === "Choice") {
        parsedEvents[idx].move = "Home Choice: Neutral";
        parsedEvents[idx].detail = "Neutral";
        parsedEvents[idx].outcome = "success";
        parsedEvents[idx].tie = "";
        parsedEvents[idx].points = 0;
        render();
        return;
      }
      const group = taxonomy.MOVE_GROUPS[cat];
      let first = "";
      if (Array.isArray(group) && group[0]) first = group[0];
      else if (group && typeof group === "object") {
        const sub = Object.keys(group)[0];
        first = (group[sub] && group[sub][0]) || "";
      }
      parsedEvents[idx].move = first;
      parsedEvents[idx].detail = "";
      recalcAiEventPoints(idx);
    }
    function updateAiChoiceChooser(idx, chooser) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      const pos = parsedEvents[idx].detail || "Neutral";
      parsedEvents[idx].category = "Choice";
      parsedEvents[idx].move = `${chooser} Choice: ${pos}`;
      parsedEvents[idx].detail = pos;
      parsedEvents[idx].direction = chooser === "Home" ? "offense" : "defense";
      parsedEvents[idx].outcome = "success";
      parsedEvents[idx].points = 0;
      render();
    }
    function updateAiChoicePosition(idx, pos) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      const chooser = (parsedEvents[idx].move || "").includes("Opponent") ? "Opponent" : "Home";
      parsedEvents[idx].category = "Choice";
      parsedEvents[idx].move = `${chooser} Choice: ${pos}`;
      parsedEvents[idx].detail = pos;
      parsedEvents[idx].outcome = "success";
      parsedEvents[idx].points = 0;
      render();
    }
    function setAiModifier(idx, kind, value) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      const finishes = taxonomy.FINISH_MODIFIERS || DEFAULT_TAXONOMY.FINISH_MODIFIERS || [];
      const rides = taxonomy.RIDE_MODIFIERS || DEFAULT_TAXONOMY.RIDE_MODIFIERS || [];
      const ties = taxonomy.TIE_MODIFIERS || [];
      let parts = (parsedEvents[idx].tie || "").split(" + ").filter(Boolean);
      const stripSet = new Set(kind === "tie" ? ties : kind === "finish" ? finishes : rides);
      parts = parts.filter(p => !stripSet.has(p));
      if (value) parts.push(value);
      parsedEvents[idx].tie = parts.join(" + ");
      render();
    }
    function deleteAiParsedEvent(id) {
      if (!parsedEvents) return;
      parsedEvents = parsedEvents.filter(e => e.id !== id);
      delete selectedEvents[id];
      if (editingAiEventId === id) editingAiEventId = null;
      render();
    }
    function selectAllAiEvents(on) {
      if (!parsedEvents) return;
      parsedEvents.forEach(ev => {
        const conf = (ev.confidence || "").toLowerCase();
        if (aiVerifyFilter === "low" && conf !== "low") return;
        if (aiVerifyFilter === "medium" && conf !== "medium") return;
        if (aiVerifyFilter === "choices" && ev.category !== "Choice") return;
        if (aiVerifyFilter === "moves" && (ev.category === "Choice" || ev.category === "Flow")) return;
        selectedEvents[ev.id] = !!on;
      });
      render();
    }

    function isNestedMoveCategory(cat) {
      const groups = (typeof getVisibleMoveGroups === "function") ? getVisibleMoveGroups() : (taxonomy.MOVE_GROUPS || {});
      const val = groups[cat];
      return !!(val && !Array.isArray(val) && typeof val === "object");
    }

      if (!selectedPrimaryCat) return 'Select Category';

      if (isNestedMoveCategory(selectedPrimaryCat) && !selectedSubCat) return `${selectedPrimaryCat}`;
      if (isNestedMoveCategory(selectedPrimaryCat) && selectedSubCat) return `${selectedPrimaryCat} > ${selectedSubCat}`;
      return `${selectedPrimaryCat}`;
    }

    function toggleTieModifierMulti(tie) {
      const kind = modifierSubView === "finishes" ? "finish" : (modifierSubView === "rides" ? "ride" : "tie");
      const idx = activeTieModifiers.findIndex(m => modName(m) === tie && modKind(m) === kind);
      if (idx !== -1) {
        activeTieModifiers.splice(idx, 1);
      } else {
        activeTieModifiers.push({ name: tie, tie: tie, owner: modifierAssignTarget, kind });
      }
      render();
    }

    function startMatch() {
      if (guardSeasonLocked("scoring matches")) return;
      const activeW = getActiveWrestler();
      if (!activeW) return;

      if (!store.activeBoutId || store.activeBoutId === "all" || !getActiveBout()) {
        alert("Select a dual or tournament in the Event dropdown before starting a match.\n\nMatches cannot be scored under \"All Events / Season Total\".");
        return;
      }

      if (!warnIfMissingWrestlerIdentification("starting the match")) return;

      const bout = getActiveBout();
      if (bout && bout.finalized) return;
      if (isSeasonLocked()) return;

      // Girls in Boys events: require Admin opt-in
      if (bout && bout.division === "Boys" && activeW.division === "Girls" && !appConfig.allowGirlsInBoysEvents) {
        alert(
          activeW.name + " is rostered as Girls, but this event is a Boys dual/tournament.\n\n" +
          "To allow Girls to wrestle in Boys events, enable the option in Admin → Manage Official Weight Classes."
        );
        return;
      }
      // Boys never compete in Girls events
      if (bout && bout.division === "Girls" && activeW.division === "Boys") {
        alert(
          activeW.name + " is rostered as Boys, but this event is a Girls dual/tournament.\n\n" +
          "Boys cannot be scored in Girls events."
        );
        return;
      }

      // Sync match level from the dropdown if present
      const levelSel = document.getElementById("log-match-level");
      if (levelSel) selectedMatchLevel = levelSel.value;

      const season = getActiveSeason();
      if (bout && bout.type === "Dual" && store.activeBoutId && store.activeBoutId !== "all") {
        // Only warn when attempting another Varsity bout — JV / Exhibition re-entries are expected
        if (selectedMatchLevel === "Varsity") {
          const prior = season.matches.filter(m =>
            m.wrestlerId === activeW.id && m.boutId === store.activeBoutId
          );
          if (prior.length > 0) {
            const levels = prior.map(m => m.level || "Varsity");
            const uniqueLevels = Array.from(new Set(levels));
            const levelList = uniqueLevels.join(", ");
            const msg =
              `${activeW.name} already has a match recorded for this dual (${levelList}).\n\n` +
              `For dual meets, a second bout should usually be scored as JV or Exhibition.\n\n` +
              `Current selection: Varsity\n\n` +
              `Change Match Level to JV or Exhibition, or press OK to continue with Varsity anyway.`;
            if (!confirm(msg)) return;
          }
        }
      }

      const opponent = document.getElementById("log-opponent").value.trim() || "Opponent";
      const matchWt = getScoutMatchWeightClass() || String(activeW.weightClass);
      scoutMatchWeightClass = matchWt;
      activeMatch = { 
        id: Math.random().toString(36).slice(2, 9), 
        wrestlerId: activeW.id, 
        boutId: store.activeBoutId,
        opponent, 
        level: selectedMatchLevel,
        date: new Date().toISOString().slice(0, 10),
        weightClass: matchWt,
        rosterWeightClass: String(activeW.weightClass),
        events: []
      };
      currentPeriod = "P1";
      ridingTimeActive = false;
      ridingTimeController = null;
      ridingTimeStartedTs = null;
      ridingTimeOurSec = 0;
      ridingTimeOppSec = 0;
      resetPassivityState();
      activeMatch.ourAppearance = snapshotOurWrestlerAppearance();
      render();
    }

    function setDir(d) {
      pauseVideoAndGetTime();
      manualDirection = d; 
      selectedPrimaryCat = null; 
      selectedSubCat = null;
      selectedPendingMove = null;
      render(); 
    }

    function setPrimaryCat(c) {
      pauseVideoAndGetTime();
      selectedPrimaryCat = c;
      selectedSubCat = null;
      selectedPendingMove = null;
      render();

    function logEvent(category, move, outcome, points = 0, detail = "") {
      const timestamp = pauseVideoAndGetTime();
      const modifiers = listToModifiersStruct(activeTieModifiers);
      const formattedTie = formatModifiersPlainFromStruct(modifiers);

      // Defense success = defended (no board points). Offense success / defense fail keep values.
      const resolvedPts = resolveEventPoints(category, move, manualDirection, outcome, points);
      if (manualDirection === "defense" && outcome === "success" && !isPenaltyCategory(category) && !detail) {
        detail = "Defended";
      }

      activeMatch.events.push({ 
        id: Math.random().toString(36).slice(2, 9), 
        matchId: activeMatch.id, 
        wrestlerId: activeMatch.wrestlerId, 
        boutId: store.activeBoutId,
        period: currentPeriod,
        category, 
        subCategory: selectedSubCat,
        move, 
        tie: formattedTie,
        modifiers,
        direction: manualDirection, 
        outcome, 
        points: resolvedPts,
        detail,
        timestamp,
        ts: Date.now() 
      });
      selectedPrimaryCat = null;
      selectedSubCat = null;
      selectedPendingMove = null;
      activeTieModifiers = [];
      render();
    }

    function logTurnMove(move, detail, points) {
      // Offense: we scored the NF/pin off the turn. Defense: NF/pin scored against us (faced).
      if (manualDirection === "offense") {
        logEvent("Turns", move, "success", points, detail);
      } else {
        logEvent("Turns", move, "fail", points, detail);
      }
    }

    function logThrowScore(move, points) {
      const detail = points + "-Point Throw";
      if (manualDirection === "offense") {
        logEvent("Takedown", move, "success", points, detail);
      } else {
        logEvent("Takedown", move, "fail", points, detail);
      }
    }

    function nearFallCategoryForLog(detail) {
      if (selectedPrimaryCat === "Exposure / Pin" || getSeasonStyle() !== "Folkstyle" || /Exposure/i.test(String(detail || ""))) {
        return "Exposure / Pin";
      }
      return "Near Fall / Pin";
    }

    /** Near Fall / Pin / Exposure outcomes — direction-aware so defense counts as faced. */
    function logNearFallScore(detail, points) {
      const cat = nearFallCategoryForLog(detail);
      if (manualDirection === "offense") {
        logEvent(cat, detail, "success", points, detail);
      } else {
        logEvent(cat, detail, "fail", points, detail);
      }
    }

    function logNearFallDefended() {
      // Defense only: NF/exposure attempt stopped — defended (no board points)
      const cat = nearFallCategoryForLog("");
      const move = cat === "Exposure / Pin" ? "Exposure Attempt" : "Near Fall Attempt";
      logEvent(cat, move, "success", 0, "Defended");
    }

    function logNearFallAttemptFailed(move) {
      const cat = nearFallCategoryForLog(move);
      const label = move || (cat === "Exposure / Pin" ? "Exposure Attempt" : "Near Fall Attempt");
      if (manualDirection === "offense") {
        logEvent(cat, label, "fail", 0, "Failed");
      } else {
        logEvent(cat, label, "success", 0, "Defended");
      }
    }

    function logTurnDefended(move) {
      logEvent("Turns", move, "success", 0, "Defended");
    }

    function logTurnAttemptFailed(move) {
      if (manualDirection === "offense") {
        logEvent("Turns", move, "fail", 0, "Failed");
      } else {
        // Opponent tried the turn and failed — we defended
        logEvent("Turns", move, "success", 0, "Defended");
      }
    }

    function logPenaltyMove(move, detail, points) {
      logEvent('Penalty/DQ', move, 'success', points, detail);

    function countGearIssued(type, size) {
      const t = String(type || "").toLowerCase();
      const s = String(size || "").toLowerCase();
      let n = 0;
      (store.seasons || []).forEach(season => {
        (season.roster || []).forEach(w => {
          (w.issuedGear || []).forEach(ig => {
            if (String(ig.type || "").toLowerCase() === t && String(ig.size || "").toLowerCase() === s) {
              n += Number(ig.qty) || 1;
            }
          });
        });
      });
      return n;
    }

    function parseMarkingRange(rangeStr) {
      const s = String(rangeStr || "").trim();
      if (!s) return [];
      const nums = new Set();
      s.split(/[,;\s]+/).forEach(part => {
        part = part.trim();
        if (!part) return;
        const m = part.match(/^(\d+)\s*[-–—]\s*(\d+)$/);
        if (m) {
          let a = Number(m[1]), b = Number(m[2]);
          if (a > b) { const t = a; a = b; b = t; }
          for (let i = a; i <= b && i - a < 500; i++) nums.add(String(i));
        } else if (/^\d+$/.test(part)) {
          nums.add(part);
        }
      });
      return Array.from(nums).sort((a, b) => Number(a) - Number(b));
    }

    function getIssuedMarkings(type, size) {
      const t = String(type || "").toLowerCase();
      const s = String(size || "").toLowerCase();
      const set = new Set();
      (store.seasons || []).forEach(season => {
        (season.roster || []).forEach(w => {
          (w.issuedGear || []).forEach(ig => {
            if (String(ig.type || "").toLowerCase() === t && String(ig.size || "").toLowerCase() === s) {
              if (ig.marking != null && ig.marking !== "") set.add(String(ig.marking));
            }
          });
        });
      });
      return set;
    }

    function addGearInventoryItem() {
      const typeEl = document.getElementById("gear-type");
      const sizeEl = document.getElementById("gear-size");
      const markEl = document.getElementById("gear-marking");
      const qtyEl = document.getElementById("gear-qty");
      const type = typeEl ? typeEl.value.trim() : "";
      const size = sizeEl ? sizeEl.value.trim() : "";
      const markingRange = markEl ? markEl.value.trim() : "";
      let quantity = Math.max(1, Number(qtyEl && qtyEl.value) || 1);
      if (!type) return alert("Enter a gear type (e.g. Singlet, Headgear).");
      const marks = parseMarkingRange(markingRange);
      if (marks.length) quantity = Math.max(quantity, marks.length);
      const existing = (gearInventory || []).find(g =>
        String(g.type).toLowerCase() === type.toLowerCase() &&
        String(g.size || "").toLowerCase() === size.toLowerCase() &&
        String(g.markingRange || "").toLowerCase() === markingRange.toLowerCase()
      );
      if (existing) {
        existing.quantity = (Number(existing.quantity) || 0) + quantity;
        if (markingRange && !existing.markingRange) existing.markingRange = markingRange;
      } else {
        gearInventory.push({
          id: Math.random().toString(36).slice(2, 9),
          type, size, markingRange, quantity
        });
      }
      if (typeEl) typeEl.value = "";
      if (sizeEl) sizeEl.value = "";
      if (markEl) markEl.value = "";
      if (qtyEl) qtyEl.value = "1";
      persist();
      render();
    }

    function issueGearItem(wrestlerId, type, size, gearId) {
      const season = getActiveSeason();
      const w = season.roster.find(r => r.id === wrestlerId);
      if (!w) return;
      if (!Array.isArray(w.issuedGear)) w.issuedGear = [];
      const stock = (gearInventory || []).find(g => g.id === gearId) ||
        (gearInventory || []).find(g =>
          String(g.type) === String(type) && String(g.size || "") === String(size || "")
        );
      if (!stock) return alert("Gear item not found in inventory.");
      const issued = countGearIssued(stock.type, stock.size);
      const avail = Math.max(0, (Number(stock.quantity) || 0) - issued);
      if (avail < 1) return alert("None available to issue.");

      let marking = "";
      const markInput = document.getElementById("gear-issue-mark-" + stock.id);
      if (markInput) marking = String(markInput.value || "").trim();
      const marks = parseMarkingRange(stock.markingRange || "");
      if (marks.length) {
        if (!marking) return alert("Enter a marking number for this item (e.g. from range " + stock.markingRange + ").");
        const used = getIssuedMarkings(stock.type, stock.size);
        if (used.has(String(marking))) return alert("Marking #" + marking + " is already issued.");
        if (!marks.includes(String(marking)) && !confirm("Marking #" + marking + " is outside the range " + stock.markingRange + ". Issue anyway?")) return;
      }

      w.issuedGear.push({
        type: stock.type,
        size: stock.size || "",
        qty: 1,
        marking: marking || "",
        gearId: stock.id,
        issuedAt: new Date().toISOString().slice(0, 10)
      });
      persist();
      renderModal();
    }

    function returnGearItem(wrestlerId, index) {
      const season = getActiveSeason();
      const w = season.roster.find(r => r.id === wrestlerId);
      if (!w || !Array.isArray(w.issuedGear)) return;
      const item = w.issuedGear[index];
      if (!item) return;
      if ((Number(item.qty) || 1) > 1) item.qty = (Number(item.qty) || 1) - 1;
      else w.issuedGear.splice(index, 1);
      persist();
      renderModal();
    }
