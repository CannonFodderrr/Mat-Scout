    function cycleEditModalTie(tie) {
      if (!editingEvent) return;
      let ties = editingEvent.tie ? editingEvent.tie.split(" + ") : [];
      const oppLabel = `Opp: ${tie}`;

      if (ties.includes(tie)) {
        ties = ties.filter(t => t !== tie);
        ties.push(oppLabel);
      } else if (ties.includes(oppLabel)) {
        ties = ties.filter(t => t !== oppLabel);
      } else {
        ties.push(tie);
      }
      editingEvent.tie = ties.join(" + ");
      renderModal();
    }

    function addOpponentToEditingBout() {
      const name = document.getElementById("modal-ed-opp-name").value.trim();
      const weightClass = document.getElementById("modal-ed-opp-weight").value.trim();
      if (!name || !weightClass) return alert("Enter opponent name and weight class.");
      if (!editingBout.opponentRoster) editingBout.opponentRoster = [];
      editingBout.opponentRoster.push({ name, weightClass });
      document.getElementById("modal-ed-opp-name").value = "";
      document.getElementById("modal-ed-opp-weight").value = "";
      renderModal();
    }

    function saveEditedWrestler() {
      const season = getActiveSeason();
      const idx = season.roster.findIndex(w => w.id === editingWrestler.id);
      if (idx !== -1) {
        season.roster[idx] = { ...editingWrestler };
      }
      closeModal();
      persist();
      render();
    }

    function saveEditedBout() {
      const season = getActiveSeason();
      const idx = season.bouts.findIndex(b => b.id === editingBout.id);
      if (idx !== -1) {
        season.bouts[idx] = { ...editingBout };
      }
      closeModal();
      persist();
      render();
    }

    function addBufferedOpponent() {
      const name = document.getElementById("modal-opp-name").value.trim();
      const weightClass = document.getElementById("modal-opp-weight").value.trim();
      const grade = document.getElementById("modal-opp-grade").value.trim();
      if (!name || !weightClass) return alert("Enter opponent name and weight class.");

      boutFormBuffer.opponents.push({ name, weightClass, grade });
      document.getElementById("modal-opp-name").value = "";
      document.getElementById("modal-opp-weight").value = "";
      document.getElementById("modal-opp-grade").value = "";
      renderModal();
    }

    function saveNewSeason() {
      const name = document.getElementById("modal-s-name").value.trim();
      const style = document.getElementById("modal-s-style").value;
      const importId = document.getElementById("modal-s-import").value;

      if (!name) return alert("Please enter a season name.");

      let initialRoster = [];
      if (importId !== "none") {
        const sourceSeason = store.seasons.find(s => s.id === importId);
        if (sourceSeason) {
          initialRoster = sourceSeason.roster.map(w => ({
            ...w,
            id: Math.random().toString(36).slice(2, 9),
            grade: (Number(w.grade) < 12 ? String(Number(w.grade) + 1) : "12")
          }));
        }
      }

      const newSeasonId = Math.random().toString(36).slice(2, 9);
      store.seasons.push({
        id: newSeasonId,
        name,
        style,
        boysDualRecord: { wins: 0, losses: 0, ties: 0 },
        girlsDualRecord: { wins: 0, losses: 0, ties: 0 },
        roster: initialRoster,
        bouts: [],
        matches: [],
        events: []
      });

      store.activeSeasonId = newSeasonId;
      store.activeBoutId = "all";
      store.activeWrestlerId = initialRoster.length > 0 ? initialRoster[0].id : null;
      closeModal();
      persist();
      render();
    }

    function saveNewBout() {
      const season = getActiveSeason();
      if (!boutFormBuffer.opponentTeam.trim()) return alert("Please enter the opponent team name.");

      const newBoutId = Math.random().toString(36).slice(2, 9);
      season.bouts.push({
        id: newBoutId,
        date: boutFormBuffer.date,
        type: boutFormBuffer.type,
        division: boutFormBuffer.division,
        opponentTeam: boutFormBuffer.opponentTeam.trim(),
        opponentRoster: [...boutFormBuffer.opponents],
        finalized: false
      });

      store.activeBoutId = newBoutId;
      boutFormBuffer = { date: new Date().toISOString().slice(0, 10), type: "Dual", division: "Boys", opponentTeam: "", opponents: [] };
      closeModal();
      persist();
      render();
    }

    function saveEditedEvent() {
      if (!activeMatch || !editingEvent) return;
      const idx = activeMatch.events.findIndex(e => e.id === editingEvent.id);
      if (idx !== -1) {
        activeMatch.events[idx] = { ...editingEvent };
      }
      closeModal();
    }

    function deleteEditedEvent() {
      if (!activeMatch || !editingEvent) return;
      activeMatch.events = activeMatch.events.filter(e => e.id !== editingEvent.id);
      closeModal();
    }

    /* IN-BROWSER AI ENGINE */
    async function extractFrames(file, statusCb) {
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.preload = "auto";
        video.src = URL.createObjectURL(file);
        video.muted = true;

        const canvas = document.getElementById("frame-canvas");
        const ctx = canvas.getContext("2d");
        const frames = [];

        video.onloadedmetadata = async () => {
          canvas.width = 480;
          canvas.height = Math.round(480 * (video.videoHeight / video.videoWidth));
          const duration = Math.min(video.duration, 180);
          const interval = 1.0;

          for (let time = 0; time < duration; time += interval) {
            statusCb(`Extracting match frames: ${Math.round((time / duration) * 100)}%`);
            await new Promise(r => {
              video.currentTime = time;
              video.onseeked = () => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
                frames.push({
                  time: `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(Math.floor(time % 60)).padStart(2, '0')}`,
                  base64: dataUrl.split(",")[1]
                });
                r();
              };
            });
          }
          URL.revokeObjectURL(video.src);
          resolve(frames);
        };
        video.onerror = () => reject(new Error("Could not decode local video file."));
      });
    }

    async function runDirectBrowserAnalysis() {
      const activeW = getActiveWrestler();
      if (!activeW) return alert("Select an active wrestler first.");

      const key = document.getElementById("imp-key").value.trim();
      const opponent = document.getElementById("imp-opp").value.trim() || "Opponent";

      if (!key) return alert("Please enter your Gemini API Key.");
      if (!selectedVideoFile) return alert("Please select a video file.");

      localStorage.setItem(API_KEY_STORAGE, key);
      const statusDiv = document.getElementById("ai-status");
      const aiBtn = document.getElementById("ai-btn");
      statusDiv.style.display = "block";
      aiBtn.disabled = true;

      try {
        const frames = await extractFrames(selectedVideoFile, (txt) => { statusDiv.textContent = txt; });
        statusDiv.textContent = `Analyzing ${frames.length} frames with Gemini...`;

        const contentsParts = [
          {
            text: `You are scoring a wrestling match for wrestler "${activeW.name}" vs "${opponent}". Takedowns score 3 points.
Watch sequential frames and return ONLY a JSON array of scoring actions with:
- "category": ("Takedown", "Escape", "Reversal", "Turns", "Near Fall / Pin", "Penalty")
- "move": specific move name
- "raw_move": specific move name or setup
- "direction": "offense" or "defense"
- "outcome": "success" or "fail"
- "timestamp": mm:ss
- "confidence": "high", "medium", or "low"`
          }
        ];

        frames.forEach(f => {
          contentsParts.push({ text: `Frame Time: ${f.time}` });
          contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: f.base64 } });
        });

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: contentsParts }] })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || "Gemini API error.");
        }

        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        let clean = text.trim();
        if (clean.startsWith("```")) clean = clean.split("```")[1].replace(/^json/, "");
        
        parsedEvents = JSON.parse(clean).map(e => ({ ...e, id: Math.random().toString(36).slice(2, 9) }));
        selectedEvents = {};
        parsedEvents.forEach(e => { selectedEvents[e.id] = e.confidence !== 'low'; });
        render();
      } catch (err) {
        alert("Analysis Error: " + err.message);
        statusDiv.style.display = "none";
        aiBtn.disabled = false;
      }
    }

    function toggleSelect(id) { selectedEvents[id] = !selectedEvents[id]; render(); }
    function toggleEvDir(idx) { parsedEvents[idx].direction = parsedEvents[idx].direction === 'offense' ? 'defense' : 'offense'; render(); }
    function toggleEvOutcome(idx) { parsedEvents[idx].outcome = parsedEvents[idx].outcome === 'success' ? 'fail' : 'success'; render(); }
    function swapAllDir() { parsedEvents.forEach(e => { e.direction = e.direction === 'offense' ? 'defense' : 'offense'; }); render(); }
    function cancelImport() { parsedEvents = null; render(); }

    function commitImport() {
      const activeW = getActiveWrestler();
      const season = getActiveSeason();
      if (!activeW) return;
      const opponent = document.getElementById("imp-opp")?.value.trim() || "Opponent";
      const matchId = Math.random().toString(36).slice(2, 9);
      season.matches.push({ id: matchId, wrestlerId: activeW.id, boutId: store.activeBoutId, opponent, level: selectedMatchLevel, date: new Date().toISOString().slice(0, 10), source: "video" });
      parsedEvents.filter(e => selectedEvents[e.id]).forEach(e => {
        season.events.push({
          id: e.id, matchId, wrestlerId: activeW.id, boutId: store.activeBoutId, category: e.category || "Takedown",
          move: e.move || "Unknown", rawMove: e.raw_move || e.move,
          direction: e.direction || "offense", outcome: e.outcome || "success", 
          timestamp: e.timestamp || "",
          ts: Date.now()
        });
      });
      parsedEvents = null;
      persist();
      switchTab("sheet");
    }

    window.onload = init;
  </script>
