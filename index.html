              ${girlsOptions.length ? `<optgroup label="Girls">${girlsOptions.map(w => `<option value="${w.id}" ${!statsShowTeam && w.id === activeW.id ? 'selected' : ''}>${w.name} — ${w.weightClass} lbs (${w.level})</option>`).join('')}</optgroup>` : ''}
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>${planTitle}</span>
            ${helpIcon('plan_remediation')}
          </div>
          
          <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">
            Positional Proficiency Focus <span style="font-weight:400; text-transform:none;">(yellow &amp; red bands: index &lt; 0.25)</span>
          </div>
          ${weakPositions.length === 0 ? `<p style="color:var(--muted); font-size:12px; margin-bottom:12px;">All positions are in the green band (≥ 0.25). No proficiency remediation needed.</p>` : ''}
          ${weakPositions.map(p => `
            <div style="background:var(--mat); padding:10px; border-radius:4px; margin-bottom:6px; border:1px solid var(--panelLine);">
              <div style="display:flex; justify-content:space-between; font-weight:700; font-size:13px; margin-bottom:4px;">
                <span>${p.name} Position
                  <span style="font-size:10px; font-weight:800; text-transform:uppercase; margin-left:6px; color:${p.color};">
                    [${p.band === 'red' ? 'RED' : 'YELLOW'}]
                  </span>
                </span>
                <span style="font-family:monospace; color:${p.color};">${formatProfIndex(p.idx)}</span>
              </div>
              <div style="font-size:11px; color:var(--muted); margin-bottom:4px;">
                ${p.data.successes} successes · ${p.data.failures} failures · ${p.data.opps} opportunities
              </div>
              <div style="font-size:11px; color:var(--chalk);">
                <strong style="color:var(--gold);">Drill Focus: </strong>${PROF_DRILLS[p.name]}
              </div>
            </div>

    function setAttendanceStatus(dateStr, wrestlerId, status) {

    /** Calendar attendance list: typing in the "Jump to last name" box scrolls/highlights the first match. */
    let attendanceJumpIndex = -1;
    let attendanceJumpQuery = "";

    function jumpToAttendanceRow(query, direction) {
      // direction: undefined = first match / re-query; 1 = next; -1 = previous
      const q = String(query != null ? query : (document.getElementById("att-jump-input") || {}).value || "").trim().toLowerCase();
      const list = document.getElementById("att-row-list");
      if (!list) return;
      const rows = Array.from(list.querySelectorAll("[data-lastname]"));
      rows.forEach(r => { r.style.outline = ""; });
      if (!q) {
        attendanceJumpIndex = -1;
        attendanceJumpQuery = "";
        return;
      }
      const matches = rows.filter(r => {
        const ln = (r.getAttribute("data-lastname") || "").toLowerCase();
        return ln.startsWith(q) || (q.length === 1 && ln.charAt(0) === q);
      });
      if (!matches.length) {
        attendanceJumpIndex = -1;
        attendanceJumpQuery = q;
        return;
      }
      if (q !== attendanceJumpQuery || direction == null) {
        attendanceJumpQuery = q;
        attendanceJumpIndex = 0;
      } else {
        const step = direction === -1 ? -1 : 1;
        attendanceJumpIndex = (attendanceJumpIndex + step + matches.length) % matches.length;
      }
      const match = matches[attendanceJumpIndex];
      if (match) {
        match.scrollIntoView({ block: "nearest", behavior: "smooth" });
        match.style.outline = "2px solid var(--gold)";
      }
    }

    function cycleAttendanceJump(direction) {
      const inp = document.getElementById("att-jump-input");

    /**
     * Attendance is "unknown" by default for every wrestler until explicitly marked
     * (either individually, or all at once via Mark All Present). hasAtt = true once
     * ANY wrestler has been marked for that date — the snapshot is only shown then.
     */
    function summarizeDayAttendance(dateStr) {
      const season = getActiveSeason();
      ensureSeasonCalendar(season);
      const roster = season.roster || [];
      const day = season.attendance[dateStr] || {};
      const hasAtt = Object.keys(day).length > 0;
      let present = 0, excused = 0, absent = 0, late = 0, unknown = 0;
      const total = roster.length;
      roster.forEach(w => {
        const rec = day[w.id];
        if (!rec) { unknown++; return; }
        if (rec.status === "present") present++;
        else if (rec.status === "excused") excused++;
        else if (rec.status === "absent") absent++;
        else if (rec.status === "late") late++;
        else unknown++;
      });
      let label = "";
      if (hasAtt) {
        label = present + "/" + total + " in attendance";
        const extras = [];
        if (excused) extras.push(excused + " exc");
        if (late) extras.push(late + " late");
        if (absent) extras.push(absent + " abs");
        if (unknown) extras.push(unknown + " unk");
        if (extras.length) label += " - " + extras.join(", ");
      }
      return { present, total, excused, absent, late, unknown, hasAtt, label };
    }

    function getWrestlerAttendanceStats(wrestlerId) {
      const season = getActiveSeason();
      ensureSeasonCalendar(season);
      let abs = 0, absInj = 0, exc = 0, excInj = 0, late = 0, lateInj = 0, totalEvents = 0;
      const dates = new Set();
      // Count days that have any attendance marked OR are practices in calendarEntries OR bout dates?
      // User: "Total practices" — count days with attendance records or calendar practice entries
      Object.keys(season.attendance || {}).forEach(d => {
        const day = season.attendance[d];
        if (day && Object.keys(day).length > 0) {
          // Only count days where attendance was actually taken (at least one wrestler marked)
          dates.add(d);
        }
      });
      (season.calendarEntries || []).forEach(e => {
        if (e && e.date) dates.add(e.date);
      });
      // Also count bout dates as events? User said practices primarily - include custom + days with attendance
      totalEvents = dates.size;
      dates.forEach(d => {
        const rec = (season.attendance[d] || {})[wrestlerId];
        if (!rec || rec.status === "present") return;
        if (rec.status === "absent") { abs++; if (rec.injuryRelated) absInj++; }
        else if (rec.status === "excused") { exc++; if (rec.injuryRelated) excInj++; }
        else if (rec.status === "late") { late++; if (rec.injuryRelated) lateInj++; }
      });
      let rate = 100;
      if (totalEvents > 0) {
        let effectiveAbs = abs; // excused typically still counts against pure present rate? User: 5/10 - 2E suggests excused are separate from present
        // Attendance rate = present days / total. Present = total - abs - exc - late(if counted)
        let missed = abs + exc;
        if (appConfig.countLatesInAttendanceRate) {
          const ratio = Math.max(1, Number(appConfig.latesPerAbsence) || 2);
          missed += late / ratio;
        }
        rate = Math.max(0, Math.round((1 - missed / totalEvents) * 1000) / 10);
      }
      return { abs, absInj, exc, excInj, late, lateInj, totalEvents, rate };
    }

    function printCalendarMonth() {
      const season = getActiveSeason();
      ensureSeasonCalendar(season);
      const months = season.calendarMonths || [];
      const ym = calendarActiveMonth || months[0];
      if (!ym) return alert("Add a month tab first.");
      const parts = ym.split("-").map(Number);
      const year = parts[0], month = parts[1];
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const team = branding.teamName || "Team";
      const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      const first = new Date(year, month - 1, 1);
      const startPad = first.getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const cells = [];
      for (let i = 0; i < startPad; i++) cells.push(`<td></td>`);
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = year + "-" + String(month).padStart(2,"0") + "-" + String(d).padStart(2,"0");
        const bouts = (season.bouts || []).filter(b => b.date === dateStr);
        const customs = (season.calendarEntries || []).filter(e => e.date === dateStr);
        const sum = summarizeDayAttendance(dateStr);
        cells.push(`<td style="vertical-align:top; height:80px;">
          <div style="font-weight:800;">${d}</div>
          ${sum.hasAtt ? `<div style="font-size:9px; color:#666;">${esc(sum.label)}</div>` : ""}
          ${bouts.map(b => `<div style="font-size:9px; color:${b.division === 'Boys' ? '#2A5FA5' : (b.division === 'Girls' ? '#B23A6B' : '#2F7A4F')};">${esc(b.type)}: ${esc(b.opponentTeam || "")}</div>`).join("")}
          ${customs.map(c => `<div style="font-size:9px;">${esc(c.title)}</div>`).join("")}
        </td>`);
        if ((startPad + d) % 7 === 0 && d !== daysInMonth) cells.push(`</tr><tr>`);
      }

      const html = `<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>${esc(team)} — ${esc(monthNames[month-1])} ${year}</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; color: #111; margin: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  h2 { font-size: 14px; font-weight: 600; color: #444; margin: 0 0 16px 0; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid #ccc; padding: 4px; font-size: 11px; }
  th { background: #f3f4f6; text-transform: uppercase; font-size: 10px; }
  @media print { body { margin: 12px; } }
</style></head><body>
  <h1>${esc(team)}</h1>
  <h2>${esc(monthNames[month-1])} ${year} — Team Calendar</h2>
  <table>
    <thead><tr>${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<th>${d}</th>`).join("")}</tr></thead>
    <tbody><tr>${cells.join("")}</tr></tbody>
  </table>
  <script>window.onload = function(){ window.print(); };<\/script>
</body></html>`;

      const w = window.open("", "_blank");
      if (!w) {
        alert("Pop-up blocked. Allow pop-ups to print the calendar.");
        return;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
    }

    function renderAdminSubcatSelect(cat) {
      const container = document.getElementById("adm-subcat-container");
      if (!container) return;
      const val = taxonomy.MOVE_GROUPS[cat];
      const isNested = val && !Array.isArray(val) && typeof val === "object";
      container.style.display = isNested ? "block" : "none";
      if (isNested) {
        const sel = document.getElementById("adm-subcat");
        if (sel) {
          sel.innerHTML = Object.keys(val).map(s => `<option value="${s}">${s}</option>`).join('');
        }
      }
    }

    let awardAssignDivision = "All";
    let awardAssignStyle = "Folkstyle"; // Folkstyle | Freestyle | Greco
    let assigningAwardIdx = null;

    function adminCreateAward() {
      const name = document.getElementById("adm-award-name").value.trim();
      const icon = document.getElementById("adm-award-icon").value;

      if (!name) return alert("Please enter an award name.");
      awards.push({ id: Math.random().toString(36).slice(2, 9), name, icon, assignments: [] });
      persist();
      render();
    }

    function adminDeleteAward(idx) {
      if (!confirm("Are you sure you want to delete this award?")) return;
      awards.splice(idx, 1);
      persist();
      render();
    }

    function openAssignAwardModal(idx) {
      assigningAwardIdx = idx;
      awardAssignDivision = "All";
      awardAssignStyle = "Folkstyle";
      activeModal = "assign-award";
      renderModal();
    }

    function ensureAwardAssignments(aw) {
      if (!Array.isArray(aw.assignments)) {
        const season = getActiveSeason();
        const year = getSeasonYearLabel(season);
        let ids = Array.isArray(aw.wrestlerIds) ? aw.wrestlerIds.slice() : [];
        if (aw.wrestlerId && !ids.includes(aw.wrestlerId)) ids.push(aw.wrestlerId);
        aw.assignments = ids.map(id => {
          const w = season.roster.find(r => r.id === id);
          return {
            wrestlerId: id,
            wrestlerName: w ? w.name : "Unknown Athlete",
            weightClass: w ? w.weightClass : "",
            division: w ? w.division : "",
            year,
            seasonId: season.id,
            seasonName: season.name
          };
        });
        delete aw.wrestlerId;
        delete aw.wrestlerIds;
      }
      return aw.assignments;
    }

    function assignWrestlerToAward(wrestlerId) {
      if (assigningAwardIdx == null || !wrestlerId) return;
      const aw = awards[assigningAwardIdx];
      if (!aw) return;
      const season = getActiveSeason();
      const year = getSeasonYearLabel(season);
      const style = awardAssignStyle || "Folkstyle";
      const list = ensureAwardAssignments(aw);
      const already = list.some(a => a.wrestlerId === wrestlerId && a.year === year && (a.style || "Folkstyle") === style);
      if (already) return;
      const w = season.roster.find(r => r.id === wrestlerId);
      if (!w) return;
      list.push({
        wrestlerId: w.id,
        wrestlerName: w.name,
        weightClass: w.weightClass,
        division: w.division,
        year,
        style,
        seasonId: season.id,
        seasonName: season.name
      });
      persist();
      renderModal();
    }

    function unassignWrestlerFromAward(wrestlerId, year) {
      if (assigningAwardIdx == null) return;
      const aw = awards[assigningAwardIdx];
      if (!aw) return;
      const list = ensureAwardAssignments(aw);
      aw.assignments = list.filter(a => !(a.wrestlerId === wrestlerId && (!year || a.year === year)));
      persist();
      renderModal();
    }

    /** Remove a Hall of Fame assignment from Admin without opening the assign modal. */
    function removeHallOfFameAssignment(awardIdx, wrestlerId, year) {
      const aw = awards[awardIdx];
      if (!aw) return;
      const label = (aw.icon || "") + " " + (aw.name || "Award");
      if (!confirm(`Remove this Hall of Fame entry?\n\n${label}\nAthlete assignment for year: ${year || "—"}`)) return;
      const list = ensureAwardAssignments(aw);
      aw.assignments = list.filter(a => !(a.wrestlerId === wrestlerId && (!year || a.year === year)));
      persist();
      render();
    }

    function adminAddWeightClass(div) {
      const input = document.getElementById(div === "Boys" ? "adm-add-boy-weight" : "adm-add-girl-weight");
      if (!input) return;
      const wt = input.value.trim();
      if (!wt || isNaN(wt)) return alert("Please enter a numeric weight class.");

      if (!weightClasses[div].includes(wt)) {
        weightClasses[div].push(wt);
        weightClasses[div].sort((a, b) => Number(a) - Number(b));
      }
      input.value = "";
      persist();
      render();
    }

    function adminDeleteWeightClass(div, wt) {
      if (!confirm(`Are you sure you want to delete the ${wt} lbs (${div}) weight class?`)) return;
      weightClasses[div] = weightClasses[div].filter(w => w !== wt);
      persist();
      render();
    }

    function resetDefaultWeightClasses() {
      if (!confirm("Reset all Boys and Girls weight classes to NFHS standard defaults?")) return;
      weightClasses = JSON.parse(JSON.stringify(DEFAULT_WEIGHT_CLASSES));
      persist();
      render();
    }

    function dragStart(e, cat, sub, idx) {
      draggedMove = { cat, sub, idx };
    }

    function dropMove(e, targetCat, targetSub, targetIdx) {
      e.preventDefault();
      if (!draggedMove || draggedMove.cat !== targetCat || draggedMove.sub !== targetSub) return;
      
      let list = targetSub ? taxonomy.MOVE_GROUPS[targetCat][targetSub] : taxonomy.MOVE_GROUPS[targetCat];
      const item = list.splice(draggedMove.idx, 1)[0];
      list.splice(targetIdx, 0, item);
      draggedMove = null;
      persist();
      render();
    }

    function adminAddMove() {
      const cat = document.getElementById("adm-cat").value;
      const moveName = document.getElementById("adm-move-name").value.trim();
      if (!moveName) return alert("Please enter a move name.");

      const group = taxonomy.MOVE_GROUPS[cat];
      if (group && !Array.isArray(group) && typeof group === "object") {
        const sub = document.getElementById("adm-subcat").value;
        if (!group[sub]) group[sub] = [];
        if (!group[sub].includes(moveName)) group[sub].push(moveName);
      } else {
        if (!Array.isArray(taxonomy.MOVE_GROUPS[cat])) taxonomy.MOVE_GROUPS[cat] = [];
        if (!taxonomy.MOVE_GROUPS[cat].includes(moveName)) {
          taxonomy.MOVE_GROUPS[cat].push(moveName);
        }
      }
      const styles = [];
      if (document.getElementById("adm-move-style-folk")?.checked) styles.push("Folkstyle");
      if (document.getElementById("adm-move-style-free")?.checked) styles.push("Freestyle");
      if (document.getElementById("adm-move-style-greco")?.checked) styles.push("Greco");
      if (styles.length && styles.length < 3) {
        moveStyleTags[moveName] = styles;
      } else {
        delete moveStyleTags[moveName]; // all styles = no restriction
      }
      persist();
      render();
    }

    function adminDeleteMove(cat, sub, moveName) {
      if (!confirm(`Are you sure you want to delete "${moveName}" from the taxonomy?`)) return;
      const group = taxonomy.MOVE_GROUPS[cat];
      if (sub && group && !Array.isArray(group) && typeof group === "object") {
        group[sub] = (group[sub] || []).filter(m => m !== moveName);
      } else if (Array.isArray(group)) {
        taxonomy.MOVE_GROUPS[cat] = group.filter(m => m !== moveName);
      }
      persist();
      render();
    }

    function adminAddTie() {
      const tieName = document.getElementById("adm-tie-name").value.trim();
      if (!tieName) return alert("Please enter a tie modifier name.");
      if (!taxonomy.TIE_MODIFIERS.includes(tieName)) {
        taxonomy.TIE_MODIFIERS.push(tieName);
      }
      persist();
      render();
    }

    function adminDeleteTie(tie) {
      if (!confirm(`Are you sure you want to delete the tie modifier "${tie}"?`)) return;
      taxonomy.TIE_MODIFIERS = taxonomy.TIE_MODIFIERS.filter(t => t !== tie);
      persist();
      render();
    }

    function adminAddFinish() {
      const finName = document.getElementById("adm-finish-name").value.trim();
      if (!finName) return alert("Please enter a finish/counter name.");
      if (!taxonomy.FINISH_MODIFIERS) taxonomy.FINISH_MODIFIERS = [...DEFAULT_TAXONOMY.FINISH_MODIFIERS];
      if (!taxonomy.FINISH_MODIFIERS.includes(finName)) {
        taxonomy.FINISH_MODIFIERS.push(finName);
      }
      persist();
      render();
    }

    function adminDeleteFinish(fin) {
      if (!confirm(`Are you sure you want to delete the finish modifier "${fin}"?`)) return;
      if (!taxonomy.FINISH_MODIFIERS) taxonomy.FINISH_MODIFIERS = [...DEFAULT_TAXONOMY.FINISH_MODIFIERS];
      taxonomy.FINISH_MODIFIERS = taxonomy.FINISH_MODIFIERS.filter(f => f !== fin);
      persist();
      render();
    }

    function adminAddRide() {
      const rideName = document.getElementById("adm-ride-name").value.trim();
      if (!rideName) return alert("Please enter a ride name.");
      if (!taxonomy.RIDE_MODIFIERS) taxonomy.RIDE_MODIFIERS = [...DEFAULT_TAXONOMY.RIDE_MODIFIERS];
      if (!taxonomy.RIDE_MODIFIERS.includes(rideName)) {
        taxonomy.RIDE_MODIFIERS.push(rideName);
      }
      persist();
      render();
    }

    function adminDeleteRide(ride) {
      if (!confirm(`Are you sure you want to delete the ride "${ride}"?`)) return;
      if (!taxonomy.RIDE_MODIFIERS) taxonomy.RIDE_MODIFIERS = [...DEFAULT_TAXONOMY.RIDE_MODIFIERS];
      taxonomy.RIDE_MODIFIERS = taxonomy.RIDE_MODIFIERS.filter(r => r !== ride);

      render();

          descFailure = "Takedowns conceded / scored on (+1 each)";

    function cycleEditModalTie(tie) {
      if (!editingEvent) return;
      const s = parseEventModifiers(editingEvent);
      const inOur = (s.our.ties || []).includes(tie) || (s.our.finishes || []).includes(tie) || (s.our.rides || []).includes(tie);
      const inOpp = (s.opp.ties || []).includes(tie) || (s.opp.finishes || []).includes(tie) || (s.opp.rides || []).includes(tie);
      const strip = (side) => {
        side.ties = (side.ties || []).filter(n => n !== tie);
        side.finishes = (side.finishes || []).filter(n => n !== tie);
        side.rides = (side.rides || []).filter(n => n !== tie);
      };
      // Cycle: none → Our → Opp → none
      if (!inOur && !inOpp) {
        s.our.ties.push(tie);
      } else if (inOur) {
        strip(s.our);
        s.opp.ties.push(tie);
      } else {
        strip(s.opp);
      }
      editingEvent.modifiers = s;
      editingEvent.tie = formatModifiersPlainFromStruct(s);
      renderModal();
    }

    /* IN-BROWSER AI ENGINE */
    async function extractFrames(fileOrUrl, statusCb) {
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.preload = "auto";
        video.muted = true;
        video.playsInline = true;
        let objectUrl = null;
        if (typeof fileOrUrl === "string") {
          video.src = fileOrUrl;
        } else if (fileOrUrl) {
          objectUrl = URL.createObjectURL(fileOrUrl);
          video.src = objectUrl;
        } else {
          reject(new Error("No local video provided."));
          return;
        }

        const canvas = document.getElementById("frame-canvas");
        const ctx = canvas.getContext("2d");
        const frames = [];

        video.onloadedmetadata = async () => {
          try {
            const maxSide = 512;
            let w = video.videoWidth || 640;
            let h = video.videoHeight || 360;
            if (Math.max(w, h) > maxSide) {
              const scale = maxSide / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            canvas.width = Math.max(1, w);
            canvas.height = Math.max(1, h);
            const duration = Math.min(video.duration || 0, 180);
            if (!duration || !isFinite(duration)) {
              if (objectUrl) URL.revokeObjectURL(objectUrl);
              reject(new Error("Could not read video duration. Try re-exporting as H.264 .mp4."));
              return;
            }
            const interval = 1.0;

            for (let time = 0; time < duration; time += interval) {
              if (statusCb) statusCb(`Extracting match frames: ${Math.round((time / duration) * 100)}%`);
              await new Promise(r => {
                const onSeeked = () => {
                  video.removeEventListener("seeked", onSeeked);
                  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                  const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
                  frames.push({
                    time: `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(Math.floor(time % 60)).padStart(2, '0')}`,
                    base64: dataUrl.split(",")[1]
                  });
                  r();
                };
                video.addEventListener("seeked", onSeeked);
                try { video.currentTime = Math.min(time, Math.max(0, duration - 0.05)); } catch (e) { r(); }
              });
            }
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            resolve(frames);
          } catch (err) {
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            reject(err);
          }
        };
        video.onerror = () => {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          reject(new Error("Could not decode local video file. Use an H.264 .mp4 if possible."));
        };
      });
    }

    function inferPeriodFromTimestamp(ts) {
      const sec = (() => {
        if (!ts) return 0;
        const p = String(ts).split(":").map(Number);
        if (p.length === 2 && p.every(n => !isNaN(n))) return p[0] * 60 + p[1];
        return 0;
      })();
      if (sec < 120) return "P1";
      if (sec < 240) return "P2";
      return "P3";
    }

    function parseTimestampToSeconds(ts) {
      if (ts == null || ts === "") return null;
      if (typeof ts === "number" && isFinite(ts)) return Math.max(0, ts);
      const parts = String(ts).trim().split(":");
      if (parts.length === 2) {
        const m = Number(parts[0]), s = Number(parts[1]); // fractional OK e.g. "01:23.4"
        if (!isNaN(m) && !isNaN(s)) return Math.max(0, m * 60 + s);
      }
      if (parts.length === 3) {
        const h = Number(parts[0]), m = Number(parts[1]), s = Number(parts[2]);
        if ([h, m, s].every(n => !isNaN(n))) return Math.max(0, h * 3600 + m * 60 + s);
      }
      const n = Number(ts);
      return isNaN(n) ? null : Math.max(0, n);
    }

    function formatMmSs(secs) {
      const s = Math.max(0, Math.floor(secs || 0));
      return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }

    async function extractFramesAtTimes(blob, timesSec, statusCb) {
      if (!blob || !timesSec || !timesSec.length) return [];
      const uniqueTimes = Array.from(new Set(timesSec.map(t => Math.max(0, Number(t))).filter(t => isFinite(t)))).sort((a,b)=>a-b);
      if (!uniqueTimes.length) return [];
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.preload = "auto"; video.muted = true; video.playsInline = true;
        const objectUrl = URL.createObjectURL(blob);
        video.src = objectUrl;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const frames = [];
        video.onloadedmetadata = async () => {
          try {
            const maxSide = 512;
            let w = video.videoWidth || 640;
            let h = video.videoHeight || 360;
            if (Math.max(w, h) > maxSide) {
              const scale = maxSide / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            canvas.width = Math.max(1, w);
            canvas.height = Math.max(1, h);
            const duration = video.duration || 0;
            for (let i = 0; i < uniqueTimes.length; i++) {
              const time = Math.min(uniqueTimes[i], Math.max(0, duration - 0.05));
              if (statusCb) statusCb(`Training frames ${i+1}/${uniqueTimes.length}…`);
              await new Promise(r => {
                const onSeeked = () => {
                  video.removeEventListener("seeked", onSeeked);
                  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                  frames.push({ time: formatMmSs(time), base64: canvas.toDataURL("image/jpeg", 0.5).split(",")[1], secs: time });
                  r();
                };
                video.addEventListener("seeked", onSeeked);
                try { video.currentTime = time; } catch (e) { r(); }
              });
            }
            URL.revokeObjectURL(objectUrl);
            resolve(frames);
          } catch (err) { URL.revokeObjectURL(objectUrl); reject(err); }
        };
        video.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Could not decode training video.")); };
      });
    }

    function buildStructuredTaxonomyForPrompt() {
      const groups = {};
      Object.keys(taxonomy.MOVE_GROUPS || {}).forEach(cat => {
        const val = taxonomy.MOVE_GROUPS[cat];
        if (Array.isArray(val)) groups[cat] = val.slice();
        else if (val && typeof val === "object") {
          groups[cat] = {};
          Object.keys(val).forEach(sub => { groups[cat][sub] = (val[sub] || []).slice(); });
        }
      });
      return {
        MOVE_GROUPS: groups,
        TIE_MODIFIERS: (taxonomy.TIE_MODIFIERS || []).slice(),
        FINISH_MODIFIERS: (taxonomy.FINISH_MODIFIERS || []).slice(),
        RIDE_MODIFIERS: (taxonomy.RIDE_MODIFIERS || []).slice()
      };
    }

    function buildMatScoutRulesPrompt(activeW, opponent) {
      const tax = buildStructuredTaxonomyForPrompt();
      return (
        `You are Mat Scout's folkstyle wrestling video scorer.\n` +
        `Score for OUR wrestler "${activeW.name}" vs "${opponent}".\n` +
        `OUR WRESTLER VISUAL ID: ${formatOurWrestlerAppearanceText(ourWrestlerAppearance, activeW.name)}\n` +
        `Opponent is the other athlete.\n\n` +
        `RULES:\n` +
        `1) Log technique attempts (success OR fail) and period position CHOICES.\n` +
        `2) Prefer move names from MOVE_GROUPS. Do not invent free-form moves when taxonomy matches.\n` +
        `3) When visible, set modifiers from taxonomy lists only. Ownership format is required:\n` +
        `   - Put opponent setups/finishes/rides after "Opp:" and our wrestler after "Our:".\n` +
        `   - Example: "Opp: Outside Tie + Poor Penetration Our: Sprawl"\n` +
        `   - Prefer separate fields when possible: tie (setups), finish, ride — still use Opp:/Our: inside each string if both sides contribute.\n` +
        `4) direction "offense" = our wrestler (matching ankle band/singlet); "defense" = opponent action we faced.\n` +
        `5) Period choices: referee/wrestler hand signals Top/Bottom/Neutral/Defer → category Choice, move "Home Choice: Bottom" etc. Use confidence low if unclear.\n` +
        `6) confidence high|medium|low. Prefer low when unsure.\n` +
        `7) Return ONLY a JSON array. Fields: category, subCategory, move, direction, outcome, timestamp, period, confidence, tie, finish, ride, detail.\n\n` +
        `TAXONOMY:\n` + JSON.stringify(tax) + `\n`
      );
    }

    function pickScorableEvents(events, maxN) {
      return (events || []).filter(e => e && e.category !== "Flow").filter(e => parseTimestampToSeconds(e.timestamp) != null).slice(0, maxN);
    }

    function eventLabelLine(e) {
      const bits = [e.timestamp||"", e.category||"", e.move||"", e.direction||"", e.outcome||""];
      if (e.tie) bits.push("tie:"+e.tie);
      if (e.detail) bits.push("detail:"+e.detail);
      return bits.filter(Boolean).join(" | ");
    }

    async function buildTrainingFewShotParts(statusCb) {
      const parts = [];
      let visionCount = 0, labelCount = 0, visionFrameCount = 0;
      if (!aiTrainingLibrary || !aiTrainingLibrary.length) return { parts, visionCount, labelCount, visionFrameCount };
      const newest = aiTrainingLibrary.slice().reverse();
      const withVideo = newest.filter(ex => ex && ex.video && ex.video.type === "file" && ex.video.hasLocalBlob && ex.id);
      const visionTargets = withVideo.slice(0, 3);
      if (visionTargets.length) {
        parts.push({ text: "=== VISUAL TRAINING EXAMPLES (coach-verified) ===\nFrame + correct label. Learn move appearance.\n" });
      }
      for (let vi = 0; vi < visionTargets.length; vi++) {
        const ex = visionTargets[vi];
        if (statusCb) statusCb(`Loading training video ${vi+1}/${visionTargets.length}…`);
        let blob = null;
        try { blob = await idbGetTrainingVideo(ex.id); } catch (e) { blob = null; }
        if (!blob) continue;
        const scorable = pickScorableEvents(ex.events, 6);
        if (!scorable.length) continue;
        const times = scorable.map(e => parseTimestampToSeconds(e.timestamp)).filter(t => t != null);
        let frames = [];
        try { frames = await extractFramesAtTimes(blob, times, statusCb); } catch (e) { continue; }
        if (!frames.length) continue;
        if (ex.ourAppearanceText) parts.push({ text: `Training match our wrestler ID: ${ex.ourAppearanceText}\n` });
        for (const e of scorable) {
          const sec = parseTimestampToSeconds(e.timestamp);
          if (sec == null) continue;
          let best = null, bestDist = Infinity;
          for (const f of frames) {
            const d = Math.abs((f.secs != null ? f.secs : parseTimestampToSeconds(f.time)) - sec);
            if (d < bestDist) { bestDist = d; best = f; }
          }
          if (!best || bestDist > 2.5) continue;
          parts.push({ text: `TRAINING FRAME @ ${e.timestamp || best.time} — LABEL: ${eventLabelLine(e)}` });
          parts.push({ inline_data: { mime_type: "image/jpeg", data: best.base64 } });
          visionFrameCount++;
        }
        visionCount++;
      }
      if (visionCount) parts.push({ text: "\n=== END VISUAL TRAINING ===\n" });
      const labelTargets = newest.slice(0, 6);
      if (labelTargets.length) {
        const blocks = labelTargets.map((ex, i) => ({
          example: i + 1,
          wrestler: ex.wrestlerName || "Athlete",
          opponent: ex.opponent || "Opp",
          ourAppearance: ex.ourAppearance || null,
          ourAppearanceText: ex.ourAppearanceText || "",
          events: pickScorableEvents(ex.events, 24).map(e => ({
            category: e.category||"", move: e.move||"", direction: e.direction||"", outcome: e.outcome||"",
            timestamp: e.timestamp||"",
            tie: formatModifiersPlainForEvent(e) || e.tie || undefined,
            modifiers: parseEventModifiers(e),
            detail: e.detail||undefined, period: e.period||undefined
          }))
        }));
        parts.push({ text: "\n=== LABEL TRAINING LOGS ===\n" + JSON.stringify(blocks) + "\n=== END LABEL LOGS ===\n" });
        labelCount = labelTargets.length;
      }
      return { parts, visionCount, labelCount, visionFrameCount };
    }

    function normalizeAiEventToManualFormat(raw, activeW) {
      const e = raw && typeof raw === "object" ? raw : {};
      let category = e.category || "Takedown";
      let subCategory = e.subCategory || null;
      let move = e.move || e.raw_move || "Undefined";
      let direction = e.direction === "defense" ? "defense" : "offense";
      let outcome = e.outcome === "fail" ? "fail" : "success";
      let confidence = String(e.confidence || "medium").toLowerCase();
      if (confidence !== "high" && confidence !== "low") confidence = "medium";
      let detail = e.detail || "";
      if (category === "Choice" || /choice/i.test(String(move)) || /defer/i.test(String(move))) {
        category = "Choice"; outcome = "success";
        const m = String(move);
        if (!detail) {
          if (/top/i.test(m)) detail = "Top";
          else if (/bottom/i.test(m)) detail = "Bottom";
          else if (/neutral/i.test(m)) detail = "Neutral";
          else if (/defer/i.test(m)) detail = "Defer";
          else detail = "Neutral";
        }
        const chooser = /opponent/i.test(m) ? "Opponent" : "Home";
        move = `${chooser} Choice: ${detail}`;
        direction = chooser === "Home" ? "offense" : "defense";
      }
      const mods = [];
      if (e.tie) mods.push(String(e.tie));
      if (e.finish && !mods.includes(String(e.finish))) mods.push(String(e.finish));
      if (e.ride && !mods.includes(String(e.ride))) mods.push(String(e.ride));
      const tie = mods.join(" + ");
      let points = 0;
      if (category === "Choice" || category === "Flow") points = 0;
      else if (category === "Near Fall / Pin") {
        const src = move + " " + detail;
        if (/pin/i.test(src)) { points = 0; detail = detail || "Pin / Fall"; }
        else if (/4/.test(src)) points = 4;
        else if (/3/.test(src)) points = 3;
        else if (/2/.test(src)) points = 2;
        if (outcome === "fail" && direction === "offense") points = 0;
        if (direction === "defense" && outcome === "success") { points = 0; if (!detail) detail = "Defended"; }
      } else if (isPenaltyCategory(category)) points = typeof e.points === "number" ? e.points : 1;
      else if (direction === "defense" && outcome === "success") { points = 0; if (!detail) detail = "Defended"; }
      else if (outcome === "success") points = getPointValue(category, move);
      else if (outcome === "fail" && direction === "defense") points = getPointValue(category, move);
      const timestamp = e.timestamp || "";
      // Prefer structured modifiers from model; else parse Opp:/Our: from tie/finish/ride strings
      let modifiers = e.modifiers && typeof e.modifiers === "object" ? e.modifiers : null;
      if (!modifiers) {
        const combined = [tie, e.finish, e.ride].filter(Boolean).join(" ");
        modifiers = parseModifiersPlain(combined || tie);
        // If model returned separate finish/ride without Opp/Our, attribute to actor by direction
        if (!combined && !tie) modifiers = emptyModifiersStruct();
      }

      // Stricter taxonomy + Opp/Our schema enforcement
      const allMoves = [];
      Object.keys(taxonomy.MOVE_GROUPS || {}).forEach(cat => {
        const v = taxonomy.MOVE_GROUPS[cat];
        if (Array.isArray(v)) v.forEach(m => allMoves.push({ cat, move: m }));
        else if (v && typeof v === "object") Object.keys(v).forEach(sub => (v[sub] || []).forEach(m => allMoves.push({ cat, sub, move: m })));
      });
      const moveMatch = allMoves.find(x => x.move.toLowerCase() === String(move).toLowerCase());
      if (moveMatch) {
        category = moveMatch.cat;
        move = moveMatch.move;
        if (moveMatch.sub) subCategory = moveMatch.sub;
      } else if (category !== "Choice" && category !== "Flow" && category !== "Riding Time" && !isPenaltyCategory(category)) {
        // Keep category if known; flag unknown moves via detail
        if (!detail) detail = "Unmatched taxonomy move";
        confidence = "low";
      }
      // Rebuild modifiers from Opp:/Our: if needed
      if (!modifiers || (!((modifiers.opp||{}).ties||[]).length && !((modifiers.our||{}).ties||[]).length
          && !((modifiers.opp||{}).finishes||[]).length && !((modifiers.our||{}).finishes||[]).length)) {
        modifiers = parseModifiersPlain(tiePlain || tie || "");
      }
      // Strip free-form modifier names not in taxonomy lists
      const allowedTies = new Set((taxonomy.TIE_MODIFIERS || []).map(x => x.toLowerCase()));
      const allowedFin = new Set((taxonomy.FINISH_MODIFIERS || []).map(x => x.toLowerCase()));
      const allowedRide = new Set((taxonomy.RIDE_MODIFIERS || []).map(x => x.toLowerCase()));
      const filterSide = (side) => {
        side.ties = (side.ties || []).filter(n => allowedTies.has(String(n).toLowerCase()));
        side.finishes = (side.finishes || []).filter(n => allowedFin.has(String(n).toLowerCase()));
        side.rides = (side.rides || []).filter(n => allowedRide.has(String(n).toLowerCase()));
      };
      if (modifiers) { filterSide(modifiers.opp || (modifiers.opp = {ties:[],finishes:[],rides:[]})); filterSide(modifiers.our || (modifiers.our = {ties:[],finishes:[],rides:[]})); }
      tiePlain = formatModifiersPlainFromStruct(modifiers) || tiePlain;

      tiePlain = formatModifiersPlainFromStruct(modifiers) || tie;
      return {
        id: Math.random().toString(36).slice(2, 9),
        matchId: null,
        wrestlerId: activeW ? activeW.id : null,
        boutId: store.activeBoutId,
        period: e.period || inferPeriodFromTimestamp(timestamp),
        category, subCategory: e.subCategory || null, move, tie: tiePlain, modifiers, direction, outcome, points, detail, timestamp,
        confidence, source: "ai", ts: Date.now()
      };
    }

    async function callGeminiGenerate(key, contentsParts, statusDiv) {
      const AI_MODEL_CANDIDATES = ["gemini-3.7-flash","gemini-3.6-flash","gemini-3.5-flash","gemini-2.5-flash"];
      let data = null, lastErr = null;
      for (const modelId of AI_MODEL_CANDIDATES) {
        if (statusDiv) statusDiv.textContent = `Analyzing with Gemini ${modelId}…`;
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: contentsParts }] })
        });
        if (res.ok) { data = await res.json(); break; }
        let errMsg = "Gemini API error.";
        try { const errData = await res.json(); errMsg = errData.error?.message || errMsg; } catch (e) {}
        lastErr = errMsg;
        const overloaded = /high demand|overloaded|try again later|resource exhausted|unavailable|503|429/i.test(errMsg) || res.status === 503 || res.status === 429;
        if (!overloaded) throw new Error(errMsg);
        await new Promise(r => setTimeout(r, 600));
      }
      if (!data) throw new Error((lastErr || "All Gemini models unavailable.") + " Try again shortly.");
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
    }

    /**
     * Send a compact frame sample + Mat Scout rules to the local LoRA bridge.
     * Expects POST {base}/predict JSON response with { events: [...] } or a raw array.
     */
    async function callLocalLoraPredict(systemText, frames, statusDiv) {
      const base = (appConfig.autoClipServerUrl || "http://localhost:5057").trim().replace(/\/$/, "");
      // Cap frames for local inference latency (evenly sample up to 5)
      const maxFrames = 5;
      const sampled = [];
      if (frames.length <= maxFrames) {
        frames.forEach(f => sampled.push(f));
      } else {
        for (let i = 0; i < maxFrames; i++) {
          const idx = Math.round(i * (frames.length - 1) / (maxFrames - 1));
          sampled.push(frames[idx]);
        }
      }
      if (statusDiv) statusDiv.textContent = `Sending ${sampled.length} frames to local LoRA at ${base}/predict…`;
      const payload = {
        system: systemText,
        frames: sampled.map(f => ({ time: f.time, image_base64: f.base64 })),
        max_events: 40
      };
      const resp = await fetch(base + "/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) {
        let errMsg = "Local LoRA HTTP " + resp.status;
        try {
          const errData = await resp.json();
          errMsg = errData.error || errData.message || errMsg;
        } catch (e) {}
        throw new Error(errMsg + " — is app.py running with LoRA weights?");
      }
      const data = await resp.json();
      if (Array.isArray(data)) return JSON.stringify(data);
      if (Array.isArray(data.events)) return JSON.stringify(data.events);
      if (typeof data.text === "string") return data.text;
      if (typeof data.raw === "string") return data.raw;
      return JSON.stringify(data.events || data.result || []);
    }

    async function runDirectBrowserAnalysis() {
      if (aiAnalysisInFlight) return;
      if (guardSeasonLocked("analyzing matches")) return;
      const activeW = getActiveWrestler();
      if (!activeW) return alert("Select an active wrestler first.");
      if (!store.activeBoutId || store.activeBoutId === "all" || !getActiveBout()) {
        alert("Select a dual or tournament in the Event dropdown before analyzing a match.\n\nAnalysis cannot run under \"All Events / Season Total\".");
        return;
      }

      if (!warnIfMissingWrestlerIdentification("with AI analysis")) return;
      const bout = getActiveBout();
      if (bout && bout.finalized) return;
      if (isSeasonLocked()) return;
      const keyEl = document.getElementById("imp-key");
      const key = keyEl ? keyEl.value.trim() : "";
      const opponent = document.getElementById("imp-opp").value.trim() || "Opponent";
      aiImportOpponent = opponent;
      const useLocalLora = aiAnalysisBackend === "local_lora";
      if (!useLocalLora && !key) return alert("Please enter your Gemini API Key.");
      // AI frame extraction needs a local File/Blob. YouTube can play in the scout player
      // but browsers block reading pixel frames from YouTube (CORS) — so analysis cannot run on YT alone.
      if (videoSourceType === "youtube" && youtubeVideoId && !selectedVideoFile && !videoBlobUrl) {
        return alert(
          "AI Video Scout needs a local match video (.mp4 / .webm / .mov).\n\n" +
          "YouTube is loaded for playback and manual scoring, but the browser cannot extract frames from YouTube for AI analysis.\n\n" +
          "Download the match video, then use Option 1 (Upload Local Match Video) and run Analyze again."
        );
      }
      if (!selectedVideoFile && !videoBlobUrl) {
        return alert(
          "Please load a local match video first.\n\n" +
          "Use Option 1: Upload Local Match Video (.mp4 recommended).\n" +
          "YouTube URLs work for watching and manual tagging, but not for AI frame analysis."
        );
      }
      if (!useLocalLora) localStorage.setItem(API_KEY_STORAGE, key);
      const statusDiv = document.getElementById("ai-status");
      const aiBtn = document.getElementById("ai-btn");
      const aiBtnOriginalHTML = aiBtn ? aiBtn.innerHTML : "";
      aiAnalysisInFlight = true;
      statusDiv.style.display = "block";
      aiBtn.disabled = true;
      aiBtn.style.opacity = "0.7";
      aiBtn.style.cursor = "not-allowed";
      aiBtn.innerHTML = '<span class="btn-spinner"></span> Analyzing…';
      try {
        statusDiv.textContent = "Preparing Mat Scout rules + training examples…";
        const fewShot = await buildTrainingFewShotParts((txt) => { if (statusDiv) statusDiv.textContent = txt; });
        const frameSource = selectedVideoFile || videoBlobUrl;
        if (!frameSource) throw new Error("No local video available for frame extraction.");
        const frames = await extractFrames(frameSource, (txt) => { if (statusDiv) statusDiv.textContent = txt; });
        const trainBits = [];
        if (fewShot.visionFrameCount) trainBits.push(fewShot.visionFrameCount + " labeled frames");
        if (fewShot.labelCount) trainBits.push(fewShot.labelCount + " label logs");
        statusDiv.textContent = `Analyzing ${frames.length} frames` + (trainBits.length ? " · " + trainBits.join(" + ") : " · taxonomy only") + "…";
        const systemPrompt = buildMatScoutRulesPrompt(activeW, opponent) +
          (fewShot.visionFrameCount ? "Use visual training frames to recognize the same moves.\n" : "") +
          (fewShot.labelCount ? "Match labeling style from the label logs.\n" : "");

        let textOut = "[]";
        if (useLocalLora) {
          // Compact sample for local LoRA; still pass taxonomy/rules in system text
          textOut = await callLocalLoraPredict(
            systemPrompt + `\nNEW MATCH: ${activeW.name} vs ${opponent}. Return ONLY a JSON array of events.\n`,
            frames,
            statusDiv
          );
        } else {
          const contentsParts = [{ text: systemPrompt }];
          fewShot.parts.forEach(p => contentsParts.push(p));
          contentsParts.push({ text: `\n=== NEW MATCH TO SCORE ===\n${activeW.name} vs ${opponent}. Sequential frames follow. JSON array only.\n` });
          frames.forEach(f => {
            contentsParts.push({ text: `Frame Time: ${f.time}` });
            contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: f.base64 } });
          });
          textOut = await callGeminiGenerate(key, contentsParts, statusDiv);
        }
        let clean = (textOut || "[]").trim();
        if (clean.startsWith("```")) clean = clean.split("```")[1].replace(/^json/, "");
        if (!clean.startsWith("[")) {
          const a = clean.indexOf("[");
          const b = clean.lastIndexOf("]");
          if (a >= 0 && b > a) clean = clean.slice(a, b + 1);
        }
        const parsed = JSON.parse(clean);
        if (!Array.isArray(parsed)) throw new Error("Model did not return a JSON array.");
        parsedEvents = parsed.map(e => normalizeAiEventToManualFormat(e, activeW));
        selectedEvents = {};
        parsedEvents.forEach(e => { selectedEvents[e.id] = (e.confidence || "").toLowerCase() !== "low"; });
        aiVerifyFilter = "all";
        editingAiEventId = null;
        aiAnalysisInFlight = false;
        render();
      } catch (err) {
        alert("Analysis Error: " + err.message);
        statusDiv.style.display = "none";
        aiAnalysisInFlight = false;
        aiBtn.disabled = false;
        aiBtn.style.opacity = "";
        aiBtn.style.cursor = "";
        aiBtn.innerHTML = aiBtnOriginalHTML || "Analyze Match with AI";
      }
    }

    function toggleSelect(id) { selectedEvents[id] = !selectedEvents[id]; render(); }
    function toggleEvDir(idx) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      parsedEvents[idx].direction = parsedEvents[idx].direction === "offense" ? "defense" : "offense";
      recalcAiEventPoints(idx);
    }
    function toggleEvOutcome(idx) {
      if (!parsedEvents || !parsedEvents[idx]) return;
      if (parsedEvents[idx].category === "Choice") return;
      parsedEvents[idx].outcome = parsedEvents[idx].outcome === "success" ? "fail" : "success";
      recalcAiEventPoints(idx);
    }
    function swapAllDir() {
      if (!parsedEvents) return;
      parsedEvents.forEach((e, i) => {
        e.direction = e.direction === "offense" ? "defense" : "offense";
      });
      parsedEvents.forEach((_, i) => {
        const e = parsedEvents[i];
        if (e.category === "Choice" || e.category === "Flow") e.points = 0;
        else if (isPenaltyCategory(e.category)) {}
        else if (e.category === "Near Fall / Pin") {
          const src = (e.move||"")+" "+(e.detail||"");
          if (/pin/i.test(src)) e.points = 0;
          else if (/4/.test(src)) e.points = 4;
          else if (/3/.test(src)) e.points = 3;
          else if (/2/.test(src)) e.points = 2;
          if (e.outcome === "fail" && e.direction === "offense") e.points = 0;
          if (e.direction === "defense" && e.outcome === "success") e.points = 0;
        } else if (e.direction === "defense" && e.outcome === "success") e.points = 0;
        else if (e.outcome === "success") e.points = getPointValue(e.category, e.move);
        else if (e.outcome === "fail" && e.direction === "defense") e.points = getPointValue(e.category, e.move);
        else e.points = 0;
      });
      render();
    }
    function cancelImport() {
      parsedEvents = null; selectedEvents = {}; editingAiEventId = null; aiVerifyFilter = "all"; render();
    }


    function buildVideoRefForTraining() {
      if (videoSourceType === "youtube" && youtubeVideoId) {
        return {
          type: "youtube",
          youtubeId: youtubeVideoId,
          youtubeUrl: "https://www.youtube.com/watch?v=" + youtubeVideoId,
          fileName: videoFileName || ("YouTube [" + youtubeVideoId + "]")
        };
      }
      if (videoSourceType === "file" && (selectedVideoFile || videoBlobUrl)) {
        return {
          type: "file",
          fileName: videoFileName || (selectedVideoFile && selectedVideoFile.name) || "local-video",
          hasLocalBlob: false
        };
      }
      return { type: "none" };
    }

    function commitImport() {
      if (commitImportInFlight) return;
      if (guardSeasonLocked("committing matches")) return;
      const activeW = getActiveWrestler();
      const season = getActiveSeason();
      if (!activeW) return;
      const selected = (parsedEvents || []).filter(e => selectedEvents[e.id]);
      if (!selected.length) return alert("Select at least one event to commit.");
      commitImportInFlight = true;
      const commitBtn = document.getElementById("ai-commit-btn");
      if (commitBtn) {
        commitBtn.disabled = true;
        commitBtn.style.opacity = "0.7";
        commitBtn.style.cursor = "not-allowed";
        commitBtn.innerHTML = '<span class="btn-spinner"></span> Committing…';
      }
      const opponent = aiImportOpponent || document.getElementById("imp-opp")?.value.trim() || "Opponent";
      const matchId = Math.random().toString(36).slice(2, 9);
      const matchWt = getScoutMatchWeightClass() || String(activeW.weightClass);
      season.matches.push({
        id: matchId, wrestlerId: activeW.id, boutId: store.activeBoutId, opponent,
        level: selectedMatchLevel, date: new Date().toISOString().slice(0, 10),
        weightClass: matchWt, rosterWeightClass: String(activeW.weightClass),
        source: "video"
      });
      const committedEvents = [];
      selected.forEach(e => {
        const row = {
          id: e.id, matchId, wrestlerId: activeW.id, boutId: store.activeBoutId,
          period: e.period || "P1", category: e.category || "Takedown", subCategory: e.subCategory || null,
          move: e.move || "Unknown", tie: e.tie || "", modifiers: e.modifiers || null,
          direction: e.direction || "offense",
          outcome: e.outcome || "success", points: typeof e.points === "number" ? e.points : 0,
          detail: e.detail || "", timestamp: e.timestamp || "", confidence: e.confidence || "",
          source: "ai-verified", ts: Date.now()
        };
        season.events.push(row);
        committedEvents.push(row);
      });
      try {
        const example = {
          id: Math.random().toString(36).slice(2, 9),
          seasonMatchId: matchId,
          wrestlerId: activeW.id,
          wrestlerName: activeW.name,
          opponent,
          level: selectedMatchLevel,
          date: new Date().toISOString().slice(0, 10),
          source: "ai-verified",
          events: committedEvents,
          ourAppearance: snapshotOurWrestlerAppearance(),
          ourAppearanceText: formatOurWrestlerAppearanceText(ourWrestlerAppearance, activeW.name),
          video: (typeof buildVideoRefForTraining === "function") ? buildVideoRefForTraining() : { type: "none" }
        };
        aiTrainingLibrary.push(example);
      } catch (err) { console.warn("AI training auto-append failed", err); }
      parsedEvents = null; selectedEvents = {}; editingAiEventId = null;
      commitImportInFlight = false;
      persist();
      switchTab("sheet");
    }

    try {

    function openChangelogModal() {
      activeModal = "changelog";
      renderModal();
    }

    function dismissChangelog(markSeen) {
      if (markSeen) {
        try { localStorage.setItem(LAST_SEEN_BUILD_KEY, MAT_SCOUT_BUILD); } catch (e) {}
      }
      closeModal();
    }

    function maybeShowChangelogOnBoot() {
      try {
        const seen = localStorage.getItem(LAST_SEEN_BUILD_KEY);
        if (seen !== MAT_SCOUT_BUILD) {
          setTimeout(() => {
            if (!activeModal) openChangelogModal();
          }, 600);
        }
      } catch (e) {}
    }

    const _prevInit = typeof init === "function" ? init : null;
    // Hook changelog after normal init via onload replacement
    window.onload = function() {
      if (typeof init === "function") init();
      maybeShowChangelogOnBoot();
    };
