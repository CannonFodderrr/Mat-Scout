    function addWrestlerToSeason() {
      const season = getActiveSeason();
      const name = document.getElementById("r-name").value.trim();
      const weightClass = document.getElementById("r-weight").value.trim();
      const division = document.getElementById("r-div").value;
      const level = document.getElementById("r-lvl").value;
      const grade = document.getElementById("r-grade").value;

      if (!name || !weightClass) return alert("Please enter wrestler name and weight class.");

      const newId = Math.random().toString(36).slice(2, 9);
      season.roster.push({ id: newId, name, weightClass, division, level, grade });
      if (!store.activeWrestlerId) {
        store.activeWrestlerId = newId;
        selectedMatchLevel = level;
      }

      persist();
      render();
    }

    function deleteWrestler(id) {
      const season = getActiveSeason();
      const targetW = season.roster.find(w => w.id === id);
      const name = targetW ? targetW.name : "this athlete";
      if (!confirm(`Are you sure you want to delete ${name}? All associated match and event records will be permanently removed.`)) return;

      season.roster = season.roster.filter(w => w.id !== id);
      season.matches = season.matches.filter(m => m.wrestlerId !== id);
      season.events = season.events.filter(e => e.wrestlerId !== id);
      if (store.activeWrestlerId === id) {
        store.activeWrestlerId = season.roster.length > 0 ? season.roster[0].id : null;
      }
      persist();
      render();
    }

    function deleteBout(boutId) {
      const season = getActiveSeason();
      const targetB = season.bouts.find(b => b.id === boutId);
      const boutLabel = targetB ? `${targetB.date} vs ${targetB.opponentTeam}` : "this bout";
      if (!confirm(`Are you sure you want to delete ${boutLabel}? All events scored in this bout will be permanently removed.`)) return;

      season.bouts = season.bouts.filter(b => b.id !== boutId);
      if (store.activeBoutId === boutId) store.activeBoutId = "all";
      persist();
      render();
    }

    /* SCOUT TAB */
    function getOpponentForActiveWrestler() {
      const activeW = getActiveWrestler();
      const bout = getActiveBout();
      if (!activeW || !bout || !bout.opponentRoster) return "";
      const match = bout.opponentRoster.find(o => o.weightClass === activeW.weightClass);
      return match ? match.name : "";
    }

    function getVideoCardEl() {
      if (videoCardEl) return videoCardEl;
      videoCardEl = document.createElement("div");
      videoCardEl.className = "card";
      videoCardEl.style.paddingBottom = "10px";
      videoCardEl.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div id="global-video-title" class="card-title" style="margin-bottom:0;">Match Video Player</div>
          <button class="btn-remove-video" onclick="clearSharedVideo()">✕ Remove Video</button>
        </div>

        <!-- Native MP4 Video Player -->
        <video id="persistent-video" controls style="display:none;"></video>

        <!-- YouTube Video Embed Container -->
        <div id="yt-player-container" class="yt-wrapper" style="display:none;">
          <div id="yt-player-target"></div>
        </div>

        <div style="font-size:11px; color:var(--muted);">Video pauses automatically when tagging moves. Click timestamps in the log to seek.</div>
      `;
      return videoCardEl;
    }

    function renderScout(target) {
      const season = getActiveSeason();
      const activeW = getActiveWrestler();
      const activeBout = getActiveBout();

      if (season.roster.length === 0) {
        target.innerHTML = '<div class="card"><p style="color:var(--muted); font-size:12px;">Add wrestlers in the Roster tab first.</p></div>';
        return;
      }

      const autoOpponent = getOpponentForActiveWrestler();
      const boutOpponents = activeBout && activeBout.opponentRoster ? activeBout.opponentRoster : [];
      const hasLoadedVideo = (videoSourceType === "file" && videoBlobUrl) || (videoSourceType === "youtube" && youtubeVideoId);

      target.innerHTML = `
        <!-- Athlete Selector & Mode Switcher -->
        <div class="card" style="padding:10px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase;">Athlete Under Review:</span>
            <select class="select" style="margin-bottom:0; flex:1; max-width:340px; font-size:12px; font-weight:700;" onchange="setActiveWrestler(this.value)">
              ${season.roster.map(w => `<option value="${w.id}" ${w.id === store.activeWrestlerId ? 'selected' : ''}>${w.name} — ${w.weightClass} lbs (${w.level})</option>`).join('')}
            </select>
          </div>
        </div>

        <!-- Mode Switch Buttons -->
        <div class="card" style="padding:10px 14px;">
          <div class="grid-2">
            <button class="btn" style="background:${scoutMode === 'manual' ? 'var(--gold)' : 'var(--mat)'}; color:${scoutMode === 'manual' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="scoutMode = 'manual'; render();">
              Manual Scoring Mode
            </button>
            <button class="btn" style="background:${scoutMode === 'ai' ? 'var(--gold)' : 'var(--mat)'}; color:${scoutMode === 'ai' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="scoutMode = 'ai'; render();">
              AI Video Scout Mode
            </button>
          </div>
        </div>

        <!-- Video Source Chooser -->
        ${!hasLoadedVideo ? `
          <div class="card" style="padding:12px;">
            <div style="font-size:11px; font-weight:700; color:var(--gold); margin-bottom:6px;">Choose Match Video Source:</div>
            <div class="grid-2">
              <div>
                <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Option 1: Upload Video (.mp4)</label>
                <input type="file" accept="video/*" class="input" style="margin-bottom:0;" onchange="handleSharedVideoFile(event)" />
              </div>
              <div>
                <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Option 2: YouTube Match URL</label>
                <div style="display:flex; gap:4px;">
                  <input id="yt-url-input" class="input" style="margin-bottom:0;" placeholder="https://youtube.com/watch?v=..." />
                  <button class="btn btn-gold" onclick="handleLoadYouTubeUrl()">Load</button>
                </div>
              </div>
            </div>
          </div>
        ` : `
          <!-- Loaded Match Video Player Card (Reorderable) -->
          <div id="video-card-slot"></div>
        `}

        <!-- Mode Content Container (Manual Scoring / AI Video Scout) -->
        ${scoutMode === 'manual' ? renderManualScoutContent(activeW, boutOpponents, autoOpponent) : renderAIScoutContent(activeW, boutOpponents, autoOpponent)}
      `;

      if (hasLoadedVideo) {
        const slot = target.querySelector("#video-card-slot");
        if (slot) slot.replaceWith(getVideoCardEl());
      }
    }

    function formatActiveModifiersSummary() {
      if (!activeTieModifiers.length) return '';
      const parts = activeTieModifiers.map(m => {
        const isWrestler = typeof m === 'object' ? (m.owner !== 'opponent') : true;
        const label = typeof m === 'object' ? `${m.owner === 'opponent' ? 'Opp: ' : ''}${m.tie}` : m;
        const color = isWrestler ? 'var(--green)' : 'var(--red)';
        return `<span style="color:${color}; font-weight:700;">${label}</span>`;
      });
      return `(${parts.join(', ')})`;
    }

    function renderManualScoutContent(activeW, boutOpponents, autoOpponent) {
      if (!activeMatch) {
        return `
          <div class="card">
            <div class="card-title">
              <span>Score Match: ${activeW.name} (${activeW.weightClass} lbs)</span>
              ${helpIcon('scout_manual')}
            </div>
            
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="log-match-level" class="select" onchange="selectedMatchLevel = this.value">
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Opponent Roster</label>
                <select id="log-opp-select" class="select" onchange="document.getElementById('log-opponent').value = this.value">
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>

            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="log-opponent" class="input" value="${autoOpponent}" placeholder="Enter opponent name" />
            <button class="btn btn-gold" style="width:100%; margin-top:4px;" onclick="startMatch()">Start Scoring Match</button>
          </div>
        `;
      }

      // Point Calculation
      let ourPts = 0;
      let oppPts = 0;

      activeMatch.events.forEach(e => {
        const pts = e.points || 0;
        if (e.category === "Penalty") {
          if (e.direction === "offense") oppPts += pts;
          else ourPts += pts;
        } else {
          if (e.direction === "offense") ourPts += pts;
          else if (e.outcome === "fail") oppPts += pts;
        }
      });

      const choiceEvents = activeMatch.events.filter(e => e.category === "Choice");
      const p2ChoiceEvs = choiceEvents.filter(e => e.period === "P2");
      const p3ChoiceEv = choiceEvents.find(e => e.period === "P3");

      const hasEventsInP1 = activeMatch.events.some(e => e.period === "P1");
      const hasEventsInP2 = activeMatch.events.some(e => e.period === "P2");

      let p2Allowed = hasEventsInP1;
      let p3Allowed = hasEventsInP2;

      let decisionButtonsDisabled = true;
      let currentChooserText = "Neutral Start";

      if (currentPeriod === "P2") {
        const deferEv = p2ChoiceEvs.find(e => e.detail === "Defer");
        const finalP2Pos = p2ChoiceEvs.find(e => e.detail !== "Defer");

        if (!deferEv && !finalP2Pos) {
          decisionButtonsDisabled = false;
          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P2` : `Opponent's Choice for P2`;
        } else if (deferEv && !finalP2Pos) {
          decisionButtonsDisabled = false;
          const deferredToWhom = deferEv.move.includes("Home") ? `${activeMatch.opponent || 'Opponent'}` : activeW.name;
          currentChooserText = `${deferredToWhom}'s Choice (Deferred)`;
        } else {
          decisionButtonsDisabled = true;
          currentChooserText = `P2 Set: ${finalP2Pos.move}`;
        }
      } else if (currentPeriod === "P3") {
        if (!p3ChoiceEv) {
          decisionButtonsDisabled = false;
          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P3` : `Opponent's Choice for P3`;
        } else {
          decisionButtonsDisabled = true;
          currentChooserText = `P3 Set: ${p3ChoiceEv.move}`;
        }
      }

      const activeList = modifierSubView === "ties" ? taxonomy.TIE_MODIFIERS : (taxonomy.FINISH_MODIFIERS || DEFAULT_TAXONOMY.FINISH_MODIFIERS);

      return `
        <!-- Score Card -->
        <div class="card" style="padding:12px;">
          <div class="grid-2">
            <div style="background-color:var(--greenDim); border:1px solid var(--green); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--green); text-transform:uppercase;">${activeW.name} (${activeMatch.level})</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${ourPts}</div>
            </div>
            <div style="background-color:var(--redDim); border:1px solid var(--red); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--red); text-transform:uppercase;">${activeMatch.opponent}</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${oppPts}</div>
            </div>
          </div>
        </div>

        <!-- Period Bar Card -->
        <div class="card" style="padding:8px 12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase;">Period: ${currentPeriod}</div>
            <div style="font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;">${currentChooserText}</div>
          </div>
          
          <div style="display:flex; justify-content:space-between; align-items:center; gap:4px; flex-wrap:wrap;">
            <div style="display:flex; gap:4px;">
              <button class="chip ${currentPeriod === 'P1' ? 'selected' : ''}" onclick="advancePeriod('P1')">P1</button>
              <button class="chip ${currentPeriod === 'P2' ? 'selected' : ''}" ${!p2Allowed && currentPeriod !== 'P2' && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P2')">P2</button>
              <button class="chip ${currentPeriod === 'P3' ? 'selected' : ''}" ${!p3Allowed && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P3')">P3</button>
              <button class="chip ${currentPeriod === 'OT' ? 'selected' : ''}" onclick="advancePeriod('OT')">OT</button>
            </div>

            <div style="display:flex; gap:4px;">
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Top')">Top</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Bottom')">Bottom</button>
              <button class="chip" ${decisionButtonsDisabled || currentPeriod !== 'P2' || (p2ChoiceEvs.some(e => e.detail === 'Defer')) ? 'disabled' : ''} onclick="recordPositionChoice('Defer')">Defer</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Neutral')">Neutral</button>
            </div>
          </div>
        </div>

        <!-- Direction Switcher Card -->
        <div class="card" style="padding:8px 12px;">
          <div class="grid-2">
            <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'offense' ? 'var(--green)' : 'var(--mat)'}; border:1px solid var(--panelLine); color:var(--chalk);" onclick="setDir('offense')">
              Offense (By ${activeW.name})
            </button>
            <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'defense' ? 'var(--red)' : 'var(--mat)'}; border:1px solid var(--panelLine); color:var(--chalk);" onclick="setDir('defense')">
              Faced (vs. ${activeW.name})
            </button>
          </div>
        </div>

        <!-- Modifiers Window: Ties & Setups vs Finishes -->
        <div class="card" style="padding:10px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'ties' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'ties' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'ties'; render();">
                Ties & Setups
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'finishes' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'finishes' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'finishes'; render();">
                Finishes
              </button>
              <span style="font-size:10px; font-weight:700; color:var(--muted);">${formatActiveModifiersSummary()}</span>
              ${helpIcon('scout_modifiers')}
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <span style="font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase;">Apply To:</span>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierAssignTarget === 'wrestler' ? 'var(--green)' : 'var(--mat)'}; border:1px solid ${modifierAssignTarget === 'wrestler' ? 'var(--green)' : 'var(--panelLine)'}; color:var(--chalk);" onclick="modifierAssignTarget = 'wrestler'; render();">
                ${activeW.name} (Wrestler)
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierAssignTarget === 'opponent' ? 'var(--red)' : 'var(--mat)'}; border:1px solid ${modifierAssignTarget === 'opponent' ? 'var(--red)' : 'var(--panelLine)'}; color:var(--chalk);" onclick="modifierAssignTarget = 'opponent'; render();">
                ${activeMatch.opponent || 'Opponent'}
              </button>
            </div>
          </div>
          <div class="grid-3">
            ${activeList.map(mod => {
              const matchedMod = activeTieModifiers.find(m => (typeof m === 'object' ? m.tie : m) === mod);
              let chipClass = "chip";
              if (matchedMod) {
                const owner = typeof matchedMod === 'object' ? matchedMod.owner : 'wrestler';
                chipClass += owner === 'opponent' ? " selected-opponent" : " selected-wrestler";
              }
              return `
                <div class="${chipClass}" onclick="toggleTieModifierMulti('${mod}')">
                  ${mod} ${matchedMod ? `<span style="font-size:9px;">[${(typeof matchedMod === 'object' ? matchedMod.owner : 'wrestler') === 'opponent' ? 'OPP' : 'WRESTLER'}]</span>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Move Selection Card -->
        <div class="card">
          <div class="card-title">
            <span>${renderMoveSelectorTitle()}</span>
            ${renderMoveBackButton()}
          </div>
          ${renderMoveSelectorGrid()}
        </div>

        <!-- Scoring Log Card -->
        <div class="card">
          <div class="card-title">
            <span>Scoring Log (${activeMatch.events.length} events)</span>
            <span style="font-size:10px; color:var(--muted); font-weight:400; text-transform:none;">Click any action to edit</span>
          </div>
          <div style="max-height:180px; overflow-y:auto; margin-bottom:12px;">
            ${activeMatch.events.length === 0 ? '<p style="font-size:11px; color:var(--muted);">No actions tagged yet.</p>' : ''}
            ${activeMatch.events.slice().reverse().map((e) => `
              <div class="item-row" style="cursor:pointer;" onclick="openEditEventModal('${e.id}')">
                <span>
                  <span style="font-family:monospace; color:var(--gold); margin-right:6px; text-decoration:underline;" onclick="event.stopPropagation(); seekVideo('${e.timestamp}');">${e.timestamp || '--:--'}</span>
                  <span style="color:var(--muted); font-size:10px; margin-right:4px;">[${e.period || 'P1'}]</span>
                  <strong style="color:${e.direction === 'offense' ? 'var(--green)' : 'var(--red)'}">${e.direction === 'offense' ? 'OFF' : 'DEF'}</strong> 
                  ${e.move} ${e.tie ? `<span style="color:var(--gold); font-size:10px;">[${e.tie}]</span>` : ''}
                  ${e.detail ? `<span style="color:var(--muted); font-size:10px;">(${e.detail})</span>` : ''}
                </span>
                <span style="color:${e.outcome === 'success' ? 'var(--green)' : 'var(--red)'}; font-weight:700; display:flex; align-items:center; gap:4px;">
                  ${e.outcome} ${e.points ? `(+${e.points})` : (e.detail === 'Pin / Fall' ? '(FALL)' : '')} 
                  <span style="color:var(--gold); font-size:13px;">✎</span>
                </span>
              </div>
            `).join('')}
          </div>

          <div class="grid-2">
            <button class="btn btn-green" onclick="commitManualMatch()">Save & Commit Match to Stats</button>
            <button class="btn" style="background:var(--panelLine); color:var(--chalk);" onclick="discardMatch()">Discard Match</button>
          </div>
        </div>
      `;
    }

    function advancePeriod(p) {
      currentPeriod = p;
      logEvent('Flow', `Period Change: ${p}`, 'success', 0, p);

      if (p === 'P3' && activeMatch) {
        const choiceEvents = activeMatch.events.filter(e => e.category === "Choice");
        const p2ChoiceEvs = choiceEvents.filter(e => e.period === "P2");
        const deferEv = p2ChoiceEvs.find(e => e.detail === "Defer");
        const finalP2Pos = p2ChoiceEvs.find(e => e.detail !== "Defer");

        if (deferEv) {
          manualDirection = deferEv.move.includes("Home") ? 'offense' : 'defense';
        } else if (finalP2Pos) {
          manualDirection = finalP2Pos.move.includes("Home") ? 'defense' : 'offense';
        }
      }
      render();
    }

    function recordPositionChoice(choice) {
      const chooser = manualDirection === 'offense' ? 'Home' : 'Opponent';
      logEvent('Choice', `${chooser} Choice: ${choice}`, 'success', 0, choice);

      if (choice === 'Defer') {
        manualDirection = (manualDirection === 'offense') ? 'defense' : 'offense';
      }
      render();
    }

    function renderAIScoutContent(activeW, boutOpponents, autoOpponent) {
      return `
        ${!parsedEvents ? `
          <div class="card">
            <div class="card-title">AI Video Scout: ${activeW.name} (${activeW.weightClass} lbs)</div>
            
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="ai-match-level" class="select" onchange="selectedMatchLevel = this.value">
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Roster</label>
                <select class="select" onchange="document.getElementById('imp-opp').value = this.value">
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>

            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="imp-opp" class="input" value="${autoOpponent}" placeholder="Opponent name" />

            <label style="font-size:11px; color:var(--muted);">Gemini API Key</label>
            <input type="password" id="imp-key" class="input" placeholder="AIzaSy..." value="${localStorage.getItem(API_KEY_STORAGE) || ''}" />

            <div id="ai-status" style="display:none; padding:10px; margin-bottom:8px; border-radius:4px; font-size:12px; font-weight:700; text-align:center; background:var(--goldDim); color:var(--gold);"></div>

            <button id="ai-btn" class="btn btn-gold" style="width:100%;" onclick="runDirectBrowserAnalysis()">Analyze Match with AI</button>
            <div style="font-size:10px; color:var(--muted); margin-top:6px;">*Note: In-browser AI video extraction requires a local file (.mp4) due to browser CORS policies.</div>
          </div>
        ` : `
          <div class="card">
            <div class="card-title">
              <span>Verify Events for ${activeW.name} (${Object.values(selectedEvents).filter(Boolean).length} Selected)</span>
              <button class="btn-back" onclick="cancelImport()">Cancel</button>
            </div>
            <button class="btn btn-gold" style="width:100%; font-size:11px; margin-bottom:8px;" onclick="swapAllDir()">Swap All OFF/DEF</button>
            <div style="max-height:240px; overflow-y:auto; margin-bottom:12px;">
              ${parsedEvents.map((ev, idx) => `
                <div class="item-row">
                  <input type="checkbox" ${selectedEvents[ev.id] ? 'checked' : ''} onchange="toggleSelect('${ev.id}')" />
                  <span style="font-family:monospace; color:var(--gold); cursor:pointer; text-decoration:underline;" onclick="seekVideo('${ev.timestamp}')">${ev.timestamp || '--:--'}</span>
                  <span style="font-weight:700; color:${ev.direction === 'offense' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvDir(${idx})">${ev.direction === 'offense' ? 'OFF' : 'DEF'}</span>
                  <span style="flex:1; margin-left:8px;">${ev.move} ${ev.raw_move && ev.raw_move !== ev.move ? `(${ev.raw_move})` : ''}</span>
                  <span style="color:${ev.outcome === 'success' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvOutcome(${idx})">${ev.outcome}</span>
                </div>
              `).join('')}
            </div>
            <button class="btn btn-green" style="width:100%;" onclick="commitImport()">Commit Events to ${activeW.name}'s Stats</button>
          </div>
        `}
      `;
    }

    function renderMoveSelectorTitle() {
      if (!selectedPrimaryCat) return 'Select Category';
      if (selectedPendingMove) return `${selectedPrimaryCat} > ${selectedPendingMove}`;
      if (selectedPrimaryCat === 'Takedown' && !selectedSubCat) return `Takedowns`;
      if (selectedPrimaryCat === 'Takedown' && selectedSubCat) return `Takedown > ${selectedSubCat}`;
      return `${selectedPrimaryCat}`;
    }

    function renderMoveBackButton() {
      if (selectedPendingMove) return `<button class="btn-back" onclick="selectedPendingMove = null; render();">← Back</button>`;
      if (selectedPrimaryCat === 'Takedown' && selectedSubCat) return `<button class="btn-back" onclick="selectedSubCat = null; render();">← Back</button>`;
      if (selectedPrimaryCat) return `<button class="btn-back" onclick="setPrimaryCat(null)">← Back</button>`;
      return '';
    }

    function renderMoveSelectorGrid() {
      if (selectedPendingMove) {
        if (selectedPrimaryCat === "Turns" || selectedPrimaryCat === "Near Fall / Pin") {
          return `
            <div class="grid-2">
              <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', '2-Point NF', 2)">2-Point NF (+2)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', '3-Point NF', 3)">3-Point NF (+3)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', '4-Point NF', 4)">4-Point NF (+4)</button>
              <button class="btn btn-gold" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', 'Pin / Fall', 0)">Win by Pin / Fall (0 Pts)</button>
              <button class="btn btn-red" style="padding:10px; grid-column:span 2;" onclick="logEvent('Turns', '${selectedPendingMove}', 'fail', 0, 'Failed')">Attempt Failed</button>
            </div>
          `;
        }
        if (selectedPrimaryCat === "Penalty") {
          return `
            <div class="grid-3">
              <button class="btn btn-green" style="padding:10px;" onclick="logPenaltyMove('${selectedPendingMove}', '1 Point Penalty', 1)">1 Point (+1)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logPenaltyMove('${selectedPendingMove}', '2 Points Penalty', 2)">2 Points (+2)</button>
              <button class="btn btn-red" style="padding:10px;" onclick="logPenaltyMove('${selectedPendingMove}', 'DQ', 0)">DQ</button>
            </div>
          `;
        }
      }

      // Standalone Near Fall / Pin: 1-Click Direct Scoring
      if (selectedPrimaryCat === "Near Fall / Pin") {
        return `
          <div class="grid-2">
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', '2-Point NF', 'success', 2, '2-Point NF')">2-Point NF (+2)</button>
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', '3-Point NF', 'success', 3, '3-Point NF')">3-Point NF (+3)</button>
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', '4-Point NF', 'success', 4, '4-Point NF')">4-Point NF (+4)</button>
            <button class="btn btn-gold" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', 'Pin / Fall', 'success', 0, 'Pin / Fall')">Win by Pin / Fall (0 Pts)</button>
          </div>
        `;
      }

      // 3 Columns Top Categories
      if (!selectedPrimaryCat) {
        return `
          <div class="grid-3">
            ${Object.keys(taxonomy.MOVE_GROUPS).map(cat => `
              <button class="btn" style="background:var(--mat); color:var(--chalk); border:1px solid var(--panelLine); padding:12px;" onclick="setPrimaryCat('${cat}')">
                ${cat}
              </button>
            `).join('')}
          </div>
        `;
      }

      // 3 Columns Takedown Subcategories
      if (selectedPrimaryCat === 'Takedown' && !selectedSubCat) {
        let subs = Object.keys(taxonomy.MOVE_GROUPS.Takedown);
        return `
          <div class="grid-3">
            ${subs.map(sub => `
              <button class="btn" style="background:var(--mat); color:var(--chalk); border:1px solid var(--panelLine); padding:12px;" onclick="selectedSubCat = '${sub}'; render();">
                ${sub}
              </button>
            `).join('')}
          </div>
        `;
      }

      let movesList = selectedPrimaryCat === 'Takedown' 
        ? taxonomy.MOVE_GROUPS.Takedown[selectedSubCat] 
        : taxonomy.MOVE_GROUPS[selectedPrimaryCat];

      return `
        <div class="grid-3">
          ${movesList.map(m => `
            <div style="background:var(--mat); padding:8px; border-radius:4px; border:1px solid var(--panelLine);">
              <div style="font-size:11px; font-weight:700; margin-bottom:6px; truncate;">
                ${m}
              </div>
              <div style="display:flex; flex-direction:column; gap:4px;">
                ${(selectedPrimaryCat === 'Turns' || selectedPrimaryCat === 'Near Fall / Pin' || selectedPrimaryCat === 'Penalty') ? `
                  <button class="btn btn-gold" style="padding:6px; font-size:10px;" onclick="selectedPendingMove = '${m}'; render();">
                    Outcome
                  </button>
                ` : `
                  <button class="btn btn-green" style="padding:4px; font-size:10px;" onclick="logEvent('${selectedPrimaryCat}', '${m}', 'success', ${selectedPrimaryCat === 'Takedown' ? 3 : (POINT_VALUES[m] || 0)})">
                    ${manualDirection === 'offense' ? 'Success' : 'Defended'}
                  </button>
                  <button class="btn btn-red" style="padding:4px; font-size:10px;" onclick="logEvent('${selectedPrimaryCat}', '${m}', 'fail', ${manualDirection === 'defense' ? (selectedPrimaryCat === 'Takedown' ? 3 : (POINT_VALUES[m] || 0)) : 0})">
                    ${manualDirection === 'offense' ? 'Fail' : 'Scored On (+Pts)'}
                  </button>
                `}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleTieModifierMulti(tie) {
      const idx = activeTieModifiers.findIndex(m => (typeof m === 'object' ? m.tie : m) === tie);
      if (idx !== -1) {
        activeTieModifiers.splice(idx, 1);
      } else {
        activeTieModifiers.push({ tie, owner: modifierAssignTarget });
      }
      render();
    }

    function startMatch() {
      const activeW = getActiveWrestler();
      if (!activeW) return;
      const opponent = document.getElementById("log-opponent").value.trim() || "Opponent";
      activeMatch = { 
        id: Math.random().toString(36).slice(2, 9), 
        wrestlerId: activeW.id, 
        boutId: store.activeBoutId,
        opponent, 
        level: selectedMatchLevel,
        date: new Date().toISOString().slice(0, 10),
        events: []
      };
      currentPeriod = "P1";
      render();
    }

    function setDir(d) {
      pauseVideoAndGetTime();
      manualDirection = d; 
      selectedPrimaryCat = null; 
      selectedSubCat = null;
      selectedPendingMove = null;
      render(); 
    }

    function setPrimaryCat(c) {
      pauseVideoAndGetTime();
      selectedPrimaryCat = c;
      selectedSubCat = null;
      selectedPendingMove = null;
      render();
    }

    function logEvent(category, move, outcome, points = 0, detail = "") {
      const timestamp = pauseVideoAndGetTime();
      const formattedTie = activeTieModifiers.map(m => {
        if (typeof m === 'object') {
          return m.owner === 'opponent' ? `Opp: ${m.tie}` : m.tie;
        }
        return m;
      }).join(" + ");

      activeMatch.events.push({ 
        id: Math.random().toString(36).slice(2, 9), 
        matchId: activeMatch.id, 
        wrestlerId: activeMatch.wrestlerId, 
        boutId: store.activeBoutId,
        period: currentPeriod,
        category, 
        subCategory: selectedSubCat,
        move, 
        tie: formattedTie,
        direction: manualDirection, 
        outcome, 
        points,
        detail,
        timestamp,
        ts: Date.now() 
      });
      selectedPrimaryCat = null;
      selectedSubCat = null;
      selectedPendingMove = null;
      activeTieModifiers = [];
      render();
    }

    function logTurnMove(move, detail, points) {
      logEvent('Turns', move, 'success', points, detail);
    }

    function logPenaltyMove(move, detail, points) {
      logEvent('Penalty', move, 'success', points, detail);
    }

    function openEditEventModal(eventId) {
      if (!activeMatch) return;
      const ev = activeMatch.events.find(e => e.id === eventId);
      if (!ev) return;
      editingEvent = { ...ev };
      activeModal = "edit-event";
      render();
    }

    function openEditWrestlerModal(id) {
      const season = getActiveSeason();
      const w = season.roster.find(r => r.id === id);
      if (!w) return;
      editingWrestler = { ...w };
      activeModal = "edit-wrestler";
      render();
    }

    function openEditBoutModal(id) {
      const season = getActiveSeason();
      const b = season.bouts.find(x => x.id === id);
      if (!b) return;
      editingBout = JSON.parse(JSON.stringify(b));
      activeModal = "edit-bout";
      render();
    }

    function commitManualMatch() {
      if (!activeMatch) return;
      const season = getActiveSeason();
      season.matches.push({
        id: activeMatch.id,
        wrestlerId: activeMatch.wrestlerId,
        boutId: activeMatch.boutId,
        opponent: activeMatch.opponent,
        level: activeMatch.level,
        date: activeMatch.date,
        source: "manual"
      });
      season.events.push(...activeMatch.events);
      activeMatch = null;
      persist();
      switchTab("sheet");
    }

    function discardMatch() {
      if (confirm("Discard this scoring session without adding to stats?")) {
        activeMatch = null;
        selectedPrimaryCat = null;
        selectedSubCat = null;
        selectedPendingMove = null;
        activeTieModifiers = [];
        render();
      }
    }

    /* EDIT FALL TIMESTAMP */
    function promptEditFallTime(matchId) {
      const season = getActiveSeason();
      const pinEv = season.events.find(e => e.matchId === matchId && (e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin"))));
      const currentTs = pinEv ? pinEv.timestamp || "00:00" : "00:00";
      const newTs = prompt("Enter new Pin / Fall timestamp (mm:ss):", currentTs);
      if (newTs !== null) {
        if (pinEv) {
          pinEv.timestamp = newTs.trim();
        } else {
          season.events.push({
            id: Math.random().toString(36).slice(2, 9),
            matchId,
            period: "P1",
            category: "Near Fall / Pin",
            move: "Pin / Fall",
            detail: "Pin / Fall",
            direction: "offense",
            outcome: "success",
            points: 0,
            timestamp: newTs.trim(),
            ts: Date.now()
          });
        }
        persist();
        render();
      }
    }

    /* OFFICIAL DUAL BOUT SHEET & SEASON MATCH LEDGER */
    function renderBoutSheet(target) {
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      const currentWeights = getActiveWeightClasses();
      const isSeasonScope = store.activeBoutId === "all";

      // If Season Total is selected: Show Season Match Ledger with Wrestler Selector
      if (isSeasonScope) {
        const activeW = getActiveWrestler();
        const sortedRoster = [...season.roster].sort((a, b) => (Number(a.weightClass) || 0) - (Number(b.weightClass) || 0));
        const wrestlerMatches = activeW ? season.matches.filter(m => m.wrestlerId === activeW.id) : [];

        target.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--panelLine); padding-bottom:10px; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
              <div>
                <div style="font-size:14px; font-weight:800; color:var(--gold); text-transform:uppercase;">Season Match Ledger</div>
                <div style="font-size:11px; color:var(--muted);">${season.name} · All Competitions</div>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase;">Select Athlete:</span>
                <select class="select" style="margin-bottom:0; width:auto; font-size:12px; font-weight:700;" onchange="setActiveWrestler(this.value)">
                  ${sortedRoster.map(w => `<option value="${w.id}" ${activeW && w.id === activeW.id ? 'selected' : ''}>${w.name} (${w.weightClass} lbs - ${w.level})</option>`).join('')}
                </select>
                ${helpIcon('bout_sheet')}
              </div>
            </div>

            <table class="sheet-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Event / Opponent Team</th>
                  <th>Opponent Name</th>
                  <th>Level</th>
                  <th>Result</th>
                  <th>Score / Outcome</th>
                </tr>
              </thead>
              <tbody>
                ${wrestlerMatches.length === 0 ? '<tr><td colspan="6" style="text-align:center; color:var(--muted);">No matches logged for this wrestler in the season.</td></tr>' : ''}
                ${wrestlerMatches.map(m => {
                  const bout = season.bouts.find(b => b.id === m.boutId);
                  const evs = season.events.filter(e => e.matchId === m.id);
                  let ourP = 0, oppP = 0;
                  evs.forEach(e => {
                    const pts = e.points || 0;
                    if (e.category === "Penalty") {
                      if (e.direction === "offense") oppP += pts;
                      else ourP += pts;
                    } else {
                      if (e.direction === "offense") ourP += pts;
                      else if (e.outcome === "fail") oppP += pts;
                    }
                  });

                  const pinEv = evs.find(e => e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin")));
                  const isOffPin = pinEv && pinEv.direction === "offense";
                  const isDefPin = pinEv && pinEv.direction === "defense";

                  let resultStr = "—";
                  let outcomeDisplay = "";

                  if (isOffPin) {
                    resultStr = "WIN";
                    outcomeDisplay = `<span style="cursor:pointer; text-decoration:underline;" onclick="promptEditFallTime('${m.id}')">Pin (${pinEv.timestamp || '0:00'}) ✎</span>`;
                  } else if (isDefPin) {
                    resultStr = "LOSS";
                    outcomeDisplay = `<span style="cursor:pointer; text-decoration:underline;" onclick="promptEditFallTime('${m.id}')">Pinned (${pinEv.timestamp || '0:00'}) ✎</span>`;
                  } else if (ourP > oppP) {
                    resultStr = "WIN";
                    outcomeDisplay = `${ourP} - ${oppP}`;
                  } else {
                    resultStr = "LOSS";
                    outcomeDisplay = `${ourP} - ${oppP}`;
                  }

                  return `
                    <tr>
                      <td>${m.date || (bout ? bout.date : '—')}</td>
                      <td>${bout ? `${bout.opponentTeam} [${bout.type}]` : 'Individual Bout'}</td>
                      <td><strong>${m.opponent}</strong></td>
                      <td>${m.level}</td>
                      <td style="font-weight:700; color:${resultStr === 'WIN' ? 'var(--green)' : 'var(--red)'};">${resultStr}</td>
                      <td style="font-family:monospace; font-weight:700;">${outcomeDisplay}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
        return;
      }

      // Event Scoped: Show Dual / Tournament Bout Sheet
      let teamScoreOur = 0;
      let teamScoreOpp = 0;

      const varsityMatches = [];
      const jvExhMatches = [];

      season.matches.filter(m => m.boutId === store.activeBoutId).forEach(m => {
        const ourW = season.roster.find(w => w.id === m.wrestlerId);
        const oppW = activeBout && activeBout.opponentRoster ? activeBout.opponentRoster.find(o => o.name === m.opponent) : null;
        
        let assignedWeight = ourW ? ourW.weightClass : "Unknown";
        let isBumped = false;

        if (ourW && oppW) {
          const ourNum = Number(ourW.weightClass) || 0;
          const oppNum = Number(oppW.weightClass) || 0;
          if (oppNum > ourNum) {
            assignedWeight = oppW.weightClass;
            isBumped = true;
          }
        }

        const matchPayload = { ...m, ourW, oppW, assignedWeight, isBumped };
        if (m.level === "Varsity") varsityMatches.push(matchPayload);
        else jvExhMatches.push(matchPayload);
      });

      const varsityRowsHtml = currentWeights.map(weight => {
        const matchesAtWeight = varsityMatches.filter(m => m.assignedWeight === weight);
        if (matchesAtWeight.length === 0) {
          const ourW = season.roster.find(w => w.weightClass === weight && w.level === "Varsity");
          const oppW = activeBout && activeBout.opponentRoster ? activeBout.opponentRoster.find(o => o.weightClass === weight) : null;
          return `
            <tr>
              <td><strong>${weight}</strong></td>
              <td>${ourW ? `${ourW.name}` : 'FORFEIT'}</td>
              <td>${oppW ? `${oppW.name}` : '—'}</td>
              <td>Varsity</td>
              <td>—</td>
              <td>—</td>
              <td>—</td>
            </tr>
          `;
        }

        return matchesAtWeight.map(m => {
          const matchEvs = season.events.filter(e => e.matchId === m.id);
          let ourP = 0, oppP = 0;

          matchEvs.forEach(e => {
            const pts = e.points || 0;
            if (e.category === "Penalty") {
              if (e.direction === "offense") oppP += pts;
              else ourP += pts;
            } else {
              if (e.direction === "offense") ourP += pts;
              else if (e.outcome === "fail") oppP += pts;
            }
          });

          const pinEv = matchEvs.find(e => e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin")));
          const isOffPin = pinEv && pinEv.direction === "offense";
          const isDefPin = pinEv && pinEv.direction === "defense";

          let resultStr = "—", teamPtsOur = 0, teamPtsOpp = 0;

          if (isOffPin || (!isDefPin && ourP > oppP)) {
            resultStr = isOffPin 
              ? `<span style="cursor:pointer; text-decoration:underline;" onclick="promptEditFallTime('${m.id}')">WIN (Pin ${pinEv.timestamp || '0:00'}) ✎</span>` 
              : `WIN (${ourP}-${oppP})`;
            teamPtsOur = isOffPin ? 6 : (ourP - oppP >= 8 ? 4 : 3);
            teamScoreOur += teamPtsOur;
          } else {
            resultStr = isDefPin 
              ? `<span style="cursor:pointer; text-decoration:underline;" onclick="promptEditFallTime('${m.id}')">LOSS (Pinned ${pinEv.timestamp || '0:00'}) ✎</span>` 
              : `LOSS (${ourP}-${oppP})`;
            teamPtsOpp = isDefPin ? 6 : (oppP - ourP >= 8 ? 4 : 3);
            teamScoreOpp += teamPtsOpp;
          }

          return `
            <tr>
              <td><strong>${m.assignedWeight}</strong> ${m.isBumped ? '<span style="color:var(--gold); font-size:9px;">[↑ Bumped]</span>' : ''}</td>
              <td>${m.ourW ? `${m.ourW.name}` : 'FORFEIT'}</td>
              <td>${m.opponent}</td>
              <td>Varsity</td>
              <td style="font-weight:700; color:${resultStr.includes('WIN') ? 'var(--green)' : 'var(--red)'};">${resultStr}</td>
              <td style="font-family:monospace; color:var(--green); font-weight:700;">${teamPtsOur || '—'}</td>
              <td style="font-family:monospace; color:var(--red); font-weight:700;">${teamPtsOpp || '—'}</td>
            </tr>
          `;
        }).join('');
      }).join('');

      const jvRowsHtml = jvExhMatches.map(m => {
        const matchEvs = season.events.filter(e => e.matchId === m.id);
        let ourP = 0, oppP = 0;
        matchEvs.forEach(e => {
          const pts = e.points || 0;
          if (e.category === "Penalty") {
            if (e.direction === "offense") oppP += pts;
            else ourP += pts;
          } else {
            if (e.direction === "offense") ourP += pts;
            else if (e.outcome === "fail") oppP += pts;
          }
        });

        const pinEv = matchEvs.find(e => e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin")));
        const isOffPin = pinEv && pinEv.direction === "offense";
        const isDefPin = pinEv && pinEv.direction === "defense";

        let resultStr = "—";
        if (isOffPin) resultStr = `<span style="cursor:pointer; text-decoration:underline;" onclick="promptEditFallTime('${m.id}')">WIN (Pin ${pinEv.timestamp || '0:00'}) ✎</span>`;
        else if (isDefPin) resultStr = `<span style="cursor:pointer; text-decoration:underline;" onclick="promptEditFallTime('${m.id}')">LOSS (Pinned ${pinEv.timestamp || '0:00'}) ✎</span>`;
        else resultStr = ourP > oppP ? `WIN (${ourP}-${oppP})` : `LOSS (${ourP}-${oppP})`;

        return `
          <tr>
            <td><strong>${m.assignedWeight}</strong></td>
            <td>${m.ourW ? m.ourW.name : 'Unknown'}</td>
            <td>${m.opponent}</td>
            <td>${m.level}</td>
            <td style="font-weight:700; color:${resultStr.includes('WIN') ? 'var(--green)' : 'var(--red)'};">${resultStr}</td>
            <td style="color:var(--muted); font-size:10px;">(0 Exh)</td>
            <td style="color:var(--muted); font-size:10px;">(0 Exh)</td>
          </tr>
        `;
      }).join('');

      target.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--panelLine); padding-bottom:10px; margin-bottom:12px;">
            <div>
              <div style="font-size:14px; font-weight:800; color:var(--gold); text-transform:uppercase;">Official Dual Bout Sheet</div>
              <div style="font-size:11px; color:var(--muted);">${season.name} · ${activeBout ? `${activeBout.date} [${activeBout.type}] vs ${activeBout.opponentTeam} (${activeBout.division})` : 'All Season Events'}</div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <button class="btn btn-gold" onclick="activeModal = 'expanded-sheet'; render();">View Expanded Bout Sheet</button>
              ${activeBout && activeBout.type === "Dual" ? `
                <button class="btn btn-green" onclick="finalizeDualMeet(${teamScoreOur}, ${teamScoreOpp})">Finalize Dual Meet</button>
              ` : ''}
              <div style="text-align:right; margin-left:10px;">
                <span style="font-size:20px; font-weight:800; color:var(--green);">${teamScoreOur}</span>
                <span style="font-size:14px; color:var(--muted);"> - </span>
                <span style="font-size:20px; font-weight:800; color:var(--red);">${teamScoreOpp}</span>
              </div>
              ${helpIcon('bout_sheet')}
            </div>
          </div>

          <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:4px;">Varsity Dual Competition</div>
          <table class="sheet-table" style="margin-bottom:16px;">
            <thead>
              <tr>
                <th>Wt</th>
                <th>Home Athlete</th>
                <th>Opponent Athlete</th>
                <th>Level</th>
                <th>Result</th>
                <th>Home Pts</th>
                <th>Opp Pts</th>
              </tr>
            </thead>
            <tbody>
              ${varsityRowsHtml}
            </tbody>

    function finalizeDualMeet(ourPts, oppPts) {
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      if (!activeBout || activeBout.type !== "Dual") return alert("Only dual meets can be finalized to the dual team record.");

      if (activeBout.finalized) {
        if (!confirm("This bout was already finalized. Overwrite previous record calculation?")) return;
      }

      const rec = activeBout.division === "Girls" 
        ? (season.girlsDualRecord || (season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 }))
        : (season.boysDualRecord || (season.boysDualRecord = { wins: 0, losses: 0, ties: 0 }));

      if (ourPts > oppPts) rec.wins += 1;
      else if (oppPts > ourPts) rec.losses += 1;
      else rec.ties = (rec.ties || 0) + 1;

      activeBout.finalized = true;
      persist();
      alert(`Dual Meet Finalized! Updated record.`);
      render();
    }

    /* CALGRAPPLER EXPANDED STAT SHEET */
    function renderCalGrapplerExpandedSheet() {
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      const currentWeights = getActiveWeightClasses();

      let cumHomeTeamPts = 0;
      let cumOppTeamPts = 0;

      const rows = currentWeights.map(weight => {
        const ourW = season.roster.find(w => w.weightClass === weight && w.level === "Varsity");
        const match = season.matches.find(m => {
          if (store.activeBoutId !== "all" && m.boutId !== store.activeBoutId) return false;
          return ourW && m.wrestlerId === ourW.id;
        });

        const oppW = activeBout && activeBout.opponentRoster ? activeBout.opponentRoster.find(o => o.weightClass === weight) : null;
        const oppName = match ? match.opponent : (oppW ? oppW.name : "FORFEIT");

        let p1Score = "—", p2Score = "—", p3Score = "—", fallTime = "—", matchScore = "—", homeDualPt = "", oppDualPt = "";

        if (match) {
          const matchEvs = season.events.filter(e => e.matchId === match.id);
          
          const symbolMap = (e) => {
            const who = e.direction === "offense" ? "H" : "V";
            if (e.category === "Choice") {
              return `[${who}:${e.detail || e.move}]`;
            }
            let sym = "T3";
            if (e.category === "Escape") sym = "E1";
            else if (e.category === "Reversal") sym = "R2";
            else if (e.detail && e.detail.includes("2-Point")) sym = "N2";
            else if (e.detail && e.detail.includes("3-Point")) sym = "N3";
            else if (e.detail && e.detail.includes("4-Point")) sym = "N4";
            else if (e.category === "Penalty") sym = "P1";
            return `${who}:${sym}`;
          };

          const filterPeriodEvents = (p) => {
            return matchEvs.filter(e => {
              if (e.period !== p) return false;
              if (e.category === "Choice") return true;
              if (e.category === "Penalty") return true;
              if (e.direction === "offense" && e.outcome === "success") return true;
              if (e.direction === "defense" && e.outcome === "fail") return true;
              return false;
            });
          };

          const p1Evs = filterPeriodEvents("P1");
          const p2Evs = filterPeriodEvents("P2");
          const p3Evs = filterPeriodEvents("P3");

          p1Score = p1Evs.map(symbolMap).join(", ") || "0-0";
          p2Score = p2Evs.map(symbolMap).join(", ") || "—";
          p3Score = p3Evs.map(symbolMap).join(", ") || "—";

          let ourP = 0, oppP = 0;
          matchEvs.forEach(e => {
            const pts = e.points || 0;
            if (e.category === "Penalty") {
              if (e.direction === "offense") oppP += pts;
              else ourP += pts;
            } else {
              if (e.direction === "offense") ourP += pts;
              else if (e.outcome === "fail") oppP += pts;
            }
          });

          const pinEv = matchEvs.find(e => e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin")));
          const isOffPin = pinEv && pinEv.direction === "offense";
          const isDefPin = pinEv && pinEv.direction === "defense";

          if (isOffPin) {
            fallTime = pinEv.timestamp || "FALL";
            matchScore = "FALL";
          } else if (isDefPin) {
            fallTime = pinEv.timestamp || "DEF FALL";
            matchScore = "FALL";
          } else {
            matchScore = `${ourP} - ${oppP}`;
          }

          if (isOffPin || (!isDefPin && ourP > oppP)) {
            const pts = isOffPin ? 6 : (ourP - oppP >= 15 ? 5 : (ourP - oppP >= 8 ? 4 : 3));
            cumHomeTeamPts += pts;
            homeDualPt = String(cumHomeTeamPts);
          } else {
            const pts = isDefPin ? 6 : (oppP - ourP >= 15 ? 5 : (oppP - ourP >= 8 ? 4 : 3));
            cumOppTeamPts += pts;
            oppDualPt = String(cumOppTeamPts);
          }
        }

        return `
          <tr>
            <td style="text-align:center; font-weight:800;">${weight}</td>
            <td><strong>Home:</strong> ${ourW ? ourW.name : 'FORFEIT'}<br/><strong>Opp:</strong> ${oppName}</td>
            <td>${p1Score}</td>
            <td>${p2Score}</td>
            <td>${p3Score}</td>
            <td style="text-align:center; font-weight:700;">${fallTime}</td>
            <td style="text-align:center; font-weight:800;">${matchScore}</td>
            <td style="text-align:center; font-weight:800; color:var(--green);">${homeDualPt}</td>
            <td style="text-align:center; font-weight:800; color:var(--red);">${oppDualPt}</td>
          </tr>
        `;
      }).join('');

      return `
        <div style="overflow-x:auto;">
          <table class="cg-table">
            <thead>
              <tr>
                <th rowspan="2">Weight</th>
                <th rowspan="2">Wrestlers</th>
                <th colspan="3">Match Sequence & Positions</th>
                <th rowspan="2">Fall Time</th>
                <th rowspan="2">Match Score</th>
                <th colspan="2">Team Score</th>
              </tr>
              <tr>
                <th>1st Period</th>

              ${rows}
            </tbody>
          </table>

          <div class="cg-legend">
            <div><strong>SCORING SYMBOLS</strong></div>
            <div><strong>TAKEDOWN</strong> - T3</div>
            <div><strong>REVERSAL</strong> - R2</div>
            <div><strong>ESCAPE</strong> - E1</div>
            <div><strong>NEAR FALL</strong> - N2, N3, N4</div>
            <div><strong>PENALTY</strong> - P1, P2</div>
            <div><strong>CHOICE</strong> - Top, Bottom, Neutral, Defer</div>
          </div>
        </div>
      `;

    /* FULL SYMMETRIC STATS & TRAINING PLAN */
    function computeStatsWithTieBreakdown(wrestlerId) {
      const season = getActiveSeason();
      const wEvents = season.events.filter(e => {
        if (e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        return true;
      });

      const offense = {}, defense = {};

      wEvents.forEach(e => {
        const bucket = e.direction === "offense" ? offense : defense;
        if (!bucket[e.move]) {
          bucket[e.move] = { move: e.move, category: e.category, attempts: 0, success: 0, ties: {} };
        }
        bucket[e.move].attempts += 1;
        if (e.outcome === "success") bucket[e.move].success += 1;

        const tieKey = e.tie || "Open / Unspecified Tie";
        if (!bucket[e.move].ties[tieKey]) {
          bucket[e.move].ties[tieKey] = { tie: tieKey, attempts: 0, success: 0 };
        }
        bucket[e.move].ties[tieKey].attempts += 1;
        if (e.outcome === "success") bucket[e.move].ties[tieKey].success += 1;
      });

      const format = obj => Object.values(obj).map(r => ({
        ...r,
        rate: Math.round((r.success / r.attempts) * 100),
        tieList: Object.values(r.ties).map(t => ({
          ...t,
          rate: Math.round((t.success / t.attempts) * 100)
        })).sort((a,b) => b.attempts - a.attempts)
      })).sort((a,b) => b.attempts - a.attempts);

      return { offense: format(offense), defense: format(defense) };
    }

    function computeTeamStatsWithTieBreakdown() {
      const season = getActiveSeason();
      const wEvents = season.events.filter(e => {
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        return true;
      });

      const offense = {}, defense = {};

      wEvents.forEach(e => {
        const bucket = e.direction === "offense" ? offense : defense;
        if (!bucket[e.move]) {
          bucket[e.move] = { move: e.move, category: e.category, attempts: 0, success: 0, ties: {} };
        }
        bucket[e.move].attempts += 1;
        if (e.outcome === "success") bucket[e.move].success += 1;

        const tieKey = e.tie || "Open / Unspecified Tie";
        if (!bucket[e.move].ties[tieKey]) {
          bucket[e.move].ties[tieKey] = { tie: tieKey, attempts: 0, success: 0 };
        }
        bucket[e.move].ties[tieKey].attempts += 1;
        if (e.outcome === "success") bucket[e.move].ties[tieKey].success += 1;
      });

      const format = obj => Object.values(obj).map(r => ({
        ...r,
        rate: Math.round((r.success / r.attempts) * 100),
        tieList: Object.values(r.ties).map(t => ({
          ...t,
          rate: Math.round((t.success / t.attempts) * 100)
        })).sort((a,b) => b.attempts - a.attempts)
      })).sort((a,b) => b.attempts - a.attempts);

      return { offense: format(offense), defense: format(defense) };
    }

    function computePositionalProficiency(targetWrestlerId = null) {
      const season = getActiveSeason();
      const targetMatches = season.matches.filter(m => {
        if (targetWrestlerId && m.wrestlerId !== targetWrestlerId) return false;
        if (store.activeBoutId !== "all" && m.boutId !== store.activeBoutId) return false;
        return true;
      });

      let neutral = { opps: 0, successes: 0, failures: 0 };
      let top = { opps: 0, successes: 0, failures: 0 };
      let bottom = { opps: 0, successes: 0, failures: 0 };
      let choices = { neutral: 0, top: 0, bottom: 0, defer: 0 };

      targetMatches.forEach(m => {
        const mEvs = season.events
          .filter(e => e.matchId === m.id)
          .sort((a, b) => (a.ts || 0) - (b.ts || 0));

        // Neutral starts with Period 1
        neutral.opps += 1;

        mEvs.forEach(e => {
          // Track choice preferences made BY THE WRESTLER ONLY (Offense / Home)
          if (e.category === "Choice" && e.direction === "offense") {
            const pos = e.detail;
            if (pos === "Neutral") choices.neutral += 1;
            else if (pos === "Top") choices.top += 1;
            else if (pos === "Bottom") choices.bottom += 1;
            else if (pos === "Defer") choices.defer += 1;
          }

          // Overtime neutral start
          if (e.category === "Flow" && e.detail === "OT") {
            neutral.opps += 1;
          }

          // Choice options impact on opportunities
          if (e.category === "Choice") {
            const isHomeChoice = e.move.includes("Home");
            const pos = e.detail;

            if (pos === "Neutral") {
              neutral.opps += 1;
            } else if (pos === "Top") {
              if (isHomeChoice) top.opps += 1;
              else bottom.opps += 1;
            } else if (pos === "Bottom") {
              if (isHomeChoice) bottom.opps += 1;
              else top.opps += 1;
            }
          }

          // Takedown
          if (e.category === "Takedown") {
            if (e.direction === "offense" && e.outcome === "success") {
              neutral.successes += 1;
              top.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              neutral.failures += 1;
              bottom.opps += 1;
            }
          }

          // Escape
          if (e.category === "Escape") {
            if (e.direction === "offense" && e.outcome === "success") {
              bottom.successes += 1;
              neutral.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              top.failures += 1;
              neutral.opps += 1;
            }
          }

          // Reversal
          if (e.category === "Reversal") {
            if (e.direction === "offense" && e.outcome === "success") {
              bottom.successes += 1;
              top.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              top.failures += 1;
              bottom.opps += 1;
            }
          }

          // Near Fall / Pin & Turns
          if (e.category === "Near Fall / Pin" || e.category === "Turns") {
            if (e.direction === "offense" && e.outcome === "success") {
              top.successes += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              bottom.failures += 1;
            }
          }
        });
      });

      const calcPct = (s, f, opp) => opp > 0 ? Math.round(((s - f) / opp) * 100) : 0;

      return {
        neutral: { ...neutral, pct: calcPct(neutral.successes, neutral.failures, neutral.opps) },
        top: { ...top, pct: calcPct(top.successes, top.failures, top.opps) },
        bottom: { ...bottom, pct: calcPct(bottom.successes, bottom.failures, bottom.opps) },
        choices
      };
    }

    /* Ranks a wrestler against same-division teammates for a specific move */
    function getMoveTeamRank(wrestler, move, direction) {
      const season = getActiveSeason();
      const sameDivision = season.roster.filter(w => w.division === wrestler.division);

      const totals = sameDivision.map(w => {
        const evs = season.events.filter(e =>
          e.wrestlerId === w.id &&
          e.move === move &&
          e.direction === direction &&
          (store.activeBoutId === "all" || e.boutId === store.activeBoutId)
        );
        const attempts = evs.length;
        const success = evs.filter(e => e.outcome === "success").length;
        return { id: w.id, attempts, rate: attempts ? success / attempts : -1 };
      }).filter(t => t.attempts > 0);

      totals.sort((a, b) => b.rate - a.rate || b.attempts - a.attempts);
      return totals.findIndex(t => t.id === wrestler.id);
    }

    function medalForRank(rank) {
      if (rank === 0) return "🥇";
      if (rank === 1) return "🥈";
      if (rank === 2) return "🥉";
      return "";
    }

    function renderPlan(target) {

      const minAttempts = statsShowTeam ? 4 : 2;

    function renderAdminSubcatSelect(cat) {
      const container = document.getElementById("adm-subcat-container");
      if (container) container.style.display = (cat === "Takedown") ? "block" : "none";
    }

    function adminAddWeightClass(div) {
      const input = document.getElementById(div === "Boys" ? "adm-add-boy-weight" : "adm-add-girl-weight");
      if (!input) return;
      const wt = input.value.trim();
      if (!wt || isNaN(wt)) return alert("Please enter a numeric weight class.");

      if (!weightClasses[div].includes(wt)) {
        weightClasses[div].push(wt);
        weightClasses[div].sort((a, b) => Number(a) - Number(b));
      }
      input.value = "";
      persist();
      render();
    }

    function adminDeleteWeightClass(div, wt) {
      weightClasses[div] = weightClasses[div].filter(w => w !== wt);
      persist();
      render();
    }

    function resetDefaultWeightClasses() {
      if (!confirm("Reset all Boys and Girls weight classes to NFHS standard defaults?")) return;
      weightClasses = JSON.parse(JSON.stringify(DEFAULT_WEIGHT_CLASSES));
      persist();
      render();
    }

    function dragStart(e, cat, sub, idx) {
      draggedMove = { cat, sub, idx };
    }

    function dropMove(e, targetCat, targetSub, targetIdx) {
      e.preventDefault();
      if (!draggedMove || draggedMove.cat !== targetCat || draggedMove.sub !== targetSub) return;
      
      let list = targetSub ? taxonomy.MOVE_GROUPS[targetCat][targetSub] : taxonomy.MOVE_GROUPS[targetCat];
      const item = list.splice(draggedMove.idx, 1)[0];
      list.splice(targetIdx, 0, item);
      draggedMove = null;
      persist();
      render();
    }

    function adminAddMove() {
      const cat = document.getElementById("adm-cat").value;
      const moveName = document.getElementById("adm-move-name").value.trim();
      if (!moveName) return alert("Please enter a move name.");

      if (cat === "Takedown") {
        const sub = document.getElementById("adm-subcat").value;
        if (!taxonomy.MOVE_GROUPS.Takedown[sub].includes(moveName)) {
          taxonomy.MOVE_GROUPS.Takedown[sub].push(moveName);
        }
      } else {
        if (!taxonomy.MOVE_GROUPS[cat].includes(moveName)) {
          taxonomy.MOVE_GROUPS[cat].push(moveName);
        }
      }
      persist();
      render();
    }

    function adminDeleteMove(cat, sub, moveName) {
      if (cat === "Takedown" && sub) {
        taxonomy.MOVE_GROUPS.Takedown[sub] = taxonomy.MOVE_GROUPS.Takedown[sub].filter(m => m !== moveName);
      } else {
        taxonomy.MOVE_GROUPS[cat] = taxonomy.MOVE_GROUPS[cat].filter(m => m !== moveName);
      }
      persist();
      render();
    }

    function adminAddTie() {
      const tieName = document.getElementById("adm-tie-name").value.trim();
      if (!tieName) return alert("Please enter a tie modifier name.");
      if (!taxonomy.TIE_MODIFIERS.includes(tieName)) {
        taxonomy.TIE_MODIFIERS.push(tieName);
      }
      persist();
      render();
    }

    function adminDeleteTie(tie) {
      taxonomy.TIE_MODIFIERS = taxonomy.TIE_MODIFIERS.filter(t => t !== tie);
      persist();
      render();
    }

    function adminAddFinish() {
      const finName = document.getElementById("adm-finish-name").value.trim();
      if (!finName) return alert("Please enter a finish/counter name.");
      if (!taxonomy.FINISH_MODIFIERS) taxonomy.FINISH_MODIFIERS = [...DEFAULT_TAXONOMY.FINISH_MODIFIERS];
      if (!taxonomy.FINISH_MODIFIERS.includes(finName)) {
        taxonomy.FINISH_MODIFIERS.push(finName);
      }
      persist();
      render();
    }

    function adminDeleteFinish(fin) {
      if (!taxonomy.FINISH_MODIFIERS) taxonomy.FINISH_MODIFIERS = [...DEFAULT_TAXONOMY.FINISH_MODIFIERS];

                  <select class="select" onchange="editingBout.division = this.value">

              <input class="input" value="${editingBout.opponentTeam}" oninput="editingBout.opponentTeam = this.value" />

                <div style="max-height:120px; overflow-y:auto;">

      if (activeModal === "expanded-sheet") {

                ${renderCalGrapplerExpandedSheet()}
              </div>
            </div>
          </div>

      if (activeModal === "edit-event" && editingEvent) {
        const allMoves = getAllMovesFlat();
        let currentTies = editingEvent.tie ? editingEvent.tie.split(" + ") : [];
        const combinedModifiersList = Array.from(new Set([...taxonomy.TIE_MODIFIERS, ...(taxonomy.FINISH_MODIFIERS || DEFAULT_TAXONOMY.FINISH_MODIFIERS)]));

        root.innerHTML = `
          <div class="modal-overlay" onclick="closeModal()">
