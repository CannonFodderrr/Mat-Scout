    /* ===== AI TRAINING LIBRARY ===== */
    function openAiTrainingDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("IndexedDB not available"));
        const req = indexedDB.open(AI_TRAINING_IDB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("videos")) db.createObjectStore("videos");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("IDB open failed"));
      });
    }

    async function idbPutTrainingVideo(exampleId, blob) {
      if (!blob || !exampleId) return false;
      try {
        const db = await openAiTrainingDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("videos", "readwrite");
          tx.objectStore("videos").put(blob, exampleId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        console.warn("Could not store training video blob", e);
        return false;
      }
    }

    async function idbGetTrainingVideo(exampleId) {
      try {
        const db = await openAiTrainingDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("videos", "readonly");
          const req = tx.objectStore("videos").get(exampleId);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    }

    async function idbDeleteTrainingVideo(exampleId) {
      try {
        const db = await openAiTrainingDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("videos", "readwrite");
          tx.objectStore("videos").delete(exampleId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        return false;
      }
    }

    function buildTrainingExampleFromActiveMatch() {
      if (!activeMatch) return null;
      const season = getActiveSeason();
      const w = season.roster.find(r => r.id === activeMatch.wrestlerId);
      const bout = season.bouts.find(b => b.id === activeMatch.boutId);
      const events = JSON.parse(JSON.stringify(activeMatch.events || []));
      const result = classifyMatchResult(events);

      let video = { type: "none" };
      if (videoSourceType === "youtube" && youtubeVideoId) {
        video = {
          type: "youtube",
          youtubeId: youtubeVideoId,
          youtubeUrl: "https://www.youtube.com/watch?v=" + youtubeVideoId,
          fileName: videoFileName || ("YouTube [" + youtubeVideoId + "]")
        };
      } else if (videoSourceType === "file" && (selectedVideoFile || videoBlobUrl)) {
        video = {
          type: "file",
          fileName: videoFileName || (selectedVideoFile && selectedVideoFile.name) || "local-video",
          mimeType: (selectedVideoFile && selectedVideoFile.type) || "video/mp4",
          hasLocalBlob: true
        };
      }

      const appearance = activeMatch.ourAppearance
        ? JSON.parse(JSON.stringify(activeMatch.ourAppearance))
        : snapshotOurWrestlerAppearance();

      return {
        id: Math.random().toString(36).slice(2, 10),
        seasonMatchId: activeMatch.id,
        savedAt: new Date().toISOString(),
        seasonId: season.id,
        seasonName: season.name,
        wrestlerId: activeMatch.wrestlerId,
        wrestlerName: w ? w.name : "",
        weightClass: w ? w.weightClass : "",
        division: w ? w.division : "",
        boutId: activeMatch.boutId,
        boutLabel: bout ? ((bout.date || "") + " vs " + (bout.opponentTeam || "")) : "",
        opponent: activeMatch.opponent,
        level: activeMatch.level,
        date: activeMatch.date,
        source: "manual",
        // Visual ID of OUR wrestler on film (ankle band / singlet)
        ourAppearance: appearance,
        ourAppearanceText: formatOurWrestlerAppearanceText(appearance, w ? w.name : ""),
        events,
        result: {
          ourP: result.ourP,
          oppP: result.oppP,
          outcome: result.result,
          method: result.method
        },
        video
      };
    }

    async function saveActiveMatchToAiTrainingLibrary() {
      if (activeMatch) {
        activeMatch.ourAppearance = snapshotOurWrestlerAppearance();
      }
      const example = buildTrainingExampleFromActiveMatch();
      if (!example) return { ok: false, reason: "no match" };

      // Store local file blob in IndexedDB when available
      if (example.video && example.video.type === "file" && selectedVideoFile) {
        const stored = await idbPutTrainingVideo(example.id, selectedVideoFile);
        example.video.hasLocalBlob = !!stored;
        if (!stored) {
          example.video.note = "Video file could not be stored in IndexedDB (quota or browser limit). Event labels were still saved.";
        }
      } else if (example.video && example.video.type === "file" && videoBlobUrl && !selectedVideoFile) {
        // Try fetch blob from object URL
        try {
          const resp = await fetch(videoBlobUrl);
          const blob = await resp.blob();
          const stored = await idbPutTrainingVideo(example.id, blob);
          example.video.hasLocalBlob = !!stored;
        } catch (e) {
          example.video.hasLocalBlob = false;
          example.video.note = "Local video blob unavailable to store; labels saved.";
        }
      }

      aiTrainingLibrary.push(example);
      try {
        localStorage.setItem(AI_TRAINING_LIBRARY_KEY, JSON.stringify(aiTrainingLibrary));
      } catch (e) {
        // quota — drop video refs and retry metadata only
        example.video = example.video && example.video.type === "youtube" ? example.video : { type: "none", note: "Storage full; video omitted" };
        aiTrainingLibrary[aiTrainingLibrary.length - 1] = example;
        try {
          localStorage.setItem(AI_TRAINING_LIBRARY_KEY, JSON.stringify(aiTrainingLibrary));
        } catch (e2) {
          aiTrainingLibrary.pop();
          return { ok: false, reason: "storage_full" };
        }
      }
      return { ok: true, example };
    }

    function exportAiTrainingLibrary() {
      const payload = {
        type: "mat-scout-ai-training-library",
        version: 1,
        exportedAt: new Date().toISOString(),
        count: aiTrainingLibrary.length,
        examples: aiTrainingLibrary
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Mat Scout/AI Training Library/mat-scout-ai-training-library.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function downloadTextFile(filename, text, mime) {
      const blob = new Blob([text], { type: mime || "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function csvEscape(v) {
      const s = v == null ? "" : String(v);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    /** URL/filesystem-safe slug: lowercase, alphanumerics only, dash-separated. */
    function slugify(s) {
      return String(s || "").toLowerCase().trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "x";
    }

    function stripFileExt(name) {
      return String(name || "").replace(/\.[a-zA-Z0-9]{1,5}$/, "");
    }

    /** Looks up a YouTube video's title via the public oEmbed endpoint (no API key needed).
     *  Returns null on any failure (offline, blocked, deleted video) so callers can fall
     *  back gracefully instead of breaking the clip pipeline. */
    async function fetchYoutubeTitle(youtubeUrl) {
      if (!youtubeUrl) return null;
      try {
        const resp = await fetch("https://www.youtube.com/oembed?url=" + encodeURIComponent(youtubeUrl) + "&format=json");
        if (!resp.ok) return null;
        const data = await resp.json();
        return data && data.title ? data.title : null;
      } catch (err) {
        return null;
      }
    }

    /** Builds a single-match clip manifest (same shape as the Kaggle export's event rows)
     *  for POSTing to the local auto-clip server right after commit. Folder and clip file
     *  names are derived from the uploaded video's filename (or YouTube title), the match date,
     *  and opponent — not the internal training-library ID — so they're browsable on disk. */
    async function buildClipManifestForExample(example) {
      const video = example.video || { type: "none" };
      const before = Number(appConfig.clipSecondsBefore) || 4;
      const after = Number(appConfig.clipSecondsAfter) || 1.5;

      let videoBase;
      if (video.type === "file") {
        videoBase = stripFileExt(video.fileName);
      } else if (video.type === "youtube") {
        const title = await fetchYoutubeTitle(video.youtubeUrl);
        videoBase = title || video.youtubeId || "youtube-video";
      } else {
        videoBase = "match";
      }
      const clipFolderName = [slugify(videoBase), slugify(example.date), slugify(example.opponent)]
        .filter(Boolean).join("__");

      // Optional video duration (seconds) if known on the example or video meta
      const videoDurationSec = (typeof example.videoDurationSec === "number" && example.videoDurationSec > 0)
        ? example.videoDurationSec
        : (typeof video.durationSec === "number" && video.durationSec > 0 ? video.durationSec : null);

      const events = (example.events || []).map((e, i) => {
        const ts = e.timestamp || "";
        // Prefer shared parser so MM:SS.s fractional timestamps work
        let tSec = null;
        if (typeof parseTimestampToSeconds === "function") tSec = parseTimestampToSeconds(ts);
        if (tSec == null) {
          const parts = String(ts).trim().split(":");
          if (parts.length === 2) {
            const m = Number(parts[0]), s = Number(parts[1]);
            if (!isNaN(m) && !isNaN(s)) tSec = m * 60 + s;
          }
        }
        const clipName = [
          ts ? String(ts).replace(/:/g, "-").replace(/\./g, "p") : "t" + i,
          slugify(e.move || e.category || "event"),
          slugify(e.outcome)
        ].filter(Boolean).join("_") + "_" + String(i + 1).padStart(2, "0");
        let clipStart = tSec == null ? null : Math.max(0, tSec - before);
        let clipEnd = tSec == null ? null : tSec + after;
        if (clipStart != null && clipEnd != null) {
          // Never emit inverted windows; keep a minimum span for ffmpeg
          if (clipEnd <= clipStart) clipEnd = clipStart + Math.max(0.25, after);
          if (videoDurationSec != null) {
            clipStart = Math.min(clipStart, Math.max(0, videoDurationSec - 0.1));
            clipEnd = Math.min(clipEnd, videoDurationSec);
            if (clipEnd <= clipStart) clipEnd = Math.min(videoDurationSec, clipStart + 0.25);
          }
        }
        return {
          event_id: clipName,
          timestamp: ts, time_sec: tSec,
          clip_start_sec: clipStart,
          clip_end_sec: clipEnd,
          period: e.period || "", category: e.category || "", sub_category: e.subCategory || "",
          move: e.move || "", direction: e.direction || "", outcome: e.outcome || "",
          points: e.points != null ? e.points : "", detail: e.detail || "", tie: e.tie || "",
          actor: e.direction === "defense" ? "opponent" : "our_wrestler"
        };
      }).filter(e => e.time_sec != null);
      return {
        match_id: example.id,
        clip_folder_name: clipFolderName,
        wrestler_name: example.wrestlerName || "",
        opponent_name: example.opponent || "",
        video_source: video.type || "none",
        youtube_id: video.youtubeId || "",
        youtube_url: video.youtubeUrl || "",
        video_file_name: video.fileName || "",
        events
      };
    }

    /**
     * Best-effort notify local clip server that a match (and its clips) should be removed.
     * Tries DELETE /clips/{matchId} then POST /clip/delete with JSON body.
     * Never throws — orphaned clips are a soft failure.
     */
    async function notifyClipServerMatchDeleted(matchId, meta) {
      if (!appConfig.autoClipEnabled) return null;
      const base = (appConfig.autoClipServerUrl || "").trim().replace(/\/$/, "");
      if (!base || !matchId) return null;
      const body = JSON.stringify({
        match_id: matchId,
        action: "delete",
        wrestler_name: (meta && meta.wrestlerName) || "",
        opponent_name: (meta && meta.opponent) || "",
        date: (meta && meta.date) || ""
      });
      try {
        let resp = await fetch(base + "/clips/" + encodeURIComponent(matchId), {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body
        });
        if (resp.ok) {
          const data = await resp.json().catch(() => ({}));
          return data.message || data.status || "clips deleted";
        }
        resp = await fetch(base + "/clip/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body
        });
        if (resp.ok) {
          const data = await resp.json().catch(() => ({}));
          return data.message || data.status || "clips deleted";
        }
        return null;
      } catch (err) {
        console.warn("clip server delete notify failed", err);
        return null;
      }
    }

    /** Fire-and-forget POST of a just-committed match to the local Python clip server.
     *  Returns a short status string for display; never throws (best-effort). */
    async function postMatchToClipServer(example) {
      if (!appConfig.autoClipEnabled) return null;
      const url = (appConfig.autoClipServerUrl || "").trim();
      if (!url) return "Auto-clip enabled but no server URL is set.";
      const manifest = await buildClipManifestForExample(example);
      if (!manifest.events.length) return "No timestamped events to clip.";
      try {
        const form = new FormData();
        form.append("manifest", JSON.stringify(manifest));
        if (manifest.video_source === "file") {
          const blob = await idbGetTrainingVideo(example.id);
          if (!blob) return "Local video not found in browser storage; skipped auto-clip.";
          form.append("video", blob, manifest.video_file_name || (example.id + ".mp4"));
        }
        const resp = await fetch(url.replace(/\/$/, "") + "/clip", { method: "POST", body: form });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) return "Clip server error: " + (data.error || resp.status);
        return "Clip server: " + (data.clips_written != null ? data.clips_written + " clip(s) written." : "done.");
      } catch (err) {
        return "Could not reach clip server at " + url + " (" + (err.message || err) + "). Is it running?";
      }
    }

    async function testClipServerConnection() {
      const statusEl = document.getElementById("clip-server-status");
      const urlEl = document.getElementById("clip-server-url");
      const url = ((urlEl && urlEl.value) || appConfig.autoClipServerUrl || "").trim();
      if (statusEl) statusEl.textContent = "Checking…";
      try {
        const resp = await fetch(url.replace(/\/$/, "") + "/health", { method: "GET" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json().catch(() => ({}));
        const extra = [];
        if (data.status) extra.push(data.status);
        if (data.lora || data.predict) extra.push("LoRA ready");
        if (statusEl) { statusEl.textContent = "✓ Connected" + (extra.length ? " (" + extra.join(", ") + ")" : ""); statusEl.style.color = "var(--green)"; }
      } catch (err) {
        if (statusEl) { statusEl.textContent = "✗ Not reachable — start mat_scout_clip_server.py / app.py"; statusEl.style.color = "var(--red)"; }
      }
    }

    function importAiTrainingLibraryFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          let examples = Array.isArray(data) ? data : (Array.isArray(data.examples) ? data.examples : null);
          if (!examples) throw new Error("Expected Mat Scout library export with examples array.");
          let added = 0;
          examples.forEach(ex => {
            if (!ex || typeof ex !== "object") return;
            const copy = JSON.parse(JSON.stringify(ex));
            copy.id = Math.random().toString(36).slice(2, 10);
            if (copy.video && copy.video.type === "file") {
              copy.video.hasLocalBlob = false;
              copy.video.note = (copy.video.note || "") + " Imported without local video blob.";
            }
            if (!copy.savedAt) copy.savedAt = new Date().toISOString();
            aiTrainingLibrary.push(copy);
            added++;
          });
          persist();
          render();
          alert("Imported " + added + " example(s). Library size: " + aiTrainingLibrary.length);
        } catch (err) {
          alert("Import failed: " + (err.message || err));
        }
      };
      reader.readAsText(file);
    }

    function triggerImportAiTrainingLibrary() {
      const input = document.createElement("input");
      input.type = "file"; input.accept = "application/json,.json";
      input.onchange = () => { if (input.files && input.files[0]) importAiTrainingLibraryFromFile(input.files[0]); };
      input.click();
    }

    async function clearAiTrainingLibrary() {
      if (!aiTrainingLibrary.length) return alert("Training library is empty.");
      if (!confirm("Clear the entire AI training library (" + aiTrainingLibrary.length + " examples)? Local video copies will also be removed.")) return;
      const ids = aiTrainingLibrary.map(e => e.id);
      const metas = aiTrainingLibrary.map(e => ({ wrestlerName: e.wrestlerName || "", opponent: e.opponent || "", date: e.date || "" }));
      aiTrainingLibrary = [];
      persist();
      for (let i = 0; i < ids.length; i++) {

        notifyClipServerMatchDeleted(ids[i], metas[i]);
      }
      render();

    }


    async function commitManualMatch() {
      if (!activeMatch) return;
      if (commitManualInFlight) return;
      if (!activeMatch.boutId || activeMatch.boutId === "all") {
        alert("This match is not linked to an event. Select a dual or tournament, then re-score the match.");
        return;
      }
      const btn = document.getElementById("commit-match-btn");
      const btnOriginalHTML = btn ? btn.innerHTML : "";
      commitManualInFlight = true;
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="btn-spinner"></span> Saving…'; btn.style.opacity = '0.7'; btn.style.cursor = 'not-allowed'; }
      try {
        const season = getActiveSeason();
        const trainOn = !!(appConfig && appConfig.aiTrainOnCommit);

        let trainMsg = "";
        if (trainOn) {
          if (btn) btn.innerHTML = '<span class="btn-spinner"></span> Saving to training library…';
          const res = await saveActiveMatchToAiTrainingLibrary();
          if (res.ok) {
            const v = res.example.video || {};
            const vNote = v.type === "youtube" ? "YouTube linked" : (v.type === "file" ? (v.hasLocalBlob ? "local video stored" : "labels only (video not stored)") : "no video");
            trainMsg = "\n\nAI training library: example saved (" + aiTrainingLibrary.length + " total · " + vNote + ").";
            if (appConfig.autoClipEnabled) {
              if (btn) btn.innerHTML = '<span class="btn-spinner"></span> Cutting training clips…';
              const clipStatus = await postMatchToClipServer(res.example);
              if (clipStatus) trainMsg += "\n" + clipStatus;
            }
          } else if (res.reason === "storage_full") {
            trainMsg = "\n\nWarning: could not save to AI training library (storage full). Match stats were still committed.";
          }
        }

        season.matches.push({
          id: activeMatch.id,
          wrestlerId: activeMatch.wrestlerId,
          boutId: activeMatch.boutId,
          opponent: activeMatch.opponent,
          level: activeMatch.level,
          date: activeMatch.date,
          weightClass: activeMatch.weightClass || null,
          rosterWeightClass: activeMatch.rosterWeightClass || null,
          source: "manual"
        });
        season.events.push(...activeMatch.events);
        activeMatch = null;
        commitManualInFlight = false;
        persist();
        if (trainMsg) {
          alert("Match committed to stats." + trainMsg);
        }
        switchTab("sheet");
      } catch (err) {
        alert("Error committing match: " + (err.message || err));
        commitManualInFlight = false;
        if (btn) { btn.disabled = false; btn.innerHTML = btnOriginalHTML || "Save & Commit Match to Stats"; btn.style.opacity = ''; btn.style.cursor = ''; }
      }
    }

    function deleteMatch(matchId) {
      const season = getActiveSeason();
      const match = (season.matches || []).find(m => m.id === matchId);
      if (!match) return;
      const boutForMatch = (season.bouts || []).find(b => b.id === match.boutId);
      if (boutForMatch && boutForMatch.finalized) {
        alert("This event is finalized. Reopen the dual from the Bout Sheet before deleting matches.");
        return;
      }
      const w = season.roster.find(r => r.id === match.wrestlerId);
      const eventCount = (season.events || []).filter(e => e.matchId === matchId).length;
      const label = w ? w.name : "this wrestler";
      const msg =
        `Delete match for ${label} vs ${match.opponent || "Opponent"}?\n\n` +
        `This will permanently remove the match and ${eventCount} scoring event(s). ` +
        `Stats derived from this match will no longer appear on the Stats page.`;
      if (!confirm(msg)) return;

      const deletedMeta = {
        wrestlerName: w ? w.name : "",
        opponent: match.opponent || "",
        date: match.date || ""
      };
      // Training library examples that reference this season match id (if stored)
      const orphanTrainIds = (aiTrainingLibrary || [])
        .filter(ex => ex && (ex.seasonMatchId === matchId || (ex.events || []).some(ev => ev && ev.matchId === matchId)))
        .map(ex => ex.id);

      season.matches = (season.matches || []).filter(m => m.id !== matchId);
      season.events = (season.events || []).filter(e => e.matchId !== matchId);
      if (activeMatch && activeMatch.id === matchId) activeMatch = null;
      viewingMatchId = null;
      activeModal = null;

      // Soft-delete related training examples so manifest/clips stay aligned
      if (orphanTrainIds.length) {
        aiTrainingLibrary = (aiTrainingLibrary || []).filter(ex => !orphanTrainIds.includes(ex.id));
        orphanTrainIds.forEach(id => {
          try { idbDeleteTrainingVideo(id); } catch (e) {}
          notifyClipServerMatchDeleted(id, deletedMeta);
        });
      }
      // Also notify by season match id (clip server may key either way)
      notifyClipServerMatchDeleted(matchId, deletedMeta);

      persist();
      render();
    }

    function formatEventLogLine(e) {
      const dir = e.direction === "offense" ? "Off" : "Def";
      const od = formatOutcomeDisplay(e);
      const pts = od.pointsHtml ? ` ${od.pointsHtml}` : "";
      const detail = e.detail ? ` · ${e.detail}` : "";
      const tiePlain = formatModifiersPlainForEvent(e) || e.tie || "";
      const tie = tiePlain ? ` [${tiePlain}]` : "";
      return `${e.period || "—"} · ${dir} · ${e.category || ""} · ${e.move || ""}${detail}${tie} · ${od.label}${pts} · ${e.timestamp || ""}`;

    function finalizeDualMeet(ourPts, oppPts) {
      if (guardSeasonLocked("finalizing dual meets")) return;
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      if (!activeBout || activeBout.type !== "Dual") return alert("Only dual meets can be finalized to the dual team record.");

      if (activeBout.finalized) {
        if (!confirm("This dual was already finalized. Re-finalizing will overwrite the previous dual-record contribution for this bout with the current team score. Continue?")) return;
      }

      const rec = activeBout.division === "Girls" 
        ? (season.girlsDualRecord || (season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 }))
        : (season.boysDualRecord || (season.boysDualRecord = { wins: 0, losses: 0, ties: 0 }));

      // Undo previous finalize contribution so re-finalize overwrites instead of double-counting
      if (activeBout.finalized && activeBout.finalizedSnapshot) {
        const prev = activeBout.finalizedSnapshot;
        if (prev.outcome === "win") rec.wins = Math.max(0, (rec.wins || 0) - 1);
        else if (prev.outcome === "loss") rec.losses = Math.max(0, (rec.losses || 0) - 1);
        else if (prev.outcome === "tie") rec.ties = Math.max(0, (rec.ties || 0) - 1);
      }

      let outcome = "tie";
      if (ourPts > oppPts) {
        rec.wins = (rec.wins || 0) + 1;
        outcome = "win";
      } else if (oppPts > ourPts) {
        rec.losses = (rec.losses || 0) + 1;
        outcome = "loss";
      } else {
        rec.ties = (rec.ties || 0) + 1;
        outcome = "tie";
      }

      activeBout.finalized = true;
      activeBout.finalizedSnapshot = { ourPts, oppPts, outcome, at: Date.now() };
      persist();
      alert(`Dual Meet Finalized (${outcome.toUpperCase()} ${ourPts}-${oppPts}). Season dual record updated.`);
      render();
    }

    function reopenDualMeet() {
      if (guardSeasonLocked("reopening dual meets")) return;
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      if (!activeBout || activeBout.type !== "Dual") return;
      if (!activeBout.finalized) return alert("This dual is not finalized.");
      if (!confirm("Reopen this dual meet?\n\nThis will reverse its contribution to the season dual record so you can edit matches and re-finalize later.")) return;
      reverseDualRecordContribution(season, activeBout);
      activeBout.finalized = false;
      activeBout.finalizedSnapshot = null;
      persist();
      alert("Dual meet reopened. You can score or edit matches and finalize again when ready.");
      render();
    }

    /* CALGRAPPLER EXPANDED STAT SHEET */
    function renderCalGrapplerExpandedSheet() {
      const season = getActiveSeason();
      const activeBout = getActiveBout();

      const divisionOk = (div) => {
        if (expandedSheetDivision === "Both") return true;
        return (div || "Boys") === expandedSheetDivision;
      };
      const levelOk = (lvl) => {
        const L = lvl || "Varsity";
        if (expandedSheetLevel === "All") return true;
        if (expandedSheetLevel === "Both") return L === "Varsity" || L === "JV";
        if (expandedSheetLevel === "Exh") return L === "Exh" || L === "Exhibition";
        return L === expandedSheetLevel;
      };

      // All matches for active bout matching filters (supports duplicate weights + Exh)
      let matches = (season.matches || []).filter(m => {
        if (store.activeBoutId !== "all" && m.boutId !== store.activeBoutId) return false;
        if (!levelOk(m.level)) return false;
        const w = season.roster.find(r => r.id === m.wrestlerId);
        if (w && !divisionOk(w.division)) return false;
        if (!w && activeBout && !divisionOk(activeBout.division)) return false;
        return true;
      });

      matches = matches.map(m => {
        const ourW = season.roster.find(r => r.id === m.wrestlerId);
        const wt = ourW ? Number(ourW.weightClass) || 0 : 0;
        return { ...m, ourW, sortWt: wt };
      }).sort((a, b) => {
        if (a.sortWt !== b.sortWt) return a.sortWt - b.sortWt;
        const rank = (lvl) => {
          const L = String(lvl || "Varsity").toLowerCase();
          if (L === "varsity") return 0;
          if (L === "jv") return 1;
          if (L === "exh" || L === "exhibition") return 2;
          return 3;
        };
        const ra = rank(a.level), rb = rank(b.level);
        if (ra !== rb) return ra - rb;
        const na = (a.ourW && a.ourW.name) || "";
        const nb = (b.ourW && b.ourW.name) || "";
        return na.localeCompare(nb);
      });

      // For dual meets, inject automatic Varsity forfeit slots at weights with no scored match
      if (activeBout && activeBout.type === "Dual" && (expandedSheetLevel === "Varsity" || expandedSheetLevel === "Both" || expandedSheetLevel === "All")) {
        const weights = (activeBout.division === "Girls") ? (weightClasses.Girls || []) : (weightClasses.Boys || []);
        const covered = new Set(
          matches
            .filter(m => (m.level || "Varsity") === "Varsity")
            .map(m => String(m.ourW ? m.ourW.weightClass : (m.assignedWeight || "")))
        );
        weights.forEach(wt => {
          if (covered.has(String(wt))) return;
          const ourW = (season.roster || []).find(w =>
            String(w.weightClass) === String(wt) &&
            w.level === "Varsity" &&
            (expandedSheetDivision === "Both" || (w.division || "Boys") === expandedSheetDivision || (activeBout.division === w.division))
          );
          // Prefer active bout division filter
          const ourAtWt = (season.roster || []).find(w =>
            String(w.weightClass) === String(wt) &&
            (w.level || "Varsity") === "Varsity" &&
            (w.division || "Boys") === (activeBout.division || "Boys")
          );
          const oppAtWt = activeBout.opponentRoster
            ? activeBout.opponentRoster.find(o => String(o.weightClass) === String(wt))
            : null;
          // Only inject true auto-forfeit situations (one or both sides missing an athlete)
          if (ourAtWt && oppAtWt) return;
          matches.push({
            id: null,
            isAutoForfeit: true,
            level: "Varsity",
            ourW: ourAtWt || null,
            sortWt: Number(wt) || 0,
            autoWeight: String(wt),
            autoOpp: oppAtWt || null
          });
        });
        // Re-sort after injection
        matches.sort((a, b) => {
          if (a.sortWt !== b.sortWt) return a.sortWt - b.sortWt;
          const rank = (lvl) => {
            const L = String(lvl || "Varsity").toLowerCase();
            if (L === "varsity") return 0;
            if (L === "jv") return 1;
            if (L === "exh" || L === "exhibition") return 2;
            return 3;
          };
          const ra = rank(a.level), rb = rank(b.level);
          if (ra !== rb) return ra - rb;
          const na = (a.ourW && a.ourW.name) || "";
          const nb = (b.ourW && b.ourW.name) || "";
          return na.localeCompare(nb);
        });
      }

      let cumHomeTeamPts = 0;
      let cumOppTeamPts = 0;

      const rows = matches.length === 0
        ? `<tr><td colspan="9" style="text-align:center; color:var(--muted); padding:16px;">No matches match these filters.</td></tr>`
        : matches.map(m => {
            // Auto-forfeit synthetic rows (no scored match at weight)
            if (m.isAutoForfeit) {
              const wt = m.autoWeight || "—";
              const ourW = m.ourW;
              const oppW = m.autoOpp;
              let resultLabel = "—";
              let dualOur = 0, dualOpp = 0;
              if (!ourW && !oppW) {
                resultLabel = "DOUBLE FORFEIT";
                dualOur = 0; dualOpp = 0;
              } else if (!ourW && oppW) {
                resultLabel = "LOSS (Forfeit)";
                dualOur = 0; dualOpp = 6;
              } else if (ourW && !oppW) {
                resultLabel = "WIN (Forfeit)";
                dualOur = 6; dualOpp = 0;
              } else {
                // both listed but unscored — show placeholder, no dual points yet
                resultLabel = "—";
              }
              let homeDualPt = "—", oppDualPt = "—";
              if (resultLabel !== "—") {
                if (dualOur > 0) {
                  cumHomeTeamPts += dualOur;

                }
                if (dualOpp > 0) {
                  cumOppTeamPts += dualOpp;
                  oppDualPt = String(cumOppTeamPts);
                }
                if (resultLabel === "DOUBLE FORFEIT") {
                  homeDualPt = String(cumHomeTeamPts);
                  oppDualPt = String(cumOppTeamPts);

              }
              return `
          <tr>
            <td style="text-align:center; font-weight:800;">${wt}</td>
            <td>
              <strong>Home:</strong> ${ourW ? ourW.name : 'FORFEIT'}
              <span style="color:var(--muted); font-size:10px;"> (Varsity)</span>
              <br/><strong>Visitor:</strong> ${oppW ? oppW.name : 'FORFEIT'}
            </td>
            <td style="text-align:center;">—</td>
            <td style="text-align:center;">—</td>
            <td style="text-align:center;">—</td>
            <td style="text-align:center; font-weight:700;">${resultLabel}</td>
            <td style="text-align:center;">${resultLabel === "—" ? "—" : resultLabel}</td>
            <td style="text-align:center; font-weight:700; color:var(--green);">${homeDualPt}</td>
            <td style="text-align:center; font-weight:700; color:var(--red);">${oppDualPt}</td>
          </tr>`;
            }

            const ourW = m.ourW;
            const weight = ourW ? ourW.weightClass : "—";
            const level = m.level || "Varsity";
            const countsTeamPts = level === "Varsity"; // JV / Exh do not add dual points

            let p1Score = "—", p2Score = "—", p3Score = "—", fallTime = "—", matchScore = "—";
            let homeDualPt = "", oppDualPt = "";

            const matchEvs = season.events.filter(e => e.matchId === m.id);

            const symbolMap = (e) => {
              const who = e.direction === "offense" ? "H" : "V";
              if (e.category === "Choice") return `[${who}:${e.detail || e.move}]`;
              let sym = "T3";
              if (e.category === "Escape") sym = "E1";
              else if (e.category === "Reversal") sym = "R2";
              else if (e.detail && e.detail.includes("2-Point")) sym = "N2";
              else if (e.detail && e.detail.includes("3-Point")) sym = "N3";
              else if (e.detail && e.detail.includes("4-Point")) sym = "N4";
              else if (isPinLikeEvent(e)) sym = "FALL";
              else if (isPenaltyCategory(e.category)) sym = e.points === 2 ? "P2" : "P1";
              else if (e.category === "Turns" && e.detail && e.detail.includes("Point")) {
                if (e.detail.includes("2")) sym = "N2";
                else if (e.detail.includes("3")) sym = "N3";
                else if (e.detail.includes("4")) sym = "N4";
              }
              return `${who}:${sym}`;
            };

            const filterPeriodEvents = (p) => matchEvs.filter(e => {
              if (e.period !== p) return false;
              if (e.category === "Choice") return true;
              if (isPenaltyCategory(e.category)) return true;
              if (e.direction === "offense" && e.outcome === "success") return true;
              if (e.direction === "defense" && e.outcome === "fail") return true;
              if (isPinLikeEvent(e)) return true;
              return false;
            });

            const fmtPeriod = (p) => {
              const pe = filterPeriodEvents(p);
              if (!pe.length) return "—";
              return pe.map(symbolMap).join(" ");
            };
            p1Score = fmtPeriod("P1");
            p2Score = fmtPeriod("P2");
            p3Score = fmtPeriod("P3");

            const r = classifyMatchResult(matchEvs);
            const ourP = r.ourP, oppP = r.oppP;
            const pinEv = r.pinEv;

            if (r.method === "pin" && r.result === "win") {
              fallTime = (pinEv && pinEv.timestamp) || "FALL";
              matchScore = "FALL";
            } else if (r.method === "pin" && r.result === "loss") {
              fallTime = (pinEv && pinEv.timestamp) || "DEF FALL";
              matchScore = "FALL";
            } else if (r.method === "forfeit" || r.method === "dq") {
              fallTime = r.method === "dq" ? "DQ" : "FORF";
              matchScore = r.result === "win" ? (r.method === "dq" ? "DQ WIN" : "FORFEIT WIN") : (r.method === "dq" ? "DQ LOSS" : "FORFEIT LOSS");
            } else if (r.result === "tie") {
              matchScore = `${ourP} - ${oppP} TIE`;
            } else {
              matchScore = `${ourP} - ${oppP}`;
            }

            if (countsTeamPts) {
              if (r.dualPtsOur > 0) {
                cumHomeTeamPts += r.dualPtsOur;
                homeDualPt = String(cumHomeTeamPts);
              }
              if (r.dualPtsOpp > 0) {
                cumOppTeamPts += r.dualPtsOpp;
                oppDualPt = String(cumOppTeamPts);
              }
            } else {
              homeDualPt = "—";
              oppDualPt = "—";
            }

            return `
          <tr style="cursor:pointer;" title="View match log" onclick="openMatchLog('${m.id}')">
            <td style="text-align:center; font-weight:800;">${weight}</td>
            <td>
              <strong>Home:</strong> ${ourW ? ourW.name : 'Unknown'}

            <td>${p2Score}</td>
            <td>${p3Score}</td>
            <td style="text-align:center; font-weight:700;">${fallTime}</td>
            <td style="text-align:center; font-weight:800;">${matchScore}</td>
            <td style="text-align:center; font-weight:800; color:var(--green);">${homeDualPt}</td>
            <td style="text-align:center; font-weight:800; color:var(--red);">${oppDualPt}</td>
          </tr>
        `;
          }).join("");

      const filterNote = `Level: ${expandedSheetLevel} · Division: ${expandedSheetDivision} · ${matches.length} match(es)`;

      return `
        <div style="overflow-x:auto;">
          <div style="font-size:11px; color:var(--muted); margin-bottom:8px;">${filterNote} · Duplicate weights listed separately · Exh/JV show no dual points</div>
          <table class="cg-table">
            <thead>

            </tbody>

            <div><strong>REVERSAL</strong> - R2</div>
            <div><strong>ESCAPE</strong> - E1</div>
            <div><strong>NEAR FALL</strong> - N2, N3, N4</div>
            <div><strong>PENALTY</strong> - P1, P2</div>

    }


    /* FULL SYMMETRIC STATS & TRAINING PLAN */

    function computeModifierAnalytics(wrestlerId) {
      const season = getActiveSeason();
      if (!season) return { our: [], opp: [] };
      const wEvents = (season.events || []).filter(e => {
        if (wrestlerId && e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId && store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        if (e.category === "Choice" || e.category === "Flow" || e.category === "Riding Time") return false;
        return true;
      });
      const buckets = {};
      const ensure = (side, kind, name) => {
        const key = side + "|" + kind + "|" + name;
        if (!buckets[key]) buckets[key] = { side, kind, name, attempts: 0, success: 0 };
        return buckets[key];
      };
      wEvents.forEach(e => {
        const mod = parseEventModifiers(e);
        const success = e.outcome === "success";
        const addList = (side, kind, arr) => {
          (arr || []).forEach(n => {
            if (!n) return;
            const b = ensure(side, kind, String(n));
            b.attempts += 1;
            if (success) b.success += 1;
          });
        };
        if (!mod) return;
        const opp = mod.opp || {};
        const our = mod.our || {};
        addList("opp", "tie", opp.ties);
        addList("opp", "finish", opp.finishes);
        addList("opp", "ride", opp.rides);
        addList("our", "tie", our.ties);
        addList("our", "finish", our.finishes);
        addList("our", "ride", our.rides);
      });
      const list = Object.values(buckets).map(b => ({
        side: b.side,
        kind: b.kind,
        name: b.name,
        attempts: b.attempts,
        success: b.success,
        rate: b.attempts ? Math.round((b.success / b.attempts) * 100) : 0
      })).sort((a, b) => b.attempts - a.attempts);
      return {
        our: list.filter(x => x.side === "our"),
        opp: list.filter(x => x.side === "opp")
      };
    }

    function computeStatsWithTieBreakdown(wrestlerId) {
      const season = getActiveSeason();
      const wEvents = season.events.filter(e => {
        if (e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        return true;
      });

      const offense = {}, defense = {};

      wEvents.forEach(e => {
        // Period changes and position choices are excluded from efficiency
        if (e.category === "Choice" || e.category === "Flow") return;
        const bucket = e.direction === "offense" ? offense : defense;

        function addToBucket(category, move, success, tie) {
          const key = `${category}::${move}`;
          if (!bucket[key]) {
            bucket[key] = { move: move, category: category, attempts: 0, success: 0, ties: {} };
          }
          bucket[key].attempts += 1;
          if (success) bucket[key].success += 1;
          const tieKey = tie || "Open / Unspecified Tie";
          if (!bucket[key].ties[tieKey]) {
            bucket[key].ties[tieKey] = { tie: tieKey, attempts: 0, success: 0 };
          }
          bucket[key].ties[tieKey].attempts += 1;
          if (success) bucket[key].ties[tieKey].success += 1;
        }

        const isSuccess = e.outcome === "success";
        addToBucket(e.category, e.move, isSuccess, formatModifiersPlainForEvent(e) || e.tie);

        // Near falls scored off a turn also appear under Near Fall / Pin on the stat sheet
        if (e.category === "Turns" && e.detail) {
          const d = e.detail;
          if (d.includes("Point NF") || d.includes("Point Exposure") || d === "Pin / Fall" || d === "Pin") {
            const nfMove = d.includes("2-Point") ? (d.includes("Exposure") ? "2-Point Exposure" : "2-Point NF")
              : d.includes("3-Point") ? "3-Point NF"
              : d.includes("4-Point") ? (d.includes("Exposure") ? "4-Point Exposure" : "4-Point NF")
              : (d === "Pin / Fall" || d === "Pin" ? "Pin / Fall" : d);
            // For turns, success on offense = we scored NF; fail on defense = they scored NF on us
            // Defended turn (detail Defended) should not count as NF scored
            if (d === "Defended" || d === "Failed") {
              // skip NF dual-count
            } else {
              const nfSuccess = (e.direction === "offense" && e.outcome === "success")
                || (e.direction === "defense" && e.outcome === "fail");
              // Represent attempt: for defense faced NF, outcome is fail → still an "attempt" they succeeded
              // Keep success flag aligned with whether the NF was scored by that side's actor
              addToBucket("Near Fall / Pin", nfMove, e.direction === "offense" ? isSuccess : (e.outcome === "fail"), e.move || e.tie);
            }
          }
        }
      });

      const format = obj => Object.values(obj).map(r => ({
        ...r,
        rate: Math.round((r.success / r.attempts) * 100),
        tieList: Object.values(r.ties).map(t => ({
          ...t,
          rate: Math.round((t.success / t.attempts) * 100)
        })).sort((a,b) => b.attempts - a.attempts)
      })).sort((a,b) => b.attempts - a.attempts);

      return { offense: format(offense), defense: format(defense) };
    }

        if (e.category === "Turns" && e.detail) {

              : d.includes("3-Point") ? "3-Point NF"
              : d.includes("4-Point") ? (d.includes("Exposure") ? "4-Point Exposure" : "4-Point NF")
              : (d === "Pin / Fall" || d === "Pin" ? "Pin / Fall" : d);
            // For turns, success on offense = we scored NF; fail on defense = they scored NF on us
            // Defended turn (detail Defended) should not count as NF scored
            if (d === "Defended" || d === "Failed") {

            } else {

                || (e.direction === "defense" && e.outcome === "fail");
              // Represent attempt: for defense faced NF, outcome is fail → still an "attempt" they succeeded
              // Keep success flag aligned with whether the NF was scored by that side's actor
              addToBucket("Near Fall / Pin", nfMove, e.direction === "offense" ? isSuccess : (e.outcome === "fail"), e.move || e.tie);
            }
          }
        }
      });

      const format = obj => Object.values(obj).map(r => ({
        ...r,
        rate: Math.round((r.success / r.attempts) * 100),
        tieList: Object.values(r.ties).map(t => ({
          ...t,
          rate: Math.round((t.success / t.attempts) * 100)
        })).sort((a,b) => b.attempts - a.attempts)
      })).sort((a,b) => b.attempts - a.attempts);

      return { offense: format(offense), defense: format(defense) };
    }

    
    function getMoveGroupMeta(move, category) {
      const group = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS[category];
      if (group && !Array.isArray(group) && typeof group === "object") {
        for (const sub of Object.keys(group)) {
          if ((group[sub] || []).includes(move)) {
            return { groupKey: `${category}::${sub}`, header: `${category} · ${sub}`, sortCat: category, sortSub: sub };
          }
        }
        return { groupKey: `${category}::Other`, header: `${category} · Other`, sortCat: category, sortSub: "ZZZ" };
      }
      const cat = category || "Other";
      return { groupKey: cat, header: cat, sortCat: cat, sortSub: "" };
    }

    function taxonomyCategoryOrder() {
      return Object.keys(taxonomy.MOVE_GROUPS || {});
    }

    function taxonomySubOrder(cat) {
      const val = taxonomy.MOVE_GROUPS[cat];
      if (val && !Array.isArray(val) && typeof val === "object") return Object.keys(val);
      return [];
    }

    function groupStatsRowsByCategory(rows) {
      const catOrder = taxonomyCategoryOrder();
      const groups = new Map();
      rows.forEach(r => {
        const meta = getMoveGroupMeta(r.move, r.category);
        if (!groups.has(meta.groupKey)) {
          groups.set(meta.groupKey, { ...meta, rows: [] });
        }
        groups.get(meta.groupKey).rows.push(r);
      });
      const list = Array.from(groups.values());
      list.sort((a, b) => {
        const ai = catOrder.indexOf(a.sortCat);
        const bi = catOrder.indexOf(b.sortCat);
        const aRank = ai === -1 ? 999 : ai;
        const bRank = bi === -1 ? 999 : bi;
        if (aRank !== bRank) return aRank - bRank;
        const subA = taxonomySubOrder(a.sortCat);
        const subB = taxonomySubOrder(b.sortCat);
        const asi = subA.indexOf(a.sortSub);
        const bsi = subB.indexOf(b.sortSub);
        const aSub = asi === -1 ? 999 : asi;
        const bSub = bsi === -1 ? 999 : bsi;
        if (aSub !== bSub) return aSub - bSub;
        return a.header.localeCompare(b.header);
      });
      return list;
    }

    function formatProfIndex(v) {
      if (v == null || isNaN(v)) return "0";
      const n = Number(v);
      const abs = Math.abs(n);
      const body = abs >= 10 ? abs.toFixed(1) : abs.toFixed(2);
      if (n > 0) return `+${body}`;
      if (n < 0) return `-${body}`;
      return "0.00";
    }

    // Proficiency color bands: < -0.15 red · -0.15 to < 0.25 gold · ≥ 0.25 green
    function profColor(pct) {
      const n = Number(pct) || 0;
      if (n < -0.15) return "var(--red)";
      if (n >= 0.25) return "var(--green)";
      return "var(--gold)";
    }

    function getShotMoveList() {
      const td = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS.Takedown;
      if (td && td.Shots && Array.isArray(td.Shots)) return td.Shots.slice();
      return ["Single Leg", "Double Leg", "High Crotch", "Ankle Pick", "Fireman's Carry", "Dresser Dump"];
    }

    /** Shot % = successful offensive shots / total offensive shots × 100 (Takedown → Shots). */
    function computeShotPercentage(targetWrestlerId = null) {
      const season = getActiveSeason();
      const shotMoves = new Set(getShotMoveList());
      const events = (season.events || []).filter(e => {
        if (targetWrestlerId && e.wrestlerId !== targetWrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        if (e.category !== "Takedown") return false;
        if (e.direction !== "offense") return false;
        if (!shotMoves.has(e.move)) return false;
        return true;
      });
      const taken = events.length;
      const success = events.filter(e => e.outcome === "success").length;
      const pct = taken ? Math.round((success / taken) * 100) : null;
      return { taken, success, pct };
    }

    function rateColorPct(rate) {
      if (rate == null || isNaN(rate)) return "var(--muted)";
      if (rate >= 60) return "var(--green)";
      if (rate < 40) return "var(--red)";
      return "var(--gold)";
    }

    function computePositionalProficiency(targetWrestlerId = null) {
      const season = getActiveSeason();
      const targetMatches = season.matches.filter(m => {
        if (targetWrestlerId && m.wrestlerId !== targetWrestlerId) return false;
        if (store.activeBoutId !== "all" && m.boutId !== store.activeBoutId) return false;
        return true;
      });

      let neutral = { opps: 0, successes: 0, failures: 0 };
      let top = { opps: 0, successes: 0, failures: 0 };
      let bottom = { opps: 0, successes: 0, failures: 0 };
      let choices = { neutral: 0, top: 0, bottom: 0, defer: 0 };

      targetMatches.forEach(m => {
        const mEvs = season.events
          .filter(e => e.matchId === m.id)
          .sort((a, b) => (a.ts || 0) - (b.ts || 0));

        neutral.opps += 1;

        mEvs.forEach(e => {
          if (e.category === "Choice" && e.direction === "offense") {
            const pos = e.detail;
            if (pos === "Neutral") choices.neutral += 1;
            else if (pos === "Top") choices.top += 1;
            else if (pos === "Bottom") choices.bottom += 1;
            else if (pos === "Defer") choices.defer += 1;
          }

          if (e.category === "Flow" && e.detail === "OT") {
            neutral.opps += 1;
          }

          if (e.category === "Choice") {
            const isHomeChoice = e.move.includes("Home");
            const pos = e.detail;

            if (pos === "Neutral") {
              neutral.opps += 1;
            } else if (pos === "Top") {
              if (isHomeChoice) top.opps += 1;
              else bottom.opps += 1;
            } else if (pos === "Bottom") {
              if (isHomeChoice) bottom.opps += 1;
              else top.opps += 1;
            }
          }

          if (e.category === "Takedown") {
            if (e.direction === "offense" && e.outcome === "success") {
              neutral.successes += 1;
              top.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              neutral.failures += 1;
              bottom.opps += 1;
            }
          }

          if (e.category === "Escape") {
            if (e.direction === "offense" && e.outcome === "success") {
              bottom.successes += 1;
              neutral.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              top.failures += 1;
              neutral.opps += 1;
            }
          }

          if (e.category === "Reversal") {
            if (e.direction === "offense" && e.outcome === "success") {
              bottom.successes += 1;
              top.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              top.failures += 1;
              bottom.opps += 1;
            }
          }

          if (e.category === "Near Fall / Pin" || e.category === "Turns") {
            if (e.direction === "offense" && e.outcome === "success") {
              top.successes += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              bottom.failures += 1;
            }
          }
        });
      });

      // Net index typically in [-1, +1]; can exceed +1 when successes > opportunities
      const calcIndex = (s, f, opp) => opp > 0 ? Math.round(((s - f) / opp) * 100) / 100 : 0;

      return {
        neutral: { ...neutral, pct: calcIndex(neutral.successes, neutral.failures, neutral.opps) },
        top: { ...top, pct: calcIndex(top.successes, top.failures, top.opps) },
        bottom: { ...bottom, pct: calcIndex(bottom.successes, bottom.failures, bottom.opps) },
        choices
      };
    }

    /* LEADERBOARD ENGINE (Places 1-3) */
    function formatTiedNames(athletes) {
      if (athletes.length === 0) return "—";
      if (athletes.length > 3) return "More than three";
      return athletes.map(a => `${a.name} (${a.weightClass} lbs)`).join(", ");
    }

    function buildLeaderboardPodium(items, valColor) {
      if (!items || items.length === 0) {
        return '<p style="font-size:11px; color:var(--muted); padding:4px 0;">No athlete records logged.</p>';
      }

      const numColor = valColor || "var(--green)";

      // Group into distinct ranks
      const scoreMap = new Map();
      items.forEach(item => {
        if (!scoreMap.has(item.val)) scoreMap.set(item.val, []);
        scoreMap.get(item.val).push(item);
      });

      const sortedVals = Array.from(scoreMap.keys()).sort((a, b) => b - a);
      const medals = ["🥇 1st", "🥈 2nd", "🥉 3rd"];
      const rows = [];

      for (let i = 0; i < Math.min(3, sortedVals.length); i++) {
        const val = sortedVals[i];
        const athletes = scoreMap.get(val);
        rows.push(`
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.03);">
            <span style="font-weight:700; color:var(--gold);">${medals[i]}:</span>
            <span style="flex:1; margin:0 8px; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${formatTiedNames(athletes)}</span>
            <span style="font-family:monospace; font-weight:800; color:${numColor};">${athletes[0].displayVal != null ? athletes[0].displayVal : val}</span>
          </div>
        `);
      }

      return rows.join('');
    }

    function getCategoryMoveList(catKey) {
      const group = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS[catKey];
      if (!group) return [];
      if (Array.isArray(group)) return group.slice();
      return Object.values(group).flat();
    }

    function countMoveSuccesses(wrestlerId, category, move, direction, mode) {
      // mode: "success" (default) | "scored_on" (opponent scored on this wrestler)
      const season = getActiveSeason();
      const scoredOn = mode === "scored_on";
      return season.events.filter(e => {
        if (e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        if (e.direction !== direction) return false;

        if (scoredOn) {
          // Events logged as defense where opponent converted (outcome fail) or we were pinned
          if (category === "Pins") {
            return isPinLikeEvent(e);
          }
          if (category === "Near Fall / Pin") {
            const isPin = isPinLikeEvent(e);
            // NF scored on us: defense + fail with NF points, or Near Fall category
            const isNf = (e.category === "Near Fall / Pin" || e.category === "Turns") && !isPin;
            if (!isNf) return false;
            if (e.outcome !== "fail") return false;
            if (move && e.move !== move && e.detail !== move) return false;
            return true;
          }
          // Generic: opponent scored this category on us
          if (e.category !== category) return false;
          if (e.outcome !== "fail") return false;
          if (move && e.move !== move) return false;
          return true;
        }

        if (e.outcome !== "success") return false;
        if (category === "Pins") {
          return isPinLikeEvent(e);
        }
        if (category === "Near Fall / Pin") {
          const isPin = isPinLikeEvent(e);
          return e.category === "Near Fall / Pin" && !isPin && (!move || e.move === move);
        }
        if (isPenaltyCategory(category) || category === "Penalty/DQ") {
          return isPenaltyCategory(e.category) && (!move || e.move === move);
        }
        return e.category === category && (!move || e.move === move);
      }).length;
    }

    function buildLeadersForMetric(athletes, getVal, formatVal) {
      const items = [];
      athletes.forEach(w => {
        const val = getVal(w);
        if (val > 0 || (typeof val === "number" && !isNaN(val) && formatVal)) {
          // for proficiency formatVal is set and we filter by opps outside
          if (val === 0 && !formatVal) return;
          const item = { ...w, val };
          if (formatVal) item.displayVal = formatVal(val);
          items.push(item);
        }
      });
      return items;
    }

    function renderLeaderboardView() {
      const season = getActiveSeason();
      const filteredAthletes = season.roster.filter(w => leaderboardDivision === "All" || w.division === leaderboardDivision);
      const isOff = leaderboardSide === "offense";
      // Offense = our scoring success. Scored On = opponent converted against us (defense + fail).
      const dir = isOff ? "offense" : "defense";
      const countMode = isOff ? "success" : "scored_on";

      const categoryBoxes = isOff
        ? [
            { key: "Takedown", label: "Takedowns (T3)", expandable: true },
            { key: "Escape", label: "Escapes (E1)", expandable: true },
            { key: "Reversal", label: "Reversals (R2)", expandable: true },
            { key: "Near Fall / Pin", label: "Near Fall Exposures", expandable: true },
            { key: "Pins", label: "Pins / Falls", expandable: false },
            { key: "Turns", label: "Turns", expandable: true },
            { key: "ShotPct", label: "Shot %", expandable: false }
          ]
        : [
            { key: "Takedown", label: "Takedowns Scored On", expandable: true },
            { key: "Escape", label: "Escapes Allowed", expandable: true },
            { key: "Reversal", label: "Reversals Allowed", expandable: true },
            { key: "Near Fall / Pin", label: "Near Falls Scored On", expandable: true },
            { key: "Pins", label: "Pins / Falls Scored On", expandable: false },
            { key: "Turns", label: "Turns Scored On", expandable: true }
          ];

      // Aggregate category leaders
      const boxHtml = categoryBoxes.map(box => {
        const leaders = [];
        filteredAthletes.forEach(w => {
          let val = 0;
          if (box.key === "ShotPct") {
            const sp = computeShotPercentage(w.id);
            if (sp.taken >= 2 && sp.pct != null) {
              leaders.push({ ...w, val: sp.pct, displayVal: sp.pct + "% (" + sp.success + "/" + sp.taken + ")" });
            }
            return;
          }
          if (box.key === "Pins") {
            val = countMoveSuccesses(w.id, "Pins", null, dir, countMode);
          } else if (box.key === "Near Fall / Pin") {
            val = countMoveSuccesses(w.id, "Near Fall / Pin", null, dir, countMode);
          } else {
            val = countMoveSuccesses(w.id, box.key, null, dir, countMode);
          }
          if (val > 0) leaders.push({ ...w, val });
        });

        const expanded = leaderboardExpanded === box.key;
        let detailHtml = "";
        if (expanded && box.expandable) {
          const moves = getCategoryMoveList(box.key === "Near Fall / Pin" ? "Near Fall / Pin" : box.key)
            .filter(m => !(box.key === "Near Fall / Pin" && (m.includes("Pin") || m === "Pin / Fall")));
          const moveBlocks = moves.map(move => {
            const mLeaders = [];
            filteredAthletes.forEach(w => {
              const val = countMoveSuccesses(w.id, box.key, move, dir, countMode);
              if (val > 0) mLeaders.push({ ...w, val });
            });
            return `
              <div style="margin-top:8px; padding-top:6px; border-top:1px solid var(--panelLine);">
                <div style="font-size:10px; font-weight:800; color:var(--chalk); margin-bottom:4px;">${move}</div>
                ${buildLeaderboardPodium(mLeaders, isOff ? 'var(--green)' : 'var(--red)')}
              </div>
            `;
          }).join("");
          detailHtml = `
            <div style="margin-top:8px;">
              <div style="font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:4px;">Top 3 by move</div>
              ${moveBlocks || '<p style="font-size:11px; color:var(--muted);">No individual move data.</p>'}
            </div>
          `;
        }

        return `
          <div style="background:var(--mat); border:1px solid ${expanded ? 'var(--gold)' : 'var(--panelLine)'}; padding:10px; border-radius:6px; cursor:${box.expandable ? 'pointer' : 'default'};"
               ${box.expandable ? `onclick="leaderboardExpanded = (leaderboardExpanded === '${box.key}') ? null : '${box.key}'; render();"` : ""}>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase;">${box.label}</div>
              ${box.expandable ? `<span style="font-size:10px; color:var(--muted);">${expanded ? '▲ collapse' : '▼ expand'}</span>` : ''}
            </div>
            ${buildLeaderboardPodium(leaders, isOff ? 'var(--green)' : 'var(--red)')}
            ${detailHtml}
          </div>
        `;
      }).join("");

      // Proficiency leaders — offense section only
      let profHtml = "";
      if (isOff) {
        const neutralProfLeader = [];
        const topProfLeader = [];
        const bottomProfLeader = [];
        filteredAthletes.forEach(w => {
          const prof = computePositionalProficiency(w.id);
          if (prof.neutral.opps >= 2) neutralProfLeader.push({ ...w, val: prof.neutral.pct, displayVal: formatProfIndex(prof.neutral.pct) });
          if (prof.top.opps >= 2) topProfLeader.push({ ...w, val: prof.top.pct, displayVal: formatProfIndex(prof.top.pct) });
          if (prof.bottom.opps >= 2) bottomProfLeader.push({ ...w, val: prof.bottom.pct, displayVal: formatProfIndex(prof.bottom.pct) });
        });
        profHtml = `
          <div style="background:var(--mat); border:1px solid var(--panelLine); padding:10px; border-radius:6px;">
            <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">Neutral Proficiency</div>
            ${buildLeaderboardPodium(neutralProfLeader)}
          </div>
          <div style="background:var(--mat); border:1px solid var(--panelLine); padding:10px; border-radius:6px;">
            <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">Top Proficiency</div>
            ${buildLeaderboardPodium(topProfLeader)}
          </div>
          <div style="background:var(--mat); border:1px solid var(--panelLine); padding:10px; border-radius:6px;">
            <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">Bottom Proficiency</div>
            ${buildLeaderboardPodium(bottomProfLeader)}
          </div>
        `;
      }

      return `
        <div style="display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;">
          <button class="btn" style="padding:6px 12px; font-size:11px; font-weight:800; background:${isOff ? 'var(--green)' : 'var(--mat)'}; color:var(--chalk); border:1px solid var(--panelLine);"

            ${isOff ? 'Leaders for scoring success · includes Shot % · click a category to expand' : 'Times opponent scored on your wrestler · click a category to expand move leaders'}

        </div>
        <div class="grid-2">
          ${boxHtml}
          ${profHtml}
        </div>
      `;

    /* Ranks a wrestler against same-division teammates for a specific move */
    function getMoveTeamRank(wrestler, move, direction) {
      const season = getActiveSeason();
      const sameDivision = season.roster.filter(w => w.division === wrestler.division);

      const totals = sameDivision.map(w => {
        const evs = season.events.filter(e =>
          e.wrestlerId === w.id &&
          e.move === move &&
          e.direction === direction &&
          (store.activeBoutId === "all" || e.boutId === store.activeBoutId)
        );
        const attempts = evs.length;
        const success = evs.filter(e => e.outcome === "success").length;
        return { id: w.id, attempts, rate: attempts ? success / attempts : -1 };
      }).filter(t => t.attempts > 0);

      totals.sort((a, b) => b.rate - a.rate || b.attempts - a.attempts);
      return totals.findIndex(t => t.id === wrestler.id);
    }

    function medalForRank(rank) {
      if (rank === 0) return "🥇";
      if (rank === 1) return "🥈";
      if (rank === 2) return "🥉";
      return "";
    }

      const scopedMatches = statsShowTeam

    function collectHallOfFameEntries() {
      const entries = [];
      awards.forEach(aw => {
        const list = Array.isArray(aw.assignments) ? aw.assignments : [];
        list.forEach(a => {
          entries.push({
            year: a.year || "Unknown",
            style: a.style || "Folkstyle",
            awardName: aw.name,
            icon: aw.icon,
            wrestlerName: a.wrestlerName || "Unknown Athlete",
            weightClass: a.weightClass || "",
            division: a.division || "",
            seasonName: a.seasonName || ""
          });
        });
      });
      return entries;
    }

    function getHallOfFameYears() {
      const years = Array.from(new Set(collectHallOfFameEntries().map(e => e.year)));
      years.sort((a, b) => {
        const ay = parseInt(String(a).match(/20\d{2}/)?.[0] || "0", 10);
        const by = parseInt(String(b).match(/20\d{2}/)?.[0] || "0", 10);
        return by - ay;
      });
      return years;
    }

    function renderHallOfFameView() {
      let entries = collectHallOfFameEntries();
      if (hallOfFameYearFilter && hallOfFameYearFilter !== "all") {
        entries = entries.filter(e => e.year === hallOfFameYearFilter);
      }
      if (hallOfFameStyleFilter && hallOfFameStyleFilter !== "all") {
        entries = entries.filter(e => (e.style || "Folkstyle") === hallOfFameStyleFilter);
      }

      if (entries.length === 0) {
        return `<p style="font-size:12px; color:var(--muted);">${hallOfFameYearFilter !== "all" ? "No Hall of Fame entries for this year." : "No awards have been assigned yet. Create awards in Admin and click them to assign athletes — they will appear here by year and wrestling style."}</p>`;
      }

      const STYLE_ORDER = ["Folkstyle", "Freestyle", "Greco"];
      const byYear = new Map();
      entries.forEach(e => {
        if (!byYear.has(e.year)) byYear.set(e.year, []);
        byYear.get(e.year).push(e);
      });
      const years = Array.from(byYear.keys()).sort((a, b) => {
        const ay = parseInt(String(a).match(/20\d{2}/)?.[0] || "0", 10);
        const by = parseInt(String(b).match(/20\d{2}/)?.[0] || "0", 10);
        return by - ay;
      });

      return years.map(year => {
        const list = byYear.get(year);
        const byStyle = new Map();
        list.forEach(e => {
          const st = e.style || "Folkstyle";
          if (!byStyle.has(st)) byStyle.set(st, []);
          byStyle.get(st).push(e);
        });
        const styles = Array.from(byStyle.keys()).sort((a, b) => {
          const ia = STYLE_ORDER.indexOf(a); const ib = STYLE_ORDER.indexOf(b);
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
        });
        const styleBlocks = styles.map(style => {
          const sList = byStyle.get(style).sort((a, b) => a.awardName.localeCompare(b.awardName) || a.wrestlerName.localeCompare(b.wrestlerName));
          const byAward = new Map();
          sList.forEach(e => {
            const key = e.icon + "::" + e.awardName;
            if (!byAward.has(key)) byAward.set(key, { icon: e.icon, name: e.awardName, recipients: [] });
            byAward.get(key).recipients.push(e);
          });
          const awardBlocks = Array.from(byAward.values()).map(block => `
            <div style="background:var(--mat); border:1px solid var(--panelLine); border-radius:6px; padding:10px; margin-bottom:8px;">
              <div style="font-size:13px; font-weight:800; margin-bottom:6px;">
                <span style="font-size:16px; margin-right:4px;">${block.icon}</span>${block.name}
              </div>
              ${block.recipients.map(r => `
                <div style="display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-top:1px solid rgba(255,255,255,0.04);">
                  <span><strong>${r.wrestlerName}</strong>
                    <span style="color:var(--muted); font-size:11px;">
                      ${r.weightClass ? `· ${r.weightClass} lbs` : ""}${r.division ? ` · ${r.division}` : ""}
                    </span>
                  </span>
                  ${r.seasonName ? `<span style="color:var(--muted); font-size:10px;">${r.seasonName}</span>` : ""}
                </div>
              `).join('')}
            </div>
          `).join('');
          return `
            <div style="margin-bottom:12px; margin-left:4px;">
              <div style="font-size:11px; font-weight:800; color:var(--chalk); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; padding:4px 8px; background:var(--mat); border-left:3px solid var(--gold); border-radius:2px;">
                ${style === "Greco" ? "Greco-Roman" : style}
              </div>
              ${awardBlocks}
            </div>`;
        }).join('');
        return `
          <div style="margin-bottom:16px;">
            <div style="font-size:12px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--goldDim);">
              ${year}
            </div>
            ${styleBlocks}
          </div>
        `;
      }).join('');
    }

    function printHallOfFame() {
      const team = (branding && branding.teamName) || "Mat Scout";
      const yearLabel = hallOfFameYearFilter === "all" ? "All Years" : hallOfFameYearFilter;
      const styleLabel = !hallOfFameStyleFilter || hallOfFameStyleFilter === "all" ? "All Styles"
        : (hallOfFameStyleFilter === "Greco" ? "Greco-Roman" : hallOfFameStyleFilter);
      const filterLabel = yearLabel + " · " + styleLabel;
      const body = renderHallOfFameView();
      const cleaned = body
        .replace(/var\(--mat\)/g, "#f7f7f7")
        .replace(/var\(--panelLine\)/g, "#ccc")
        .replace(/var\(--gold\)/g, "#8a6a1a")
        .replace(/var\(--goldDim\)/g, "#D9A441")
        .replace(/var\(--muted\)/g, "#666")
        .replace(/var\(--chalk\)/g, "#111");
      const html = `<!DOCTYPE html><html><head><title>Hall of Fame — ${team}</title>
        <style>
          body{font-family:system-ui,sans-serif;color:#111;padding:24px;max-width:800px;margin:0 auto;}
          h1{font-size:20px;margin:0 0 4px 0;}.sub{color:#555;font-size:12px;margin-bottom:16px;}
          @media print{body{padding:0;}}
        </style></head><body>
        <h1>${team} — Hall of Fame</h1>
        <div class="sub">Filter: ${filterLabel} · Printed ${new Date().toLocaleString()}</div>
        ${cleaned}
        <script>window.onload = function(){ window.print(); };<\/script>
      </body></html>`;
      const w = window.open("", "_blank");
      if (!w) {
        alert("Pop-up blocked. Allow pop-ups to print the Hall of Fame.");
        return;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
    }

    function buildLeaderboardPrintHtml(side) {
      const season = getActiveSeason();
      const team = (branding && branding.teamName) || "Mat Scout";
      const filteredAthletes = season.roster.filter(w => leaderboardDivision === "All" || w.division === leaderboardDivision);
      const isOff = side === "offense";
      const dir = isOff ? "offense" : "defense";
      const countMode = isOff ? "success" : "scored_on";
      const title = isOff ? "Offense Leaders" : "Scored On (Allowed)";
      const categoryBoxes = isOff
        ? [
            { key: "Takedown", label: "Takedowns (T3)" },
            { key: "Escape", label: "Escapes (E1)" },
            { key: "Reversal", label: "Reversals (R2)" },
            { key: "Near Fall / Pin", label: "Near Fall Exposures" },
            { key: "Pins", label: "Pins / Falls" },
            { key: "Turns", label: "Turns" },
            { key: "ShotPct", label: "Shot %" }
          ]
        : [
            { key: "Takedown", label: "Takedowns Scored On" },
            { key: "Escape", label: "Escapes Allowed" },
            { key: "Reversal", label: "Reversals Allowed" },
            { key: "Near Fall / Pin", label: "Near Falls Scored On" },
            { key: "Pins", label: "Pins / Falls Scored On" },
            { key: "Turns", label: "Turns Scored On" }
          ];

      const sections = categoryBoxes.map(box => {
        const leaders = [];
        filteredAthletes.forEach(w => {
          let val = 0;
          if (box.key === "ShotPct") {
            const sp = computeShotPercentage(w.id);
            if (sp.taken >= 2 && sp.pct != null) leaders.push({ name: w.name, weightClass: w.weightClass, val: sp.pct, displayVal: sp.pct + "% (" + sp.success + "/" + sp.taken + ")" });
            return;
          }
          if (box.key === "Pins") val = countMoveSuccesses(w.id, "Pins", null, dir, countMode);
          else if (box.key === "Near Fall / Pin") val = countMoveSuccesses(w.id, "Near Fall / Pin", null, dir, countMode);
          else val = countMoveSuccesses(w.id, box.key, null, dir, countMode);
          if (val > 0) leaders.push({ name: w.name, weightClass: w.weightClass, val, displayVal: String(val) });
        });
        leaders.sort((a, b) => b.val - a.val);
        const top = leaders.slice(0, 3);
        if (!top.length) return "";
        const rows = top.map((r, i) => "<tr><td>" + (i + 1) + "</td><td>" + r.name + "</td><td>" + (r.weightClass || "") + "</td><td>" + (r.displayVal || r.val) + "</td></tr>").join("");
        return "<h3>" + box.label + "</h3><table><thead><tr><th>#</th><th>Athlete</th><th>Wt</th><th>Value</th></tr></thead><tbody>" + rows + "</tbody></table>";
      }).filter(Boolean).join("");

      return "<h2>" + team + " — Team Leaderboard · " + title + "</h2>" +
        "<p class='sub'>Division: " + leaderboardDivision + " · " + (season.name || "") + " · Printed " + new Date().toLocaleString() + "</p>" +
        (sections || "<p>No leaders in this category yet.</p>");
    }

      const html = "<!DOCTYPE html><html><head><title>Team Leaderboard</title>" +
        "<style>" +

      const w = window.open("", "_blank");
      if (!w) {
        alert("Pop-up blocked. Allow pop-ups to print the leaderboard.");

      w.document.open();
      w.document.write(html);

    function renderPlan(target) {
      const activeW = getActiveWrestler();
      const season = getActiveSeason();
      if (!activeW && !statsShowTeam) return target.innerHTML = '<div class="card"><p style="color:var(--muted); font-size:12px;">Select an active wrestler on the Roster page.</p></div>';

      const boysOptions = sortedRoster.filter(w => w.division === "Boys");
      const girlsOptions = sortedRoster.filter(w => w.division === "Girls");
      
      const { offense, defense } = statsShowTeam
        ? computeTeamStatsWithTieBreakdown()
        : computeStatsWithTieBreakdown(activeW.id);

      const minAttempts = statsShowTeam ? 4 : 2;
      const offenseThreshold = statsShowTeam
        ? (appConfig.teamOffenseThreshold || 50)
        : (appConfig.individualOffenseThreshold || 50);
      const defenseThreshold = statsShowTeam
        ? (appConfig.teamDefenseThreshold || 50)
        : (appConfig.individualDefenseThreshold || 50);

      const weakOffense = offense.filter(r => r.attempts >= minAttempts && r.rate < offenseThreshold);
      const weakDefense = defense.filter(r => r.attempts >= minAttempts && r.rate < defenseThreshold);

      const shotPctThreshold = statsShowTeam
        ? (appConfig.teamShotPctThreshold ?? 40)
        : (appConfig.individualShotPctThreshold ?? 40);
      const shotPct = statsShowTeam
        ? computeShotPercentage(null)
        : computeShotPercentage(activeW.id);
      const shotMoves = new Set(getShotMoveList());
      const weakShots = offense.filter(r =>
        shotMoves.has(r.move) && r.attempts >= minAttempts && r.rate < shotPctThreshold
      );
      const shotPctTriggered = shotPct.pct != null && shotPct.taken >= minAttempts && shotPct.pct < shotPctThreshold;

      const profStats = statsShowTeam
        ? computePositionalProficiency(null)
        : computePositionalProficiency(activeW.id);

      const PROF_DRILLS = {
        Neutral: "Hand-fighting series, shot setups from ties, sprawl-and-score live go's, neutral posture and level-change drilling.",
        Top: "Ride breakdowns, mat returns, turn chains (half / arm bar / tilt), ride-time pressure and turn finishes.",
        Bottom: "Stand-up series, switches/sit-outs, hip heists, scramble recovery, and bottom defense vs common rides."
      };

      // Yellow: -0.15 to <0.25 · Red: < -0.15  (green is ≥ 0.25 — no remediation)
      const weakPositions = ["Neutral", "Top", "Bottom"].map(name => {
        const key = name.toLowerCase();
        const data = profStats[key];
        const idx = data ? data.pct : 0;
        let band = "green";
        if (idx < -0.15) band = "red";
        else if (idx < 0.25) band = "yellow";
        return { name, data, idx, band, color: profColor(idx) };
      }).filter(p => p.band === "red" || p.band === "yellow");

      const planTitle = statsShowTeam
        ? `Targeted Practice Drills: Entire Team Compiled (${season.name})`
        : `Targeted Practice Drills: ${activeW.name} (${season.name})`;

      target.innerHTML = `
