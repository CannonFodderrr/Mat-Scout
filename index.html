<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mat Scout — Wrestling Analytics & Match Manager</title>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --mat: #1C1F1E;
      --panel: #25292A;
      --panelLine: #33383A;
      --chalk: #F2F0EA;
      --muted: #8B9290;
      --red: #C23B22;
      --redDim: #4A241C;
      --green: #2F7A4F;
      --greenDim: #1E3B2C;
      --gold: #D9A441;
      --goldDim: #4A3B1D;
      --teamFont: system-ui, -apple-system, sans-serif;
      --teamColor: #F2F0EA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--mat); color: var(--chalk); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; }
    
    /* Header & Brand */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-emblem { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--goldDim); border: 1.5px solid var(--gold); border-radius: 8px; flex-shrink: 0; }
    .logo-emblem svg { width: 22px; height: 22px; fill: var(--gold); }
    .logo-titles { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
    .team-title { font-size: 15px; font-weight: 700; font-family: var(--teamFont); color: var(--teamColor); letter-spacing: 1px; text-transform: uppercase; }
    
    .badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--panelLine); color: var(--chalk); }
    .badge strong { color: var(--gold); }

    /* Scope Bar */
    .scope-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--panelLine); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 11px; gap: 8px; }
    .scope-bar select { background: var(--mat); color: var(--chalk); border: 1px solid var(--panelLine); border-radius: 4px; padding: 4px 8px; font-size: 11px; outline: none; }
    .record-display { font-family: monospace; font-weight: 700; color: var(--gold); }

    /* Navigation */
    .nav-tabs { display: flex; flex-wrap: wrap; background-color: var(--panel); border: 1px solid var(--panelLine); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    .tab-btn { flex: 1; min-width: 80px; padding: 10px 8px; background: transparent; border: none; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; }
    .tab-btn.active { background-color: var(--gold); color: var(--mat); }

    /* Cards & Elements */
    .card { background-color: var(--panel); border: 1px solid var(--panelLine); border-radius: 6px; padding: 16px; margin-bottom: 12px; position: relative; }
    .card-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input, .select, .textarea { width: 100%; padding: 8px 12px; background-color: var(--mat); color: var(--chalk); border: 1px solid var(--panelLine); border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 8px; }
    
    /* Buttons */
    .btn { padding: 8px 14px; border-radius: 4px; border: none; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-gold { background-color: var(--gold); color: var(--mat); }
    .btn-green { background-color: var(--green); color: var(--chalk); }
    .btn-red { background-color: var(--red); color: var(--chalk); }
    .btn-back { background-color: var(--goldDim); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .btn-back:hover { background-color: var(--gold); color: var(--mat); }
    .btn-remove-video { background-color: var(--redDim); border: 1px solid var(--red); color: var(--red); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    
    /* Help Icon Button */
    .help-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--panelLine); color: var(--muted); font-size: 11px; font-weight: 800; border: 1px solid var(--muted); cursor: pointer; user-select: none; margin-left: 6px; line-height: 1; vertical-align: middle; transition: 0.15s ease; }
    .help-btn:hover { background: var(--goldDim); border-color: var(--gold); color: var(--gold); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
    
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; background-color: var(--mat); border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
    .bar-bg { width: 100%; height: 6px; background-color: var(--panelLine); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; border-radius: 99px; }
    
    video { width: 100%; border-radius: 4px; background: black; max-height: 320px; margin-bottom: 8px; display: block; }
    .yt-wrapper { width: 100%; border-radius: 4px; overflow: hidden; aspect-ratio: 16/9; max-height: 320px; background: black; margin-bottom: 8px; }
    .yt-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    .chip { font-size: 10px; font-weight: 700; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--panelLine); background: var(--mat); color: var(--muted); cursor: pointer; text-transform: uppercase; text-align: center; user-select: none; }
    .chip.selected { background: var(--goldDim); border-color: var(--gold); color: var(--gold); }
    .chip.selected-wrestler { background: var(--greenDim); border-color: var(--green); color: var(--green); }
    .chip.selected-opponent { background: var(--redDim); border-color: var(--red); color: var(--red); }
    .chip:disabled, .chip.disabled { opacity: 0.35; cursor: not-allowed; }

    .draggable-item { cursor: grab; }
    .draggable-item:active { cursor: grabbing; opacity: 0.6; }

    /* Bout Sheet Styling */
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; text-align: left; }
    .sheet-table th, .sheet-table td { border: 1px solid var(--panelLine); padding: 6px 8px; }
    .sheet-table th { background: var(--mat); color: var(--gold); text-transform: uppercase; font-size: 10px; }
    .sheet-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }

    /* CalGrappler Expanded Table */
    .cg-table { width: 100%; border-collapse: collapse; font-size: 10px; background: #fff; color: #111; margin-top: 8px; }
    .cg-table th, .cg-table td { border: 1px solid #777; padding: 4px 6px; vertical-align: middle; }
    .cg-table th { background: #e5e7eb; color: #111; font-weight: 800; text-transform: uppercase; text-align: center; }
    .cg-legend { font-size: 9px; border: 1px solid #777; padding: 6px; background: #f9fafb; margin-top: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; color: #222; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-box { background: var(--panel); border: 1px solid var(--panelLine); border-radius: 8px; width: 100%; max-width: 580px; padding: 18px; max-height: 90vh; overflow-y: auto; }

    /* Layout Lock / Drag-to-Reorder */
    .layout-unlock-banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--goldDim); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .card.layout-draggable { cursor: grab; border-style: dashed; border-color: var(--gold); position: relative; }
    .card.layout-draggable::before { content: "⠿ Drag to reorder"; display: block; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; user-select: none; }
    .card.layout-draggable:active { cursor: grabbing; }
    .card.dragging { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo-emblem">
          <svg viewBox="0 0 24 24">
            <path d="M4.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm15 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM8 7.5c0-.83-.67-1.5-1.5-1.5S5 6.67 5 7.5 5.67 9 6.5 9 8 8.33 8 7.5zm11 0c0-.83-.67-1.5-1.5-1.5S16 6.67 16 7.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5zM3 13.5l3.5-2 3 2.5v7h2v-5l-2-2 1.5-3.5 2 2h3l2-2 1.5 3.5-2 2v5h2v-7l3-2.5 3.5 2-1 2-2.5-1.5-2 4.5h-3l-2-3-2 3H6.5l-2-4.5L2 15.5l1-2z"/>
          </svg>
        </div>
        <div class="logo-titles">
          <span class="logo">Mat Scout</span>
          <span id="header-team-title" class="team-title"></span>
        </div>
      </div>
      <div id="active-wrestler-display" class="badge">Active: <strong>None</strong></div>
    </div>

    <!-- Active Season & Event Scope Bar -->
    <div class="scope-bar">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span><strong>Season:</strong></span>
        <select id="global-season-select" onchange="switchActiveSeason(this.value)"></select>
        <span style="margin-left: 6px;"><strong>Event:</strong></span>
        <select id="global-bout-select" onchange="switchActiveBout(this.value)"></select>
      </div>
      <div id="dual-record-details" class="record-display">Boys: 0-0-0 | Girls: 0-0-0</div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('roster')">Roster</button>
      <button class="tab-btn" onclick="switchTab('scout')">Scout</button>
      <button class="tab-btn" onclick="switchTab('sheet')">Bout Sheet</button>
      <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
      <button class="tab-btn" onclick="switchTab('plan')">Training Plan</button>
      <button class="tab-btn" onclick="switchTab('admin')">Admin</button>
    </div>

    <div id="tab-content"></div>
  </div>

  <div id="modal-root"></div>
  <canvas id="frame-canvas" style="display:none;"></canvas>

  <script>
    // Safely embed a dynamic string inside `onclick="fn('${value}')"` markup.
    // Rendered HTML here is built as plain template-literal strings and assigned
    // via innerHTML, so any apostrophe in the value (e.g. "Fireman's Carry") would
    // otherwise prematurely close the single-quoted JS string inside the onclick
    // attribute, producing invalid inline JS that silently fails on click — the
    // button does nothing and no error is visible without devtools open.
    // This escapes backslashes/quotes for the JS-string layer and & / " for the
    // surrounding HTML-attribute layer, so any move, tie, or finish name — current
    // or future — is safe to interpolate.
    function escAttr(v) {
      return String(v)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;');
    }

    const STORAGE_KEY = "mat-scout-season-store-v8";
    const TAXONOMY_STORAGE_KEY = "mat-scout-custom-taxonomy-v8";
    const WEIGHT_CLASSES_STORAGE_KEY = "mat-scout-weight-classes-v8";
    const BRANDING_STORAGE_KEY = "mat-scout-branding-v8";
    const COLOR_THEME_STORAGE_KEY = "mat-scout-color-theme-v8";
    const API_KEY_STORAGE = "mat-scout-gemini-api-key";
    const LAYOUT_STORAGE_KEY = "mat-scout-layout-order-v1";
    const CONFIG_STORAGE_KEY = "mat-scout-config-v8";
    const AWARDS_STORAGE_KEY = "mat-scout-awards-v8";
    const ROSTER_LIBRARY_KEY = "mat-scout-roster-library-v1";
    const AI_TRAINING_LIBRARY_KEY = "mat-scout-ai-training-v1";
    const AI_TRAINING_IDB = "mat-scout-ai-training-videos";
    const SAMPLE_SEASON_ID = "season_sample_2026";

    const DEFAULT_WEIGHT_CLASSES = {
      Boys: ["106", "113", "120", "126", "132", "138", "144", "150", "157", "165", "175", "190", "215", "285"],
      Girls: ["100", "105", "110", "115", "120", "125", "130", "135", "140", "145", "155", "170", "190", "235"]
    };

    const AWARD_ICONS = [
      "🏆", "🥇", "🥈", "🥉", "🎖️", "🏅", "🏵️", "🎀",
      "🔥", "⚡", "💥", "✨", "🌟", "⭐", "💫",
      "👑", "🛡️", "⚔️", "🗡️", "🏹", "🎯", "🥊", "🤼",
      "💪", "🦾", "🦶", "👀", "🧠", "❤️", "💙", "💚",
      "🚀", "🦅", "🐉", "🦁", "🐯", "🐺", "🦂", "🐍"
    ];

    const DEFAULT_TAXONOMY = {
      MOVE_GROUPS: {
        "Takedown": {
          "Shots": ["Single Leg", "Double Leg", "High Crotch", "Ankle Pick", "Fireman's Carry", "Dresser Dump"],
          "Throws": ["Pinch Headlock", "Sag Headlock", "Harai Goshi", "Lat Drop", "Cow Catcher", "Pancake"],
          "Ducks / Slides": ["Kolat Duck", "Hildebrandt Slide-By"],
          "Go Behinds": ["Snap Down", "Front Headlock", "Arm Drag"],
          "Defensive": ["Sprawl Go Behind", "Leg Elevator", "Broomstick", "Headlock Roll Through", "Spladle"],
          "Other": ["Standing Cradle", "Undefined"]
        },
        "Escape": ["Stand-Up", "Switch", "Sit-Out"],
        "Reversal": ["Standing Switch", "Roll", "Switch", "Granby Roll", "Peterson", "Out the Back", "Head Hook", "Arm Hook"],
        "Turns": {
          "Nelsons": ["Half", "Quarter", "3/4"],
          "Arm Bars": ["Arm Bar", "Double Arm Bar", "Bar and Half"],
          "Tilts": ["2 on 1 Tilt", "Clemson Tilt", "Ball and Chain"],
          "Cradles": ["Near Side Cradle", "Far Side Cradle", "Head In Side Cradle"]
        },
        "Near Fall / Pin": ["2-Point NF", "3-Point NF", "4-Point NF", "Pin / Fall"],
        "Penalty/DQ": ["Full Nelson", "Locked Hands", "Illegal Move", "Stalling", "Unsportsmanlike", "Injury", "Blood", "Forfeit"]
      },
      TIE_MODIFIERS: [
        "Fake", "Overhook", "Underhook", "Over/Under", "Collar Tie", "Inside Tie", "Outside Tie", "Over Tie", "Wrist Control", "Elbow Control", "Russian", "Wrist Pass", "Arm Drag", "2 on 1", "Poor Penetration",
        "Head Position", "Poor Head Position", "Both Wrists", "Post", "Standing", "On Knee"
      ],
      FINISH_MODIFIERS: [
        "Inside Trip", "Outside Trip", "Crack Down", "Backside Finish", "Cut to Double", "Dump", "Scramble", "Down Block", "Sprawl", "Whizzer", "Crossface", "Mat Return", "Cut Loose",
        "Belly Whizzer", "Step Over",
        "Arm Chop", "Tight Waist Far Ankle", "Tight Waist Near Ankle", "Spiral Ride", "Far Knee Far Ankle"
      ],
      RIDE_MODIFIERS: [
        "Single Leg", "Double Leg", "Cross Body", "Iowa", "Blair", "Claw", "Crab", "2 on 1", "Spiral Ride"
      ]
    };

    const POINT_VALUES = {
      "Single Leg": 3, "Double Leg": 3, "High Crotch": 3, "Ankle Pick": 3, "Fireman's Carry": 3, "Dresser Dump": 3,
      "Pinch Headlock": 3, "Sag Headlock": 3, "Harai Goshi": 3, "Lat Drop": 3, "Cow Catcher": 3, "Pancake": 3,
      "Kolat Duck": 3, "Hildebrandt Slide-By": 3,
      "Snap Down": 3, "Front Headlock": 3, "Arm Drag": 3,
      "Sprawl Go Behind": 3, "Leg Elevator": 3, "Broomstick": 3, "Headlock Roll Through": 3, "Spladle": 3,
      "Standing Cradle": 3, "Undefined": 3,
      "Stand-Up": 1, "Switch": 2, "Sit-Out": 1, "Standing Switch": 2, "Roll": 2, "Granby Roll": 2,
      "Peterson": 2, "Out the Back": 2, "Head Hook": 2, "Arm Hook": 2,
      "2-Point NF": 2, "3-Point NF": 3, "4-Point NF": 4, "Pin / Fall": 0,
      "Half": 0, "Quarter": 0, "3/4": 0,
      "Arm Bar": 0, "Double Arm Bar": 0, "Bar and Half": 0,
      "2 on 1 Tilt": 0, "Clemson Tilt": 0, "Ball and Chain": 0,
      "Near Side Cradle": 0, "Far Side Cradle": 0, "Head In Side Cradle": 0,
      "Over/Under": 0,
      "Full Nelson": 0, "Locked Hands": 0, "Illegal Move": 0, "Stalling": 0, "Unsportsmanlike": 0
    };

    // Some move names appear in more than one category with different point values
    // (e.g. "Switch" is a 1-point Escape but a 2-point Reversal). POINT_VALUES alone
    // can't disambiguate by name, so overrides are keyed "Category::Move".
    const POINT_VALUE_OVERRIDES = {
      "Escape::Switch": 1,
      "Reversal::Switch": 2
    };

    // Fallback points for a category when a move has no POINT_VALUES entry at all —
    // this is what makes newly added custom moves (via Admin > Add Move) score
    // correctly out of the box. Turns/Near Fall/Penalty/DQ aren't listed here because
    // those categories pick their point value explicitly on an outcome screen
    // rather than looking it up by move name.
    const CATEGORY_DEFAULT_POINTS = {
      "Takedown": 3,
      "Escape": 1,
      "Reversal": 2
    };

    function getPointValue(category, move) {
      const key = `${category}::${move}`;
      if (Object.prototype.hasOwnProperty.call(POINT_VALUE_OVERRIDES, key)) {
        return POINT_VALUE_OVERRIDES[key];
      }
      if (Object.prototype.hasOwnProperty.call(POINT_VALUES, move)) {
        return POINT_VALUES[move];
      }
      if (Object.prototype.hasOwnProperty.call(CATEGORY_DEFAULT_POINTS, category)) {
        return CATEGORY_DEFAULT_POINTS[category];
      }
      return 0;
    }

    function isPenaltyCategory(cat) {
      return cat === "Penalty" || cat === "Penalty/DQ";
    }

    function isPinLikeEvent(e) {
      if (!e) return false;
      return e.detail === "Pin / Fall" || e.detail === "Pin" ||
        (e.move && (e.move === "Pin / Fall" || e.move.includes("Pin")));
    }

    function isForfeitLikeEvent(e) {
      if (!e) return false;
      // Only terminal forfeit outcomes — not every Injury/Blood label mid-match
      if (e.detail === "Forfeit") return true;
      const m = (e.move || "").toLowerCase();
      if (m === "forfeit") return true;
      // Injury / Blood count as forfeit only when logged via the Forfeit outcome path
      if ((m === "injury" || m === "blood") && e.detail === "Forfeit") return true;
      return false;
    }

    /** Accumulate match points from event list (shared scoring rules). */
    function accumulateMatchPoints(evs) {
      let ourP = 0, oppP = 0;
      (evs || []).forEach(e => {
        const pts = e.points || 0;
        if (isPenaltyCategory(e.category)) {
          // Direction = who committed the foul / who is the actor:
          //   Offense (By us)  = WE were penalized → points to opponent
          //   Defense (Faced) = OPPONENT was penalized → points to us
          if (e.direction === "offense") oppP += pts;
          else ourP += pts;
        } else {
          if (e.direction === "offense") ourP += pts;
          else if (e.outcome === "fail") oppP += pts;
        }
      });
      return { ourP, oppP };
    }

    function isDqLikeEvent(e) {
      if (!e) return false;
      if (e.detail === "DQ" || e.detail === "Disqualification") return true;
      const m = (e.move || "").toLowerCase();
      return m === "dq" || m === "disqualification";
    }

    /**
     * Classify match outcome + dual team points (NFHS-style folkstyle dual).
     * Decision 3 · Major (8–14) 4 · Tech (15+) 5 · Fall / Forfeit / DQ 6
     *
     * Direction model (same as moves):
     *   Offense = our action  → we forfeit / we get pinned → LOSS
     *   Defense (Faced) = opponent's action → they forfeit / we pin them is offense pin
     *   Faced forfeit (opponent forfeits) → WIN + 6 dual points to us
     *   Offense forfeit (we forfeit) → LOSS + 6 dual points to opponent
     */
    function classifyMatchResult(evs) {
      const { ourP, oppP } = accumulateMatchPoints(evs);
      const pinEv = (evs || []).find(e => isPinLikeEvent(e));
      const forfeitEv = (evs || []).find(e => isForfeitLikeEvent(e));
      const dqEv = (evs || []).find(e => isDqLikeEvent(e));
      const isOffPin = pinEv && pinEv.direction === "offense";
      const isDefPin = pinEv && pinEv.direction === "defense";
      // Faced forfeit/DQ = opponent gives up → we WIN. Offense forfeit/DQ = we give up → LOSS.
      const isFacedForfeit = forfeitEv && forfeitEv.direction === "defense";
      const isOurForfeit = forfeitEv && forfeitEv.direction === "offense";
      const isFacedDq = dqEv && dqEv.direction === "defense";
      const isOurDq = dqEv && dqEv.direction === "offense";

      let result = "tie"; // win | loss | tie
      let method = "decision"; // pin | forfeit | dq | tech | major | decision | tie
      let dualPtsOur = 0;
      let dualPtsOpp = 0;
      let margin = 0;

      if (isOffPin || isFacedForfeit || isFacedDq) {
        result = "win";
        method = isOffPin ? "pin" : (isFacedForfeit || isOurForfeit ? "forfeit" : "dq");
        if (isFacedForfeit) method = "forfeit";
        else if (isFacedDq) method = "dq";
        dualPtsOur = 6;
      } else if (isDefPin || isOurForfeit || isOurDq) {
        result = "loss";
        method = isDefPin ? "pin" : (isOurForfeit ? "forfeit" : "dq");
        dualPtsOpp = 6;
      } else if (ourP > oppP) {
        result = "win";
        margin = ourP - oppP;
        if (margin >= 15) { method = "tech"; dualPtsOur = 5; }
        else if (margin >= 8) { method = "major"; dualPtsOur = 4; }
        else { method = "decision"; dualPtsOur = 3; }
      } else if (oppP > ourP) {
        result = "loss";
        margin = oppP - ourP;
        if (margin >= 15) { method = "tech"; dualPtsOpp = 5; }
        else if (margin >= 8) { method = "major"; dualPtsOpp = 4; }
        else { method = "decision"; dualPtsOpp = 3; }
      } else {
        result = "tie";
        method = "tie";
      }

      return {
        ourP, oppP, result, method, margin,
        dualPtsOur, dualPtsOpp,
        pinEv: pinEv || null,

        isOffPin, isDefPin,

      };

    function reverseDualRecordContribution(season, bout) {
      if (!bout || !bout.finalizedSnapshot) return;
      const rec = bout.division === "Girls"
        ? (season.girlsDualRecord || (season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 }))
        : (season.boysDualRecord || (season.boysDualRecord = { wins: 0, losses: 0, ties: 0 }));
      const prev = bout.finalizedSnapshot;
      if (prev.outcome === "win") rec.wins = Math.max(0, (rec.wins || 0) - 1);
      else if (prev.outcome === "loss") rec.losses = Math.max(0, (rec.losses || 0) - 1);
      else if (prev.outcome === "tie") rec.ties = Math.max(0, (rec.ties || 0) - 1);
    }

    /** Download a full season archive as a JSON file (browser "folder"/file save). */
    function archiveSeason(seasonId) {
      const season = store.seasons.find(s => s.id === seasonId);
      if (!season) return alert("Season not found.");
      const payload = {
        type: "mat-scout-season-archive",
        version: 1,
        exportedAt: new Date().toISOString(),
        season: JSON.parse(JSON.stringify(season)),
        // HOF stays global; include assignment context for reference only
        awardsSnapshot: JSON.parse(JSON.stringify(awards || []))
      };
      const safeName = String(season.name || "season").replace(/[^a-z0-9-_]+/gi, "_").slice(0, 40);
      const fname = `mat-scout-archive_${safeName}_${getSeasonYearLabelSafe(season)}.json`;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      alert(`Archived "${season.name}" to download: ${fname}\n\nKeep this file to reload the season later.`);
    }

    /** Load a previously downloaded season archive JSON. */
    function loadSeasonArchiveFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          let season = data.season || data;
          if (!season || !season.name) throw new Error("Invalid archive file.");
          season = JSON.parse(JSON.stringify(season));

          const oldWrestlerIds = {};
          const oldBoutIds = {};
          const oldMatchIds = {};

          season.id = Math.random().toString(36).slice(2, 9);
          season.roster = (season.roster || []).map(w => {
            const nid = Math.random().toString(36).slice(2, 9);
            oldWrestlerIds[w.id] = nid;
            return { ...w, id: nid };
          });
          season.bouts = (season.bouts || []).map(b => {
            const nid = Math.random().toString(36).slice(2, 9);
            oldBoutIds[b.id] = nid;
            return { ...b, id: nid };
          });
          season.matches = (season.matches || []).map(m => {
            const nid = Math.random().toString(36).slice(2, 9);
            oldMatchIds[m.id] = nid;
            return {
              ...m,
              id: nid,
              wrestlerId: oldWrestlerIds[m.wrestlerId] || m.wrestlerId,
              boutId: oldBoutIds[m.boutId] || m.boutId
            };
          });
          season.events = (season.events || []).map(e => ({
            ...e,
            id: Math.random().toString(36).slice(2, 9),
            wrestlerId: oldWrestlerIds[e.wrestlerId] || e.wrestlerId,
            boutId: oldBoutIds[e.boutId] || e.boutId,
            matchId: oldMatchIds[e.matchId] || e.matchId
          }));
          if (!season.boysDualRecord) season.boysDualRecord = { wins: 0, losses: 0, ties: 0 };
          if (!season.girlsDualRecord) season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 };

          // Ensure unique name if collision
          let base = season.name;
          let n = 2;
          while (store.seasons.some(s => s.name === season.name)) {
            season.name = base + " (restored " + n + ")";
            n++;
          }

          store.seasons.push(season);
          store.activeSeasonId = season.id;
          store.activeBoutId = "all";
          store.activeWrestlerId = season.roster[0] ? season.roster[0].id : null;
          persist();
          render();
          alert(`Loaded archived season "${season.name}" (${season.roster.length} athletes, ${(season.matches || []).length} matches).`);
        } catch (err) {
          alert("Could not load archive: " + (err.message || err));
        }
      };
      reader.readAsText(file);
    }

    /**
     * Delete a season from active storage.

     */
    function deleteSeason(seasonId) {
      const season = store.seasons.find(s => s.id === seasonId);
      if (!season) return;
      if (store.seasons.length <= 1) {
        return alert("You cannot delete the only remaining season. Create or load another season first.");
      }
      const matchCount = (season.matches || []).length;
      const eventCount = (season.events || []).length;
      const msg =
        `Delete season "${season.name}"?\n\n` +
        `• ${season.roster.length} roster athlete(s) will be saved to the Roster Library for later import\n` +
        `• ${matchCount} match(es) and ${eventCount} event(s) will be removed from this device\n` +
        `• Hall of Fame awards are kept\n\n` +
        `Tip: Archive/download the season first if you may need the full stats later.`;
      if (!confirm(msg)) return;

      // Preserve roster for future season import
      if (season.roster && season.roster.length) {
        rosterLibrary.push({
          id: Math.random().toString(36).slice(2, 9),
          label: season.name,
          year: getSeasonYearLabelSafe(season),
          savedAt: new Date().toISOString(),
          roster: JSON.parse(JSON.stringify(season.roster))
        });
      }

      store.seasons = store.seasons.filter(s => s.id !== seasonId);
      if (store.activeSeasonId === seasonId) {
        store.activeSeasonId = store.seasons[0].id;
        store.activeBoutId = "all";
        store.activeWrestlerId = store.seasons[0].roster[0] ? store.seasons[0].roster[0].id : null;
      }
      persist();
      render();
      alert(`Season deleted. Roster saved to library (${rosterLibrary.length} saved roster(s) available for import).`);
    }

    function syncVideoPlayerVisibility() {
      const vid = document.getElementById("persistent-video");
      const ytContainer = document.getElementById("yt-player-container");
      const title = document.getElementById("global-video-title");
      if (title) title.textContent = `Match Video Player: ${videoFileName || 'YouTube Footage'}`;

      if (videoSourceType === "file") {
        if (vid) {
          vid.style.display = "block";
          if (vid.src !== videoBlobUrl) vid.src = videoBlobUrl || "";
        }
        if (ytContainer) ytContainer.style.display = "none";
      } else if (videoSourceType === "youtube") {
        if (vid) vid.style.display = "none";
        if (ytContainer) ytContainer.style.display = "block";
        initOrUpdateYouTubePlayer(youtubeVideoId);
      }
    }

    function initOrUpdateYouTubePlayer(videoId) {
      if (!videoId) return;
      if (!ytPlayer && window.YT && YT.Player) {
        ytPlayer = new YT.Player('yt-player-target', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: { 'playsinline': 1, 'rel': 0 },
          events: {
            'onReady': () => { ytLoadedVideoId = videoId; }
          }
        });
      } else if (ytPlayer && ytPlayer.loadVideoById && videoId !== ytLoadedVideoId) {
        ytPlayer.cueVideoById(videoId);
        ytLoadedVideoId = videoId;
      }
    }

    function handleSharedVideoFile(e) {
      const file = e.target.files[0];
      if (file) {
        videoSourceType = "file";
        selectedVideoFile = file;
        videoFileName = file.name;
        if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
        videoBlobUrl = URL.createObjectURL(file);
        youtubeVideoId = null;
        render();
      }
    }

    function handleLoadYouTubeUrl() {
      const input = document.getElementById("yt-url-input");
      if (!input) return;
      const url = input.value.trim();
      const id = extractYouTubeVideoId(url);
      if (!id) return alert("Please enter a valid YouTube video URL.");

      videoSourceType = "youtube";
      youtubeVideoId = id;
      videoFileName = `YouTube [${id}]`;
      selectedVideoFile = null;
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = null;
      render();
    }

    function clearSharedVideo() {
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = null;
      selectedVideoFile = null;
      videoFileName = "";
      youtubeVideoId = null;

      const vid = document.getElementById("persistent-video");
      if (vid) {
        vid.pause();
        vid.removeAttribute("src");
        vid.load();
      }

      if (ytPlayer && ytPlayer.pauseVideo) {
        ytPlayer.pauseVideo();
      }
      render();
    }

    function pauseVideoAndGetTime() {
      if (videoSourceType === "youtube") {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          try { ytPlayer.pauseVideo(); } catch (err) {}
          const s = Math.floor(ytPlayer.getCurrentTime() || 0);
          const mm = String(Math.floor(s / 60)).padStart(2, '0');
          const ss = String(s % 60).padStart(2, '0');
          return `${mm}:${ss}`;
        }
        return "00:00";
      }

      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return "";
      vid.pause();
      const s = Math.floor(vid.currentTime || 0);
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function seekVideo(ts) {
      if (!ts) return;
      const parts = ts.split(":").map(Number);
      const secs = parts.length === 2 ? parts[0] * 60 + parts[1] : Number(ts) || 0;

      if (videoSourceType === "youtube") {
        if (ytPlayer && ytPlayer.seekTo) {
          ytPlayer.seekTo(secs, true);
          try { ytPlayer.playVideo(); } catch (err) {}
        }
        return;
      }

      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return;
      vid.currentTime = secs;
      vid.play().catch(() => {});
    }

    /* LAYOUT LOCK / DRAG-TO-REORDER */
    function toggleUILock() {
      uiUnlocked = !uiUnlocked;
      render();
    }

    function resetTabLayout(tabKey) {
      if (!confirm(`Reset the ${tabKey} tab back to its default layout?`)) return;
      delete layoutOrder[tabKey];
      persist();
      render();
    }

    function applyLayoutOrder() {
      const target = document.getElementById("tab-content");
      if (!target) return;
      const cards = Array.from(target.children).filter(el => el.classList.contains("card"));
      cards.forEach((el, i) => { el.dataset.cardIdx = i; });

      const key = currentTab;
      let order = layoutOrder[key];
      if (!order || order.length !== cards.length) {
        order = cards.map((_, i) => i);
        layoutOrder[key] = order;
      }

      order.forEach(idx => {
        const el = cards[idx];
        if (el) target.appendChild(el);
      });

      const orderedEls = Array.from(target.children).filter(el => el.classList.contains("card"));
      orderedEls.forEach(el => {
        el.classList.toggle("layout-draggable", uiUnlocked && cards.length > 1);
        el.draggable = uiUnlocked && cards.length > 1;
        el.removeEventListener("dragstart", onCardDragStart);
        el.removeEventListener("dragover", onCardDragOver);
        el.removeEventListener("drop", onCardDrop);
        el.removeEventListener("dragend", onCardDragEnd);
        if (uiUnlocked) {
          el.addEventListener("dragstart", onCardDragStart);
          el.addEventListener("dragover", onCardDragOver);
          el.addEventListener("drop", onCardDrop);
          el.addEventListener("dragend", onCardDragEnd);
        }
      });
    }

    function onCardDragStart(e) {
      draggedCardEl = e.currentTarget;
      e.currentTarget.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", ""); } catch (err) {}
    }

    function onCardDragOver(e) {
      e.preventDefault();
      if (!draggedCardEl) return;
      const container = document.getElementById("tab-content");
      const afterEl = getDragAfterElement(container, e.clientY);
      if (afterEl == null) {
        container.appendChild(draggedCardEl);
      } else if (afterEl !== draggedCardEl) {
        container.insertBefore(draggedCardEl, afterEl);
      }
    }

    function getDragAfterElement(container, y) {
      const els = Array.from(container.querySelectorAll(".card:not(.dragging)"));
      return els.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    function onCardDrop(e) {
      e.preventDefault();
      saveCurrentCardOrder();
    }

    function onCardDragEnd(e) {
      e.currentTarget.classList.remove("dragging");
      draggedCardEl = null;
      saveCurrentCardOrder();
    }

    function saveCurrentCardOrder() {
      const target = document.getElementById("tab-content");
      if (!target) return;
      const cards = Array.from(target.children).filter(el => el.classList.contains("card"));
      const order = cards.map(el => Number(el.dataset.cardIdx));
      layoutOrder[currentTab] = order;
      persist();
    }

    /* ROSTER TAB RENDERING */
    function getWrestlerRecord(wrestlerId) {
      const season = getActiveSeason();
      let wins = 0, losses = 0, ties = 0;
      season.matches.filter(m => m.wrestlerId === wrestlerId).forEach(m => {
        const evs = season.events.filter(e => e.matchId === m.id);
        const r = classifyMatchResult(evs);
        if (r.result === "win") wins++;
        else if (r.result === "loss") losses++;
        else ties++;
      });
      return ties > 0 ? `${wins}-${losses}-${ties}` : `${wins}-${losses}`;
    }

          if (rosterLevelFilter === "JV" && w.level !== "JV") return false;

          if (boutLevelFilter === "JV" && lvl === "Varsity") return false;

    function deleteWrestler(id) {
      const season = getActiveSeason();
      const targetW = season.roster.find(w => w.id === id);
      const name = targetW ? targetW.name : "this athlete";
      if (!confirm(`Are you sure you want to delete ${name}? All associated match and event records will be permanently removed.`)) return;

      season.roster = season.roster.filter(w => w.id !== id);
      season.matches = season.matches.filter(m => m.wrestlerId !== id);
      season.events = season.events.filter(e => e.wrestlerId !== id);
      if (store.activeWrestlerId === id) {
        store.activeWrestlerId = season.roster.length > 0 ? season.roster[0].id : null;
      }
      persist();
      render();
    }

    function deleteBout(boutId) {
      const season = getActiveSeason();
      const targetB = season.bouts.find(b => b.id === boutId);
      const boutLabel = targetB ? `${targetB.date} [${targetB.type}] vs ${targetB.opponentTeam}` : "this bout";
      const matchCount = (season.matches || []).filter(m => m.boutId === boutId).length;
      const eventCount = (season.events || []).filter(e => e.boutId === boutId).length;

      let msg = `Delete ${boutLabel}?`;
      if (matchCount > 0 || eventCount > 0) {
        msg =
          `Stats have been entered for this event.\n\n` +
          `• ${matchCount} match(es)\n` +
          `• ${eventCount} scoring event(s)\n\n` +
          `Deleting will permanently remove all matches and stats associated with this dual/tournament.\n\n` +
          `Continue?`;
      } else {
        msg = `Are you sure you want to delete ${boutLabel}? No matches or stats are logged for this event.`;
      }
      if (!confirm(msg)) return;

      // Reverse dual-record contribution if this bout was finalized
      if (targetB && targetB.finalized) {
        reverseDualRecordContribution(season, targetB);
      }

      // Cascade-remove matches and events for this bout
      const removedMatchIds = new Set(
        (season.matches || []).filter(m => m.boutId === boutId).map(m => m.id)
      );
      season.matches = (season.matches || []).filter(m => m.boutId !== boutId);
      season.events = (season.events || []).filter(e =>
        e.boutId !== boutId && !removedMatchIds.has(e.matchId)
      );
      season.bouts = season.bouts.filter(b => b.id !== boutId);
      if (store.activeBoutId === boutId) store.activeBoutId = "all";
      if (activeMatch && activeMatch.boutId === boutId) activeMatch = null;
      persist();
      render();
    }

    function formatTime12(t) {
      if (!t) return "—";
      const parts = String(t).split(":");
      if (parts.length < 2) return t;
      let h = parseInt(parts[0], 10);
      const m = parts[1];
      if (isNaN(h)) return t;
      const ap = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return h + ":" + m + " " + ap;
    }

          else ourPts += pts;

          if (e.direction === "offense") ourPts += pts;
          else if (e.outcome === "fail") oppPts += pts;

          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P3` : `Opponent's Choice for P3`;
        } else {
          decisionButtonsDisabled = true;
          currentChooserText = `P3 Set: ${p3ChoiceEv.move}`;
        }
      }

      const activeList = modifierSubView === "ties"
        ? taxonomy.TIE_MODIFIERS
        : modifierSubView === "finishes"
          ? (taxonomy.FINISH_MODIFIERS || DEFAULT_TAXONOMY.FINISH_MODIFIERS)
          : (taxonomy.RIDE_MODIFIERS || DEFAULT_TAXONOMY.RIDE_MODIFIERS);

      return `

          <div class="grid-2">
            <div style="background-color:var(--greenDim); border:1px solid var(--green); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--green); text-transform:uppercase;">${activeW.name} (${activeMatch.level})</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${ourPts}</div>
            </div>
            <div style="background-color:var(--redDim); border:1px solid var(--red); padding:8px 12px; text-align:center; border-radius:6px;">
              <div style="font-size:10px; font-weight:700; color:var(--red); text-transform:uppercase;">${activeMatch.opponent}</div>
              <div style="font-size:28px; font-weight:800; font-family:monospace;">${oppPts}</div>
            </div>
          </div>
        </div>

        <!-- Period Bar Card -->
        <div class="card" style="padding:8px 12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase;">Period: ${currentPeriod}</div>
            <div style="font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;">${currentChooserText}</div>
          </div>
          
          <div style="display:flex; justify-content:space-between; align-items:center; gap:4px; flex-wrap:wrap;">
            <div style="display:flex; gap:4px;">
              <button class="chip ${currentPeriod === 'P1' ? 'selected' : ''}" onclick="advancePeriod('P1')">P1</button>
              <button class="chip ${currentPeriod === 'P2' ? 'selected' : ''}" ${!p2Allowed && currentPeriod !== 'P2' && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P2')">P2</button>
              <button class="chip ${currentPeriod === 'P3' ? 'selected' : ''}" ${!p3Allowed && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P3')">P3</button>
              <button class="chip ${currentPeriod === 'OT' ? 'selected' : ''}" onclick="advancePeriod('OT')">OT</button>
            </div>

            <div style="display:flex; gap:4px;">
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Top')">Top</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Bottom')">Bottom</button>
              <button class="chip" ${decisionButtonsDisabled || currentPeriod !== 'P2' || (p2ChoiceEvs.some(e => e.detail === 'Defer')) ? 'disabled' : ''} onclick="recordPositionChoice('Defer')">Defer</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Neutral')">Neutral</button>
            </div>
          </div>
        </div>

        <!-- Direction Switcher Card -->
        <div class="card" style="padding:8px 12px;">
          <div class="grid-2">
            <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'offense' ? 'var(--green)' : 'var(--mat)'}; border:1px solid var(--panelLine); color:var(--chalk);" onclick="setDir('offense')">
              Offense (By ${activeW.name})
            </button>
            <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'defense' ? 'var(--red)' : 'var(--mat)'}; border:1px solid var(--panelLine); color:var(--chalk);" onclick="setDir('defense')">
              Faced (vs. ${activeW.name})
            </button>
          </div>
        </div>

        <!-- Modifiers Window: Ties & Setups vs Finishes -->
        <div class="card" style="padding:10px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'ties' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'ties' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'ties'; render();">
                Ties & Setups
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'finishes' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'finishes' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'finishes'; render();">
                Finishes
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierSubView === 'rides' ? 'var(--gold)' : 'var(--mat)'}; color:${modifierSubView === 'rides' ? 'var(--mat)' : 'var(--chalk)'}; border:1px solid var(--panelLine);" onclick="modifierSubView = 'rides'; render();">
                Rides
              </button>
              <span style="font-size:10px; font-weight:700; color:var(--muted);">${formatActiveModifiersSummary()}</span>
              ${helpIcon('scout_modifiers')}
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <span style="font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase;">Apply To:</span>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierAssignTarget === 'wrestler' ? 'var(--green)' : 'var(--mat)'}; border:1px solid ${modifierAssignTarget === 'wrestler' ? 'var(--green)' : 'var(--panelLine)'}; color:var(--chalk);" onclick="modifierAssignTarget = 'wrestler'; render();">
                ${activeW.name} (Wrestler)
              </button>
              <button class="btn" style="padding:3px 8px; font-size:10px; font-weight:800; background:${modifierAssignTarget === 'opponent' ? 'var(--red)' : 'var(--mat)'}; border:1px solid ${modifierAssignTarget === 'opponent' ? 'var(--red)' : 'var(--panelLine)'}; color:var(--chalk);" onclick="modifierAssignTarget = 'opponent'; render();">
                ${activeMatch.opponent || 'Opponent'}
              </button>
            </div>
          </div>
          <div class="grid-4">
            ${activeList.map(mod => {
              const matchedMod = activeTieModifiers.find(m => (typeof m === 'object' ? m.tie : m) === mod);
              let chipClass = "chip";
              if (matchedMod) {
                const owner = typeof matchedMod === 'object' ? matchedMod.owner : 'wrestler';
                chipClass += owner === 'opponent' ? " selected-opponent" : " selected-wrestler";
              }
              return `
                <div class="${chipClass}" onclick="toggleTieModifierMulti('${escAttr(mod)}')">
                  ${mod} ${matchedMod ? `<span style="font-size:9px;">[${(typeof matchedMod === 'object' ? matchedMod.owner : 'wrestler') === 'opponent' ? 'OPP' : 'WRESTLER'}]</span>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Move Selection Card -->
        <div class="card">
          <div class="card-title">
            <span>${renderMoveSelectorTitle()}</span>
            ${renderMoveBackButton()}
          </div>
          ${renderMoveSelectorGrid()}
        </div>

        <!-- Scoring Log Card -->
        <div class="card">
          <div class="card-title">
            <span>Scoring Log (${activeMatch.events.length} events)</span>
            <span style="font-size:10px; color:var(--muted); font-weight:400; text-transform:none;">Click any action to edit</span>
          </div>
          <div style="max-height:180px; overflow-y:auto; margin-bottom:12px;">
            ${activeMatch.events.length === 0 ? '<p style="font-size:11px; color:var(--muted);">No actions tagged yet.</p>' : ''}
            ${activeMatch.events.slice().reverse().map((e) => `
              <div class="item-row" style="cursor:pointer;" onclick="openEditEventModal('${e.id}')">
                <span>
                  <span style="font-family:monospace; color:var(--gold); margin-right:6px; text-decoration:underline;" onclick="event.stopPropagation(); seekVideo('${e.timestamp}');">${e.timestamp || '--:--'}</span>
                  <span style="color:var(--muted); font-size:10px; margin-right:4px;">[${e.period || 'P1'}]</span>
                  <strong style="color:${e.direction === 'offense' ? 'var(--green)' : 'var(--red)'}">${e.direction === 'offense' ? 'OFF' : 'DEF'}</strong> 
                  ${e.move} ${e.tie ? `<span style="color:var(--gold); font-size:10px;">[${e.tie}]</span>` : ''}
                  ${e.detail ? `<span style="color:var(--muted); font-size:10px;">(${e.detail})</span>` : ''}
                </span>
                <span style="color:${e.outcome === 'success' ? 'var(--green)' : 'var(--red)'}; font-weight:700; display:flex; align-items:center; gap:4px;">
                  ${e.outcome} ${e.points ? `(+${e.points})` : (e.detail === 'Pin / Fall' ? '(FALL)' : '')} 
                  <span style="color:var(--gold); font-size:13px;">✎</span>
                </span>
              </div>
            `).join('')}
          </div>

          <label style="display:flex; align-items:flex-start; gap:8px; margin:10px 0 12px 0; font-size:12px; color:var(--chalk); cursor:pointer;">
            <input type="checkbox" style="margin-top:3px;" ${appConfig.aiTrainOnCommit ? 'checked' : ''}
              onchange="appConfig.aiTrainOnCommit = this.checked; persist();" />
            <span>
              <strong style="color:var(--gold);">Add to AI training library</strong>
              <span style="color:var(--muted); display:block; font-size:11px; margin-top:2px;">
                When checked, this match’s scoring log (and video reference — YouTube link or local file copy) is saved for future AI scoring examples.
                Library size: ${aiTrainingLibrary.length} example(s).
              </span>
            </span>
          </label>

          <div class="grid-2">
            <button class="btn btn-green" onclick="commitManualMatch()">Save & Commit Match to Stats</button>
            <button class="btn" style="background:var(--panelLine); color:var(--chalk);" onclick="discardMatch()">Discard Match</button>
          </div>
        </div>
      `;
    }

    function advancePeriod(p) {
      currentPeriod = p;
      logEvent('Flow', `Period Change: ${p}`, 'success', 0, p);

      if (p === 'P3' && activeMatch) {
        const choiceEvents = activeMatch.events.filter(e => e.category === "Choice");
        const p2ChoiceEvs = choiceEvents.filter(e => e.period === "P2");
        const deferEv = p2ChoiceEvs.find(e => e.detail === "Defer");
        const finalP2Pos = p2ChoiceEvs.find(e => e.detail !== "Defer");

        if (deferEv) {
          manualDirection = deferEv.move.includes("Home") ? 'offense' : 'defense';
        } else if (finalP2Pos) {
          manualDirection = finalP2Pos.move.includes("Home") ? 'defense' : 'offense';
        }
      }
      render();
    }

    function recordPositionChoice(choice) {
      const chooser = manualDirection === 'offense' ? 'Home' : 'Opponent';
      logEvent('Choice', `${chooser} Choice: ${choice}`, 'success', 0, choice);

      if (choice === 'Defer') {
        manualDirection = (manualDirection === 'offense') ? 'defense' : 'offense';
      }
      render();
    }

    function renderAIScoutContent(activeW, boutOpponents, autoOpponent) {
      return `
        ${!parsedEvents ? `
          <div class="card">
            <div class="card-title">AI Video Scout: ${activeW.name} (${activeW.weightClass} lbs)</div>
            
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="ai-match-level" class="select" onchange="selectedMatchLevel = this.value">
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Roster</label>
                <select class="select" onchange="document.getElementById('imp-opp').value = this.value">
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>

            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="imp-opp" class="input" value="${autoOpponent}" placeholder="Opponent name" />

            <label style="font-size:11px; color:var(--muted);">Gemini API Key</label>
            <input type="password" id="imp-key" class="input" placeholder="AIzaSy..." value="${localStorage.getItem(API_KEY_STORAGE) || ''}" />

            <div id="ai-status" style="display:none; padding:10px; margin-bottom:8px; border-radius:4px; font-size:12px; font-weight:700; text-align:center; background:var(--goldDim); color:var(--gold);"></div>

            <button id="ai-btn" class="btn btn-gold" style="width:100%;" onclick="runDirectBrowserAnalysis()">Analyze Match with AI</button>
            <div style="font-size:10px; color:var(--muted); margin-top:6px;">*Note: In-browser AI video extraction requires a local file (.mp4) due to browser CORS policies.</div>
          </div>
        ` : `
          <div class="card">
            <div class="card-title">
              <span>Verify Events for ${activeW.name} (${Object.values(selectedEvents).filter(Boolean).length} Selected)</span>
              <button class="btn-back" onclick="cancelImport()">Cancel</button>
            </div>
            <button class="btn btn-gold" style="width:100%; font-size:11px; margin-bottom:8px;" onclick="swapAllDir()">Swap All OFF/DEF</button>
            <div style="max-height:240px; overflow-y:auto; margin-bottom:12px;">
              ${parsedEvents.map((ev, idx) => `
                <div class="item-row">
                  <input type="checkbox" ${selectedEvents[ev.id] ? 'checked' : ''} onchange="toggleSelect('${ev.id}')" />
                  <span style="font-family:monospace; color:var(--gold); cursor:pointer; text-decoration:underline;" onclick="seekVideo('${ev.timestamp}')">${ev.timestamp || '--:--'}</span>
                  <span style="font-weight:700; color:${ev.direction === 'offense' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvDir(${idx})">${ev.direction === 'offense' ? 'OFF' : 'DEF'}</span>
                  <span style="flex:1; margin-left:8px;">${ev.move} ${ev.raw_move && ev.raw_move !== ev.move ? `(${ev.raw_move})` : ''}</span>
                  <span style="color:${ev.outcome === 'success' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvOutcome(${idx})">${ev.outcome}</span>
                </div>
              `).join('')}
            </div>
            <button class="btn btn-green" style="width:100%;" onclick="commitImport()">Commit Events to ${activeW.name}'s Stats</button>
          </div>
        `}
      `;
    }

    function isNestedMoveCategory(cat) {
      const val = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS[cat];
      return !!(val && !Array.isArray(val) && typeof val === "object");
    }

    function renderMoveSelectorTitle() {
      if (!selectedPrimaryCat) return 'Select Category';
      if (selectedPendingMove) {
        const subBit = selectedSubCat ? ` > ${selectedSubCat}` : '';
        return `${selectedPrimaryCat}${subBit} > ${selectedPendingMove}`;
      }
      if (isNestedMoveCategory(selectedPrimaryCat) && !selectedSubCat) return `${selectedPrimaryCat}`;
      if (isNestedMoveCategory(selectedPrimaryCat) && selectedSubCat) return `${selectedPrimaryCat} > ${selectedSubCat}`;
      return `${selectedPrimaryCat}`;
    }

    function renderMoveBackButton() {
      if (selectedPendingMove) return `<button class="btn-back" onclick="selectedPendingMove = null; render();">← Back</button>`;
      if (isNestedMoveCategory(selectedPrimaryCat) && selectedSubCat) return `<button class="btn-back" onclick="selectedSubCat = null; render();">← Back</button>`;
      if (selectedPrimaryCat) return `<button class="btn-back" onclick="setPrimaryCat(null)">← Back</button>`;
      return '';
    }

    function renderMoveSelectorGrid() {
      if (selectedPendingMove) {
        if (selectedPrimaryCat === "Turns" || selectedPrimaryCat === "Near Fall / Pin") {
          const isDef = manualDirection === "defense";
          const catLabel = selectedPrimaryCat === "Turns" ? "Turns" : "Near Fall / Pin";
          if (isDef) {
            // Defense: NF outcomes are "faced" (fail + points to opponent)
            if (selectedPrimaryCat === "Turns") {
              return `
                <div style="font-size:11px; color:var(--muted); margin-bottom:8px; text-align:center;">
                  Defense — log near fall / pin <strong>scored against you</strong> (counts as faced)
                </div>
                <div class="grid-2">
                  <button class="btn btn-red" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', '2-Point NF', 2)">Faced: 2-Point NF (+2 opp)</button>
                  <button class="btn btn-red" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', '3-Point NF', 3)">Faced: 3-Point NF (+3 opp)</button>
                  <button class="btn btn-red" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', '4-Point NF', 4)">Faced: 4-Point NF (+4 opp)</button>
                  <button class="btn btn-red" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', 'Pin / Fall', 0)">Faced: Pin / Fall</button>
                  <button class="btn btn-green" style="padding:10px; grid-column:span 2;" onclick="logTurnDefended('${escAttr(selectedPendingMove)}')">Defended Turn (no score)</button>
                </div>
              `;
            }
            return `
              <div style="font-size:11px; color:var(--muted); margin-bottom:8px; text-align:center;">
                Defense — log near fall / pin <strong>scored against you</strong> (counts as faced)
              </div>
              <div class="grid-2">
                <button class="btn btn-red" style="padding:10px;" onclick="logNearFallScore('2-Point NF', 2)">Faced: 2-Point NF (+2 opp)</button>
                <button class="btn btn-red" style="padding:10px;" onclick="logNearFallScore('3-Point NF', 3)">Faced: 3-Point NF (+3 opp)</button>
                <button class="btn btn-red" style="padding:10px;" onclick="logNearFallScore('4-Point NF', 4)">Faced: 4-Point NF (+4 opp)</button>
                <button class="btn btn-red" style="padding:10px;" onclick="logNearFallScore('Pin / Fall', 0)">Faced: Pin / Fall</button>
                <button class="btn btn-green" style="padding:10px; grid-column:span 2;" onclick="logNearFallDefended()">Defended (no score)</button>
              </div>
            `;
          }
          // Offense
          if (selectedPrimaryCat === "Turns") {
            return `
              <div class="grid-2">
                <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', '2-Point NF', 2)">2-Point NF (+2)</button>
                <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', '3-Point NF', 3)">3-Point NF (+3)</button>
                <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', '4-Point NF', 4)">4-Point NF (+4)</button>
                <button class="btn btn-gold" style="padding:10px;" onclick="logTurnMove('${escAttr(selectedPendingMove)}', 'Pin / Fall', 0)">Win by Pin / Fall (0 Pts)</button>
                <button class="btn btn-red" style="padding:10px; grid-column:span 2;" onclick="logTurnAttemptFailed('${escAttr(selectedPendingMove)}')">Attempt Failed</button>
              </div>
            `;
          }
          return `
            <div class="grid-2">
              <button class="btn btn-green" style="padding:10px;" onclick="logNearFallScore('2-Point NF', 2)">2-Point NF (+2)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logNearFallScore('3-Point NF', 3)">3-Point NF (+3)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logNearFallScore('4-Point NF', 4)">4-Point NF (+4)</button>
              <button class="btn btn-gold" style="padding:10px;" onclick="logNearFallScore('Pin / Fall', 0)">Win by Pin / Fall (0 Pts)</button>
            </div>
          `;
        }
        if (isPenaltyCategory(selectedPrimaryCat)) {
          const forfeitOnly = ["Injury", "Blood", "Forfeit"].includes(selectedPendingMove);
          if (forfeitOnly) {
            const faced = manualDirection === "defense";
            return `
              <div class="grid-1" style="display:grid; gap:8px;">
                <button class="btn ${faced ? 'btn-green' : 'btn-red'}" style="padding:14px; font-weight:800;" onclick="logPenaltyMove('${escAttr(selectedPendingMove)}', 'Forfeit', 0)">
                  ${faced
                    ? `Opponent Forfeits (${selectedPendingMove}) — WIN +6 dual pts`
                    : `We Forfeit (${selectedPendingMove}) — LOSS +6 dual pts to opp`}
                </button>
                <p style="font-size:11px; color:var(--muted); text-align:center;">
                  Direction: <strong>${faced ? "Defense (Faced) = opponent forfeits → we win" : "Offense (By us) = we forfeit → opponent wins"}</strong>
                </p>
              </div>
            `;
          }
          const facedPen = manualDirection === "defense";
          return `
            <div class="grid-3">
              <button class="btn btn-green" style="padding:10px;" onclick="logPenaltyMove('${escAttr(selectedPendingMove)}', '1 Point Penalty', 1)">1 Point (+1)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logPenaltyMove('${escAttr(selectedPendingMove)}', '2 Points Penalty', 2)">2 Points (+2)</button>
              <button class="btn btn-red" style="padding:10px;" onclick="logPenaltyMove('${escAttr(selectedPendingMove)}', 'DQ', 0)">DQ</button>
            </div>
            <p style="font-size:11px; color:var(--muted); text-align:center; margin-top:8px;">
              ${facedPen
                ? "Faced: opponent is penalized → points go to <strong>your</strong> wrestler."
                : "Offense: your wrestler is penalized → points go to the <strong>opponent</strong>."}
            </p>
          `;
        }
      }

      // Standalone Near Fall / Pin: direction-aware (offense scores / defense faced)
      if (selectedPrimaryCat === "Near Fall / Pin") {
        if (manualDirection === "defense") {
          return `
            <div style="font-size:11px; color:var(--muted); margin-bottom:8px; text-align:center;">
              Defense — near falls scored <strong>against you</strong> count as faced
            </div>
            <div class="grid-2">
              <button class="btn btn-red" style="padding:12px; font-weight:800;" onclick="logNearFallScore('2-Point NF', 2)">Faced: 2-Point NF (+2 opp)</button>
              <button class="btn btn-red" style="padding:12px; font-weight:800;" onclick="logNearFallScore('3-Point NF', 3)">Faced: 3-Point NF (+3 opp)</button>
              <button class="btn btn-red" style="padding:12px; font-weight:800;" onclick="logNearFallScore('4-Point NF', 4)">Faced: 4-Point NF (+4 opp)</button>
              <button class="btn btn-red" style="padding:12px; font-weight:800;" onclick="logNearFallScore('Pin / Fall', 0)">Faced: Pin / Fall</button>
              <button class="btn btn-green" style="padding:12px; font-weight:800; grid-column:span 2;" onclick="logNearFallDefended()">Defended (no score)</button>
            </div>
          `;
        }
        return `
          <div class="grid-2">
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logNearFallScore('2-Point NF', 2)">2-Point NF (+2)</button>
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logNearFallScore('3-Point NF', 3)">3-Point NF (+3)</button>
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logNearFallScore('4-Point NF', 4)">4-Point NF (+4)</button>
            <button class="btn btn-gold" style="padding:12px; font-weight:800;" onclick="logNearFallScore('Pin / Fall', 0)">Win by Pin / Fall (0 Pts)</button>
          </div>
        `;
      }

      // 3 Columns Top Categories
      if (!selectedPrimaryCat) {
        return `
          <div class="grid-3">
            ${Object.keys(taxonomy.MOVE_GROUPS).map(cat => `
              <button class="btn" style="background:var(--mat); color:var(--chalk); border:1px solid var(--panelLine); padding:12px;" onclick="setPrimaryCat('${escAttr(cat)}')">
                ${cat}
              </button>
            `).join('')}
          </div>
        `;
      }

      // Nested category sub-groups (Takedown, Turns, …)
      if (isNestedMoveCategory(selectedPrimaryCat) && !selectedSubCat) {
        let subs = Object.keys(taxonomy.MOVE_GROUPS[selectedPrimaryCat]);
        return `
          <div class="grid-3">
            ${subs.map(sub => `
              <button class="btn" style="background:var(--mat); color:var(--chalk); border:1px solid var(--panelLine); padding:12px;" onclick="selectedSubCat = '${escAttr(sub)}'; render();">
                ${sub}
              </button>
            `).join('')}

    function startMatch() {
      const activeW = getActiveWrestler();
      if (!activeW) return;

      if (!store.activeBoutId || store.activeBoutId === "all" || !getActiveBout()) {
        alert("Select a dual or tournament in the Event dropdown before starting a match.\n\nMatches cannot be scored under \"All Events / Season Total\".");
        return;
      }

      // Sync match level from the dropdown if present
      const levelSel = document.getElementById("log-match-level");
      if (levelSel) selectedMatchLevel = levelSel.value;

      const bout = getActiveBout();
      const season = getActiveSeason();
      if (bout && bout.type === "Dual" && store.activeBoutId && store.activeBoutId !== "all") {
        const prior = season.matches.filter(m =>
          m.wrestlerId === activeW.id && m.boutId === store.activeBoutId
        );
        if (prior.length > 0) {
          const levels = prior.map(m => m.level || "Varsity");
          const uniqueLevels = Array.from(new Set(levels));
          const levelList = uniqueLevels.join(", ");
          const msg =
            `${activeW.name} already has a match recorded for this dual (${levelList}).\n\n` +

            `Current selection: ${selectedMatchLevel}\n\n` +
            (selectedMatchLevel === "Varsity"
              ? `Change Match Level to JV or Exhibition, or press OK to continue with Varsity anyway.`
              : `Press OK to continue with ${selectedMatchLevel}, or Cancel to change the level first.`);
          if (!confirm(msg)) return;
        }
      }

      const opponent = document.getElementById("log-opponent").value.trim() || "Opponent";
      activeMatch = { 
        id: Math.random().toString(36).slice(2, 9), 
        wrestlerId: activeW.id, 
        boutId: store.activeBoutId,
        opponent, 
        level: selectedMatchLevel,

        events: []

    function logEvent(category, move, outcome, points = 0, detail = "") {
      const timestamp = pauseVideoAndGetTime();
      const formattedTie = activeTieModifiers.map(m => {
        if (typeof m === 'object') {
          return m.owner === 'opponent' ? `Opp: ${m.tie}` : m.tie;
        }
        return m;
      }).join(" + ");

      activeMatch.events.push({ 
        id: Math.random().toString(36).slice(2, 9), 
        matchId: activeMatch.id, 
        wrestlerId: activeMatch.wrestlerId, 
        boutId: store.activeBoutId,
        period: currentPeriod,
        category, 
        subCategory: selectedSubCat,
        move, 
        tie: formattedTie,
        direction: manualDirection, 
        outcome, 
        points,
        detail,
        timestamp,
        ts: Date.now() 
      });
      selectedPrimaryCat = null;
      selectedSubCat = null;
      selectedPendingMove = null;
      activeTieModifiers = [];
      render();
    }

    function logTurnMove(move, detail, points) {
      // Offense: we scored the NF/pin off the turn. Defense: NF/pin scored against us (faced).
      if (manualDirection === "offense") {
        logEvent("Turns", move, "success", points, detail);
      } else {
        logEvent("Turns", move, "fail", points, detail);
      }
    }

    /** Near Fall / Pin outcomes — direction-aware so defense counts as faced. */
    function logNearFallScore(detail, points) {
      if (manualDirection === "offense") {
        logEvent("Near Fall / Pin", detail, "success", points, detail);
      } else {
        // Faced: opponent earned near-fall / pin points against us
        logEvent("Near Fall / Pin", detail, "fail", points, detail);
      }
    }

    function logNearFallDefended() {
      // Defense only: turn/NF attempt stopped — counts as faced + defended
      logEvent("Near Fall / Pin", "Near Fall Attempt", "success", 0, "Defended");
    }

    function logTurnDefended(move) {
      logEvent("Turns", move, "success", 0, "Defended");
    }

    function logTurnAttemptFailed(move) {
      if (manualDirection === "offense") {
        logEvent("Turns", move, "fail", 0, "Failed");
      } else {
        // Opponent tried the turn and failed — we defended
        logEvent("Turns", move, "success", 0, "Defended");
      }
    }

    function logPenaltyMove(move, detail, points) {
      logEvent('Penalty/DQ', move, 'success', points, detail);
    }

    /* ===== AI TRAINING LIBRARY ===== */
    function openAiTrainingDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("IndexedDB not available"));
        const req = indexedDB.open(AI_TRAINING_IDB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("videos")) db.createObjectStore("videos");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("IDB open failed"));
      });
    }

    async function idbPutTrainingVideo(exampleId, blob) {
      if (!blob || !exampleId) return false;
      try {
        const db = await openAiTrainingDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("videos", "readwrite");
          tx.objectStore("videos").put(blob, exampleId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        console.warn("Could not store training video blob", e);
        return false;
      }
    }

    async function idbGetTrainingVideo(exampleId) {
      try {
        const db = await openAiTrainingDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("videos", "readonly");
          const req = tx.objectStore("videos").get(exampleId);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    }

    async function idbDeleteTrainingVideo(exampleId) {
      try {
        const db = await openAiTrainingDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("videos", "readwrite");
          tx.objectStore("videos").delete(exampleId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        return false;
      }
    }

    function buildTrainingExampleFromActiveMatch() {
      if (!activeMatch) return null;
      const season = getActiveSeason();
      const w = season.roster.find(r => r.id === activeMatch.wrestlerId);
      const bout = season.bouts.find(b => b.id === activeMatch.boutId);
      const events = JSON.parse(JSON.stringify(activeMatch.events || []));
      const result = classifyMatchResult(events);

      let video = { type: "none" };
      if (videoSourceType === "youtube" && youtubeVideoId) {
        video = {
          type: "youtube",
          youtubeId: youtubeVideoId,
          youtubeUrl: "https://www.youtube.com/watch?v=" + youtubeVideoId,
          fileName: videoFileName || ("YouTube [" + youtubeVideoId + "]")
        };
      } else if (videoSourceType === "file" && (selectedVideoFile || videoBlobUrl)) {
        video = {
          type: "file",
          fileName: videoFileName || (selectedVideoFile && selectedVideoFile.name) || "local-video",
          mimeType: (selectedVideoFile && selectedVideoFile.type) || "video/mp4",
          hasLocalBlob: true
        };
      }

      return {
        id: Math.random().toString(36).slice(2, 10),
        savedAt: new Date().toISOString(),
        seasonId: season.id,
        seasonName: season.name,
        wrestlerId: activeMatch.wrestlerId,
        wrestlerName: w ? w.name : "",
        weightClass: w ? w.weightClass : "",
        division: w ? w.division : "",
        boutId: activeMatch.boutId,
        boutLabel: bout ? ((bout.date || "") + " vs " + (bout.opponentTeam || "")) : "",
        opponent: activeMatch.opponent,
        level: activeMatch.level,
        date: activeMatch.date,
        source: "manual",
        events,
        result: {
          ourP: result.ourP,
          oppP: result.oppP,
          outcome: result.result,
          method: result.method
        },
        video
      };
    }

    async function saveActiveMatchToAiTrainingLibrary() {
      const example = buildTrainingExampleFromActiveMatch();
      if (!example) return { ok: false, reason: "no match" };

      // Store local file blob in IndexedDB when available
      if (example.video && example.video.type === "file" && selectedVideoFile) {
        const stored = await idbPutTrainingVideo(example.id, selectedVideoFile);
        example.video.hasLocalBlob = !!stored;
        if (!stored) {
          example.video.note = "Video file could not be stored in IndexedDB (quota or browser limit). Event labels were still saved.";
        }
      } else if (example.video && example.video.type === "file" && videoBlobUrl && !selectedVideoFile) {
        // Try fetch blob from object URL
        try {
          const resp = await fetch(videoBlobUrl);
          const blob = await resp.blob();
          const stored = await idbPutTrainingVideo(example.id, blob);
          example.video.hasLocalBlob = !!stored;
        } catch (e) {
          example.video.hasLocalBlob = false;
          example.video.note = "Local video blob unavailable to store; labels saved.";
        }
      }

      aiTrainingLibrary.push(example);
      try {
        localStorage.setItem(AI_TRAINING_LIBRARY_KEY, JSON.stringify(aiTrainingLibrary));
      } catch (e) {
        // quota — drop video refs and retry metadata only
        example.video = example.video && example.video.type === "youtube" ? example.video : { type: "none", note: "Storage full; video omitted" };
        aiTrainingLibrary[aiTrainingLibrary.length - 1] = example;
        try {
          localStorage.setItem(AI_TRAINING_LIBRARY_KEY, JSON.stringify(aiTrainingLibrary));
        } catch (e2) {
          aiTrainingLibrary.pop();
          return { ok: false, reason: "storage_full" };
        }
      }
      return { ok: true, example };
    }

    function exportAiTrainingLibrary() {
      const payload = {
        type: "mat-scout-ai-training-library",
        version: 1,
        exportedAt: new Date().toISOString(),
        count: aiTrainingLibrary.length,
        examples: aiTrainingLibrary
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mat-scout-ai-training-library.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function clearAiTrainingLibrary() {
      if (!aiTrainingLibrary.length) return alert("Training library is empty.");
      if (!confirm("Clear the entire AI training library (" + aiTrainingLibrary.length + " examples)? Local video copies will also be removed.")) return;
      const ids = aiTrainingLibrary.map(e => e.id);
      aiTrainingLibrary = [];
      persist();
      for (const id of ids) await idbDeleteTrainingVideo(id);
      render();
      alert("AI training library cleared.");
    }


    async function commitManualMatch() {
      if (!activeMatch) return;
      if (!activeMatch.boutId || activeMatch.boutId === "all") {
        alert("This match is not linked to an event. Select a dual or tournament, then re-score the match.");
        return;
      }
      const season = getActiveSeason();
      const trainOn = !!(appConfig && appConfig.aiTrainOnCommit);

      let trainMsg = "";
      if (trainOn) {
        const res = await saveActiveMatchToAiTrainingLibrary();
        if (res.ok) {
          const v = res.example.video || {};
          const vNote = v.type === "youtube" ? "YouTube linked" : (v.type === "file" ? (v.hasLocalBlob ? "local video stored" : "labels only (video not stored)") : "no video");
          trainMsg = "\n\nAI training library: example saved (" + aiTrainingLibrary.length + " total · " + vNote + ").";
        } else if (res.reason === "storage_full") {
          trainMsg = "\n\nWarning: could not save to AI training library (storage full). Match stats were still committed.";
        }
      }

      season.matches.push({
        id: activeMatch.id,
        wrestlerId: activeMatch.wrestlerId,
        boutId: activeMatch.boutId,
        opponent: activeMatch.opponent,
        level: activeMatch.level,
        date: activeMatch.date,
        source: "manual"
      });
      season.events.push(...activeMatch.events);
      activeMatch = null;
      persist();
      if (trainMsg) {
        alert("Match committed to stats." + trainMsg);
      }
      switchTab("sheet");
    }
