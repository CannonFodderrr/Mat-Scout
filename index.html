<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mat Scout — Wrestling Analytics & Match Manager</title>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --mat: #1C1F1E;
      --panel: #25292A;
      --panelLine: #33383A;
      --chalk: #F2F0EA;
      --muted: #8B9290;
      --red: #C23B22;
      --redDim: #4A241C;
      --green: #2F7A4F;
      --greenDim: #1E3B2C;
      --gold: #D9A441;
      --goldDim: #4A3B1D;
      --teamFont: system-ui, -apple-system, sans-serif;
      --teamColor: #F2F0EA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--mat); color: var(--chalk); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; }
    
    /* Header & Brand */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-emblem { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--goldDim); border: 1.5px solid var(--gold); border-radius: 8px; flex-shrink: 0; }
    .logo-emblem svg { width: 22px; height: 22px; fill: var(--gold); }
    .logo-titles { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
    .team-title { font-size: 15px; font-weight: 700; font-family: var(--teamFont); color: var(--teamColor); letter-spacing: 1px; text-transform: uppercase; }
    
    .badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--panelLine); color: var(--chalk); }
    .badge strong { color: var(--gold); }

    /* Scope Bar */
    .scope-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--panelLine); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 11px; gap: 8px; }
    .scope-bar select { background: var(--mat); color: var(--chalk); border: 1px solid var(--panelLine); border-radius: 4px; padding: 4px 8px; font-size: 11px; outline: none; }
    .record-display { font-family: monospace; font-weight: 700; color: var(--gold); }

    /* Navigation */
    .nav-tabs { display: flex; flex-wrap: wrap; background-color: var(--panel); border: 1px solid var(--panelLine); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    .tab-btn { flex: 1; min-width: 80px; padding: 10px 8px; background: transparent; border: none; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; }
    .tab-btn.active { background-color: var(--gold); color: var(--mat); }

    /* Cards & Elements */
    .card { background-color: var(--panel); border: 1px solid var(--panelLine); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input, .select, .textarea { width: 100%; padding: 8px 12px; background-color: var(--mat); color: var(--chalk); border: 1px solid var(--panelLine); border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 8px; }
    
    /* Buttons */
    .btn { padding: 8px 14px; border-radius: 4px; border: none; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-gold { background-color: var(--gold); color: var(--mat); }
    .btn-green { background-color: var(--green); color: var(--chalk); }
    .btn-red { background-color: var(--red); color: var(--chalk); }
    .btn-back { background-color: var(--goldDim); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .btn-back:hover { background-color: var(--gold); color: var(--mat); }
    .btn-remove-video { background-color: var(--redDim); border: 1px solid var(--red); color: var(--red); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
    
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; background-color: var(--mat); border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
    .bar-bg { width: 100%; height: 6px; background-color: var(--panelLine); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; border-radius: 99px; }
    
    video { width: 100%; border-radius: 4px; background: black; max-height: 320px; margin-bottom: 8px; display: block; }
    .yt-wrapper { width: 100%; border-radius: 4px; overflow: hidden; aspect-ratio: 16/9; max-height: 320px; background: black; margin-bottom: 8px; }
    .yt-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    .chip { font-size: 10px; font-weight: 700; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--panelLine); background: var(--mat); color: var(--muted); cursor: pointer; text-transform: uppercase; text-align: center; user-select: none; }
    .chip.selected { background: var(--goldDim); border-color: var(--gold); color: var(--gold); }
    .chip:disabled, .chip.disabled { opacity: 0.35; cursor: not-allowed; }

    .draggable-item { cursor: grab; }
    .draggable-item:active { cursor: grabbing; opacity: 0.6; }

    /* Bout Sheet Styling */
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; text-align: left; }
    .sheet-table th, .sheet-table td { border: 1px solid var(--panelLine); padding: 6px 8px; }
    .sheet-table th { background: var(--mat); color: var(--gold); text-transform: uppercase; font-size: 10px; }
    .sheet-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }

    /* CalGrappler Expanded Table */
    .cg-table { width: 100%; border-collapse: collapse; font-size: 10px; background: #fff; color: #111; margin-top: 8px; }
    .cg-table th, .cg-table td { border: 1px solid #777; padding: 4px 6px; vertical-align: middle; }
    .cg-table th { background: #e5e7eb; color: #111; font-weight: 800; text-transform: uppercase; text-align: center; }
    .cg-legend { font-size: 9px; border: 1px solid #777; padding: 6px; background: #f9fafb; margin-top: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; color: #222; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-box { background: var(--panel); border: 1px solid var(--panelLine); border-radius: 8px; width: 100%; max-width: 580px; padding: 18px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo-emblem">
          <svg viewBox="0 0 24 24">
            <path d="M4.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm15 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM8 7.5c0-.83-.67-1.5-1.5-1.5S5 6.67 5 7.5 5.67 9 6.5 9 8 8.33 8 7.5zm11 0c0-.83-.67-1.5-1.5-1.5S16 6.67 16 7.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5zM3 13.5l3.5-2 3 2.5v7h2v-5l-2-2 1.5-3.5 2 2h3l2-2 1.5 3.5-2 2v5h2v-7l3-2.5 3.5 2-1 2-2.5-1.5-2 4.5h-3l-2-3-2 3H6.5l-2-4.5L2 15.5l1-2z"/>
          </svg>
        </div>
        <div class="logo-titles">
          <span class="logo">Mat Scout</span>
          <span id="header-team-title" class="team-title"></span>
        </div>
      </div>
      <div id="active-wrestler-display" class="badge">Active: <strong>None</strong></div>
    </div>

    <!-- Active Season & Event Scope Bar -->
    <div class="scope-bar">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span><strong>Season:</strong></span>
        <select id="global-season-select" onchange="switchActiveSeason(this.value)"></select>
        <span style="margin-left: 6px;"><strong>Event:</strong></span>
        <select id="global-bout-select" onchange="switchActiveBout(this.value)"></select>
      </div>
      <div id="dual-record-details" class="record-display">Boys: 0-0-0 | Girls: 0-0-0</div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('roster')">Roster</button>
      <button class="tab-btn" onclick="switchTab('scout')">Scout</button>
      <button class="tab-btn" onclick="switchTab('sheet')">Bout Sheet</button>
      <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
      <button class="tab-btn" onclick="switchTab('plan')">Training Plan</button>
      <button class="tab-btn" onclick="switchTab('admin')">Admin</button>
    </div>

    <!-- Persistent Global Video Player Container -->
    <div id="global-video-card" class="card" style="display:none; padding-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div id="global-video-title" class="card-title" style="margin-bottom:0;">Match Video Player</div>
        <button class="btn-remove-video" onclick="clearSharedVideo()">✕ Remove Video</button>
      </div>
      
      <!-- Native MP4 Video Player -->
      <video id="persistent-video" controls style="display:none;"></video>
      
      <!-- YouTube Video Embed Container -->
      <div id="yt-player-container" class="yt-wrapper" style="display:none;">
        <div id="yt-player-target"></div>
      </div>
      
      <div style="font-size:11px; color:var(--muted);">Video pauses automatically when tagging moves. Click timestamps in the log to seek.</div>
    </div>

    <div id="tab-content"></div>
  </div>

  <div id="modal-root"></div>
  <canvas id="frame-canvas" style="display:none;"></canvas>

  <script>
    const STORAGE_KEY = "mat-scout-season-store-v8";
    const TAXONOMY_STORAGE_KEY = "mat-scout-custom-taxonomy-v8";
    const WEIGHT_CLASSES_STORAGE_KEY = "mat-scout-weight-classes-v8";
    const BRANDING_STORAGE_KEY = "mat-scout-branding-v8";
    const COLOR_THEME_STORAGE_KEY = "mat-scout-color-theme-v8";
    const API_KEY_STORAGE = "mat-scout-gemini-api-key";
    const SAMPLE_SEASON_ID = "season_sample_2026";

    const DEFAULT_WEIGHT_CLASSES = {
      Boys: ["106", "113", "120", "126", "132", "138", "144", "150", "157", "165", "175", "190", "215", "285"],
      Girls: ["100", "105", "110", "115", "120", "125", "130", "135", "140", "145", "155", "170", "190", "235"]
    };

    const DEFAULT_TAXONOMY = {
      alphabetize: false,
      MOVE_GROUPS: {
        "Takedown": {
          "Shots": ["Single Leg", "Double Leg", "High Crotch", "Ankle Pick", "Fireman's Carry", "Dresser Dump"],
          "Throws": ["Pinch Headlock", "Sag Headlock", "Harai Goshi", "Lat Drop", "Cow Catcher", "Pancake"],
          "Ducks / Slides": ["Kolat Duck", "Hildebrandt Slide-By"],
          "Go Behinds": ["Snap Down", "Front Headlock", "Arm Drag"],
          "Defensive": ["Sprawl Go Behind", "Leg Elevator", "Broomstick", "Headlock Roll Through", "Spladle"],
          "Other": ["Standing Cradle", "Undefined"]
        },
        "Escape": ["Stand-Up", "Switch", "Sit-Out"],
        "Reversal": ["Standing Switch", "Roll", "Switch", "Granby Roll"],
        "Turns": ["Half", "Arm Bar", "Over/Under", "2 on 1 Tilt"],
        "Near Fall / Pin": ["2-Point NF", "3-Point NF", "4-Point NF", "Pin / Fall"],
        "Penalty": ["Full Nelson", "Locked Hands", "Illegal Move", "Stalling", "Unsportsmanlike"]
      },
      TIE_MODIFIERS: [
        "Overhook", "Underhook", "Over/Under", "Collar Tie", "Inside Tie", "Outside Tie", "Over Tie", "Wrist Control", "Elbow Control", "Russian", "2 on 1"
      ]
    };

    const POINT_VALUES = {
      "Single Leg": 3, "Double Leg": 3, "High Crotch": 3, "Ankle Pick": 3, "Fireman's Carry": 3, "Dresser Dump": 3,
      "Pinch Headlock": 3, "Sag Headlock": 3, "Harai Goshi": 3, "Lat Drop": 3, "Cow Catcher": 3, "Pancake": 3,
      "Kolat Duck": 3, "Hildebrandt Slide-By": 3,
      "Snap Down": 3, "Front Headlock": 3, "Arm Drag": 3,
      "Sprawl Go Behind": 3, "Leg Elevator": 3, "Broomstick": 3, "Headlock Roll Through": 3, "Spladle": 3,
      "Standing Cradle": 3, "Undefined": 3,
      "Stand-Up": 1, "Switch": 2, "Sit-Out": 1, "Standing Switch": 2, "Roll": 2, "Granby Roll": 2,
      "2-Point NF": 2, "3-Point NF": 3, "4-Point NF": 4, "Pin / Fall": 0,
      "Half": 0, "Arm Bar": 0, "Over/Under": 0, "2 on 1 Tilt": 0,
      "Full Nelson": 0, "Locked Hands": 0, "Illegal Move": 0, "Stalling": 0, "Unsportsmanlike": 0
    };

    const DRILLS = {
      "Single Leg": "Penetration step reps (3x10), low-single finishes, running-the-pike drill",
      "Double Leg": "Level-change drilling, shot-to-finish reps, head-up posture on entry",
      "High Crotch": "Hip-in finishes, crack-down counters, lift-and-turn drilling",
      "Ankle Pick": "Hand-fighting into pick setups, snap-and-pick combos",
      "Fireman's Carry": "Carry entries off collar ties, dump finishes, partner-resistance reps",
      "Dresser Dump": "Inside-reach dump setups, high-amplitude roll finishes",
      "Pinch Headlock": "Inside position tie, head-and-arm pinch, tight chest turn",
      "Sag Headlock": "Sag drop angle, rotational hip leverage, controlling the near arm",
      "Harai Goshi": "Over/under setup, hip sweeping mechanics, controlled mat return",
      "Lat Drop": "Overhook/underhook squeeze, hip-pop elevation, back-arch control",
      "Cow Catcher": "Front headlock elevation, underhook turn to back exposure",
      "Pancake": "Overhook whizzer chest crush to instant back fall",
      "Kolat Duck": "Wrist-tie snap to explosive back-step duck under",
      "Hildebrandt Slide-By": "Inside tie elbow pop, clearing hips through to the back",
      "Snap Down": "Heavy snap-and-spin drilling, front headlock positioning, go-behinds",
      "Front Headlock": "Chin-and-armpit control, front headlock shucks and re-attacks",
      "Arm Drag": "Inside tie to arm drag, quick penetration step to the back",
      "Sprawl Go Behind": "Heavy hip sprawl, redirecting head, spinning behind for control",
      "Leg Elevator": "Whizzer leverage, leg shelfing, elevator roll-through counter",
      "Broomstick": "Front headlock broomstick leverage roll to back exposure",
      "Headlock Roll Through": "Defense against sag headlock, rolling with momentum to top control",
      "Spladle": "Defending low singles with roll-through spladle counter lock",
      "Standing Cradle": "Securing head-and-knee lock from neutral before returning to mat",
      "Stand-Up": "Stand-up series vs. building resistance, hand control, base-and-post reps",
      "Switch": "Hip switch drilling, arm-chop recovery, elbow control on bottom",
      "Sit-Out": "Sit-out-to-turn reps, base recovery, re-shots after sit-out",
      "Standing Switch": "Standing switch timing off underhook defense",
      "Roll": "Roll-through counters, hip heist to control",
      "Granby Roll": "Shoulder rolls from referee's bottom position, clearing hips"
    };

    let store = {
      activeSeasonId: "s1",
      activeBoutId: "all",
      activeWrestlerId: null,
      seasons: [
        {
          id: "s1",
          name: "2025–2026 Winter Season",
          style: "Folkstyle",
          boysDualRecord: { wins: 0, losses: 0, ties: 0 },
          girlsDualRecord: { wins: 0, losses: 0, ties: 0 },
          roster: [],
          bouts: [],
          matches: [],
          events: []
        }
      ]
    };

    let weightClasses = DEFAULT_WEIGHT_CLASSES;

    let branding = {
      teamName: "Scorpions Wrestling",
      teamColor: "#F2F0EA",
      teamFont: "system-ui, -apple-system, sans-serif"
    };

    let customTheme = {
      mat: "#1C1F1E",
      panel: "#25292A",
      gold: "#D9A441",
      green: "#2F7A4F",
      red: "#C23B22"
    };

    let taxonomy = DEFAULT_TAXONOMY;
    let currentTab = "roster";
    let rosterDivisionFilter = "All";

    let scoutMode = "manual";
    let selectedMatchLevel = "Varsity";

    let activeMatch = null;
    let manualDirection = "offense";
    let selectedPrimaryCat = null;
    let selectedSubCat = null;
    let selectedPendingMove = null;
    let activeTieModifiers = [];
    let currentPeriod = "P1";

    let editingEvent = null;
    let editingWrestler = null;
    let editingBout = null;
    let expandedStatMove = null;
    let expandedDefStatMove = null;

    let boutFormBuffer = {
      date: new Date().toISOString().slice(0, 10),
      type: "Dual",
      division: "Boys",
      opponentTeam: "",
      opponents: []
    };

    let activeModal = null;

    // Video State
    let videoSourceType = "file";
    let videoBlobUrl = null;
    let selectedVideoFile = null;
    let videoFileName = "";
    let youtubeVideoId = null;
    let ytPlayer = null;
    let ytApiReady = false;

    let parsedEvents = null;
    let selectedEvents = {};

    function onYouTubeIframeAPIReady() {
      ytApiReady = true;
    }

    function init() {
      try {
        const savedStore = localStorage.getItem(STORAGE_KEY);
        if (savedStore) store = JSON.parse(savedStore);
        
        const savedTax = localStorage.getItem(TAXONOMY_STORAGE_KEY);
        if (savedTax) taxonomy = JSON.parse(savedTax);

        const savedWeights = localStorage.getItem(WEIGHT_CLASSES_STORAGE_KEY);
        if (savedWeights) weightClasses = JSON.parse(savedWeights);

        const savedBrand = localStorage.getItem(BRANDING_STORAGE_KEY);
        if (savedBrand) branding = JSON.parse(savedBrand);

        const savedTheme = localStorage.getItem(COLOR_THEME_STORAGE_KEY);
        if (savedTheme) {
          customTheme = JSON.parse(savedTheme);
          applyTheme(customTheme);
        }

        applyBranding(branding);

        if (!store.activeSeasonId && store.seasons.length > 0) {
          store.activeSeasonId = store.seasons[0].id;
        }
      } catch (err) {}
      render();
    }

    function applyTheme(theme) {
      document.documentElement.style.setProperty('--mat', theme.mat);
      document.documentElement.style.setProperty('--panel', theme.panel);
      document.documentElement.style.setProperty('--gold', theme.gold);
      document.documentElement.style.setProperty('--green', theme.green);
      document.documentElement.style.setProperty('--red', theme.red);
    }

    function applyBranding(b) {
      document.documentElement.style.setProperty('--teamColor', b.teamColor);
      document.documentElement.style.setProperty('--teamFont', b.teamFont);
      const titleEl = document.getElementById("header-team-title");
      if (titleEl) titleEl.textContent = b.teamName ? `· ${b.teamName}` : "";
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        localStorage.setItem(TAXONOMY_STORAGE_KEY, JSON.stringify(taxonomy));
        localStorage.setItem(WEIGHT_CLASSES_STORAGE_KEY, JSON.stringify(weightClasses));
        localStorage.setItem(BRANDING_STORAGE_KEY, JSON.stringify(branding));
        localStorage.setItem(COLOR_THEME_STORAGE_KEY, JSON.stringify(customTheme));
      } catch (err) {}
    }

    function getActiveSeason() {
      return store.seasons.find(s => s.id === store.activeSeasonId) || store.seasons[0];
    }

    function getActiveWrestler() {
      const season = getActiveSeason();
      return season.roster.find(w => w.id === store.activeWrestlerId) || null;
    }

    function getActiveBout() {
      const season = getActiveSeason();
      if (store.activeBoutId === "all") return null;
      return season.bouts.find(b => b.id === store.activeBoutId) || null;
    }

    function getActiveWeightClasses() {
      const bout = getActiveBout();
      if (bout && bout.division === "Girls") return weightClasses.Girls;
      const wrestler = getActiveWrestler();
      if (wrestler && wrestler.division === "Girls") return weightClasses.Girls;
      return weightClasses.Boys;
    }

    function switchActiveSeason(seasonId) {
      store.activeSeasonId = seasonId;
      store.activeBoutId = "all";
      const season = getActiveSeason();
      store.activeWrestlerId = season.roster.length > 0 ? season.roster[0].id : null;
      activeMatch = null;
      persist();
      render();
    }

    function switchActiveBout(boutId) {
      store.activeBoutId = boutId;
      activeMatch = null;
      persist();
      render();
    }

    function setActiveWrestler(id) {
      store.activeWrestlerId = id;
      const w = getActiveWrestler();
      if (w) selectedMatchLevel = w.level || "Varsity";
      persist();
      render();
    }

    function getAllMovesFlat() {
      const moves = [];
      Object.keys(taxonomy.MOVE_GROUPS).forEach(cat => {
        const val = taxonomy.MOVE_GROUPS[cat];
        if (Array.isArray(val)) {
          moves.push(...val);
        } else {
          Object.values(val).forEach(subList => moves.push(...subList));
        }
      });
      return Array.from(new Set(moves));
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", ["roster", "scout", "sheet", "stats", "plan", "admin"][idx] === tab);
      });
      render();
    }

    /* VIDEO ENGINE */
    function extractYouTubeVideoId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.trim().match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function syncVideoPlayerVisibility() {
      const card = document.getElementById("global-video-card");
      const title = document.getElementById("global-video-title");
      const vid = document.getElementById("persistent-video");
      const ytContainer = document.getElementById("yt-player-container");

      const hasVideo = (videoSourceType === "file" && videoBlobUrl) || (videoSourceType === "youtube" && youtubeVideoId);
      const shouldShow = hasVideo && (currentTab === "scout");

      if (card) {
        card.style.display = shouldShow ? "block" : "none";
        if (title) title.textContent = `Match Video Player: ${videoFileName || 'YouTube Footage'}`;
        
        if (videoSourceType === "file") {
          if (vid) {
            vid.style.display = "block";
            if (vid.src !== videoBlobUrl) vid.src = videoBlobUrl || "";
          }
          if (ytContainer) ytContainer.style.display = "none";
        } else if (videoSourceType === "youtube") {
          if (vid) vid.style.display = "none";
          if (ytContainer) ytContainer.style.display = "block";
          initOrUpdateYouTubePlayer(youtubeVideoId);
        }
      }
    }

    function initOrUpdateYouTubePlayer(videoId) {
      if (!videoId) return;
      if (!ytPlayer && window.YT && YT.Player) {
        ytPlayer = new YT.Player('yt-player-target', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: { 'playsinline': 1, 'rel': 0 }
        });
      } else if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.cueVideoById(videoId);
      }
    }

    function handleSharedVideoFile(e) {
      const file = e.target.files[0];
      if (file) {
        videoSourceType = "file";
        selectedVideoFile = file;
        videoFileName = file.name;
        if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
        videoBlobUrl = URL.createObjectURL(file);
        youtubeVideoId = null;
        render();
      }
    }

    function handleLoadYouTubeUrl() {
      const input = document.getElementById("yt-url-input");
      if (!input) return;
      const url = input.value.trim();
      const id = extractYouTubeVideoId(url);
      if (!id) return alert("Please enter a valid YouTube video URL.");

      videoSourceType = "youtube";
      youtubeVideoId = id;
      videoFileName = `YouTube [${id}]`;
      selectedVideoFile = null;
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = null;
      render();
    }

    function clearSharedVideo() {
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = null;
      selectedVideoFile = null;
      videoFileName = "";
      youtubeVideoId = null;

      const vid = document.getElementById("persistent-video");
      if (vid) {
        vid.pause();
        vid.removeAttribute("src");
        vid.load();
      }

      if (ytPlayer && ytPlayer.pauseVideo) {
        ytPlayer.pauseVideo();
      }
      render();
    }

    function pauseVideoAndGetTime() {
      if (videoSourceType === "youtube") {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          try { ytPlayer.pauseVideo(); } catch (err) {}
          const s = Math.floor(ytPlayer.getCurrentTime() || 0);
          const mm = String(Math.floor(s / 60)).padStart(2, '0');
          const ss = String(s % 60).padStart(2, '0');
          return `${mm}:${ss}`;
        }
        return "00:00";
      }

      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return "";
      vid.pause();
      const s = Math.floor(vid.currentTime || 0);
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function seekVideo(ts) {
      if (!ts) return;
      const parts = ts.split(":").map(Number);
      const secs = parts.length === 2 ? parts[0] * 60 + parts[1] : Number(ts) || 0;

      if (videoSourceType === "youtube") {
        if (ytPlayer && ytPlayer.seekTo) {
          ytPlayer.seekTo(secs, true);
          try { ytPlayer.playVideo(); } catch (err) {}
        }
        return;
      }

      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return;
      vid.currentTime = secs;
      vid.play().catch(() => {});
    }

    /* ROSTER TAB RENDERING */
    function getWrestlerRecord(wrestlerId) {
      const season = getActiveSeason();
      let wins = 0, losses = 0;
      season.matches.filter(m => m.wrestlerId === wrestlerId).forEach(m => {
        const evs = season.events.filter(e => e.matchId === m.id);
        let ourP = 0, oppP = 0;
        evs.forEach(e => {
          const pts = e.points || 0;
          if (e.category === "Penalty") {
            if (e.direction === "offense") oppP += pts;
            else ourP += pts;
          } else {
            if (e.direction === "offense") ourP += pts;
            else if (e.outcome === "fail") oppP += pts;
          }
        });
        const hasPin = evs.some(e => e.direction === "offense" && (e.detail === "Pin / Fall" || e.detail === "Pin"));
        if (ourP > oppP || hasPin) wins++;
        else losses++;
      });
      return `${wins}-${losses}`;
    }

      if (!name || !weightClass) return alert("Please enter wrestler name and weight class.");

      const newId = Math.random().toString(36).slice(2, 9);
      season.roster.push({ id: newId, name, weightClass, division, level, grade });
      if (!store.activeWrestlerId) {
        store.activeWrestlerId = newId;
        selectedMatchLevel = level;
      }

      persist();
      render();
    }

    function deleteWrestler(id) {
      const season = getActiveSeason();
      season.roster = season.roster.filter(w => w.id !== id);
      season.matches = season.matches.filter(m => m.wrestlerId !== id);
      season.events = season.events.filter(e => e.wrestlerId !== id);
      if (store.activeWrestlerId === id) {
        store.activeWrestlerId = season.roster.length > 0 ? season.roster[0].id : null;
      }
      persist();
      render();
    }

    function deleteBout(boutId) {
      const season = getActiveSeason();
      season.bouts = season.bouts.filter(b => b.id !== boutId);
      if (store.activeBoutId === boutId) store.activeBoutId = "all";
      persist();
      render();
    }

    /* SCOUT TAB */
    function getOpponentForActiveWrestler() {
      const activeW = getActiveWrestler();
      const bout = getActiveBout();
      if (!activeW || !bout || !bout.opponentRoster) return "";
      const match = bout.opponentRoster.find(o => o.weightClass === activeW.weightClass);
      return match ? match.name : "";
    }

    function renderScout(target) {
      const season = getActiveSeason();
      const activeW = getActiveWrestler();
      const activeBout = getActiveBout();

      if (season.roster.length === 0) {
        target.innerHTML = '<div class="card"><p style="color:var(--muted); font-size:12px;">Add wrestlers in the Roster tab first.</p></div>';
        return;
      }

      const autoOpponent = getOpponentForActiveWrestler();
      const boutOpponents = activeBout && activeBout.opponentRoster ? activeBout.opponentRoster : [];

      target.innerHTML = `
        <!-- Top of Page: Athlete Selector & Mode Switcher -->
        <div class="card" style="padding:10px 14px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase;">Athlete Under Review:</span>
            <select class="select" style="margin-bottom:0; flex:1; max-width:340px; font-size:12px; font-weight:700;" onchange="setActiveWrestler(this.value)">
              ${season.roster.map(w => `<option value="${w.id}" ${w.id === store.activeWrestlerId ? 'selected' : ''}>${w.name} — ${w.weightClass} lbs (${w.level})</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="grid-2" style="margin-bottom:12px;">
          <button class="btn" style="background:${scoutMode === 'manual' ? 'var(--gold)' : 'var(--panel)'}; color:${scoutMode === 'manual' ? 'var(--mat)' : 'var(--chalk)'};" onclick="scoutMode = 'manual'; render();">
            Manual Scoring Mode
          </button>
          <button class="btn" style="background:${scoutMode === 'ai' ? 'var(--gold)' : 'var(--panel)'}; color:${scoutMode === 'ai' ? 'var(--mat)' : 'var(--chalk)'};" onclick="scoutMode = 'ai'; render();">
            AI Video Scout Mode
          </button>
        </div>

        <!-- Video Selection & Source Chooser -->
        ${!videoBlobUrl && !youtubeVideoId ? `
          <div class="card" style="padding:12px; margin-bottom:12px;">
            <div style="font-size:11px; font-weight:700; color:var(--gold); margin-bottom:6px;">Choose Match Video Source:</div>
            <div class="grid-2" style="margin-bottom:8px;">
              <div>
                <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Option 1: Upload Video (.mp4)</label>
                <input type="file" accept="video/*" class="input" style="margin-bottom:0;" onchange="handleSharedVideoFile(event)" />
              </div>
              <div>
                <label style="font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700;">Option 2: YouTube Match URL</label>
                <div style="display:flex; gap:4px;">
                  <input id="yt-url-input" class="input" style="margin-bottom:0;" placeholder="https://youtube.com/watch?v=..." />
                  <button class="btn btn-gold" onclick="handleLoadYouTubeUrl()">Load</button>
                </div>
              </div>
            </div>
          </div>
        ` : ''}

        ${scoutMode === 'manual' ? renderManualScoutContent(activeW, boutOpponents, autoOpponent) : renderAIScoutContent(activeW, boutOpponents, autoOpponent)}
      `;
    }

    function renderManualScoutContent(activeW, boutOpponents, autoOpponent) {
      if (!activeMatch) {
        return `
          <div class="card">
            <div class="card-title">Score Match: ${activeW.name} (${activeW.weightClass} lbs)</div>
            
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="log-match-level" class="select" onchange="selectedMatchLevel = this.value">
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Opponent Roster</label>
                <select id="log-opp-select" class="select" onchange="document.getElementById('log-opponent').value = this.value">
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>

            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="log-opponent" class="input" value="${autoOpponent}" placeholder="Enter opponent name" />
            <button class="btn btn-gold" style="width:100%; margin-top:4px;" onclick="startMatch()">Start Scoring Match</button>
          </div>
        `;
      }

      // Point Calculation
      let ourPts = 0;
      let oppPts = 0;

      activeMatch.events.forEach(e => {
        const pts = e.points || 0;
        if (e.category === "Penalty") {
          if (e.direction === "offense") oppPts += pts;
          else ourPts += pts;
        } else {
          if (e.direction === "offense") ourPts += pts;
          else if (e.outcome === "fail") oppPts += pts;
        }
      });

      const choiceEvents = activeMatch.events.filter(e => e.category === "Choice");
      const p2ChoiceEv = choiceEvents.find(e => e.period === "P2");
      const p3ChoiceEv = choiceEvents.find(e => e.period === "P3");

      const hasEventsInP1 = activeMatch.events.some(e => e.period === "P1");
      const hasEventsInP2 = activeMatch.events.some(e => e.period === "P2");

      let p2Allowed = hasEventsInP1;
      let p3Allowed = hasEventsInP2;

      let decisionButtonsDisabled = true;
      let currentChooserText = "Neutral Start";

      if (currentPeriod === "P2") {
        if (!p2ChoiceEv) {
          decisionButtonsDisabled = false;
          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P2` : `Opponent's Choice for P2`;
        } else if (p2ChoiceEv.detail === "Defer") {
          currentChooserText = `Opponent Choice (Deferred)`;
        } else {
          currentChooserText = `P2 Set: ${p2ChoiceEv.move}`;
        }
      } else if (currentPeriod === "P3") {
        if (!p3ChoiceEv) {
          decisionButtonsDisabled = false;
          currentChooserText = manualDirection === 'offense' ? `${activeW.name}'s Choice for P3` : `Opponent's Choice for P3`;
        } else {
          currentChooserText = `P3 Set: ${p3ChoiceEv.move}`;
        }
      }

      return `
        <!-- Score Header -->
        <div class="grid-2" style="margin-bottom:10px;">
          <div style="background-color:var(--greenDim); border:1px solid var(--green); padding:8px 12px; text-align:center; border-radius:6px;">
            <div style="font-size:10px; font-weight:700; color:var(--green); text-transform:uppercase;">${activeW.name} (${activeMatch.level})</div>
            <div style="font-size:28px; font-weight:800; font-family:monospace;">${ourPts}</div>
          </div>
          <div style="background-color:var(--redDim); border:1px solid var(--red); padding:8px 12px; text-align:center; border-radius:6px;">
            <div style="font-size:10px; font-weight:700; color:var(--red); text-transform:uppercase;">${activeMatch.opponent}</div>
            <div style="font-size:28px; font-weight:800; font-family:monospace;">${oppPts}</div>
          </div>
        </div>

        <!-- Thinner Period Bar with Dynamic Position Choices -->
        <div class="card" style="padding:6px 12px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase;">Period: ${currentPeriod}</div>
            <div style="font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;">${currentChooserText}</div>
          </div>
          
          <div style="display:flex; justify-content:space-between; align-items:center; gap:4px; flex-wrap:wrap;">
            <div style="display:flex; gap:4px;">
              <button class="chip ${currentPeriod === 'P1' ? 'selected' : ''}" onclick="advancePeriod('P1')">P1</button>
              <button class="chip ${currentPeriod === 'P2' ? 'selected' : ''}" ${!p2Allowed && currentPeriod !== 'P2' && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P2')">P2</button>
              <button class="chip ${currentPeriod === 'P3' ? 'selected' : ''}" ${!p3Allowed && currentPeriod !== 'P3' ? 'disabled' : ''} onclick="advancePeriod('P3')">P3</button>
              <button class="chip ${currentPeriod === 'OT' ? 'selected' : ''}" onclick="advancePeriod('OT')">OT</button>
            </div>

            <div style="display:flex; gap:4px;">
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Top')">Top</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Bottom')">Bottom</button>
              <button class="chip" ${decisionButtonsDisabled || currentPeriod !== 'P2' ? 'disabled' : ''} onclick="recordPositionChoice('Defer')">Defer</button>
              <button class="chip" ${decisionButtonsDisabled ? 'disabled' : ''} onclick="recordPositionChoice('Neutral')">Neutral</button>
            </div>
          </div>
        </div>

        <!-- Direction Switcher ABOVE Tie Setup Modifiers -->
        <div class="grid-2" style="margin-bottom:10px;">
          <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'offense' ? 'var(--green)' : 'var(--panel)'}; color:var(--chalk);" onclick="setDir('offense')">
            Offense (By ${activeW.name})
          </button>
          <button class="btn" style="padding:10px; font-weight:800; background:${manualDirection === 'defense' ? 'var(--red)' : 'var(--panel)'}; color:var(--chalk);" onclick="setDir('defense')">
            Faced (vs. ${activeW.name})
          </button>
        </div>

        <!-- Multi-Tie Setup Modifiers -->
        <div class="card" style="padding:10px 14px;">
          <div style="font-size:10px; font-weight:800; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-bottom:6px;">
            Tie Setup Modifiers (Select Multiple) ${activeTieModifiers.length ? `<span style="color:var(--gold);">(${activeTieModifiers.join(', ')})</span>` : ''}
          </div>
          <div class="grid-3">
            ${taxonomy.TIE_MODIFIERS.map(tie => `
              <div class="chip ${activeTieModifiers.includes(tie) ? 'selected' : ''}" onclick="toggleTieModifierMulti('${tie}')">
                ${tie}
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Move Selection (3 Columns) -->
        <div class="card">
          <div class="card-title">
            <span>${renderMoveSelectorTitle()}</span>
            ${renderMoveBackButton()}
          </div>
          ${renderMoveSelectorGrid()}
        </div>

        <!-- Scoring Log -->
        <div class="card">
          <div class="card-title">
            <span>Scoring Log (${activeMatch.events.length} events)</span>
            <span style="font-size:10px; color:var(--muted); font-weight:400; text-transform:none;">Click any action to edit</span>
          </div>
          <div style="max-height:180px; overflow-y:auto; margin-bottom:12px;">
            ${activeMatch.events.length === 0 ? '<p style="font-size:11px; color:var(--muted);">No actions tagged yet.</p>' : ''}
            ${activeMatch.events.slice().reverse().map((e) => `
              <div class="item-row" style="cursor:pointer;" onclick="openEditEventModal('${e.id}')">
                <span>
                  <span style="font-family:monospace; color:var(--gold); margin-right:6px; text-decoration:underline;" onclick="event.stopPropagation(); seekVideo('${e.timestamp}');">${e.timestamp || '--:--'}</span>
                  <span style="color:var(--muted); font-size:10px; margin-right:4px;">[${e.period || 'P1'}]</span>
                  <strong style="color:${e.direction === 'offense' ? 'var(--green)' : 'var(--red)'}">${e.direction === 'offense' ? 'OFF' : 'DEF'}</strong> 
                  ${e.move} ${e.tie ? `<span style="color:var(--gold); font-size:10px;">[${e.tie}]</span>` : ''}
                  ${e.detail ? `<span style="color:var(--muted); font-size:10px;">(${e.detail})</span>` : ''}
                </span>
                <span style="color:${e.outcome === 'success' ? 'var(--green)' : 'var(--red)'}; font-weight:700; display:flex; align-items:center; gap:4px;">
                  ${e.outcome} ${e.points ? `(+${e.points})` : (e.detail === 'Pin / Fall' ? '(FALL)' : '')} 
                  <span style="color:var(--gold); font-size:13px;">✎</span>
                </span>
              </div>
            `).join('')}
          </div>

          <div class="grid-2">
            <button class="btn btn-green" onclick="commitManualMatch()">Save & Commit Match to Stats</button>
            <button class="btn" style="background:var(--panelLine); color:var(--chalk);" onclick="discardMatch()">Discard Match</button>
          </div>
        </div>
      `;
    }

    function advancePeriod(p) {
      currentPeriod = p;
      logEvent('Flow', `Period Change: ${p}`, 'success', 0, p);
    }

    function recordPositionChoice(choice) {
      const chooser = manualDirection === 'offense' ? 'Home' : 'Opponent';
      logEvent('Choice', `${chooser} Choice: ${choice}`, 'success', 0, choice);
    }

    function renderAIScoutContent(activeW, boutOpponents, autoOpponent) {
      return `
        ${!parsedEvents ? `
          <div class="card">
            <div class="card-title">AI Video Scout: ${activeW.name} (${activeW.weightClass} lbs)</div>
            
            <div class="grid-2">
              <div>
                <label style="font-size:11px; color:var(--muted);">Match Level</label>
                <select id="ai-match-level" class="select" onchange="selectedMatchLevel = this.value">
                  <option value="Varsity" ${selectedMatchLevel === 'Varsity' ? 'selected' : ''}>Varsity</option>
                  <option value="JV" ${selectedMatchLevel === 'JV' ? 'selected' : ''}>JV</option>
                  <option value="Exh" ${selectedMatchLevel === 'Exh' ? 'selected' : ''}>Exhibition (Exh)</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--muted);">Select from Event Roster</label>
                <select class="select" onchange="document.getElementById('imp-opp').value = this.value">
                  <option value="">-- Choose Opponent --</option>
                  ${boutOpponents.map(o => `<option value="${o.name}" ${o.name === autoOpponent ? 'selected' : ''}>${o.name} (${o.weightClass} lbs)</option>`).join('')}
                </select>
              </div>
            </div>

            <label style="font-size:11px; color:var(--muted);">Opponent Name</label>
            <input id="imp-opp" class="input" value="${autoOpponent}" placeholder="Opponent name" />

            <label style="font-size:11px; color:var(--muted);">Gemini API Key</label>
            <input type="password" id="imp-key" class="input" placeholder="AIzaSy..." value="${localStorage.getItem(API_KEY_STORAGE) || ''}" />

            <div id="ai-status" style="display:none; padding:10px; margin-bottom:8px; border-radius:4px; font-size:12px; font-weight:700; text-align:center; background:var(--goldDim); color:var(--gold);"></div>

            <button id="ai-btn" class="btn btn-gold" style="width:100%;" onclick="runDirectBrowserAnalysis()">Analyze Match with AI</button>
            <div style="font-size:10px; color:var(--muted); margin-top:6px;">*Note: In-browser AI video extraction requires a local file (.mp4) due to browser CORS policies.</div>
          </div>
        ` : `
          <div class="card">
            <div class="card-title">
              <span>Verify Events for ${activeW.name} (${Object.values(selectedEvents).filter(Boolean).length} Selected)</span>
              <button class="btn-back" onclick="cancelImport()">Cancel</button>
            </div>
            <button class="btn btn-gold" style="width:100%; font-size:11px; margin-bottom:8px;" onclick="swapAllDir()">Swap All OFF/DEF</button>
            <div style="max-height:240px; overflow-y:auto; margin-bottom:12px;">
              ${parsedEvents.map((ev, idx) => `
                <div class="item-row">
                  <input type="checkbox" ${selectedEvents[ev.id] ? 'checked' : ''} onchange="toggleSelect('${ev.id}')" />
                  <span style="font-family:monospace; color:var(--gold); cursor:pointer; text-decoration:underline;" onclick="seekVideo('${ev.timestamp}')">${ev.timestamp || '--:--'}</span>
                  <span style="font-weight:700; color:${ev.direction === 'offense' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvDir(${idx})">${ev.direction === 'offense' ? 'OFF' : 'DEF'}</span>
                  <span style="flex:1; margin-left:8px;">${ev.move} ${ev.raw_move && ev.raw_move !== ev.move ? `(${ev.raw_move})` : ''}</span>
                  <span style="color:${ev.outcome === 'success' ? 'var(--green)' : 'var(--red)'}; cursor:pointer;" onclick="toggleEvOutcome(${idx})">${ev.outcome}</span>
                </div>
              `).join('')}
            </div>
            <button class="btn btn-green" style="width:100%;" onclick="commitImport()">Commit Events to ${activeW.name}'s Stats</button>
          </div>
        `}
      `;
    }

    function renderMoveSelectorTitle() {
      if (!selectedPrimaryCat) return 'Select Category';
      if (selectedPendingMove) return `${selectedPrimaryCat} > ${selectedPendingMove}`;
      if (selectedPrimaryCat === 'Takedown' && !selectedSubCat) return `Takedowns`;
      if (selectedPrimaryCat === 'Takedown' && selectedSubCat) return `Takedown > ${selectedSubCat}`;
      return `${selectedPrimaryCat}`;
    }

    function renderMoveBackButton() {
      if (selectedPendingMove) return `<button class="btn-back" onclick="selectedPendingMove = null; render();">← Back</button>`;
      if (selectedPrimaryCat === 'Takedown' && selectedSubCat) return `<button class="btn-back" onclick="selectedSubCat = null; render();">← Back</button>`;
      if (selectedPrimaryCat) return `<button class="btn-back" onclick="setPrimaryCat(null)">← Back</button>`;
      return '';
    }

    function renderMoveSelectorGrid() {
      if (selectedPendingMove) {
        if (selectedPrimaryCat === "Turns" || selectedPrimaryCat === "Near Fall / Pin") {
          return `
            <div class="grid-2">
              <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', '2-Point NF', 2)">2-Point NF (+2)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', '3-Point NF', 3)">3-Point NF (+3)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', '4-Point NF', 4)">4-Point NF (+4)</button>
              <button class="btn btn-gold" style="padding:10px;" onclick="logTurnMove('${selectedPendingMove}', 'Pin / Fall', 0)">Win by Pin / Fall (0 Pts)</button>
              <button class="btn btn-red" style="padding:10px; grid-column:span 2;" onclick="logEvent('Turns', '${selectedPendingMove}', 'fail', 0, 'Failed')">Attempt Failed</button>
            </div>
          `;
        }
        if (selectedPrimaryCat === "Penalty") {
          return `
            <div class="grid-3">
              <button class="btn btn-green" style="padding:10px;" onclick="logPenaltyMove('${selectedPendingMove}', '1 Point Penalty', 1)">1 Point (+1)</button>
              <button class="btn btn-green" style="padding:10px;" onclick="logPenaltyMove('${selectedPendingMove}', '2 Points Penalty', 2)">2 Points (+2)</button>
              <button class="btn btn-red" style="padding:10px;" onclick="logPenaltyMove('${selectedPendingMove}', 'DQ', 0)">DQ</button>
            </div>
          `;
        }
      }

      // Standalone Near Fall / Pin: 1-Click Direct Scoring
      if (selectedPrimaryCat === "Near Fall / Pin") {
        return `
          <div class="grid-2">
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', '2-Point NF', 'success', 2, '2-Point NF')">2-Point NF (+2)</button>
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', '3-Point NF', 'success', 3, '3-Point NF')">3-Point NF (+3)</button>
            <button class="btn btn-green" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', '4-Point NF', 'success', 4, '4-Point NF')">4-Point NF (+4)</button>
            <button class="btn btn-gold" style="padding:12px; font-weight:800;" onclick="logEvent('Near Fall / Pin', 'Pin / Fall', 'success', 0, 'Pin / Fall')">Win by Pin / Fall (0 Pts)</button>
          </div>
        `;
      }

      // 3 Columns Top Categories
      if (!selectedPrimaryCat) {
        return `
          <div class="grid-3">
            ${Object.keys(taxonomy.MOVE_GROUPS).map(cat => `
              <button class="btn" style="background:var(--mat); color:var(--chalk); border:1px solid var(--panelLine); padding:12px;" onclick="setPrimaryCat('${cat}')">
                ${cat}
              </button>
            `).join('')}
          </div>
        `;
      }

      // 3 Columns Takedown Subcategories
      if (selectedPrimaryCat === 'Takedown' && !selectedSubCat) {
        let subs = Object.keys(taxonomy.MOVE_GROUPS.Takedown);
        if (taxonomy.alphabetize) subs = [...subs].sort();
        return `
          <div class="grid-3">
            ${subs.map(sub => `
              <button class="btn" style="background:var(--mat); color:var(--chalk); border:1px solid var(--panelLine); padding:12px;" onclick="selectedSubCat = '${sub}'; render();">
                ${sub}
              </button>
            `).join('')}
          </div>
        `;
      }

      let movesList = selectedPrimaryCat === 'Takedown' 
        ? taxonomy.MOVE_GROUPS.Takedown[selectedSubCat] 
        : taxonomy.MOVE_GROUPS[selectedPrimaryCat];

      if (taxonomy.alphabetize && movesList) movesList = [...movesList].sort();

      return `
        <div class="grid-3">
          ${movesList.map(m => `
            <div style="background:var(--mat); padding:8px; border-radius:4px; border:1px solid var(--panelLine);">
              <div style="font-size:11px; font-weight:700; margin-bottom:6px; truncate;">
                ${m}
              </div>
              <div style="display:flex; flex-direction:column; gap:4px;">
                ${(selectedPrimaryCat === 'Turns' || selectedPrimaryCat === 'Near Fall / Pin' || selectedPrimaryCat === 'Penalty') ? `
                  <button class="btn btn-gold" style="padding:6px; font-size:10px;" onclick="selectedPendingMove = '${m}'; render();">
                    Outcome
                  </button>
                ` : `
                  <button class="btn btn-green" style="padding:4px; font-size:10px;" onclick="logEvent('${selectedPrimaryCat}', '${m}', 'success', ${selectedPrimaryCat === 'Takedown' ? 3 : (POINT_VALUES[m] || 0)})">
                    ${manualDirection === 'offense' ? 'Success' : 'Defended'}
                  </button>
                  <button class="btn btn-red" style="padding:4px; font-size:10px;" onclick="logEvent('${selectedPrimaryCat}', '${m}', 'fail', ${manualDirection === 'defense' ? (selectedPrimaryCat === 'Takedown' ? 3 : (POINT_VALUES[m] || 0)) : 0})">
                    ${manualDirection === 'offense' ? 'Fail' : 'Scored On (+Pts)'}
                  </button>
                `}
              </div>

          if (oppNum > ourNum) {
            assignedWeight = oppW.weightClass;
            isBumped = true;
          }

        const matchPayload = { ...m, ourW, oppW, assignedWeight, isBumped };
        if (m.level === "Varsity") varsityMatches.push(matchPayload);

          matchEvs.forEach(e => {

            if (e.category === "Penalty") {
              if (e.direction === "offense") oppP += pts;
              else ourP += pts;
            } else {
              if (e.direction === "offense") ourP += pts;
              else if (e.outcome === "fail") oppP += pts;

          const hasPin = matchEvs.some(e => e.detail === "Pin / Fall" || e.detail === "Pin" || e.move.includes("Pin"));

          if (ourP > oppP || (hasPin && matchEvs.some(e => e.direction === "offense" && (e.detail === "Pin / Fall" || e.detail === "Pin")))) {

        matchEvs.forEach(e => {

            if (e.direction === "offense") oppP += pts;
            else ourP += pts;
          } else {
            if (e.direction === "offense") ourP += pts;
            else if (e.outcome === "fail") oppP += pts;

            <td><strong>${m.assignedWeight}</strong></td>
            <td>${m.ourW ? m.ourW.name : 'Unknown'}</td>
            <td>${m.opponent}</td>
            <td>${m.level}</td>

            <td style="color:var(--muted); font-size:10px;">(0 Exh)</td>

    function finalizeDualMeet(ourPts, oppPts) {
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      if (!activeBout || activeBout.type !== "Dual") return alert("Only dual meets can be finalized to the dual team record.");

      if (activeBout.finalized) {
        if (!confirm("This bout was already finalized. Overwrite previous record calculation?")) return;
      }

      const rec = activeBout.division === "Girls" 
        ? (season.girlsDualRecord || (season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 }))
        : (season.boysDualRecord || (season.boysDualRecord = { wins: 0, losses: 0, ties: 0 }));

      if (ourPts > oppPts) rec.wins += 1;
      else if (oppPts > ourPts) rec.losses += 1;
      else rec.ties = (rec.ties || 0) + 1;

      activeBout.finalized = true;
      persist();
      alert(`Dual Meet Finalized! Updated record.`);
      render();
    }

    /* CALGRAPPLER EXPANDED STAT SHEET */
    function renderCalGrapplerExpandedSheet() {
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      const currentWeights = getActiveWeightClasses();

      let cumHomeTeamPts = 0;
      let cumOppTeamPts = 0;

      const rows = currentWeights.map(weight => {
        const ourW = season.roster.find(w => w.weightClass === weight && w.level === "Varsity");
        const match = season.matches.find(m => {
          if (store.activeBoutId !== "all" && m.boutId !== store.activeBoutId) return false;
          return ourW && m.wrestlerId === ourW.id;
        });

        const oppW = activeBout && activeBout.opponentRoster ? activeBout.opponentRoster.find(o => o.weightClass === weight) : null;
        const oppName = match ? match.opponent : (oppW ? oppW.name : "FORFEIT");

        let p1Score = "—", p2Score = "—", p3Score = "—", fallTime = "—", matchScore = "—", homeDualPt = "", oppDualPt = "";

        if (match) {
          const matchEvs = season.events.filter(e => e.matchId === match.id);
          
          const symbolMap = (e) => {
            if (e.category === "Choice") {
              const who = e.direction === "offense" ? "H" : "V";
              return `${who}:Choice[${e.detail || e.move}]`;
            }
            const who = e.direction === "offense" ? "H" : "V";
            let sym = "T3";
            if (e.category === "Escape") sym = "E1";
            else if (e.category === "Reversal") sym = "R2";
            else if (e.detail && e.detail.includes("2-Point")) sym = "N2";
            else if (e.detail && e.detail.includes("3-Point")) sym = "N3";
            else if (e.detail && e.detail.includes("4-Point")) sym = "N4";
            else if (e.category === "Penalty") sym = "P1";
            return `${who}:${sym}`;
          };

          const p1Evs = matchEvs.filter(e => e.period === "P1" && (e.outcome === "success" || e.category === "Choice"));
          const p2Evs = matchEvs.filter(e => e.period === "P2" && (e.outcome === "success" || e.category === "Choice"));
          const p3Evs = matchEvs.filter(e => e.period === "P3" && (e.outcome === "success" || e.category === "Choice"));

          p1Score = p1Evs.map(symbolMap).join(", ") || "0-0";
          p2Score = p2Evs.map(symbolMap).join(", ") || "—";
          p3Score = p3Evs.map(symbolMap).join(", ") || "—";

          let ourP = 0, oppP = 0;
          matchEvs.forEach(e => {
            const pts = e.points || 0;
            if (e.category === "Penalty") {
              if (e.direction === "offense") oppP += pts;
              else ourP += pts;
            } else {
              if (e.direction === "offense") ourP += pts;
              else if (e.outcome === "fail") oppP += pts;
            }
          });

          matchScore = `${ourP} - ${oppP}`;

          const pinEv = matchEvs.find(e => e.detail === "Pin / Fall" || e.detail === "Pin");
          if (pinEv) fallTime = pinEv.timestamp || "FALL";

          if (ourP > oppP || pinEv) {
            const pts = pinEv ? 6 : (ourP - oppP >= 15 ? 5 : (ourP - oppP >= 8 ? 4 : 3));
            cumHomeTeamPts += pts;
            homeDualPt = String(cumHomeTeamPts);
          } else {
            const pts = pinEv ? 6 : (oppP - ourP >= 15 ? 5 : (oppP - ourP >= 8 ? 4 : 3));
            cumOppTeamPts += pts;
            oppDualPt = String(cumOppTeamPts);
          }
        }

        return `
          <tr>
            <td style="text-align:center; font-weight:800;">${weight}</td>
            <td><strong>Home:</strong> ${ourW ? ourW.name : 'FORFEIT'}<br/><strong>Opp:</strong> ${oppName}</td>
            <td>${p1Score}</td>
            <td>${p2Score}</td>
            <td>${p3Score}</td>
            <td style="text-align:center; font-weight:700;">${fallTime}</td>
            <td style="text-align:center; font-weight:800;">${matchScore}</td>
            <td style="text-align:center; font-weight:800; color:var(--green);">${homeDualPt}</td>
            <td style="text-align:center; font-weight:800; color:var(--red);">${oppDualPt}</td>
          </tr>
        `;
      }).join('');

      return `
        <div style="overflow-x:auto;">
          <table class="cg-table">
            <thead>
              <tr>
                <th rowspan="2">Weight</th>
                <th rowspan="2">Wrestlers</th>
                <th colspan="3">Match Sequence & Positions</th>
                <th rowspan="2">Fall Time</th>
                <th rowspan="2">Match Score</th>
                <th colspan="2">Team Score</th>
              </tr>
              <tr>
                <th>1st Period</th>
                <th>2nd Period</th>
                <th>3rd Period</th>
                <th>Home</th>
                <th>Vist</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>

          <div class="cg-legend">
            <div><strong>SCORING SYMBOLS</strong></div>
            <div><strong>TAKEDOWN</strong> - T3</div>
            <div><strong>REVERSAL</strong> - R2</div>
            <div><strong>ESCAPE</strong> - E1</div>
            <div><strong>NEAR FALL</strong> - N2, N3, N4</div>
            <div><strong>PENALTY</strong> - P1, P2</div>
            <div><strong>CHOICE</strong> - Top, Bot, Def</div>
          </div>
        </div>
      `;
    }

    /* FULL SYMMETRIC STATS & TRAINING PLAN */
    function computeStatsWithTieBreakdown(wrestlerId) {
      const season = getActiveSeason();
      const wEvents = season.events.filter(e => {
        if (e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        return true;
      });

      const offense = {}, defense = {};

      wEvents.forEach(e => {
        const bucket = e.direction === "offense" ? offense : defense;
        if (!bucket[e.move]) {
          bucket[e.move] = { move: e.move, category: e.category, attempts: 0, success: 0, ties: {} };
        }
        bucket[e.move].attempts += 1;
        if (e.outcome === "success") bucket[e.move].success += 1;

        const tieKey = e.tie || "Open / Unspecified Tie";
        if (!bucket[e.move].ties[tieKey]) {
          bucket[e.move].ties[tieKey] = { tie: tieKey, attempts: 0, success: 0 };
        }
        bucket[e.move].ties[tieKey].attempts += 1;
        if (e.outcome === "success") bucket[e.move].ties[tieKey].success += 1;
      });

      const format = obj => Object.values(obj).map(r => ({
        ...r,
        rate: Math.round((r.success / r.attempts) * 100),
        tieList: Object.values(r.ties).map(t => ({
          ...t,
          rate: Math.round((t.success / t.attempts) * 100)
        })).sort((a,b) => b.attempts - a.attempts)
      })).sort((a,b) => b.attempts - a.attempts);

      return { offense: format(offense), defense: format(defense) };
    }

    function adminAddWeightClass(div) {
      const input = document.getElementById(div === "Boys" ? "adm-add-boy-weight" : "adm-add-girl-weight");
      if (!input) return;
      const wt = input.value.trim();
      if (!wt || isNaN(wt)) return alert("Please enter a numeric weight class.");

      if (!weightClasses[div].includes(wt)) {
        weightClasses[div].push(wt);
        weightClasses[div].sort((a, b) => Number(a) - Number(b));
      }
      input.value = "";
      persist();
      render();
    }

    function adminDeleteWeightClass(div, wt) {
      weightClasses[div] = weightClasses[div].filter(w => w !== wt);

      render();

    function resetDefaultWeightClasses() {
      if (!confirm("Reset all Boys and Girls weight classes to NFHS standard defaults?")) return;
      weightClasses = JSON.parse(JSON.stringify(DEFAULT_WEIGHT_CLASSES));
      persist();
      render();
    }

    function dragStart(e, cat, sub, idx) {
      draggedMove = { cat, sub, idx };
    }

    function dropMove(e, targetCat, targetSub, targetIdx) {
      e.preventDefault();
      if (!draggedMove || draggedMove.cat !== targetCat || draggedMove.sub !== targetSub) return;
      
      let list = targetSub ? taxonomy.MOVE_GROUPS[targetCat][targetSub] : taxonomy.MOVE_GROUPS[targetCat];
      const item = list.splice(draggedMove.idx, 1)[0];
      list.splice(targetIdx, 0, item);
      draggedMove = null;
      persist();
      render();
    }

    function adminAddMove() {
      const cat = document.getElementById("adm-cat").value;
      const moveName = document.getElementById("adm-move-name").value.trim();
      if (!moveName) return alert("Please enter a move name.");

      if (cat === "Takedown") {
        const sub = document.getElementById("adm-subcat").value;
        if (!taxonomy.MOVE_GROUPS.Takedown[sub].includes(moveName)) {
          taxonomy.MOVE_GROUPS.Takedown[sub].push(moveName);
        }
      } else {
        if (!taxonomy.MOVE_GROUPS[cat].includes(moveName)) {
          taxonomy.MOVE_GROUPS[cat].push(moveName);
        }
      }
      persist();
      render();
    }

    function adminDeleteMove(cat, sub, moveName) {
      if (cat === "Takedown" && sub) {
        taxonomy.MOVE_GROUPS.Takedown[sub] = taxonomy.MOVE_GROUPS.Takedown[sub].filter(m => m !== moveName);
      } else {
        taxonomy.MOVE_GROUPS[cat] = taxonomy.MOVE_GROUPS[cat].filter(m => m !== moveName);

      persist();

    function toggleEditModalTie(tie) {
      if (!editingEvent) return;
      let ties = editingEvent.tie ? editingEvent.tie.split(" + ") : [];
      if (ties.includes(tie)) ties = ties.filter(t => t !== tie);
      else ties.push(tie);
      editingEvent.tie = ties.join(" + ");
      renderModal();
    }

    function addOpponentToEditingBout() {
      const name = document.getElementById("modal-ed-opp-name").value.trim();
      const weightClass = document.getElementById("modal-ed-opp-weight").value.trim();
      if (!name || !weightClass) return alert("Enter opponent name and weight class.");
      if (!editingBout.opponentRoster) editingBout.opponentRoster = [];
      editingBout.opponentRoster.push({ name, weightClass });
      document.getElementById("modal-ed-opp-name").value = "";
      document.getElementById("modal-ed-opp-weight").value = "";
      renderModal();
    }

    function saveEditedWrestler() {
      const season = getActiveSeason();
      const idx = season.roster.findIndex(w => w.id === editingWrestler.id);
      if (idx !== -1) {
        season.roster[idx] = { ...editingWrestler };
      }
      closeModal();
      persist();
      render();
    }

    function saveEditedBout() {
      const season = getActiveSeason();
      const idx = season.bouts.findIndex(b => b.id === editingBout.id);
      if (idx !== -1) {
        season.bouts[idx] = { ...editingBout };
      }
      closeModal();
      persist();
      render();
    }

    function addBufferedOpponent() {
      const name = document.getElementById("modal-opp-name").value.trim();
      const weightClass = document.getElementById("modal-opp-weight").value.trim();
      const grade = document.getElementById("modal-opp-grade").value.trim();
      if (!name || !weightClass) return alert("Enter opponent name and weight class.");

      boutFormBuffer.opponents.push({ name, weightClass, grade });
      document.getElementById("modal-opp-name").value = "";
      document.getElementById("modal-opp-weight").value = "";
      document.getElementById("modal-opp-grade").value = "";
      renderModal();
    }

    function saveNewSeason() {
      const name = document.getElementById("modal-s-name").value.trim();
      const style = document.getElementById("modal-s-style").value;
      const importId = document.getElementById("modal-s-import").value;

      if (!name) return alert("Please enter a season name.");

      let initialRoster = [];
      if (importId !== "none") {
        const sourceSeason = store.seasons.find(s => s.id === importId);
        if (sourceSeason) {
          initialRoster = sourceSeason.roster.map(w => ({
            ...w,
            id: Math.random().toString(36).slice(2, 9),
            grade: (Number(w.grade) < 12 ? String(Number(w.grade) + 1) : "12")
          }));
        }
      }

      const newSeasonId = Math.random().toString(36).slice(2, 9);
      store.seasons.push({
        id: newSeasonId,
        name,
        style,
        boysDualRecord: { wins: 0, losses: 0, ties: 0 },
        girlsDualRecord: { wins: 0, losses: 0, ties: 0 },
        roster: initialRoster,
        bouts: [],
        matches: [],
        events: []
      });

      store.activeSeasonId = newSeasonId;
      store.activeBoutId = "all";
      store.activeWrestlerId = initialRoster.length > 0 ? initialRoster[0].id : null;
      closeModal();
      persist();
      render();
    }

    function saveNewBout() {
      const season = getActiveSeason();
      if (!boutFormBuffer.opponentTeam.trim()) return alert("Please enter the opponent team name.");

      const newBoutId = Math.random().toString(36).slice(2, 9);
      season.bouts.push({
        id: newBoutId,
        date: boutFormBuffer.date,
        type: boutFormBuffer.type,
        division: boutFormBuffer.division,
        opponentTeam: boutFormBuffer.opponentTeam.trim(),
        opponentRoster: [...boutFormBuffer.opponents],
        finalized: false
      });

      store.activeBoutId = newBoutId;
      boutFormBuffer = { date: new Date().toISOString().slice(0, 10), type: "Dual", division: "Boys", opponentTeam: "", opponents: [] };
      closeModal();
      persist();
      render();
    }

    function saveEditedEvent() {
      if (!activeMatch || !editingEvent) return;
      const idx = activeMatch.events.findIndex(e => e.id === editingEvent.id);
      if (idx !== -1) {
        activeMatch.events[idx] = { ...editingEvent };
      }
      closeModal();
    }

    function deleteEditedEvent() {
      if (!activeMatch || !editingEvent) return;
      activeMatch.events = activeMatch.events.filter(e => e.id !== editingEvent.id);
      closeModal();
    }

    /* IN-BROWSER AI ENGINE */
    async function extractFrames(file, statusCb) {
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.preload = "auto";
        video.src = URL.createObjectURL(file);
        video.muted = true;

        const canvas = document.getElementById("frame-canvas");
        const ctx = canvas.getContext("2d");
        const frames = [];

        video.onloadedmetadata = async () => {
          canvas.width = 480;
          canvas.height = Math.round(480 * (video.videoHeight / video.videoWidth));
          const duration = Math.min(video.duration, 180);
          const interval = 1.0;

          for (let time = 0; time < duration; time += interval) {
            statusCb(`Extracting match frames: ${Math.round((time / duration) * 100)}%`);
            await new Promise(r => {
              video.currentTime = time;
              video.onseeked = () => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
                frames.push({
                  time: `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(Math.floor(time % 60)).padStart(2, '0')}`,
                  base64: dataUrl.split(",")[1]
                });
                r();
              };
            });
          }
          URL.revokeObjectURL(video.src);
          resolve(frames);
        };
        video.onerror = () => reject(new Error("Could not decode local video file."));
      });
    }

    async function runDirectBrowserAnalysis() {
      const activeW = getActiveWrestler();
      if (!activeW) return alert("Select an active wrestler first.");

      const key = document.getElementById("imp-key").value.trim();
      const opponent = document.getElementById("imp-opp").value.trim() || "Opponent";

      if (!key) return alert("Please enter your Gemini API Key.");
      if (!selectedVideoFile) return alert("Please select a video file.");

      localStorage.setItem(API_KEY_STORAGE, key);
      const statusDiv = document.getElementById("ai-status");
      const aiBtn = document.getElementById("ai-btn");
      statusDiv.style.display = "block";
      aiBtn.disabled = true;

      try {
        const frames = await extractFrames(selectedVideoFile, (txt) => { statusDiv.textContent = txt; });
        statusDiv.textContent = `Analyzing ${frames.length} frames with Gemini...`;

        const contentsParts = [
          {
            text: `You are scoring a wrestling match for wrestler "${activeW.name}" vs "${opponent}". Takedowns score 3 points.
Watch sequential frames and return ONLY a JSON array of scoring actions with:
- "category": ("Takedown", "Escape", "Reversal", "Turns", "Near Fall / Pin", "Penalty")
- "move": specific move name
- "raw_move": specific move name or setup
- "direction": "offense" or "defense"
- "outcome": "success" or "fail"
- "timestamp": mm:ss
- "confidence": "high", "medium", or "low"`
          }
        ];

        frames.forEach(f => {
          contentsParts.push({ text: `Frame Time: ${f.time}` });
          contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: f.base64 } });
        });

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: contentsParts }] })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || "Gemini API error.");
        }

        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        let clean = text.trim();
        if (clean.startsWith("```")) clean = clean.split("```")[1].replace(/^json/, "");
        
        parsedEvents = JSON.parse(clean).map(e => ({ ...e, id: Math.random().toString(36).slice(2, 9) }));
        selectedEvents = {};
        parsedEvents.forEach(e => { selectedEvents[e.id] = e.confidence !== 'low'; });
        render();
      } catch (err) {
        alert("Analysis Error: " + err.message);
        statusDiv.style.display = "none";
        aiBtn.disabled = false;
      }
    }

    function toggleSelect(id) { selectedEvents[id] = !selectedEvents[id]; render(); }
    function toggleEvDir(idx) { parsedEvents[idx].direction = parsedEvents[idx].direction === 'offense' ? 'defense' : 'offense'; render(); }
    function toggleEvOutcome(idx) { parsedEvents[idx].outcome = parsedEvents[idx].outcome === 'success' ? 'fail' : 'success'; render(); }
    function swapAllDir() { parsedEvents.forEach(e => { e.direction = e.direction === 'offense' ? 'defense' : 'offense'; }); render(); }
    function cancelImport() { parsedEvents = null; render(); }

    function commitImport() {
      const activeW = getActiveWrestler();
      const season = getActiveSeason();
      if (!activeW) return;
      const opponent = document.getElementById("imp-opp")?.value.trim() || "Opponent";
      const matchId = Math.random().toString(36).slice(2, 9);
      season.matches.push({ id: matchId, wrestlerId: activeW.id, boutId: store.activeBoutId, opponent, level: selectedMatchLevel, date: new Date().toISOString().slice(0, 10), source: "video" });
      parsedEvents.filter(e => selectedEvents[e.id]).forEach(e => {
        season.events.push({
          id: e.id, matchId, wrestlerId: activeW.id, boutId: store.activeBoutId, category: e.category || "Takedown",
          move: e.move || "Unknown", rawMove: e.raw_move || e.move,
          direction: e.direction || "offense", outcome: e.outcome || "success", 
          timestamp: e.timestamp || "",
          ts: Date.now()
        });
      });
      parsedEvents = null;
      persist();
      switchTab("sheet");
    }

    window.onload = init;
