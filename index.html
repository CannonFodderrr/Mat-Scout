    function deleteMatch(matchId) {
      const season = getActiveSeason();
      const match = (season.matches || []).find(m => m.id === matchId);
      if (!match) return;
      const w = season.roster.find(r => r.id === match.wrestlerId);
      const eventCount = (season.events || []).filter(e => e.matchId === matchId).length;
      const label = w ? w.name : "this wrestler";
      const msg =
        `Delete match for ${label} vs ${match.opponent || "Opponent"}?\n\n` +
        `This will permanently remove the match and ${eventCount} scoring event(s). ` +
        `Stats derived from this match will no longer appear on the Stats page.`;
      if (!confirm(msg)) return;

      season.matches = (season.matches || []).filter(m => m.id !== matchId);
      season.events = (season.events || []).filter(e => e.matchId !== matchId);
      if (activeMatch && activeMatch.id === matchId) activeMatch = null;
      viewingMatchId = null;
      activeModal = null;
      persist();
      render();
    }

                ${wrestlerMatches.map(m => {

    function finalizeDualMeet(ourPts, oppPts) {
      const season = getActiveSeason();
      const activeBout = getActiveBout();
      if (!activeBout || activeBout.type !== "Dual") return alert("Only dual meets can be finalized to the dual team record.");

      if (activeBout.finalized) {
        if (!confirm("This dual was already finalized. Re-finalizing will overwrite the previous dual-record contribution for this bout with the current team score. Continue?")) return;
      }

      const rec = activeBout.division === "Girls" 
        ? (season.girlsDualRecord || (season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 }))
        : (season.boysDualRecord || (season.boysDualRecord = { wins: 0, losses: 0, ties: 0 }));

      // Undo previous finalize contribution so re-finalize overwrites instead of double-counting
      if (activeBout.finalized && activeBout.finalizedSnapshot) {
        const prev = activeBout.finalizedSnapshot;
        if (prev.outcome === "win") rec.wins = Math.max(0, (rec.wins || 0) - 1);
        else if (prev.outcome === "loss") rec.losses = Math.max(0, (rec.losses || 0) - 1);
        else if (prev.outcome === "tie") rec.ties = Math.max(0, (rec.ties || 0) - 1);
      }

      let outcome = "tie";
      if (ourPts > oppPts) {
        rec.wins = (rec.wins || 0) + 1;
        outcome = "win";
      } else if (oppPts > ourPts) {
        rec.losses = (rec.losses || 0) + 1;
        outcome = "loss";
      } else {
        rec.ties = (rec.ties || 0) + 1;
        outcome = "tie";
      }

      activeBout.finalized = true;
      activeBout.finalizedSnapshot = { ourPts, oppPts, outcome, at: Date.now() };
      persist();
      alert(`Dual Meet Finalized (${outcome.toUpperCase()} ${ourPts}-${oppPts}). Season dual record updated.`);
      render();
    }

    /* FULL SYMMETRIC STATS & TRAINING PLAN */
    function computeStatsWithTieBreakdown(wrestlerId) {
      const season = getActiveSeason();
      const wEvents = season.events.filter(e => {
        if (e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        return true;
      });

      const offense = {}, defense = {};

      wEvents.forEach(e => {
        // Period changes and position choices are excluded from efficiency
        if (e.category === "Choice" || e.category === "Flow") return;
        const bucket = e.direction === "offense" ? offense : defense;

        function addToBucket(category, move, success, tie) {
          const key = `${category}::${move}`;
          if (!bucket[key]) {
            bucket[key] = { move: move, category: category, attempts: 0, success: 0, ties: {} };
          }
          bucket[key].attempts += 1;
          if (success) bucket[key].success += 1;
          const tieKey = tie || "Open / Unspecified Tie";
          if (!bucket[key].ties[tieKey]) {
            bucket[key].ties[tieKey] = { tie: tieKey, attempts: 0, success: 0 };
          }
          bucket[key].ties[tieKey].attempts += 1;
          if (success) bucket[key].ties[tieKey].success += 1;
        }

        const isSuccess = e.outcome === "success";
        addToBucket(e.category, e.move, isSuccess, e.tie);

        // Near falls scored off a turn also appear under Near Fall / Pin on the stat sheet
        if (e.category === "Turns" && e.detail) {
          const d = e.detail;
          if (d.includes("Point NF") || d === "Pin / Fall" || d.includes("Pin")) {
            const nfMove = d.includes("2-Point") ? "2-Point NF"
              : d.includes("3-Point") ? "3-Point NF"
              : d.includes("4-Point") ? "4-Point NF"
              : (d.includes("Pin") ? "Pin / Fall" : d);
            // For turns, success on offense = we scored NF; fail on defense = they scored NF on us
            // Defended turn (detail Defended) should not count as NF scored
            if (d === "Defended" || d === "Failed") {
              // skip NF dual-count
            } else {
              const nfSuccess = (e.direction === "offense" && e.outcome === "success")
                || (e.direction === "defense" && e.outcome === "fail");
              // Represent attempt: for defense faced NF, outcome is fail → still an "attempt" they succeeded
              // Keep success flag aligned with whether the NF was scored by that side's actor
              addToBucket("Near Fall / Pin", nfMove, e.direction === "offense" ? isSuccess : (e.outcome === "fail"), e.move || e.tie);
            }
          }
        }
      });

      const format = obj => Object.values(obj).map(r => ({
        ...r,
        rate: Math.round((r.success / r.attempts) * 100),
        tieList: Object.values(r.ties).map(t => ({
          ...t,
          rate: Math.round((t.success / t.attempts) * 100)
        })).sort((a,b) => b.attempts - a.attempts)
      })).sort((a,b) => b.attempts - a.attempts);

      return { offense: format(offense), defense: format(defense) };
    }

    function getMoveGroupMeta(move, category) {
      const group = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS[category];
      if (group && !Array.isArray(group) && typeof group === "object") {
        for (const sub of Object.keys(group)) {
          if ((group[sub] || []).includes(move)) {
            return { groupKey: `${category}::${sub}`, header: `${category} · ${sub}`, sortCat: category, sortSub: sub };
          }
        }
        return { groupKey: `${category}::Other`, header: `${category} · Other`, sortCat: category, sortSub: "ZZZ" };
      }
      const cat = category || "Other";
      return { groupKey: cat, header: cat, sortCat: cat, sortSub: "" };
    }

    function taxonomyCategoryOrder() {
      return Object.keys(taxonomy.MOVE_GROUPS || {});
    }

    function taxonomySubOrder(cat) {
      const val = taxonomy.MOVE_GROUPS[cat];
      if (val && !Array.isArray(val) && typeof val === "object") return Object.keys(val);
      return [];
    }

    function groupStatsRowsByCategory(rows) {
      const catOrder = taxonomyCategoryOrder();
      const groups = new Map();
      rows.forEach(r => {
        const meta = getMoveGroupMeta(r.move, r.category);
        if (!groups.has(meta.groupKey)) {
          groups.set(meta.groupKey, { ...meta, rows: [] });
        }
        groups.get(meta.groupKey).rows.push(r);
      });
      const list = Array.from(groups.values());
      list.sort((a, b) => {
        const ai = catOrder.indexOf(a.sortCat);
        const bi = catOrder.indexOf(b.sortCat);
        const aRank = ai === -1 ? 999 : ai;
        const bRank = bi === -1 ? 999 : bi;
        if (aRank !== bRank) return aRank - bRank;
        const subA = taxonomySubOrder(a.sortCat);
        const subB = taxonomySubOrder(b.sortCat);
        const asi = subA.indexOf(a.sortSub);
        const bsi = subB.indexOf(b.sortSub);
        const aSub = asi === -1 ? 999 : asi;
        const bSub = bsi === -1 ? 999 : bsi;
        if (aSub !== bSub) return aSub - bSub;
        return a.header.localeCompare(b.header);
      });
      return list;
    }

    function formatProfIndex(v) {
      if (v == null || isNaN(v)) return "0";
      const n = Number(v);
      const abs = Math.abs(n);
      const body = abs >= 10 ? abs.toFixed(1) : abs.toFixed(2);
      if (n > 0) return `+${body}`;
      if (n < 0) return `-${body}`;
      return "0.00";
    }

    // Proficiency color bands: < -0.15 red · -0.15 to < 0.25 gold · ≥ 0.25 green
    function profColor(pct) {
      const n = Number(pct) || 0;
      if (n < -0.15) return "var(--red)";
      if (n >= 0.25) return "var(--green)";
      return "var(--gold)";
    }

    function getShotMoveList() {
      const td = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS.Takedown;
      if (td && td.Shots && Array.isArray(td.Shots)) return td.Shots.slice();
      return ["Single Leg", "Double Leg", "High Crotch", "Ankle Pick", "Fireman's Carry", "Dresser Dump"];
    }

    /** Shot % = successful offensive shots / total offensive shots × 100 (Takedown → Shots). */
    function computeShotPercentage(targetWrestlerId = null) {
      const season = getActiveSeason();
      const shotMoves = new Set(getShotMoveList());
      const events = (season.events || []).filter(e => {
        if (targetWrestlerId && e.wrestlerId !== targetWrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        if (e.category !== "Takedown") return false;
        if (e.direction !== "offense") return false;
        if (!shotMoves.has(e.move)) return false;
        return true;
      });
      const taken = events.length;
      const success = events.filter(e => e.outcome === "success").length;
      const pct = taken ? Math.round((success / taken) * 100) : null;
      return { taken, success, pct };
    }

    function rateColorPct(rate) {
      if (rate == null || isNaN(rate)) return "var(--muted)";
      if (rate >= 60) return "var(--green)";
      if (rate < 40) return "var(--red)";
      return "var(--gold)";
    }

    function computePositionalProficiency(targetWrestlerId = null) {
      const season = getActiveSeason();
      const targetMatches = season.matches.filter(m => {
        if (targetWrestlerId && m.wrestlerId !== targetWrestlerId) return false;
        if (store.activeBoutId !== "all" && m.boutId !== store.activeBoutId) return false;
        return true;
      });

      let neutral = { opps: 0, successes: 0, failures: 0 };
      let top = { opps: 0, successes: 0, failures: 0 };
      let bottom = { opps: 0, successes: 0, failures: 0 };
      let choices = { neutral: 0, top: 0, bottom: 0, defer: 0 };

      targetMatches.forEach(m => {
        const mEvs = season.events
          .filter(e => e.matchId === m.id)
          .sort((a, b) => (a.ts || 0) - (b.ts || 0));

        neutral.opps += 1;

        mEvs.forEach(e => {
          if (e.category === "Choice" && e.direction === "offense") {
            const pos = e.detail;
            if (pos === "Neutral") choices.neutral += 1;
            else if (pos === "Top") choices.top += 1;
            else if (pos === "Bottom") choices.bottom += 1;
            else if (pos === "Defer") choices.defer += 1;
          }

          if (e.category === "Flow" && e.detail === "OT") {
            neutral.opps += 1;
          }

          if (e.category === "Choice") {
            const isHomeChoice = e.move.includes("Home");
            const pos = e.detail;

            if (pos === "Neutral") {
              neutral.opps += 1;
            } else if (pos === "Top") {
              if (isHomeChoice) top.opps += 1;
              else bottom.opps += 1;
            } else if (pos === "Bottom") {
              if (isHomeChoice) bottom.opps += 1;
              else top.opps += 1;
            }
          }

          if (e.category === "Takedown") {
            if (e.direction === "offense" && e.outcome === "success") {
              neutral.successes += 1;
              top.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              neutral.failures += 1;
              bottom.opps += 1;
            }
          }

          if (e.category === "Escape") {
            if (e.direction === "offense" && e.outcome === "success") {
              bottom.successes += 1;
              neutral.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              top.failures += 1;
              neutral.opps += 1;
            }
          }

          if (e.category === "Reversal") {
            if (e.direction === "offense" && e.outcome === "success") {
              bottom.successes += 1;
              top.opps += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              top.failures += 1;
              bottom.opps += 1;
            }
          }

          if (e.category === "Near Fall / Pin" || e.category === "Turns") {
            if (e.direction === "offense" && e.outcome === "success") {
              top.successes += 1;
            } else if (e.direction === "defense" && e.outcome === "fail") {
              bottom.failures += 1;
            }
          }
        });
      });

      // Net index typically in [-1, +1]; can exceed +1 when successes > opportunities
      const calcIndex = (s, f, opp) => opp > 0 ? Math.round(((s - f) / opp) * 100) / 100 : 0;

      return {
        neutral: { ...neutral, pct: calcIndex(neutral.successes, neutral.failures, neutral.opps) },
        top: { ...top, pct: calcIndex(top.successes, top.failures, top.opps) },
        bottom: { ...bottom, pct: calcIndex(bottom.successes, bottom.failures, bottom.opps) },
        choices
      };
    }

    /* LEADERBOARD ENGINE (Places 1-3) */
    function formatTiedNames(athletes) {
      if (athletes.length === 0) return "—";
      if (athletes.length > 3) return "More than three";
      return athletes.map(a => `${a.name} (${a.weightClass} lbs)`).join(", ");
    }

    function buildLeaderboardPodium(items, valColor) {
      if (!items || items.length === 0) {
        return '<p style="font-size:11px; color:var(--muted); padding:4px 0;">No athlete records logged.</p>';
      }

      const numColor = valColor || "var(--green)";

      // Group into distinct ranks
      const scoreMap = new Map();
      items.forEach(item => {
        if (!scoreMap.has(item.val)) scoreMap.set(item.val, []);
        scoreMap.get(item.val).push(item);
      });

      const sortedVals = Array.from(scoreMap.keys()).sort((a, b) => b - a);
      const medals = ["🥇 1st", "🥈 2nd", "🥉 3rd"];
      const rows = [];

      for (let i = 0; i < Math.min(3, sortedVals.length); i++) {
        const val = sortedVals[i];
        const athletes = scoreMap.get(val);
        rows.push(`
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.03);">
            <span style="font-weight:700; color:var(--gold);">${medals[i]}:</span>
            <span style="flex:1; margin:0 8px; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${formatTiedNames(athletes)}</span>
            <span style="font-family:monospace; font-weight:800; color:${numColor};">${athletes[0].displayVal != null ? athletes[0].displayVal : val}</span>
          </div>
        `);
      }

      return rows.join('');
    }

    function getCategoryMoveList(catKey) {
      const group = taxonomy.MOVE_GROUPS && taxonomy.MOVE_GROUPS[catKey];
      if (!group) return [];
      if (Array.isArray(group)) return group.slice();
      return Object.values(group).flat();
    }

    function countMoveSuccesses(wrestlerId, category, move, direction, mode) {
      // mode: "success" (default) | "scored_on" (opponent scored on this wrestler)
      const season = getActiveSeason();
      const scoredOn = mode === "scored_on";
      return season.events.filter(e => {
        if (e.wrestlerId !== wrestlerId) return false;
        if (store.activeBoutId !== "all" && e.boutId !== store.activeBoutId) return false;
        if (e.direction !== direction) return false;

        if (scoredOn) {
          // Events logged as defense where opponent converted (outcome fail) or we were pinned
          if (category === "Pins") {
            return (e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin")));
          }
          if (category === "Near Fall / Pin") {
            const isPin = e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin"));
            // NF scored on us: defense + fail with NF points, or Near Fall category
            const isNf = (e.category === "Near Fall / Pin" || e.category === "Turns") && !isPin;
            if (!isNf) return false;
            if (e.outcome !== "fail") return false;
            if (move && e.move !== move && e.detail !== move) return false;
            return true;
          }
          // Generic: opponent scored this category on us
          if (e.category !== category) return false;
          if (e.outcome !== "fail") return false;
          if (move && e.move !== move) return false;
          return true;
        }

        if (e.outcome !== "success") return false;
        if (category === "Pins") {
          return (e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin")));
        }
        if (category === "Near Fall / Pin") {
          const isPin = e.detail === "Pin / Fall" || e.detail === "Pin" || (e.move && e.move.includes("Pin"));
          return e.category === "Near Fall / Pin" && !isPin && (!move || e.move === move);
        }
        if (isPenaltyCategory(category) || category === "Penalty/DQ") {
          return isPenaltyCategory(e.category) && (!move || e.move === move);
        }
        return e.category === category && (!move || e.move === move);
      }).length;
    }

    function buildLeadersForMetric(athletes, getVal, formatVal) {
      const items = [];
      athletes.forEach(w => {
        const val = getVal(w);
        if (val > 0 || (typeof val === "number" && !isNaN(val) && formatVal)) {
          // for proficiency formatVal is set and we filter by opps outside
          if (val === 0 && !formatVal) return;
          const item = { ...w, val };
          if (formatVal) item.displayVal = formatVal(val);
          items.push(item);
        }
      });
      return items;
    }

    function renderLeaderboardView() {
      const season = getActiveSeason();
      const filteredAthletes = season.roster.filter(w => leaderboardDivision === "All" || w.division === leaderboardDivision);
      const isOff = leaderboardSide === "offense";
      // Offense = our scoring success. Scored On = opponent converted against us (defense + fail).
      const dir = isOff ? "offense" : "defense";
      const countMode = isOff ? "success" : "scored_on";

      const categoryBoxes = isOff
        ? [
            { key: "Takedown", label: "Takedowns (T3)", expandable: true },
            { key: "Escape", label: "Escapes (E1)", expandable: true },
            { key: "Reversal", label: "Reversals (R2)", expandable: true },
            { key: "Near Fall / Pin", label: "Near Fall Exposures", expandable: true },
            { key: "Pins", label: "Pins / Falls", expandable: false },
            { key: "Turns", label: "Turns", expandable: true },
            { key: "ShotPct", label: "Shot %", expandable: false }
          ]
        : [
            { key: "Takedown", label: "Takedowns Scored On", expandable: true },
            { key: "Escape", label: "Escapes Allowed", expandable: true },
            { key: "Reversal", label: "Reversals Allowed", expandable: true },
            { key: "Near Fall / Pin", label: "Near Falls Scored On", expandable: true },
            { key: "Pins", label: "Pins / Falls Scored On", expandable: false },
            { key: "Turns", label: "Turns Scored On", expandable: true }
          ];

      // Aggregate category leaders
      const boxHtml = categoryBoxes.map(box => {
        const leaders = [];
        filteredAthletes.forEach(w => {
          let val = 0;
          if (box.key === "ShotPct") {
            const sp = computeShotPercentage(w.id);
            if (sp.taken >= 2 && sp.pct != null) {
              leaders.push({ ...w, val: sp.pct, displayVal: sp.pct + "% (" + sp.success + "/" + sp.taken + ")" });
            }
            return;
          }
          if (box.key === "Pins") {
            val = countMoveSuccesses(w.id, "Pins", null, dir, countMode);
          } else if (box.key === "Near Fall / Pin") {
            val = countMoveSuccesses(w.id, "Near Fall / Pin", null, dir, countMode);
          } else {
            val = countMoveSuccesses(w.id, box.key, null, dir, countMode);
          }
          if (val > 0) leaders.push({ ...w, val });
        });

        const expanded = leaderboardExpanded === box.key;
        let detailHtml = "";
        if (expanded && box.expandable) {
          const moves = getCategoryMoveList(box.key === "Near Fall / Pin" ? "Near Fall / Pin" : box.key)
            .filter(m => !(box.key === "Near Fall / Pin" && (m.includes("Pin") || m === "Pin / Fall")));
          const moveBlocks = moves.map(move => {
            const mLeaders = [];
            filteredAthletes.forEach(w => {
              const val = countMoveSuccesses(w.id, box.key, move, dir, countMode);
              if (val > 0) mLeaders.push({ ...w, val });
            });
            return `
              <div style="margin-top:8px; padding-top:6px; border-top:1px solid var(--panelLine);">
                <div style="font-size:10px; font-weight:800; color:var(--chalk); margin-bottom:4px;">${move}</div>
                ${buildLeaderboardPodium(mLeaders, isOff ? 'var(--green)' : 'var(--red)')}
              </div>
            `;
          }).join("");
          detailHtml = `
            <div style="margin-top:8px;">
              <div style="font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:4px;">Top 3 by move</div>
              ${moveBlocks || '<p style="font-size:11px; color:var(--muted);">No individual move data.</p>'}
            </div>
          `;
        }

        return `
          <div style="background:var(--mat); border:1px solid ${expanded ? 'var(--gold)' : 'var(--panelLine)'}; padding:10px; border-radius:6px; cursor:${box.expandable ? 'pointer' : 'default'};"
               ${box.expandable ? `onclick="leaderboardExpanded = (leaderboardExpanded === '${box.key}') ? null : '${box.key}'; render();"` : ""}>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase;">${box.label}</div>
              ${box.expandable ? `<span style="font-size:10px; color:var(--muted);">${expanded ? '▲ collapse' : '▼ expand'}</span>` : ''}
            </div>
            ${buildLeaderboardPodium(leaders, isOff ? 'var(--green)' : 'var(--red)')}
            ${detailHtml}
          </div>
        `;
      }).join("");

      // Proficiency leaders — offense section only
      let profHtml = "";
      if (isOff) {
        const neutralProfLeader = [];
        const topProfLeader = [];
        const bottomProfLeader = [];
        filteredAthletes.forEach(w => {
          const prof = computePositionalProficiency(w.id);
          if (prof.neutral.opps >= 2) neutralProfLeader.push({ ...w, val: prof.neutral.pct, displayVal: formatProfIndex(prof.neutral.pct) });
          if (prof.top.opps >= 2) topProfLeader.push({ ...w, val: prof.top.pct, displayVal: formatProfIndex(prof.top.pct) });
          if (prof.bottom.opps >= 2) bottomProfLeader.push({ ...w, val: prof.bottom.pct, displayVal: formatProfIndex(prof.bottom.pct) });
        });
        profHtml = `
          <div style="background:var(--mat); border:1px solid var(--panelLine); padding:10px; border-radius:6px;">
            <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">Neutral Proficiency</div>
            ${buildLeaderboardPodium(neutralProfLeader)}
          </div>
          <div style="background:var(--mat); border:1px solid var(--panelLine); padding:10px; border-radius:6px;">
            <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">Top Proficiency</div>
            ${buildLeaderboardPodium(topProfLeader)}
          </div>
          <div style="background:var(--mat); border:1px solid var(--panelLine); padding:10px; border-radius:6px;">
            <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">Bottom Proficiency</div>
            ${buildLeaderboardPodium(bottomProfLeader)}
          </div>
        `;
      }

      return `
        <div style="display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;">
          <button class="btn" style="padding:6px 12px; font-size:11px; font-weight:800; background:${isOff ? 'var(--green)' : 'var(--mat)'}; color:var(--chalk); border:1px solid var(--panelLine);"
            onclick="leaderboardSide = 'offense'; leaderboardExpanded = null; render();">Offense</button>
          <button class="btn" style="padding:6px 12px; font-size:11px; font-weight:800; background:${!isOff ? 'var(--red)' : 'var(--mat)'}; color:var(--chalk); border:1px solid var(--panelLine);"
            onclick="leaderboardSide = 'defense'; leaderboardExpanded = null; render();">Scored On</button>
          <span style="font-size:11px; color:var(--muted); align-self:center;">
            ${isOff ? 'Leaders for scoring success · includes Shot % · click a category to expand' : 'Times opponent scored on your wrestler · click a category to expand move leaders'}
          </span>
        </div>
        <div class="grid-2">
          ${boxHtml}
          ${profHtml}
        </div>
      `;
    }

    /* Ranks a wrestler against same-division teammates for a specific move */
    function getMoveTeamRank(wrestler, move, direction) {
      const season = getActiveSeason();
      const sameDivision = season.roster.filter(w => w.division === wrestler.division);

      const totals = sameDivision.map(w => {
        const evs = season.events.filter(e =>
          e.wrestlerId === w.id &&
          e.move === move &&
          e.direction === direction &&
          (store.activeBoutId === "all" || e.boutId === store.activeBoutId)
        );
        const attempts = evs.length;
        const success = evs.filter(e => e.outcome === "success").length;
        return { id: w.id, attempts, rate: attempts ? success / attempts : -1 };
      }).filter(t => t.attempts > 0);

      totals.sort((a, b) => b.rate - a.rate || b.attempts - a.attempts);
      return totals.findIndex(t => t.id === wrestler.id);
    }

    function medalForRank(rank) {
      if (rank === 0) return "🥇";
      if (rank === 1) return "🥈";
      if (rank === 2) return "🥉";
      return "";
    }

    function renderStats(target) {
      const activeW = getActiveWrestler();
      const season = getActiveSeason();
      const activeBout = getActiveBout();

      const sortedRoster = [...season.roster].sort((a, b) => (Number(a.weightClass) || 0) - (Number(b.weightClass) || 0));
      const boysOptions = sortedRoster.filter(w => w.division === "Boys");
      const girlsOptions = sortedRoster.filter(w => w.division === "Girls");

      const { offense, defense } = statsShowTeam
        ? computeTeamStatsWithTieBreakdown()
        : computeStatsWithTieBreakdown(activeW ? activeW.id : null);

      const offenseGroups = groupStatsRowsByCategory(offense);
      const defenseGroups = groupStatsRowsByCategory(defense);

      const profStats = statsShowTeam
        ? computePositionalProficiency(null)
        : computePositionalProficiency(activeW ? activeW.id : null);

      const shotPct = statsShowTeam
        ? computeShotPercentage(null)
        : computeShotPercentage(activeW ? activeW.id : null);

      const scopedMatches = statsShowTeam
        ? season.matches.filter(m => store.activeBoutId === "all" || m.boutId === store.activeBoutId).length
        : season.matches.filter(m => activeW && m.wrestlerId === activeW.id && (store.activeBoutId === "all" || m.boutId === store.activeBoutId)).length;

      const titleText = statsShowTeam
        ? `Stats: Entire Team (${scopedMatches} Matches ${activeBout ? `vs ${activeBout.opponentTeam}` : ''})`
        : `Stats: ${activeW ? activeW.name : 'None Selected'} (${scopedMatches} Matches ${activeBout ? `vs ${activeBout.opponentTeam}` : ''})`;

      const rateColor = rate => rate >= 60 ? 'var(--green)' : rate < 40 ? 'var(--red)' : 'var(--gold)';

      const renderMoveGroupSection = (groups, direction) => {
        if (!groups.length) {
          return `<p style="color:var(--muted); font-size:12px; margin-bottom:12px;">No ${direction} data logged yet.</p>`;
        }
        return groups.map(g => {
          const rowsHtml = g.rows.map(r => {
            const color = rateColor(r.rate);
            const rank = statsShowTeam ? -1 : getMoveTeamRank(activeW, r.move, direction);
            const medal = medalForRank(rank);
            const expandKey = direction === "offense" ? "expandedStatMove" : "expandedDefStatMove";
            const expanded = direction === "offense" ? expandedStatMove : expandedDefStatMove;
            const isOpen = expanded === r.move;
            const rateLabel = direction === "offense"
              ? `${r.success}/${r.attempts} (${r.rate}%)`
              : `${r.success}/${r.attempts} defended (${r.rate}%)`;
            const breakdownTitle = direction === "offense" ? "Offensive Setup Breakdown:" : "Defensive Setup Breakdown:";
            const defendedSuffix = direction === "defense" ? " defended" : "";
            return `
              <div style="margin-bottom:8px; padding:6px; border-radius:4px; background:var(--mat); cursor:pointer;" onclick="${expandKey} = (${expandKey} === '${r.move}') ? null : '${r.move}'; render();">
                <div style="display:flex; justify-content:space-between; font-size:12px;">
                  <span style="font-weight:700; color:var(--chalk);">${medal ? medal + ' ' : ''}${r.move} ${isOpen ? '▲' : '▼'}</span>
                  <span style="font-family:monospace; color:${color};">${rateLabel}</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" style="width:${r.rate}%; background-color:${color};"></div></div>
                ${isOpen ? `
                  <div style="margin-top:8px; padding:8px; border-top:1px solid var(--panelLine); background:var(--panel); border-radius:4px;">
                    <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:4px;">${breakdownTitle}</div>
                    ${r.tieList.map(t => `
                      <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px; color:var(--chalk);">
                        <span>↳ ${t.tie}</span>
                        <span style="font-family:monospace; color:var(--muted);">${t.success}/${t.attempts}${defendedSuffix} (${t.rate}%)</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
          return `
            <div style="margin-bottom:14px;">
              <div style="font-size:10px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--panelLine);">
                ${g.header}
              </div>
              ${rowsHtml}
            </div>
          `;
        }).join('');
      };

      target.innerHTML = `

    function renderHallOfFameView() {
      const entries = [];
      awards.forEach(aw => {
        const list = Array.isArray(aw.assignments) ? aw.assignments : [];
        list.forEach(a => {
          entries.push({
            year: a.year || "Unknown",
            awardName: aw.name,
            icon: aw.icon,
            wrestlerName: a.wrestlerName || "Unknown Athlete",
            weightClass: a.weightClass || "",
            division: a.division || "",
            seasonName: a.seasonName || ""
          });
        });
      });

      if (entries.length === 0) {
        return `<p style="font-size:12px; color:var(--muted);">No awards have been assigned yet. Create awards in Admin and click them to assign athletes — they will appear here by year and carry over across seasons.</p>`;
      }

      // Group by year, newest first
      const byYear = new Map();
      entries.forEach(e => {
        if (!byYear.has(e.year)) byYear.set(e.year, []);
        byYear.get(e.year).push(e);
      });
      const years = Array.from(byYear.keys()).sort((a, b) => {
        const ay = parseInt(String(a).match(/20\\d{2}/)?.[0] || "0", 10);
        const by = parseInt(String(b).match(/20\\d{2}/)?.[0] || "0", 10);
        return by - ay;
      });

      return years.map(year => {
        const list = byYear.get(year).sort((a, b) => a.awardName.localeCompare(b.awardName) || a.wrestlerName.localeCompare(b.wrestlerName));
        // Nested group by award
        const byAward = new Map();
        list.forEach(e => {
          const key = e.icon + "::" + e.awardName;
          if (!byAward.has(key)) byAward.set(key, { icon: e.icon, name: e.awardName, recipients: [] });
          byAward.get(key).recipients.push(e);
        });
        const awardBlocks = Array.from(byAward.values()).map(block => `
          <div style="background:var(--mat); border:1px solid var(--panelLine); border-radius:6px; padding:10px; margin-bottom:8px;">
            <div style="font-size:13px; font-weight:800; margin-bottom:6px;">
              <span style="font-size:16px; margin-right:4px;">${block.icon}</span>${block.name}
            </div>
            ${block.recipients.map(r => `
              <div style="display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-top:1px solid rgba(255,255,255,0.04);">
                <span><strong>${r.wrestlerName}</strong>
                  <span style="color:var(--muted); font-size:11px;">
                    ${r.weightClass ? `· ${r.weightClass} lbs` : ""}${r.division ? ` · ${r.division}` : ""}
                  </span>
                </span>
                ${r.seasonName ? `<span style="color:var(--muted); font-size:10px;">${r.seasonName}</span>` : ""}
              </div>
            `).join('')}
          </div>
        `).join('');
        return `
          <div style="margin-bottom:16px;">
            <div style="font-size:12px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--goldDim);">
              ${year}
            </div>
            ${awardBlocks}
          </div>
        `;
      }).join('');
    }

    function renderPlan(target) {
      const activeW = getActiveWrestler();
      const season = getActiveSeason();
      if (!activeW && !statsShowTeam) return target.innerHTML = '<div class="card"><p style="color:var(--muted); font-size:12px;">Select an active wrestler on the Roster page.</p></div>';

      const sortedRoster = [...season.roster].sort((a, b) => (Number(a.weightClass) || 0) - (Number(b.weightClass) || 0));
      const boysOptions = sortedRoster.filter(w => w.division === "Boys");
      const girlsOptions = sortedRoster.filter(w => w.division === "Girls");
      
      const { offense, defense } = statsShowTeam
        ? computeTeamStatsWithTieBreakdown()
        : computeStatsWithTieBreakdown(activeW.id);

      const minAttempts = statsShowTeam ? 4 : 2;
      const offenseThreshold = statsShowTeam
        ? (appConfig.teamOffenseThreshold || 50)
        : (appConfig.individualOffenseThreshold || 50);
      const defenseThreshold = statsShowTeam
        ? (appConfig.teamDefenseThreshold || 50)
        : (appConfig.individualDefenseThreshold || 50);

      const weakOffense = offense.filter(r => r.attempts >= minAttempts && r.rate < offenseThreshold);
      const weakDefense = defense.filter(r => r.attempts >= minAttempts && r.rate < defenseThreshold);

      const profStats = statsShowTeam
        ? computePositionalProficiency(null)
        : computePositionalProficiency(activeW.id);

      const PROF_DRILLS = {
        Neutral: "Hand-fighting series, shot setups from ties, sprawl-and-score live go's, neutral posture and level-change drilling.",
        Top: "Ride breakdowns, mat returns, turn chains (half / arm bar / tilt), ride-time pressure and turn finishes.",
        Bottom: "Stand-up series, switches/sit-outs, hip heists, scramble recovery, and bottom defense vs common rides."
      };

      // Yellow: -0.15 to <0.25 · Red: < -0.15  (green is ≥ 0.25 — no remediation)
      const weakPositions = ["Neutral", "Top", "Bottom"].map(name => {
        const key = name.toLowerCase();
        const data = profStats[key];
        const idx = data ? data.pct : 0;
        let band = "green";
        if (idx < -0.15) band = "red";
        else if (idx < 0.25) band = "yellow";
        return { name, data, idx, band, color: profColor(idx) };
      }).filter(p => p.band === "red" || p.band === "yellow");

      const planTitle = statsShowTeam
        ? `Targeted Practice Drills: Entire Team Compiled (${season.name})`
        : `Targeted Practice Drills: ${activeW.name} (${season.name})`;

      target.innerHTML = `
        <div class="card" style="padding:10px 14px;">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <span style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase;">Training Plan For:</span>
            <select class="select" style="margin-bottom:0; flex:1; min-width:200px; max-width:340px; font-size:12px; font-weight:700;" onchange="if (this.value === '__TEAM__') { statsShowTeam = true; } else { statsShowTeam = false; setActiveWrestler(this.value); } render();">
              <option value="__TEAM__" ${statsShowTeam ? 'selected' : ''}>🏆 Entire Team (Compiled)</option>
              ${boysOptions.length ? `<optgroup label="Boys">${boysOptions.map(w => `<option value="${w.id}" ${!statsShowTeam && w.id === activeW.id ? 'selected' : ''}>${w.name} — ${w.weightClass} lbs (${w.level})</option>`).join('')}</optgroup>` : ''}
              ${girlsOptions.length ? `<optgroup label="Girls">${girlsOptions.map(w => `<option value="${w.id}" ${!statsShowTeam && w.id === activeW.id ? 'selected' : ''}>${w.name} — ${w.weightClass} lbs (${w.level})</option>`).join('')}</optgroup>` : ''}
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>${planTitle}</span>
            ${helpIcon('plan_remediation')}
          </div>
          
          <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">
            Positional Proficiency Focus <span style="font-weight:400; text-transform:none;">(yellow &amp; red bands: index &lt; 0.25)</span>
          </div>
          ${weakPositions.length === 0 ? `<p style="color:var(--muted); font-size:12px; margin-bottom:12px;">All positions are in the green band (≥ 0.25). No proficiency remediation needed.</p>` : ''}
          ${weakPositions.map(p => `
            <div style="background:var(--mat); padding:10px; border-radius:4px; margin-bottom:6px; border:1px solid var(--panelLine);">
              <div style="display:flex; justify-content:space-between; font-weight:700; font-size:13px; margin-bottom:4px;">
                <span>${p.name} Position
                  <span style="font-size:10px; font-weight:800; text-transform:uppercase; margin-left:6px; color:${p.color};">
                    [${p.band === 'red' ? 'RED' : 'YELLOW'}]
                  </span>
                </span>
                <span style="font-family:monospace; color:${p.color};">${formatProfIndex(p.idx)}</span>
              </div>
              <div style="font-size:11px; color:var(--muted); margin-bottom:4px;">
                ${p.data.successes} successes · ${p.data.failures} failures · ${p.data.opps} opportunities
              </div>
              <div style="font-size:11px; color:var(--chalk);">
                <strong style="color:var(--gold);">Drill Focus: </strong>${PROF_DRILLS[p.name]}
              </div>
            </div>
          `).join('')}

          <div style="font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; margin:14px 0 6px 0;">
            Offensive Remediation Focus <span style="font-weight:400; text-transform:none;">(&lt; ${offenseThreshold}% conversion threshold)</span>
          </div>
          ${weakOffense.length === 0 ? `<p style="color:var(--muted); font-size:12px; margin-bottom:12px;">No severe offensive weak spots logged (min ${minAttempts} attempts).</p>` : ''}
          ${weakOffense.map(r => `
            <div style="background:var(--mat); padding:10px; border-radius:4px; margin-bottom:6px; border:1px solid var(--panelLine);">
              <div style="display:flex; justify-content:space-between; font-weight:700; font-size:13px; margin-bottom:4px;">
                <span>${r.move} (${r.success}/${r.attempts} converted)</span>

    function renderAdminSubcatSelect(cat) {

      const val = taxonomy.MOVE_GROUPS[cat];
      const isNested = val && !Array.isArray(val) && typeof val === "object";
      container.style.display = isNested ? "block" : "none";
      if (isNested) {
        const sel = document.getElementById("adm-subcat");
        if (sel) {
          sel.innerHTML = Object.keys(val).map(s => `<option value="${s}">${s}</option>`).join('');
        }
      }
    }

    let awardAssignDivision = "All";
    let assigningAwardIdx = null;

    function adminCreateAward() {
      const name = document.getElementById("adm-award-name").value.trim();
      const icon = document.getElementById("adm-award-icon").value;

      if (!name) return alert("Please enter an award name.");
      awards.push({ id: Math.random().toString(36).slice(2, 9), name, icon, assignments: [] });
      persist();
      render();
    }

    function adminDeleteAward(idx) {
      if (!confirm("Are you sure you want to delete this award?")) return;
      awards.splice(idx, 1);
      persist();
      render();
    }

    function openAssignAwardModal(idx) {
      assigningAwardIdx = idx;
      awardAssignDivision = "All";
      activeModal = "assign-award";
      renderModal();
    }

    function ensureAwardAssignments(aw) {
      if (!Array.isArray(aw.assignments)) {
        const season = getActiveSeason();
        const year = getSeasonYearLabel(season);
        let ids = Array.isArray(aw.wrestlerIds) ? aw.wrestlerIds.slice() : [];
        if (aw.wrestlerId && !ids.includes(aw.wrestlerId)) ids.push(aw.wrestlerId);
        aw.assignments = ids.map(id => {
          const w = season.roster.find(r => r.id === id);
          return {
            wrestlerId: id,
            wrestlerName: w ? w.name : "Unknown Athlete",
            weightClass: w ? w.weightClass : "",
            division: w ? w.division : "",
            year,
            seasonId: season.id,
            seasonName: season.name
          };
        });
        delete aw.wrestlerId;
        delete aw.wrestlerIds;
      }
      return aw.assignments;
    }

    function assignWrestlerToAward(wrestlerId) {
      if (assigningAwardIdx == null || !wrestlerId) return;
      const aw = awards[assigningAwardIdx];
      if (!aw) return;
      const season = getActiveSeason();
      const year = getSeasonYearLabel(season);
      const list = ensureAwardAssignments(aw);
      const alreadyThisYear = list.some(a => a.wrestlerId === wrestlerId && a.year === year);
      if (alreadyThisYear) return;
      const w = season.roster.find(r => r.id === wrestlerId);
      if (!w) return;
      list.push({
        wrestlerId: w.id,
        wrestlerName: w.name,
        weightClass: w.weightClass,
        division: w.division,
        year,
        seasonId: season.id,
        seasonName: season.name
      });
      persist();
      renderModal();
    }

    function unassignWrestlerFromAward(wrestlerId, year) {
      if (assigningAwardIdx == null) return;
      const aw = awards[assigningAwardIdx];
      if (!aw) return;
      const list = ensureAwardAssignments(aw);
      aw.assignments = list.filter(a => !(a.wrestlerId === wrestlerId && (!year || a.year === year)));
      persist();
      renderModal();
    }

    function adminAddWeightClass(div) {
      const input = document.getElementById(div === "Boys" ? "adm-add-boy-weight" : "adm-add-girl-weight");
      if (!input) return;
      const wt = input.value.trim();
      if (!wt || isNaN(wt)) return alert("Please enter a numeric weight class.");

      if (!weightClasses[div].includes(wt)) {
        weightClasses[div].push(wt);
        weightClasses[div].sort((a, b) => Number(a) - Number(b));
      }
      input.value = "";
      persist();
      render();
    }

    function adminDeleteWeightClass(div, wt) {
      if (!confirm(`Are you sure you want to delete the ${wt} lbs (${div}) weight class?`)) return;
      weightClasses[div] = weightClasses[div].filter(w => w !== wt);
      persist();
      render();
    }

    function resetDefaultWeightClasses() {
      if (!confirm("Reset all Boys and Girls weight classes to NFHS standard defaults?")) return;
      weightClasses = JSON.parse(JSON.stringify(DEFAULT_WEIGHT_CLASSES));
      persist();
      render();
    }

    function dragStart(e, cat, sub, idx) {
      draggedMove = { cat, sub, idx };
    }

    function dropMove(e, targetCat, targetSub, targetIdx) {
      e.preventDefault();
      if (!draggedMove || draggedMove.cat !== targetCat || draggedMove.sub !== targetSub) return;
      
      let list = targetSub ? taxonomy.MOVE_GROUPS[targetCat][targetSub] : taxonomy.MOVE_GROUPS[targetCat];
      const item = list.splice(draggedMove.idx, 1)[0];
      list.splice(targetIdx, 0, item);
      draggedMove = null;
      persist();
      render();
    }

    function adminAddMove() {
      const cat = document.getElementById("adm-cat").value;
      const moveName = document.getElementById("adm-move-name").value.trim();
      if (!moveName) return alert("Please enter a move name.");

      const group = taxonomy.MOVE_GROUPS[cat];
      if (group && !Array.isArray(group) && typeof group === "object") {
        const sub = document.getElementById("adm-subcat").value;
        if (!group[sub]) group[sub] = [];
        if (!group[sub].includes(moveName)) group[sub].push(moveName);
      } else {
        if (!Array.isArray(taxonomy.MOVE_GROUPS[cat])) taxonomy.MOVE_GROUPS[cat] = [];
        if (!taxonomy.MOVE_GROUPS[cat].includes(moveName)) {
          taxonomy.MOVE_GROUPS[cat].push(moveName);
        }
      }
      persist();
      render();
    }

    function adminDeleteMove(cat, sub, moveName) {
      if (!confirm(`Are you sure you want to delete "${moveName}" from the taxonomy?`)) return;
      const group = taxonomy.MOVE_GROUPS[cat];
      if (sub && group && !Array.isArray(group) && typeof group === "object") {
        group[sub] = (group[sub] || []).filter(m => m !== moveName);
      } else if (Array.isArray(group)) {
        taxonomy.MOVE_GROUPS[cat] = group.filter(m => m !== moveName);
      }
      persist();
      render();
    }

    /* IN-BROWSER AI ENGINE */
    async function extractFrames(file, statusCb) {
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.preload = "auto";
        video.src = URL.createObjectURL(file);
        video.muted = true;

        const canvas = document.getElementById("frame-canvas");
        const ctx = canvas.getContext("2d");
        const frames = [];

        video.onloadedmetadata = async () => {
          canvas.width = 480;
          canvas.height = Math.round(480 * (video.videoHeight / video.videoWidth));
          const duration = Math.min(video.duration, 180);
          const interval = 1.0;

          for (let time = 0; time < duration; time += interval) {
            statusCb(`Extracting match frames: ${Math.round((time / duration) * 100)}%`);
            await new Promise(r => {
              video.currentTime = time;
              video.onseeked = () => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
                frames.push({
                  time: `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(Math.floor(time % 60)).padStart(2, '0')}`,
                  base64: dataUrl.split(",")[1]
                });
                r();
              };
            });
          }
          URL.revokeObjectURL(video.src);
          resolve(frames);
        };
        video.onerror = () => reject(new Error("Could not decode local video file."));
      });
    }

    async function runDirectBrowserAnalysis() {
      const activeW = getActiveWrestler();
      if (!activeW) return alert("Select an active wrestler first.");

      const key = document.getElementById("imp-key").value.trim();
      const opponent = document.getElementById("imp-opp").value.trim() || "Opponent";

      if (!key) return alert("Please enter your Gemini API Key.");
      if (!selectedVideoFile) return alert("Please select a video file.");

      localStorage.setItem(API_KEY_STORAGE, key);
      const statusDiv = document.getElementById("ai-status");
      const aiBtn = document.getElementById("ai-btn");
      statusDiv.style.display = "block";
      aiBtn.disabled = true;

      try {
        const frames = await extractFrames(selectedVideoFile, (txt) => { statusDiv.textContent = txt; });
        statusDiv.textContent = `Analyzing ${frames.length} frames with Gemini...`;

        const contentsParts = [
          {
            text: `You are scoring a wrestling match for wrestler "${activeW.name}" vs "${opponent}". Takedowns score 3 points.
Watch sequential frames and return ONLY a JSON array of scoring actions with:
- "category": ("Takedown", "Escape", "Reversal", "Turns", "Near Fall / Pin", "Penalty/DQ")
- "move": specific move name
- "raw_move": specific move name or setup
- "direction": "offense" or "defense"
- "outcome": "success" or "fail"
- "timestamp": mm:ss
- "confidence": "high", "medium", or "low"`
          }
        ];

        frames.forEach(f => {
          contentsParts.push({ text: `Frame Time: ${f.time}` });
          contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: f.base64 } });
        });

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: contentsParts }] })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || "Gemini API error.");
        }

        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        let clean = text.trim();
        if (clean.startsWith("```")) clean = clean.split("```")[1].replace(/^json/, "");
        
        parsedEvents = JSON.parse(clean).map(e => ({ ...e, id: Math.random().toString(36).slice(2, 9) }));
        selectedEvents = {};
        parsedEvents.forEach(e => { selectedEvents[e.id] = e.confidence !== 'low'; });
        render();
      } catch (err) {
        alert("Analysis Error: " + err.message);
        statusDiv.style.display = "none";
        aiBtn.disabled = false;
      }
    }

          move: e.move || "Unknown", rawMove: e.raw_move || e.move,
          direction: e.direction || "offense", outcome: e.outcome || "success", 
          timestamp: e.timestamp || "",
          ts: Date.now()
        });
      });
      parsedEvents = null;
      persist();
      switchTab("sheet");
    }

    window.onload = init;
  </script>
</body>
</html>
