<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mat Scout — Wrestling Analytics & Match Manager</title>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --mat: #1C1F1E;
      --panel: #25292A;
      --panelLine: #33383A;
      --chalk: #F2F0EA;
      --muted: #8B9290;
      --red: #C23B22;
      --redDim: #4A241C;
      --green: #2F7A4F;
      --greenDim: #1E3B2C;
      --gold: #D9A441;
      --goldDim: #4A3B1D;
      --teamFont: system-ui, -apple-system, sans-serif;
      --teamColor: #F2F0EA;
      --calBoys: #4A90D9;
      --calGirls: #E85D9C;
      --calBoth: #9B59B6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--mat); color: var(--chalk); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; }

    /* Inline processing spinner for buttons that trigger async work */
    .btn-spinner {
      display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: currentColor;
      border-radius: 50%; animation: btn-spin 0.7s linear infinite;
    }
    @keyframes btn-spin { to { transform: rotate(360deg); } }
    
    /* Header & Brand */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-emblem { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1.5px solid var(--gold); border-radius: 8px; flex-shrink: 0; overflow: hidden; }
    .logo-emblem svg { width: 22px; height: 22px; fill: var(--gold); }
    .logo-titles { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
    .team-title { font-size: 15px; font-weight: 700; font-family: var(--teamFont); color: var(--teamColor); letter-spacing: 1px; text-transform: uppercase; }
    
    .badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--panelLine); color: var(--chalk); }
    .badge strong { color: var(--gold); }

    /* Scope Bar */
    .scope-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--panelLine); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 11px; gap: 8px; }
    .scope-bar select { background: var(--mat); color: var(--chalk); border: 1px solid var(--panelLine); border-radius: 4px; padding: 4px 8px; font-size: 11px; outline: none; }
    .record-display { font-family: monospace; font-weight: 700; color: var(--gold); }

    /* Navigation */
    .nav-tabs { display: flex; flex-wrap: wrap; background-color: var(--panel); border: 1px solid var(--panelLine); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    .tab-btn { flex: 1; min-width: 80px; padding: 10px 8px; background: transparent; border: none; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; }
    .tab-btn.active { background-color: var(--gold); color: var(--mat); }

    /* Cards & Elements */
    .card { background-color: var(--panel); border: 1px solid var(--panelLine); border-radius: 6px; padding: 16px; margin-bottom: 12px; position: relative; }
    .card-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input, .select, .textarea { width: 100%; padding: 8px 12px; background-color: var(--mat); color: var(--chalk); border: 1px solid var(--panelLine); border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 8px; }
    
    /* Buttons */
    .btn { padding: 8px 14px; border-radius: 4px; border: none; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-gold { background-color: var(--gold); color: var(--mat); }
    .btn-green { background-color: var(--green); color: var(--chalk); }
    .btn-red { background-color: var(--red); color: var(--chalk); }
    .btn-back { background-color: var(--goldDim); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .btn-back:hover { background-color: var(--gold); color: var(--mat); }
    .btn-remove-video { background-color: var(--redDim); border: 1px solid var(--red); color: var(--red); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    
    /* Help Icon Button */
    .help-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--panelLine); color: var(--muted); font-size: 11px; font-weight: 800; border: 1px solid var(--muted); cursor: pointer; user-select: none; margin-left: 6px; line-height: 1; vertical-align: middle; transition: 0.15s ease; }
    .help-btn:hover { background: var(--goldDim); border-color: var(--gold); color: var(--gold); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
    
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; background-color: var(--mat); border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
    .bar-bg { width: 100%; height: 6px; background-color: var(--panelLine); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; border-radius: 99px; }
    
    video { width: 100%; border-radius: 4px; background: black; max-height: 320px; margin-bottom: 8px; display: block; }
    .yt-wrapper { width: 100%; border-radius: 4px; overflow: hidden; aspect-ratio: 16/9; max-height: 320px; background: black; margin-bottom: 8px; }
    .yt-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    .chip { font-size: 10px; font-weight: 700; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--panelLine); background: var(--mat); color: var(--muted); cursor: pointer; text-transform: uppercase; text-align: center; user-select: none; }
    .chip.selected { background: var(--goldDim); border-color: var(--gold); color: var(--gold); }
    .chip.selected-wrestler { background: var(--greenDim); border-color: var(--green); color: var(--green); }
    .chip.selected-opponent { background: var(--redDim); border-color: var(--red); color: var(--red); }
    .chip:disabled, .chip.disabled { opacity: 0.35; cursor: not-allowed; }

    /* Reusable surface utilities (reduce repeated inline styles) */
    .surface {
      background: var(--mat);
      color: var(--chalk);
      border: 1px solid var(--panelLine);
      border-radius: 4px;
    }
    .surface-pad { padding: 10px; }
    .surface-pad-sm { padding: 8px; }
    .btn-card {
      background: var(--mat);
      color: var(--chalk);
      border: 1px solid var(--panelLine);
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-card:hover { border-color: var(--gold); color: var(--gold); }
    .chip-compact { min-width: 44px; padding: 4px 8px; }
    .stat-box {
      background: var(--mat);
      border: 1px solid var(--panelLine);
      padding: 10px;
      border-radius: 6px;
    }
    .stat-box-center { text-align: center; }
    .muted-note { font-size: 11px; color: var(--muted); }
    .muted-note-sm { font-size: 10px; color: var(--muted); }

    .draggable-item { cursor: grab; }
    .draggable-item:active { cursor: grabbing; opacity: 0.6; }

    /* Bout Sheet Styling */
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; text-align: left; }
    .sheet-table th, .sheet-table td { border: 1px solid var(--panelLine); padding: 6px 8px; }
    .sheet-table th { background: var(--mat); color: var(--gold); text-transform: uppercase; font-size: 10px; }
    .sheet-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }

    /* CalGrappler Expanded Table */
    .cg-table { width: 100%; border-collapse: collapse; font-size: 10px; background: #fff; color: #111; margin-top: 8px; }
    .cg-table th, .cg-table td { border: 1px solid #777; padding: 4px 6px; vertical-align: middle; }
    .cg-table th { background: #e5e7eb; color: #111; font-weight: 800; text-transform: uppercase; text-align: center; }
    .cg-legend { font-size: 9px; border: 1px solid #777; padding: 6px; background: #f9fafb; margin-top: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; color: #222; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-box { background: var(--panel); border: 1px solid var(--panelLine); border-radius: 8px; width: 100%; max-width: 580px; padding: 18px; max-height: 90vh; overflow-y: auto; }

    /* Layout Lock / Drag-to-Reorder */
    .layout-unlock-banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--goldDim); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .card.layout-draggable { cursor: grab; border-style: dashed; border-color: var(--gold); position: relative; }
    .card.layout-draggable::before { content: "⠿ Drag to reorder"; display: block; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; user-select: none; }
    .card.layout-draggable:active { cursor: grabbing; }
    .card.dragging { opacity: 0.4; }

    /* Visible scrollbar for gear inventory and similar lists */
    .gear-scroll {
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) var(--mat);
    }
    .gear-scroll::-webkit-scrollbar { width: 10px; }
    .gear-scroll::-webkit-scrollbar-track {
      background: var(--mat);
      border: 1px solid var(--panelLine);
      border-radius: 6px;
    }
    .gear-scroll::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 6px;
      border: 2px solid var(--mat);
    }
    .gear-scroll::-webkit-scrollbar-thumb:hover { background: #e0b85a; }
  </style>
</head>

    // Safely embed a dynamic string inside `onclick="fn('${value}')"` markup.
    // Rendered HTML here is built as plain template-literal strings and assigned
    // via innerHTML, so any apostrophe in the value (e.g. "Fireman's Carry") would
    // otherwise prematurely close the single-quoted JS string inside the onclick
    // attribute, producing invalid inline JS that silently fails on click — the
    // button does nothing and no error is visible without devtools open.
    // This escapes backslashes/quotes for the JS-string layer and & / " for the
    // surrounding HTML-attribute layer, so any move, tie, or finish name — current
    // or future — is safe to interpolate.
    function escAttr(v) {
      return String(v)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;');
    }

    function getSeasonStyle(season) {
      const s = season || getActiveSeason();
      const st = (s && s.style) || "Folkstyle";
      if (/greco/i.test(st)) return "Greco";
      if (/free/i.test(st)) return "Freestyle";
      return "Folkstyle";
    }

    function defaultPresetKeyForStyle(style) {
      const st = style || "Folkstyle";
      if (st === "Freestyle" || st === "Greco") return "uww_senior";
      return "nfhs_14";
    }

    function loadWeightClassPreset(key, silent) {
      const preset = WEIGHT_CLASS_PRESETS[key];
      if (!preset || !preset.Boys) return;
      if (!silent && !confirm("Load weight classes: " + preset.label + "?\nThis replaces the current Boys/Girls lists.")) return;
      weightClasses = {
        Boys: preset.Boys.slice(),
        Girls: (preset.Girls || []).slice()
      };
      persist();
      render();
    }

    function onWeightPresetSelect(key) {
      if (!key) return;
      loadWeightClassPreset(key, false);
      const sel = document.getElementById("adm-weight-preset");
      if (sel) sel.value = "";
    }

    /** Move style tags: missing entry = available in all styles */
    let moveStyleTags = {}; // { "Move Name": ["Folkstyle","Freestyle"] }
    const MOVE_STYLE_TAGS_KEY = "mat-scout-move-style-tags-v1";

    function moveAllowedInStyle(moveName, style) {
      const tags = moveStyleTags[moveName];
      if (!tags || !tags.length) return true;
      return tags.includes(style || "Folkstyle");
    }

    function filterMovesForSeasonStyle(moves) {
      const style = getSeasonStyle();

    /**
     * Style-aware taxonomy view for Scout / stats (does not mutate stored taxonomy).
     * Freestyle: Near Fall → Exposure / Pin; Turns + Freestyle (Gut Wrench, Leg Lace)
     * Greco: no Shots / Go Behinds; Exposure / Pin; Turns Freestyle holds
     */
    function getVisibleMoveGroups() {
      const style = getSeasonStyle();
      const base = JSON.parse(JSON.stringify(taxonomy.MOVE_GROUPS || {}));

      // Ensure Freestyle turn holds exist on source taxonomy over time
      if (base.Turns && typeof base.Turns === "object" && !Array.isArray(base.Turns)) {
        if (!base.Turns.Freestyle) base.Turns.Freestyle = ["Gut Wrench", "Leg Lace"];
        else {
          ["Gut Wrench", "Leg Lace"].forEach(m => {
            if (!base.Turns.Freestyle.includes(m)) base.Turns.Freestyle.push(m);
          });
        }
      }

      if (style === "Folkstyle") {
        return base;
      }

      // Freestyle & Greco share Exposure / Pin instead of Near Fall / Pin
      // International: 2-pt exposure + pin only (no 4-pt exposure button set)
      if (base["Near Fall / Pin"]) {
        delete base["Near Fall / Pin"];
      }
      base["Exposure / Pin"] = ["2-Point Exposure", "Pin / Fall"];

      // Step-Out (1 pt) replaces any legacy Push Out labeling
      delete base["Push Out"];
      delete base["Push-Out"];
      base["Step-Out"] = ["Step-Out"];
      base["Par Terre"] = ["Par Terre"];

      if (base.Takedown && typeof base.Takedown === "object") {
        // Strip Push Out from any takedown lists
        Object.keys(base.Takedown).forEach(sub => {
          if (Array.isArray(base.Takedown[sub])) {
            base.Takedown[sub] = base.Takedown[sub].filter(m => !/push\s*-?out/i.test(m));
          }
        });
      }

      if (style === "Greco" && base.Takedown && typeof base.Takedown === "object") {
        delete base.Takedown.Shots;
        delete base.Takedown["Go Behinds"];
        // Greco Defensive: only Headlock Roll Through
        if (base.Takedown.Defensive) {
          base.Takedown.Defensive = (base.Takedown.Defensive || []).filter(m =>
            /headlock roll/i.test(m)
          );
          if (!base.Takedown.Defensive.length) base.Takedown.Defensive = ["Headlock Roll Through"];
        }
        // Greco Other: only Undefined
        if (base.Takedown.Other) {
          base.Takedown.Other = ["Undefined"];
        }
      }

      // Drop folkstyle-only categories
      delete base.Escape;
      delete base.Reversal;

      return base;
    }

    // Some move names appear in more than one category with different point values
    // (e.g. "Switch" is a 1-point Escape but a 2-point Reversal). POINT_VALUES alone
    // can't disambiguate by name, so overrides are keyed "Category::Move".
    const POINT_VALUE_OVERRIDES = {
      "Escape::Switch": 1,
      "Reversal::Switch": 2,
      "Escape::Scramble": 1,
      "Reversal::Scramble": 2
    };

    // Fallback points for a category when a move has no POINT_VALUES entry at all —
    // this is what makes newly added custom moves (via Admin > Add Move) score
    // correctly out of the box. Turns/Near Fall/Penalty/DQ aren't listed here because
    // those categories pick their point value explicitly on an outcome screen
    // rather than looking it up by move name.
    const CATEGORY_DEFAULT_POINTS = {
      "Takedown": 3,
      "Escape": 1,
      "Reversal": 2,
      "Step-Out": 1,
      "Par Terre": 0,
      "Passivity": 1
    };

    /**
     * Unified point resolution (single source of truth for UI + AI + board scoring).
     * Priority:
     *   1) POINT_VALUE_OVERRIDES["Category::Move"] (e.g. Escape::Switch = 1 vs Reversal::Switch = 2)
     *   2) STYLE_POINT_OVERRIDES for Freestyle/Greco named moves
     *   3) International category heuristics (takedown 2/4, exposure, pin)
     *   4) POINT_VALUES folkstyle table
     *   5) CATEGORY_DEFAULT_POINTS for custom/admin-added moves
     * Board-facing points still flow through resolveEventPoints() (defense success = 0, penalties, etc.).
     */
    function getPointValue(category, move) {
      const key = `${category}::${move}`;
      if (Object.prototype.hasOwnProperty.call(POINT_VALUE_OVERRIDES, key)) {
        return POINT_VALUE_OVERRIDES[key];
      }
      const style = getSeasonStyle();
      if (style !== "Folkstyle" && STYLE_POINT_OVERRIDES[style] && Object.prototype.hasOwnProperty.call(STYLE_POINT_OVERRIDES[style], move)) {
        return STYLE_POINT_OVERRIDES[style][move];
      }
      // Freestyle/Greco defaults
      if (style === "Freestyle" || style === "Greco") {
        if (category === "Step-Out" || move === "Step-Out") return 1;
        if (category === "Passivity" || move === "Passivity") return 1;
        if (category === "Par Terre") return 0;
        if (category === "Takedown" || category === "Exposure / Pin") {
          if (/5/.test(String(move)) || /5-Point/i.test(String(move))) return 5;
          if (/4/.test(String(move))) return 4;
          if (/2/.test(String(move))) return 2;
          if (/pin/i.test(String(move))) return 0;
          // Standard takedowns are 2 in international; amplitude throws use explicit point pickers
          if (category === "Takedown") return 2;
        }
        if (move === "Gut Wrench" || move === "Leg Lace") return 2;
      }
      if (Object.prototype.hasOwnProperty.call(POINT_VALUES, move)) {
        return POINT_VALUES[move];
      }
      if (Object.prototype.hasOwnProperty.call(CATEGORY_DEFAULT_POINTS, category)) {
        return CATEGORY_DEFAULT_POINTS[category];
      }
      return 0;
    }

    /** Lightweight self-check used after taxonomy edits / in Admin diagnostics. */
    function assertPointResolutionSanity() {
      const cases = [
        ["Escape", "Switch", "Folkstyle", 1],
        ["Reversal", "Switch", "Folkstyle", 2],
        ["Takedown", "Double Leg", "Folkstyle", 3],
        ["Takedown", "Double Leg", "Freestyle", 2],
        ["Near Fall / Pin", "4-Point NF", "Folkstyle", 4],
        ["Exposure / Pin", "4-Point Exposure", "Freestyle", 4],
        ["Takedown", "Custom Brand New Shot", "Folkstyle", 3]
      ];
      const prevStyle = (getActiveSeason() && getActiveSeason().style) || "Folkstyle";
      const issues = [];
      cases.forEach(([cat, move, style, expect]) => {
        try {
          const s = getActiveSeason();
          if (s) s.style = style;
          const got = getPointValue(cat, move);
          if (got !== expect) issues.push(`${cat}/${move}/${style}: got ${got}, expected ${expect}`);
        } catch (err) {
          issues.push(String(err.message || err));
        }
      });
      const s = getActiveSeason();
      if (s) s.style = prevStyle;
      return issues;
    }

    function isPenaltyCategory(cat) {
      return cat === "Penalty" || cat === "Penalty/DQ";
    }

    /**
     * Display label for an event outcome in logs.
     * Defense + success (non-penalty) = "defended" in green, no +points —
     * those points never hit the scoreboard (see accumulateMatchPoints).
     */
    function formatOutcomeDisplay(e) {
      if (!e) return { label: "", color: "var(--muted)", pointsHtml: "" };
      const isDefSuccess = e.direction === "defense" && e.outcome === "success" && !isPenaltyCategory(e.category);
      if (isDefSuccess) {
        return { label: "defended", color: "var(--green)", pointsHtml: "" };
      }
      // Penalty/DQ category: label as DQ / Forfeit / Penalty instead of generic "success".
      // Red = our side committed it (direction offense), Green = opponent committed it (direction defense).
      if (isPenaltyCategory(e.category) && e.outcome === "success") {
        const sideColor = e.direction === "offense" ? "var(--red)" : "var(--green)";
        let pointsHtml = e.points ? `(+${e.points})` : "";
        let label = "Penalty";
        if (isDqLikeEvent(e)) label = "DQ";
        else if (isForfeitLikeEvent(e)) label = "Forfeit";
        return { label, color: sideColor, pointsHtml };
      }
      if (e.outcome === "success") {
        let pointsHtml = "";
        if (e.points) pointsHtml = `(+${e.points})`;
        else if (isPinLikeEvent(e)) pointsHtml = "(FALL)";
        return { label: "success", color: "var(--green)", pointsHtml };
      }
      if (e.outcome === "fail") {
        const pointsHtml = e.points ? `(+${e.points})` : "";
        return { label: "fail", color: "var(--red)", pointsHtml };
      }
      return { label: e.outcome || "", color: "var(--muted)", pointsHtml: e.points ? `(+${e.points})` : "" };
    }

    /** Board-facing points for a newly logged / normalized event. */
    function resolveEventPoints(category, move, direction, outcome, explicitPoints) {
      if (category === "Choice" || category === "Flow") return 0;
      if (isPenaltyCategory(category)) {
        return typeof explicitPoints === "number" ? explicitPoints : (explicitPoints || 1);
      }
      // Defense success = defended attempt — no scoreboard points
      if (direction === "defense" && outcome === "success") return 0;
      if (outcome === "success") {
        if (typeof explicitPoints === "number" && explicitPoints > 0) return explicitPoints;
        return getPointValue(category, move);
      }
      if (outcome === "fail" && direction === "defense") {
        if (typeof explicitPoints === "number" && explicitPoints > 0) return explicitPoints;
        return getPointValue(category, move);
      }
      return 0;
    }


    function isPinLikeEvent(e) {
      if (!e) return false;
      const detail = String(e.detail || "").trim();
      const move = String(e.move || "").trim();
      // Exact labels only — never use includes("Pin") (matches "Pinch Headlock")
      if (detail === "Pin / Fall" || detail === "Pin") return true;
      if (/^pin\s*\/?\s*fall$/i.test(detail)) return true;
      if (move === "Pin / Fall" || move === "Pin") return true;
      if (/^pin\s*\/?\s*fall$/i.test(move)) return true;
      return false;
    }

    function isForfeitLikeEvent(e) {
      if (!e) return false;
      // Only terminal forfeit outcomes — not every Injury/Blood label mid-match
      if (e.detail === "Forfeit") return true;
      const m = (e.move || "").toLowerCase();
      if (m === "forfeit") return true;
      // Injury / Blood count as forfeit only when logged via the Forfeit outcome path
      if ((m === "injury" || m === "blood") && e.detail === "Forfeit") return true;
      return false;
    }

    /** Accumulate match points from event list (shared scoring rules). */
    function accumulateMatchPoints(evs) {
      let ourP = 0, oppP = 0;
      (evs || []).forEach(e => {
        if (e.category === "Riding Time" || e.category === "Flow" || e.category === "Choice") {
          // RT segments carry points only on the summary event
          if (e.category === "Riding Time" && e.move === "Riding Time Point") {
            if (e.direction === "offense") ourP += (e.points || 1);
            else oppP += (e.points || 1);
          }
          return;
        }
        const pts = e.points || 0;
        if (isPenaltyCategory(e.category)) {
          if (e.direction === "offense") oppP += pts;
          else ourP += pts;
        } else if (e.category === "Passivity" && e.move === "Passivity" && pts) {
          // Passivity point: offense = we score; defense = opponent scores
          if (e.direction === "offense") ourP += pts;
          else oppP += pts;
        } else {
          if (e.direction === "offense") ourP += pts;
          else if (e.outcome === "fail") oppP += pts;
        }
      });
      return { ourP, oppP };
    }

    function parseTimestampToSecSafe(ts) {
      if (ts == null || ts === "") return null;
      if (typeof parseTimestampToSeconds === "function") {
        const v = parseTimestampToSeconds(ts);
        if (v != null && !isNaN(v)) return v;
      }
      const parts = String(ts).trim().split(":");
      if (parts.length === 2) {
        const m = Number(parts[0]), s = Number(parts[1]);
        if (!isNaN(m) && !isNaN(s)) return m * 60 + s;
      }
      if (parts.length === 3) {
        const h = Number(parts[0]), m = Number(parts[1]), s = Number(parts[2]);
        if ([h, m, s].every(n => !isNaN(n))) return h * 3600 + m * 60 + s;
      }
      const n = Number(ts);
      return isNaN(n) ? null : n;
    }

    function formatRtClock(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function getRidingTimeTotalsFromEvents(evs) {
      let our = 0, opp = 0;
      (evs || []).forEach(e => {
        if (e.category !== "Riding Time" || e.move !== "Riding Time Segment") return;
        const d = typeof e.durationSec === "number" ? e.durationSec : parseInt(e.detail, 10);
        if (!d || isNaN(d)) return;
        if (e.direction === "offense") our += d;
        else opp += d;
      });
      return { our, opp };
    }

    function startRidingTime(who) {
      if (!activeMatch) return;
      if (ridingTimeActive) stopRidingTime();
      const ts = pauseVideoAndGetTime();
      ridingTimeActive = true;
      ridingTimeController = who; // 'our' | 'opp'
      ridingTimeStartedTs = ts;
      render();
    }

    function stopRidingTime() {
      if (!activeMatch || !ridingTimeActive) {
        ridingTimeActive = false;
        ridingTimeController = null;
        ridingTimeStartedTs = null;
        return;
      }
      const endTs = pauseVideoAndGetTime();
      const startSec = parseTimestampToSecSafe(ridingTimeStartedTs);
      const endSec = parseTimestampToSecSafe(endTs);
      let dur = 0;
      if (startSec != null && endSec != null) dur = Math.max(0, Math.round(endSec - startSec));
      const who = ridingTimeController;
      const direction = who === "our" ? "offense" : "defense";
      if (dur > 0) {
        activeMatch.events.push({
          id: Math.random().toString(36).slice(2, 9),
          matchId: activeMatch.id,
          wrestlerId: activeMatch.wrestlerId,
          boutId: store.activeBoutId,
          period: currentPeriod,
          category: "Riding Time",
          subCategory: null,
          move: "Riding Time Segment",
          tie: "",
          direction,
          outcome: "success",
          points: 0,
          detail: dur + "s",
          durationSec: dur,
          timestamp: ridingTimeStartedTs || endTs,
          endTimestamp: endTs,
          ts: Date.now()
        });
        if (who === "our") ridingTimeOurSec += dur;
        else ridingTimeOppSec += dur;
      }
      ridingTimeActive = false;
      ridingTimeController = null;
      ridingTimeStartedTs = null;
      render();
    }

    function applyRidingTimePointIfNeeded() {
      if (!activeMatch) return;
      const totals = getRidingTimeTotalsFromEvents(activeMatch.events);
      // Include live open segment estimate
      let our = totals.our, opp = totals.opp;
      if (ridingTimeActive && ridingTimeStartedTs) {
        const now = parseTimestampToSecSafe(pauseVideoAndGetTime());
        const st = parseTimestampToSecSafe(ridingTimeStartedTs);
        if (now != null && st != null) {
          const d = Math.max(0, Math.round(now - st));
          if (ridingTimeController === "our") our += d;
          else opp += d;
        }
      }
      const advOur = our - opp;
      const advOpp = opp - our;
      // Remove prior RT point events then re-add if advantage >= 60s
      activeMatch.events = activeMatch.events.filter(e => !(e.category === "Riding Time" && e.move === "Riding Time Point"));
      if (advOur >= 60) {
        activeMatch.events.push({
          id: Math.random().toString(36).slice(2, 9),
          matchId: activeMatch.id, wrestlerId: activeMatch.wrestlerId, boutId: store.activeBoutId,
          period: currentPeriod, category: "Riding Time", move: "Riding Time Point",
          tie: "", direction: "offense", outcome: "success", points: 1,
          detail: "RT advantage " + formatRtClock(advOur), timestamp: pauseVideoAndGetTime(), ts: Date.now()
        });
      } else if (advOpp >= 60) {
        activeMatch.events.push({
          id: Math.random().toString(36).slice(2, 9),
          matchId: activeMatch.id, wrestlerId: activeMatch.wrestlerId, boutId: store.activeBoutId,
          period: currentPeriod, category: "Riding Time", move: "Riding Time Point",
          tie: "", direction: "defense", outcome: "success", points: 1,
          detail: "RT advantage " + formatRtClock(advOpp), timestamp: pauseVideoAndGetTime(), ts: Date.now()
        });
      }
    }

    function setPassivitySide(who) {
      if (!activeMatch) return;
      passivityController = who; // 'our' | 'opp'
      passivityActive = !!who;
      passivityStartedTs = null;
      render();
    }

    /** Award 1 passivity point. Our passive → opp scores (red). Opp passive → we score (green). */
    function awardPassivityPoint() {
      if (!activeMatch) return;
      if (!passivityController) {
        alert("Select Our passive or Opp passive first.");
        return;
      }
      const pointsToUs = passivityController === "opp";
      activeMatch.events.push({
        id: Math.random().toString(36).slice(2, 9),
        matchId: activeMatch.id,
        wrestlerId: activeMatch.wrestlerId,
        boutId: store.activeBoutId,
        period: currentPeriod,
        category: "Passivity",
        move: "Passivity",
        tie: "",
        direction: pointsToUs ? "offense" : "defense",
        outcome: "success",
        points: 1,
        detail: pointsToUs ? "Opponent passive (+1 us)" : "Our passive (+1 opp)",
        timestamp: pauseVideoAndGetTime(),
        ts: Date.now()
      });
      render();
    }

    function isDqLikeEvent(e) {
      if (!e) return false;
      const detail = String(e.detail || "").trim().toLowerCase();
      const move = String(e.move || "").trim().toLowerCase();
      if (detail === "dq" || detail === "disqualification") return true;
      if (move === "dq" || move === "disqualification") return true;
      // Penalty/DQ category with explicit DQ labeling
      if (isPenaltyCategory(e.category) && (move === "dq" || detail === "dq" || /\bdq\b/.test(detail))) return true;
      return false;
    }

    /**
     * Classify match outcome + dual team points (NFHS-style folkstyle dual).
     * Decision 3 · Major (8–14) 4 · Tech (15+) 5 · Fall / Forfeit / DQ 6
     *
     * Direction model (same as moves):
     *   Offense = our action  → we forfeit / we get pinned → LOSS
     *   Defense (Faced) = opponent's action → they forfeit / we pin them is offense pin
     *   Faced forfeit (opponent forfeits) → WIN + 6 dual points to us
     *   Offense forfeit (we forfeit) → LOSS + 6 dual points to opponent
     */
    function classifyMatchResult(evs) {
      const { ourP, oppP } = accumulateMatchPoints(evs);
      const pinEv = (evs || []).find(e => isPinLikeEvent(e));
      const forfeitEv = (evs || []).find(e => isForfeitLikeEvent(e));
      const dqEv = (evs || []).find(e => isDqLikeEvent(e));
      const isOffPin = pinEv && pinEv.direction === "offense";
      const isDefPin = pinEv && pinEv.direction === "defense";
      // Faced forfeit/DQ = opponent gives up → we WIN. Offense forfeit/DQ = we give up → LOSS.
      const isFacedForfeit = forfeitEv && forfeitEv.direction === "defense";
      const isOurForfeit = forfeitEv && forfeitEv.direction === "offense";
      const isFacedDq = dqEv && dqEv.direction === "defense";
      const isOurDq = dqEv && dqEv.direction === "offense";

      let result = "tie"; // win | loss | tie
      let method = "decision"; // pin | forfeit | dq | tech | major | decision | tie
      let dualPtsOur = 0;
      let dualPtsOpp = 0;
      let margin = 0;

      // Terminal results: DQ / Forfeit take priority over pin so mis-tagged moves never hide a DQ
      if (isFacedDq || isFacedForfeit) {
        result = "win";
        method = isFacedDq ? "dq" : "forfeit";
        dualPtsOur = 6;
      } else if (isOurDq || isOurForfeit) {
        result = "loss";
        method = isOurDq ? "dq" : "forfeit";
        dualPtsOpp = 6;
      } else if (isOffPin) {
        result = "win";
        method = "pin";
        dualPtsOur = 6;
      } else if (isDefPin) {
        result = "loss";
        method = "pin";
        dualPtsOpp = 6;
      } else if (ourP > oppP) {
        result = "win";
        margin = ourP - oppP;
        if (margin >= 15) { method = "tech"; dualPtsOur = 5; }
        else if (margin >= 8) { method = "major"; dualPtsOur = 4; }
        else { method = "decision"; dualPtsOur = 3; }
      } else if (oppP > ourP) {
        result = "loss";
        margin = oppP - ourP;
        if (margin >= 15) { method = "tech"; dualPtsOpp = 5; }
        else if (margin >= 8) { method = "major"; dualPtsOpp = 4; }
        else { method = "decision"; dualPtsOpp = 3; }
      } else {
        result = "tie";
        method = "tie";
      }

      return {
        ourP, oppP, result, method, margin,
        dualPtsOur, dualPtsOpp,
        pinEv: pinEv || null,
        forfeitEv: forfeitEv || null,
        isOffPin, isDefPin,
        isOffForfeit: isOurForfeit,
        isDefForfeit: isFacedForfeit
      };
    }

    function reverseDualRecordContribution(season, bout) {
      if (!bout || !bout.finalizedSnapshot) return;
      const rec = bout.division === "Girls"
        ? (season.girlsDualRecord || (season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 }))
        : (season.boysDualRecord || (season.boysDualRecord = { wins: 0, losses: 0, ties: 0 }));
      const prev = bout.finalizedSnapshot;
      if (prev.outcome === "win") rec.wins = Math.max(0, (rec.wins || 0) - 1);
      else if (prev.outcome === "loss") rec.losses = Math.max(0, (rec.losses || 0) - 1);
      else if (prev.outcome === "tie") rec.ties = Math.max(0, (rec.ties || 0) - 1);
    }

      if (!season) return String(new Date().getFullYear());
      const name = season.name || "";
      const range = name.match(/(20\d{2})\s*[–\-]\s*(20\d{2})/);
      if (range) return range[1] + "–" + range[2];
      const single = name.match(/20\d{2}/);

      return String(new Date().getFullYear());

      if (titleEl) titleEl.textContent = b.teamName ? `· ${b.teamName}` : "";
    }

    function estimateLocalStorageBytes() {
      let total = 0;
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k) continue;
          const v = localStorage.getItem(k) || "";
          total += (k.length + v.length) * 2; // UTF-16
        }
      } catch (e) {}
      return total;
    }

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(2) + " MB";
    }

    function exportAllBackup() {
      const payload = {
        type: "mat-scout-full-backup",
        version: 1,
        exported_at: new Date().toISOString(),
        store, taxonomy, weightClasses, branding, customTheme, appConfig, awards, gearInventory,
        rosterLibrary, aiTrainingLibrary: (aiTrainingLibrary || []).map(ex => {
          const copy = Object.assign({}, ex);
          if (copy.video && copy.video.type === "file") {
            copy.video = Object.assign({}, copy.video, { hasLocalBlob: false, note: "Video blobs not included in JSON backup — re-link locally if needed." });
          }
          return copy;
        }),
        layoutOrder, adminSectionHidden, ourWrestlerAppearance, moveStyleTags
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Mat Scout/Backups/mat-scout-full-backup_" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        localStorage.setItem(TAXONOMY_STORAGE_KEY, JSON.stringify(taxonomy));
        localStorage.setItem(WEIGHT_CLASSES_STORAGE_KEY, JSON.stringify(weightClasses));
        localStorage.setItem(BRANDING_STORAGE_KEY, JSON.stringify(branding));
        localStorage.setItem(COLOR_THEME_STORAGE_KEY, JSON.stringify(customTheme));
        localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(appConfig));
        localStorage.setItem(AWARDS_STORAGE_KEY, JSON.stringify(awards));
        localStorage.setItem(GEAR_STORAGE_KEY, JSON.stringify(gearInventory));
        localStorage.setItem(ROSTER_LIBRARY_KEY, JSON.stringify(rosterLibrary));
        localStorage.setItem(AI_TRAINING_LIBRARY_KEY, JSON.stringify(aiTrainingLibrary));
        localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify(layoutOrder));
        localStorage.setItem(ADMIN_SECTIONS_STORAGE_KEY, JSON.stringify(adminSectionHidden));
        localStorage.setItem(APPEARANCE_STORAGE_KEY, JSON.stringify(ourWrestlerAppearance));
        localStorage.setItem(MOVE_STYLE_TAGS_KEY, JSON.stringify(moveStyleTags));
        lastPersistAt = Date.now();
        const used = estimateLocalStorageBytes();
        // Typical browser quota ~5MB; warn near 4MB
        if (used > 4 * 1024 * 1024 && !storageQuotaWarned) {
          storageQuotaWarned = true;
          const go = confirm(
            "Storage is getting full (" + formatBytes(used) + ").\n\n" +
            "Archive or export a season, or download a full backup now to free space.\n\n" +
            "Download full backup now?"
          );
          if (go) exportAllBackup();
        }
      } catch (err) {
        const isQuota = err && (err.name === "QuotaExceededError" || err.code === 22);
        if (isQuota) {
          alert("Browser storage is full. Export a full backup and archive/delete old seasons before saving again.");
          try { exportAllBackup(); } catch (e2) {}
        }
        console.warn("persist failed", err);
      }
    }

    function getActiveSeason() {
      return store.seasons.find(s => s.id === store.activeSeasonId) || store.seasons[0];
    }

    function isSeasonLocked(season) {
      const s = season || getActiveSeason();
      return !!(s && s.locked);
    }

    function guardSeasonLocked(actionLabel) {
      if (isSeasonLocked()) {
        alert(`This season is finalized and locked.\n\nReopen it from Admin → Season Archive & Storage before ${actionLabel || "making changes"}.`);
        return true;
      }
      return false;
    }

    function getSeasonYearLabelSafe(season) {
      try {
        if (typeof getSeasonYearLabel === "function") return getSeasonYearLabel(season);
      } catch (e) {}
      const n = (season && season.name) || "";
      const m = String(n).match(/20\d{2}/);
      return m ? m[0] : String(new Date().getFullYear());
    }

    /** Download a full season archive as a JSON file (browser "folder"/file save). */
    function archiveSeason(seasonId) {
      const season = store.seasons.find(s => s.id === seasonId);
      if (!season) return alert("Season not found.");
      const payload = {
        type: "mat-scout-season-archive",
        version: 1,
        exportedAt: new Date().toISOString(),
        season: JSON.parse(JSON.stringify(season)),
        // HOF stays global; include assignment context for reference only
        awardsSnapshot: JSON.parse(JSON.stringify(awards || []))
      };
      const safeName = String(season.name || "season").replace(/[^a-z0-9-_]+/gi, "_").slice(0, 40);
      const fname = `Mat Scout/Seasons/mat-scout-archive_${safeName}_${getSeasonYearLabelSafe(season)}.json`;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      alert(`Archived "${season.name}" to download folder:\n${fname}\n\n(Browsers may flatten the path; move the file into Mat Scout → Seasons if needed.)\nKeep this file to reload the season later.`);
    }

    function archiveActiveSeason() {
      const s = getActiveSeason();
      if (!s) return alert("No active season.");
      archiveSeason(s.id);
    }

    function toggleSeasonLock(seasonId) {
      const season = store.seasons.find(s => s.id === seasonId);
      if (!season) return;
      if (season.locked) {
        if (!confirm(`Reopen season "${season.name}"?\n\nYou will be able to add roster, bouts, matches, and events again.`)) return;
        season.locked = false;
        persist();
        render();
        alert(`Season "${season.name}" is open for edits.`);
      } else {
        if (!confirm(`Finalize season "${season.name}"?\n\nThis locks the season: no new athletes, bouts, matches, or scoring can be added until you reopen it.`)) return;
        season.locked = true;
        persist();
        render();
        alert(`Season "${season.name}" is finalized and locked.`);
      }
    }

    /** Load a previously downloaded season archive JSON. */
    function loadSeasonArchiveFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          let season = data.season || data;
          if (!season || !season.name) throw new Error("Invalid archive file.");
          season = JSON.parse(JSON.stringify(season));

          const oldWrestlerIds = {};
          const oldBoutIds = {};
          const oldMatchIds = {};

          season.id = Math.random().toString(36).slice(2, 9);
          season.roster = (season.roster || []).map(w => {
            const nid = Math.random().toString(36).slice(2, 9);
            oldWrestlerIds[w.id] = nid;
            return { ...w, id: nid };
          });
          season.bouts = (season.bouts || []).map(b => {
            const nid = Math.random().toString(36).slice(2, 9);
            oldBoutIds[b.id] = nid;
            return { ...b, id: nid };
          });
          season.matches = (season.matches || []).map(m => {
            const nid = Math.random().toString(36).slice(2, 9);
            oldMatchIds[m.id] = nid;
            return {
              ...m,
              id: nid,
              wrestlerId: oldWrestlerIds[m.wrestlerId] || m.wrestlerId,
              boutId: oldBoutIds[m.boutId] || m.boutId
            };
          });
          season.events = (season.events || []).map(e => ({
            ...e,
            id: Math.random().toString(36).slice(2, 9),
            wrestlerId: oldWrestlerIds[e.wrestlerId] || e.wrestlerId,
            boutId: oldBoutIds[e.boutId] || e.boutId,
            matchId: oldMatchIds[e.matchId] || e.matchId
          }));
          if (!season.boysDualRecord) season.boysDualRecord = { wins: 0, losses: 0, ties: 0 };
          if (!season.girlsDualRecord) season.girlsDualRecord = { wins: 0, losses: 0, ties: 0 };

          // Ensure unique name if collision
          let base = season.name;
          let n = 2;
          while (store.seasons.some(s => s.name === season.name)) {
            season.name = base + " (restored " + n + ")";
            n++;
          }

          store.seasons.push(season);
          store.activeSeasonId = season.id;
          store.activeBoutId = "all";
          store.activeWrestlerId = season.roster[0] ? season.roster[0].id : null;
          persist();
          render();
          alert(`Loaded archived season "${season.name}" (${season.roster.length} athletes, ${(season.matches || []).length} matches).`);
        } catch (err) {
          alert("Could not load archive: " + (err.message || err));
        }
      };
      reader.readAsText(file);
    }

    function triggerLoadSeasonArchive() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json,.json";
      input.onchange = () => {
        if (input.files && input.files[0]) loadSeasonArchiveFromFile(input.files[0]);
      };
      input.click();
    }

    /**
     * Delete a season from active storage.
     * Hall of Fame (awards) is global and kept.
     * Roster is saved to rosterLibrary for optional import into a future season (not shown as a live season).
     */
    function deleteSeason(seasonId) {
      const season = store.seasons.find(s => s.id === seasonId);
      if (!season) return;
      if (store.seasons.length <= 1) {
        return alert("You cannot delete the only remaining season. Create or load another season first.");
      }
      const matchCount = (season.matches || []).length;
      const eventCount = (season.events || []).length;
      const msg =
        `Delete season "${season.name}"?\n\n` +
        `• ${season.roster.length} roster athlete(s) will be saved to the Roster Library for later import\n` +
        `• ${matchCount} match(es) and ${eventCount} event(s) will be removed from this device\n` +
        `• Hall of Fame awards are kept\n\n` +
        `Tip: Archive/download the season first if you may need the full stats later.`;
      if (!confirm(msg)) return;

      // Preserve roster for future season import
      if (season.roster && season.roster.length) {
        rosterLibrary.push({
          id: Math.random().toString(36).slice(2, 9),
          label: season.name,
          year: getSeasonYearLabelSafe(season),
          savedAt: new Date().toISOString(),
          roster: JSON.parse(JSON.stringify(season.roster))
        });
      }

      store.seasons = store.seasons.filter(s => s.id !== seasonId);
      if (store.activeSeasonId === seasonId) {
        store.activeSeasonId = store.seasons[0].id;
        store.activeBoutId = "all";
        store.activeWrestlerId = store.seasons[0].roster[0] ? store.seasons[0].roster[0].id : null;
      }
      persist();
      render();
      alert(`Season deleted. Roster saved to library (${rosterLibrary.length} saved roster(s) available for import).`);
    }

    function deleteRosterLibraryEntry(libId) {
      if (!confirm("Remove this saved roster from the library?")) return;
      rosterLibrary = rosterLibrary.filter(r => r.id !== libId);
      persist();
      render();
    }

    function getActiveWrestler() {
      const season = getActiveSeason();
      return season.roster.find(w => w.id === store.activeWrestlerId) || null;
    }

    function getActiveBout() {
      const season = getActiveSeason();
      if (store.activeBoutId === "all") return null;
      return season.bouts.find(b => b.id === store.activeBoutId) || null;
    }

    function getActiveWeightClasses() {
      const bout = getActiveBout();
      // Bout sheet / dual weights follow the loaded event division — not the active athlete
      if (bout) {
        return bout.division === "Girls" ? weightClasses.Girls : weightClasses.Boys;
      }
      const wrestler = getActiveWrestler();
      if (wrestler && wrestler.division === "Girls") return weightClasses.Girls;
      return weightClasses.Boys;
    }

    function syncScoutMatchWeightFromRoster() {
      const w = getActiveWrestler();
      scoutMatchWeightClass = w ? String(w.weightClass) : null;
    }

    function getScoutMatchWeightClass() {
      if (activeMatch && activeMatch.weightClass != null && activeMatch.weightClass !== "") {
        return String(activeMatch.weightClass);
      }
      if (scoutMatchWeightClass != null && scoutMatchWeightClass !== "") {
        return String(scoutMatchWeightClass);
      }
      const w = getActiveWrestler();
      return w ? String(w.weightClass) : "";
    }

    function setScoutMatchWeightClass(wt) {
      const val = String(wt || "").trim();
      scoutMatchWeightClass = val || null;
      if (activeMatch) {
        activeMatch.weightClass = scoutMatchWeightClass;
        const w = getActiveWrestler();
        if (w) activeMatch.rosterWeightClass = String(w.weightClass);
      }
      render();
    }

    function renderScoutAthleteSelectHtml() {
      const season = getActiveSeason();
      return `
        <select class="select" style="margin:0 0 0 6px; width:auto; min-width:210px; max-width:330px; font-size:12px; font-weight:700;"
          onchange="setActiveWrestler(this.value)" title="Athlete under review">
          ${(season.roster || []).map(w =>
            `<option value="${w.id}" ${w.id === store.activeWrestlerId ? "selected" : ""}>${w.name} — ${w.weightClass} lbs (${w.level})</option>`
          ).join("")}
        </select>`;
    }

    function renderScoutWeightSelectHtml(activeW, compact) {
      if (!activeW) return "";
      const weights = getActiveWeightClasses() || [];
      const current = getScoutMatchWeightClass() || String(activeW.weightClass);
      const set = new Set(weights.map(String));
      set.add(String(activeW.weightClass));
      if (current) set.add(String(current));
      const opts = Array.from(set).sort((a, b) => (Number(a) || 0) - (Number(b) || 0));
      const rosterWt = String(activeW.weightClass);
      const bumpedNote = current && rosterWt && Number(current) > Number(rosterWt)
        ? `<span style="font-size:10px; color:var(--gold); font-weight:700; white-space:nowrap;">↑ Bump</span>`
        : "";
      // Compact inline select (same line as athlete)
      return `
        <select class="select" style="margin:0 0 0 6px; width:auto; min-width:72px; font-size:12px; font-weight:700;"
          onchange="setScoutMatchWeightClass(this.value)" title="Match weight class (lbs). Roster default: ${rosterWt}">
          ${opts.map(wt => `<option value="${wt}" ${String(wt) === String(current) ? "selected" : ""}>${wt}${String(wt) === rosterWt ? " ★" : ""}</option>`).join("")}
        </select>${bumpedNote ? " " + bumpedNote : ""}`;
    }

    /** Title row: "Score Match:" / "AI Video Scout:" + athlete + weight on one line */
    function renderScoutTitleRow(label, activeW, extraRightHtml) {
      return `
        <div class="card-title" style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px;">
          <span style="white-space:nowrap;">${label}</span>
          <span style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            ${renderScoutAthleteSelectHtml()}
            ${renderScoutWeightSelectHtml(activeW, true)}
          </span>
          <span style="margin-left:auto; display:flex; align-items:center;">${extraRightHtml || ""}</span>
        </div>`;
    }

    function resetRidingTimeState() {
      ridingTimeActive = false;
      ridingTimeController = null;
      ridingTimeStartedTs = null;
      ridingTimeOurSec = 0;
      ridingTimeOppSec = 0;
    }

    function resetPassivityState() {
      passivityActive = false;
      passivityController = null; // 'our' | 'opp' — who is on the activity/passivity clock
      passivityStartedTs = null;
    }

    function switchActiveSeason(seasonId) {
      store.activeSeasonId = seasonId;
      store.activeBoutId = "all";
      const season = getActiveSeason();
      store.activeWrestlerId = season.roster.length > 0 ? season.roster[0].id : null;
      activeMatch = null;
      syncScoutMatchWeightFromRoster();
      resetRidingTimeState();
      resetPassivityState();
      persist();
      render();
    }

    function switchActiveBout(boutId) {
      store.activeBoutId = boutId;
      activeMatch = null;
      resetRidingTimeState();
      resetPassivityState();
      persist();
      render();
    }

    function setActiveWrestler(id) {
      store.activeWrestlerId = id;
      const w = getActiveWrestler();
      if (w) selectedMatchLevel = w.level || "Varsity";
      syncScoutMatchWeightFromRoster();
      // Don't leak open RT clock across athletes when switching mid-session
      if (!activeMatch) {
        resetRidingTimeState();
        resetPassivityState();
      } else if (activeMatch.wrestlerId !== id) {
        activeMatch = null;
        resetRidingTimeState();
        resetPassivityState();
      }
      persist();
      render();
    }

    function getAllMovesFlat() {
      const moves = [];
      Object.keys(taxonomy.MOVE_GROUPS).forEach(cat => {
        const val = taxonomy.MOVE_GROUPS[cat];
        if (Array.isArray(val)) {
          moves.push(...val);
        } else {
          Object.values(val).forEach(subList => moves.push(...subList));
        }
      });
      return Array.from(new Set(moves));
    }

    function switchTab(tab) {
      if (activeMatch && currentTab === "scout" && tab !== "scout") {
        const ok = confirm(
          "You have an unsaved scoring session in progress.\n\n" +
          "Leave Scout without saving? Your current match log will be lost unless you Save & Commit or Discard first.\n\n" +
          "Press OK to leave and discard the open session, or Cancel to stay on Scout."
        );
        if (!ok) return;
        // Leaving without commit — drop open session so state does not leak
        activeMatch = null;
        selectedPrimaryCat = null;
        selectedSubCat = null;
        selectedPendingMove = null;
        activeTieModifiers = [];
        resetRidingTimeState();
        resetPassivityState();
      }
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", ["roster", "scout", "sheet", "stats", "plan", "calendar", "admin"][idx] === tab);
      });
      render();
    }

    /* VIDEO ENGINE */
    function extractYouTubeVideoId(url) {
      if (!url) return null;
      const match = url.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function syncVideoPlayerVisibility() {
      const vid = document.getElementById("persistent-video");
      const ytContainer = document.getElementById("yt-player-container");
      const title = document.getElementById("global-video-title");
      if (title) title.textContent = `Match Video Player: ${videoFileName || 'YouTube Footage'}`;

      if (videoSourceType === "file") {
        if (vid) {
          vid.style.display = "block";
          if (vid.src !== videoBlobUrl) vid.src = videoBlobUrl || "";
          try { vid.playbackRate = videoPlaybackRate || 1; } catch (e) {}
        }
        if (ytContainer) ytContainer.style.display = "none";
      } else if (videoSourceType === "youtube") {
        if (vid) vid.style.display = "none";
        if (ytContainer) ytContainer.style.display = "block";
        initOrUpdateYouTubePlayer(youtubeVideoId);
        try {
          if (ytPlayer && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(videoPlaybackRate || 1);
        } catch (e) {}
      }
    }

    function initOrUpdateYouTubePlayer(videoId) {
      if (!videoId) return;
      const targetEl = document.getElementById("yt-player-target");
      if (!targetEl) return;
      // render() rebuilds DOM on tab switches — the old YT.Player iframe is discarded
      const hasDomIframe = !!(targetEl.querySelector && targetEl.querySelector("iframe"));
      const needNewPlayer = !ytPlayer || !hasDomIframe;

      if (needNewPlayer && window.YT && YT.Player) {
        // Destroy stale player reference if DOM was rebuilt
        try {
          if (ytPlayer && typeof ytPlayer.destroy === "function") ytPlayer.destroy();
        } catch (e) {}
        ytPlayer = null;
        ytLoadedVideoId = null;
        ytPlayer = new YT.Player('yt-player-target', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: { 'playsinline': 1, 'rel': 0 },
          events: {
            'onReady': (ev) => {
              ytLoadedVideoId = videoId;
              try { if (ev && ev.target && ev.target.setPlaybackRate) ev.target.setPlaybackRate(videoPlaybackRate || 1); } catch (e) {}
            }
          }
        });
      } else if (ytPlayer && ytPlayer.cueVideoById && videoId !== ytLoadedVideoId) {
        ytPlayer.cueVideoById(videoId);
        ytLoadedVideoId = videoId;
      }
    }

    function handleSharedVideoFile(e) {
      const file = e.target.files[0];
      if (file) {
        videoSourceType = "file";
        selectedVideoFile = file;
        videoFileName = file.name;
        if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
        videoBlobUrl = URL.createObjectURL(file);
        youtubeVideoId = null;
        render();
      }
    }

    if (typeof window !== "undefined" && !window.__matScoutUnloadBound) {
      window.__matScoutUnloadBound = true;
      window.addEventListener("beforeunload", () => {
        if (videoBlobUrl) {
          try { URL.revokeObjectURL(videoBlobUrl); } catch (e) {}
          videoBlobUrl = null;
        }
      });
    }

    function handleLoadYouTubeUrl() {
      const input = document.getElementById("yt-url-input");
      if (!input) return;
      const url = input.value.trim();
      const id = extractYouTubeVideoId(url);
      if (!id) return alert("Please enter a valid YouTube video URL.");

      videoSourceType = "youtube";
      youtubeVideoId = id;
      videoFileName = `YouTube [${id}]`;
      selectedVideoFile = null;
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = null;
      render();
    }

    function clearSharedVideo() {
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = null;
      selectedVideoFile = null;
      videoFileName = "";
      youtubeVideoId = null;

      const vid = document.getElementById("persistent-video");
      if (vid) {
        vid.pause();
        vid.removeAttribute("src");
        vid.load();
      }

      if (ytPlayer && ytPlayer.pauseVideo) {
        ytPlayer.pauseVideo();
      }
      render();
    }

    function formatTimestampFromSeconds(t) {
      t = Math.max(0, Number(t) || 0);
      const mm = String(Math.floor(t / 60)).padStart(2, "0");
      const whole = Math.floor(t % 60);
      const tenths = Math.round((t - Math.floor(t)) * 10) % 10;
      return mm + ":" + String(whole).padStart(2, "0") + "." + tenths;
    }

    function pauseVideoAndGetTime() {
      if (videoSourceType === "youtube") {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          try { ytPlayer.pauseVideo(); } catch (err) {}
          return formatTimestampFromSeconds(ytPlayer.getCurrentTime() || 0);
        }
        return "00:00.0";
      }

      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return "";
      vid.pause();
      return formatTimestampFromSeconds(vid.currentTime || 0);
    }

    function seekVideo(ts) {
      if (!ts && ts !== 0) return;
      let secs;
      if (typeof ts === "number") {
        secs = ts;
      } else {
        const parts = String(ts).trim().split(":");
        if (parts.length === 2) {
          const m = Number(parts[0]);
          const s = Number(parts[1]); // supports fractional seconds e.g. 23.4
          secs = (!isNaN(m) && !isNaN(s)) ? (m * 60 + s) : (Number(ts) || 0);
        } else if (parts.length === 3) {
          const h = Number(parts[0]), m = Number(parts[1]), s = Number(parts[2]);
          secs = ([h, m, s].every(n => !isNaN(n))) ? (h * 3600 + m * 60 + s) : (Number(ts) || 0);
        } else {
          secs = Number(ts) || 0;
        }
      }

      if (videoSourceType === "youtube") {
        if (ytPlayer && ytPlayer.seekTo) {
          ytPlayer.seekTo(secs, true);
          // Stay paused so the user can review the frame and press play when ready
          try { ytPlayer.pauseVideo(); } catch (err) {}
        }
        return;
      }

      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return;
      vid.pause();
      vid.currentTime = secs;
    }

    function getVideoCurrentTimeSec() {
      if (videoSourceType === "youtube") {
        try {
          if (ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime() || 0;
        } catch (e) {}
        return 0;
      }
      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return 0;
      return vid.currentTime || 0;
    }

    function isVideoPlaying() {
      if (videoSourceType === "youtube") {
        try {
          if (ytPlayer && ytPlayer.getPlayerState) return ytPlayer.getPlayerState() === 1; // YT.PlayerState.PLAYING
        } catch (e) {}
        return false;
      }
      const vid = document.getElementById("persistent-video");
      return !!(vid && videoBlobUrl && !vid.paused && !vid.ended);
    }

    function toggleVideoPlayPause() {
      if (videoSourceType === "youtube") {
        if (!ytPlayer) return;
        try {
          if (isVideoPlaying()) ytPlayer.pauseVideo();
          else ytPlayer.playVideo();
        } catch (e) {}
        return;
      }
      const vid = document.getElementById("persistent-video");
      if (!vid || !videoBlobUrl) return;
      if (vid.paused || vid.ended) vid.play().catch(() => {});
      else vid.pause();
    }

    function nudgeVideo(deltaSec) {
      const t = Math.max(0, getVideoCurrentTimeSec() + deltaSec);
      seekVideo(t);
    }

    /** Keyboard hotkeys active on Scout tab (ignored while typing in inputs). */
    function handleScoutHotkeys(e) {
      if (currentTab !== "scout") return;
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select" || (e.target && e.target.isContentEditable)) return;
      if (activeModal) return;

      const key = e.key;
      if (key === " " || key === "Spacebar") {
        e.preventDefault();
        toggleVideoPlayPause();
        return;
      }
      if (key === "j" || key === "J" || key === "ArrowLeft") {
        e.preventDefault();
        nudgeVideo(-3);
        return;
      }
      if (key === "l" || key === "L" || key === "ArrowRight") {
        e.preventDefault();
        nudgeVideo(3);
        return;
      }
      if (key === "[") {
        e.preventDefault();
        nudgeVideo(-0.1);
        return;
      }
      if (key === "]") {
        e.preventDefault();
        nudgeVideo(0.1);
        return;
      }
      if (key === "1") {
        e.preventDefault();
        currentPeriod = "P1";
        render();
        return;
      }
      if (key === "2") {
        e.preventDefault();
        currentPeriod = "P2";
        render();
        return;
      }
      if (key === "3") {
        e.preventDefault();
        currentPeriod = "P3";
        render();
        return;
      }
    }

    if (typeof window !== "undefined" && !window.__matScoutHotkeysBound) {
      window.__matScoutHotkeysBound = true;
      document.addEventListener("keydown", handleScoutHotkeys);
    }

    function resetTabLayout(tabKey) {
      if (!confirm(`Reset the ${tabKey} tab back to its default layout?`)) return;
      delete layoutOrder[tabKey];
      persist();
      render();
    }

    function applyLayoutOrder() {
      const target = document.getElementById("tab-content");
      if (!target) return;
      const cards = Array.from(target.children).filter(el => el.classList.contains("card"));
      cards.forEach((el, i) => { el.dataset.cardIdx = i; });

      const key = currentTab;
      let order = layoutOrder[key];
      if (!order || order.length !== cards.length) {
        order = cards.map((_, i) => i);
        layoutOrder[key] = order;
      }

      order.forEach(idx => {
        const el = cards[idx];
        if (el) target.appendChild(el);
      });

      const orderedEls = Array.from(target.children).filter(el => el.classList.contains("card"));
      orderedEls.forEach(el => {
        el.classList.toggle("layout-draggable", uiUnlocked && cards.length > 1);
        el.draggable = uiUnlocked && cards.length > 1;
        el.removeEventListener("dragstart", onCardDragStart);
        el.removeEventListener("dragover", onCardDragOver);
        el.removeEventListener("drop", onCardDrop);
        el.removeEventListener("dragend", onCardDragEnd);
        if (uiUnlocked) {
          el.addEventListener("dragstart", onCardDragStart);
          el.addEventListener("dragover", onCardDragOver);
          el.addEventListener("drop", onCardDrop);
          el.addEventListener("dragend", onCardDragEnd);
        }
      });
    }

    function onCardDragStart(e) {
      draggedCardEl = e.currentTarget;
      e.currentTarget.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", ""); } catch (err) {}
    }

    function onCardDragOver(e) {
      e.preventDefault();
      if (!draggedCardEl) return;
      const container = document.getElementById("tab-content");
      const afterEl = getDragAfterElement(container, e.clientY);
      if (afterEl == null) {
        container.appendChild(draggedCardEl);
      } else if (afterEl !== draggedCardEl) {
        container.insertBefore(draggedCardEl, afterEl);
      }
    }

    function getDragAfterElement(container, y) {
      const els = Array.from(container.querySelectorAll(".card:not(.dragging)"));
      return els.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    function onCardDrop(e) {
      e.preventDefault();
      saveCurrentCardOrder();
    }

    function onCardDragEnd(e) {
      e.currentTarget.classList.remove("dragging");
      draggedCardEl = null;
      saveCurrentCardOrder();
    }

    function saveCurrentCardOrder() {
      const target = document.getElementById("tab-content");
      if (!target) return;
      const cards = Array.from(target.children).filter(el => el.classList.contains("card"));
      const order = cards.map(el => Number(el.dataset.cardIdx));
      layoutOrder[currentTab] = order;
      persist();
    }

    /* ROSTER TAB RENDERING */
    function getWrestlerRecord(wrestlerId) {
      const season = getActiveSeason();
      let wins = 0, losses = 0, ties = 0;
      season.matches.filter(m => m.wrestlerId === wrestlerId).forEach(m => {
        const evs = season.events.filter(e => e.matchId === m.id);
        const r = classifyMatchResult(evs);
        if (r.result === "win") wins++;
        else if (r.result === "loss") losses++;
        else ties++;
      });
      return ties > 0 ? `${wins}-${losses}-${ties}` : `${wins}-${losses}`;
    }

    /** Grade options based on Admin school-level checkboxes */
    function getGradeOptions() {
      const opts = [];
      if (appConfig.includeElementary) {
        ["K", "1", "2", "3", "4", "5", "6"].forEach(g => opts.push({ value: g, label: g === "K" ? "Grade K (Kindergarten)" : "Grade " + g }));
      }
      if (appConfig.includeMiddleSchool) {
        if (appConfig.include6thInJH && !appConfig.includeElementary) {
          opts.push({ value: "6", label: "Grade 6" });
        }
        opts.push({ value: "7", label: "Grade 7" });
        opts.push({ value: "8", label: "Grade 8" });
      } else if (appConfig.include6thInJH) {
        opts.push({ value: "6", label: "Grade 6" });
      }
      if (appConfig.includeHighSchool !== false) {
        opts.push({ value: "9", label: "Grade 9 (Freshman)" });
        opts.push({ value: "10", label: "Grade 10 (Sophomore)" });
        opts.push({ value: "11", label: "Grade 11 (Junior)" });
        opts.push({ value: "12", label: "Grade 12 (Senior)" });
      }
      if (appConfig.includeCollege) {
        opts.push({ value: "FR", label: "College Freshman (FR)" });
        opts.push({ value: "SO", label: "College Sophomore (SO)" });
        opts.push({ value: "JR", label: "College Junior (JR)" });
        opts.push({ value: "SR", label: "College Senior (SR)" });
        opts.push({ value: "RS", label: "Redshirt Year (RS)" });
      }
      // de-dupe by value (e.g. grade 6 from elementary + JH)
      const seen = new Set();
      return opts.filter(o => { if (seen.has(o.value)) return false; seen.add(o.value); return true; });
    }

    function deleteWrestler(id) {
      if (guardSeasonLocked("deleting athletes")) return;
      const season = getActiveSeason();
      const targetW = season.roster.find(w => w.id === id);
      const name = targetW ? targetW.name : "this athlete";
      if (!confirm(`Are you sure you want to delete ${name}? All associated match and event records will be permanently removed.`)) return;

      season.roster = season.roster.filter(w => w.id !== id);
      season.matches = season.matches.filter(m => m.wrestlerId !== id);
      season.events = season.events.filter(e => e.wrestlerId !== id);
      if (store.activeWrestlerId === id) {
        store.activeWrestlerId = season.roster.length > 0 ? season.roster[0].id : null;
      }
      persist();
      render();
    }

    function deleteBout(boutId) {
      if (guardSeasonLocked("deleting events")) return;
      const season = getActiveSeason();
      const targetB = season.bouts.find(b => b.id === boutId);
      const boutLabel = targetB ? `${targetB.date} [${targetB.type}] vs ${targetB.opponentTeam}` : "this bout";
      const matchCount = (season.matches || []).filter(m => m.boutId === boutId).length;
      const eventCount = (season.events || []).filter(e => e.boutId === boutId).length;

      let msg = `Delete ${boutLabel}?`;
      if (matchCount > 0 || eventCount > 0) {
        msg =
          `Stats have been entered for this event.\n\n` +
          `• ${matchCount} match(es)\n` +
          `• ${eventCount} scoring event(s)\n\n` +
          `Deleting will permanently remove all matches and stats associated with this dual/tournament.\n\n` +
          `Continue?`;
      } else {
        msg = `Are you sure you want to delete ${boutLabel}? No matches or stats are logged for this event.`;
      }
      if (!confirm(msg)) return;

      // Reverse dual-record contribution if this bout was finalized
      if (targetB && targetB.finalized) {
        reverseDualRecordContribution(season, targetB);
      }

      // Cascade-remove matches and events for this bout
      const removedMatchIds = new Set(
        (season.matches || []).filter(m => m.boutId === boutId).map(m => m.id)
      );
      season.matches = (season.matches || []).filter(m => m.boutId !== boutId);
      season.events = (season.events || []).filter(e =>
        e.boutId !== boutId && !removedMatchIds.has(e.matchId)
      );
      season.bouts = season.bouts.filter(b => b.id !== boutId);
      if (store.activeBoutId === boutId) store.activeBoutId = "all";
      if (activeMatch && activeMatch.boutId === boutId) activeMatch = null;
      persist();
      render();
    }

    function formatTime12(t) {
      if (!t) return "—";
      const parts = String(t).split(":");
      if (parts.length < 2) return t;
      let h = parseInt(parts[0], 10);
      const m = parts[1];
      if (isNaN(h)) return t;
      const ap = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return h + ":" + m + " " + ap;
    }

    function printMultiSeasonAnalysis() {
      const liveSeasons = (store.seasons || []).filter(s => !s.locked).slice(-4);
      if (!liveSeasons.length) return alert("No live (open) seasons found.");
      const isTeam = statsShowTeam;
      const activeW = getActiveWrestler();
      if (!isTeam && !activeW) return alert("Select a wrestler or Team view first.");

      const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const subject = isTeam ? "Entire Team" : activeW.name;
      const targetName = isTeam ? null : (activeW.name || "").toLowerCase().trim();
      const shotMoves = new Set((taxonomy.MOVE_GROUPS.Takedown && taxonomy.MOVE_GROUPS.Takedown.Shots) || []);

      // Per-season stats: { seasonLabel, record, matches, shotPctStr, moveMap: { moveKey: { success, attempts } }, prof: { neutral, top, bottom } }
      const seasonStats = liveSeasons.map(season => {
        let wrestlerIds = null;
        let present = true;
        if (!isTeam) {
          wrestlerIds = (season.roster || []).filter(w => (w.name || "").toLowerCase().trim() === targetName).map(w => w.id);
          present = wrestlerIds.length > 0;
        }
        const matches = present
          ? (season.matches || []).filter(m => isTeam || wrestlerIds.includes(m.wrestlerId))
          : [];
        let wins = 0, losses = 0, ties = 0;
        matches.forEach(m => {
          const evs = (season.events || []).filter(e => e.matchId === m.id);
          const r = classifyMatchResult(evs);
          if (r.result === "win") wins++;
          else if (r.result === "loss") losses++;
          else ties++;
        });
        const record = !present ? "—" : (ties > 0 ? `${wins}-${losses}-${ties}` : `${wins}-${losses}`);

        const evs = present
          ? (season.events || []).filter(e => isTeam || wrestlerIds.includes(e.wrestlerId))
          : [];

        let shotSuccess = 0, shotTaken = 0;
        const moveMap = {};
        const defMoveMap = {};
        evs.forEach(e => {
          if (!e || e.category === "Choice" || e.category === "Flow") return;
          if (isPenaltyCategory(e.category)) return;
          if (e.category === "Takedown" && e.direction === "offense" && (shotMoves.has(e.move) || e.subCategory === "Shots")) {
            shotTaken++;
            if (e.outcome === "success") shotSuccess++;
          }
          if (!e.move) return;
          const key = `${e.category} · ${e.move}`;
          if (e.direction === "offense") {
            if (!moveMap[key]) moveMap[key] = { success: 0, attempts: 0 };
            moveMap[key].attempts++;
            if (e.outcome === "success") moveMap[key].success++;
          } else if (e.direction === "defense") {
            if (!defMoveMap[key]) defMoveMap[key] = { success: 0, attempts: 0 };
            defMoveMap[key].attempts++;
            if (e.outcome === "success") defMoveMap[key].success++;
          }
        });
        const shotPctStr = !present
          ? "—"

    function modName(m) {
      if (!m) return "";
      if (typeof m === "object") return m.name || m.tie || "";
      return String(m);
    }

    function modOwner(m) {
      if (typeof m === "object") return m.owner === "opponent" ? "opponent" : "wrestler";
      return "wrestler";
    }

    function modKind(m) {
      if (typeof m === "object" && m.kind) return m.kind;
      return "tie";
    }

    function emptyModifiersStruct() {
      return {
        opp: { ties: [], finishes: [], rides: [] },
        our: { ties: [], finishes: [], rides: [] }
      };
    }

    function listToModifiersStruct(list) {
      const s = emptyModifiersStruct();
      (list || []).forEach(m => {
        const name = modName(m);
        if (!name) return;
        const side = modOwner(m) === "opponent" ? "opp" : "our";
        const kind = modKind(m);
        const bucket = kind === "finish" ? "finishes" : (kind === "ride" ? "rides" : "ties");
        if (!s[side][bucket].includes(name)) s[side][bucket].push(name);
      });
      return s;
    }

    function kindSuffix(structSide) {
      const present = [];
      if ((structSide.ties || []).length) present.push("ties");
      if ((structSide.finishes || []).length) present.push("finishes");
      if ((structSide.rides || []).length) present.push("rides");
      return present;
    }

    function sidePlainParts(structSide) {
      const parts = [];
      if ((structSide.ties || []).length) parts.push(structSide.ties.join(" + "));
      if ((structSide.finishes || []).length) parts.push(structSide.finishes.join(" + "));
      if ((structSide.rides || []).length) parts.push(structSide.rides.join(" + "));
      return parts;
    }

    /** Plain text for storage / AI: "Opp: Outside Tie + Poor Penetration Our: Sprawl" with kind hints when mixed. */
    function formatModifiersPlainFromStruct(s) {
      if (!s) return "";
      const chunks = [];
      const oppParts = sidePlainParts(s.opp || {});
      const ourParts = sidePlainParts(s.our || {});
      if (oppParts.length) {
        const kinds = kindSuffix(s.opp || {});
        const kindNote = kinds.length && !(kinds.length === 1 && kinds[0] === "ties" && !(s.opp.finishes||[]).length && !(s.opp.rides||[]).length)
          ? (kinds.length > 1 || kinds[0] !== "ties" ? ` (${kinds.join(", ")})` : "")
          : "";
        // Always annotate finish/ride-only or mixed; pure ties omit tag for brevity unless mixed with our side kinds later
        let note = "";
        if ((s.opp.finishes || []).length || (s.opp.rides || []).length) {
          const bits = [];
          if ((s.opp.ties || []).length) bits.push("ties");
          if ((s.opp.finishes || []).length) bits.push("finishes");
          if ((s.opp.rides || []).length) bits.push("rides");
          note = bits.length ? ` (${bits.join(", ")})` : "";
        }
        chunks.push("Opp: " + oppParts.join(" + ") + note);
      }
      if (ourParts.length) {
        let note = "";
        if ((s.our.finishes || []).length || (s.our.rides || []).length) {
          const bits = [];
          if ((s.our.ties || []).length) bits.push("ties");
          if ((s.our.finishes || []).length) bits.push("finishes");
          if ((s.our.rides || []).length) bits.push("rides");
          note = bits.length ? ` (${bits.join(", ")})` : "";
        }
        chunks.push("Our: " + ourParts.join(" + ") + note);
      }
      return chunks.join(" ");
    }

    function formatModifiersPlainFromList(list) {
      return formatModifiersPlainFromStruct(listToModifiersStruct(list));
    }

    /** Colored HTML for UI logs. Opp = red, Our = green. */
    function formatModifiersHtmlFromStruct(s) {
      if (!s) return "";
      const chunks = [];
      const oppParts = sidePlainParts(s.opp || {});
      const ourParts = sidePlainParts(s.our || {});
      if (oppParts.length) {
